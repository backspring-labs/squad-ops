commit: 07143d9c590ec2e9ced65ea3c4bcd4523448e1df
narrative: "**The Verified Canonical App Build** (133 merges since 1.3.1) — first\
  \ dual-lane-headline\nfeature release. Lane M's golden-path stack (scaffold + verification\
  \ contracts +\nfrozen-file enforcement) plus Lane S's Ephemeral Application Sandbox\
  \ 1.4 floor.\n\n**Exit evidence, pre-registered:** Functional App Yield window 3\
  \ — **6/6 functional\n(100%), 5/6 fully green, five consecutive greens**, unfiltered,\
  \ on frozen deploy\n`9522ef4d`, in **seeded-manifest (bind) mode**; the bar was\
  \ ≥4/6. The cut gate's original\ncondition (\"≥3 consecutive golden-benchmark runs,\
  \ squad-authored-manifest mode\") was\nsuperseded by owner decision 2026-07-28 and\
  \ executed at the cut.\n\n**What this honestly demonstrates:** given a PRD **and\
  \ a fully specified interface\nmanifest**, the squad implements, verifies, and delivers\
  \ a working app. What remains\nunmeasured — by the original gate's own correct reasoning\
  \ — is squad-authored-manifest\nmode; that rung moved to v1.6 as a headline. The\
  \ claim is *a specified contract, not\nPRD-to-app*.\n\nEntries are grouped by arc\
  \ rather than listed per-PR; the volume\nhere is dominated by the correction/repair\
  \ loop, which had to converge before any of the\nscaffold work could be measured\
  \ at all. Bare `#NNN` references in this section are **pull\nrequests**; the issues\
  \ they close are named in the PR bodies.\n\n### Added — the golden-path scaffold\
  \ stack (Lane M)\n- **SIP-0099 Contract-First Build Scaffolding** — an interface\
  \ manifest expands to a\n  deterministic walking skeleton, and dev tasks *fill declared\
  \ slots* instead of\n  authoring structure. Phase-0.5 spike (#428 hand-written group_run\
  \ manifest, #429\n  `fullstack_fastapi_react` expander proving the empty skeleton\
  \ builds and boots) then\n  phases 99.1–99.3 (#482 expander canonicalization + skeleton\
  \ CI gate, #486 manifest in\n  framing, #487 executor materialization + fill-only\
  \ develop).\n- **SIP-0098 Verification Contracts** — acceptance criteria now come\
  \ from a contract the\n  cycle is *bound* to, not authored per-plan. Proposed #475,\
  \ accepted with implementation\n  plans #477; phases 98.1–98.4 (#478 contract schema,\
  \ #483 expander emission +\n  emission-time gates, #488 orchestration binding —\
  \ \"bind, don't author\", #489 behavioral\n  probe runner + coverage accounting);\
  \ 98.5 migration slices (#491 live probe emission +\n  PRD v0.4 split, #493 `contract_gate\
  \ emit` mode for operator seeding).\n- **SIP-0100 Scaffolded Test Harness and Frozen-File\
  \ Enforcement** — frozen scaffold\n  files are restored when a producer rewrites\
  \ them, and unauthorized slot emissions are\n  dropped. Prototype #538, accepted\
  \ #539 with plan #540; phases 0–4 (#541 characterization,\n  #542 harness contract,\
  \ #544 authorization spine + live frozen-ownership enforcement,\n  #547 evidence\
  \ + QA write-scope, #548 contract-compliance circuit breaker, #549/#550\n  deterministic\
  \ replay, path/atomicity matrix, no-regression).\n- **SIP-0101 Cycle Replay Harness**\
  \ — proposed #594, revised #595, accepted with a\n  Phase-1 plan #596. Implementation\
  \ deliberately held until the 98.5 baseline closes.\n- **`function_defined` acceptance\
  \ check (#533)** — a style-immune \"this file defines N\n  functions matching a\
  \ prefix\", replacing regex-on-source criteria that failed on\n  formatting rather\
  \ than behavior.\n\n### Added — verification evidence integrity (SIP-0096, Phases\
  \ 1–3)\n- **Phase 1 (#369):** the integrity core — pure aggregation, evidence families,\
  \ and the\n  `blocked_unverified` verdict. Cycle-level `request_profile` provenance\
  \ (#367).\n- **Phase 2:** task-result verification normalized into the ledger with\
  \ honest-red guards\n  (#378); final-state resolution for re-verified checks (#386).\n\
  - **Phase 3:** `CycleOutcome` roll-up pure core (#412), per-run `RunVerificationSummary`\n\
  \  persistence (#416), derive-on-read `CycleOutcome` + cycle-detail surface (#418).\n\
  - **Check governance:** canonical framework-check registry rejecting unknown\n \
  \ `required_checks` ids (#396); required-check tooling parity at preflight + a `doctor`\n\
  \  verification category (#398); `required_files` enforced at run completion (#390)\
  \ and\n  recorded as a `CheckResult` (#402, corrected builder seam #405); fullstack\n\
  \  `frontend_build` as evidence (#408).\n- **Honest verdicts:** a non-succeeded\
  \ run never reads `accepted` on zero evidence\n  (#409); cycle outcome reconciles\
  \ per-check evidence across runs (#446); typed\n  acceptance reaches the builder\
  \ seam with wire-shape criteria coercion (#421).\n\n### Fixed — correction and repair\
  \ convergence\n- **Repairs are verified behaviorally, not structurally.** Re-run\
  \ the failed check on a\n  patch (#385); accept behaviorally-verified patches instead\
  \ of re-rolling repaired tasks\n  (#413); re-execute repaired `qa.test` suites before\
  \ acceptance (#461); reject patches\n  whose intra-package imports can't resolve\
  \ (#592).\n- **Repair targeting** — a correct diagnosis is useless if the repair\
  \ edits the wrong\n  file. Retarget onto the drifted source rather than the failing\
  \ check's tests (#532);\n  target the union of drift files and the failing artifact\
  \ (#534); dependency-scoped\n  targeting so no-drift `qa.test` failures reach the\
  \ source under test (#536); the drift\n  branch reaches the fill-slot source (#554);\
  \ repair artifacts re-homed onto expected\n  paths before overlay (#517).\n- **Repair\
  \ context** — the recurring root cause was the system holding an authoritative\n\
  \  fact and never putting it in front of the agent that needed it. The dev repair\
  \ gets the\n  same fill-only constraint as develop (#555); `resolved_config` threading\
  \ + frozen\n  enforcement on the repair path (#562); deterministic interface-drift\
  \ diagnosis feeds the\n  repair (#527); contract expectations, emission integrity\
  \ and candidate-free workspaces\n  (#564); error-contract block, exit-4 locus, initial-QA\
  \ expectations (#585); the initial\n  dev prompt carries the scaffold contract it\
  \ was filling (#589); repairs are told the real\n  model names instead of guessing\
  \ them (#604).\n- **Workspace correctness:** the correction workspace is re-resolved\
  \ from live stored\n  artifacts each attempt, so the loop can see its own progress\
  \ (#535).\n- **Policy and routing:** `continue` cannot discard executed-failed required\
  \ checks (#449);\n  locus-keyed QA repair routing + emission recovery with aimed\
  \ retry (#569); cancel reaches\n  the dispatch boundary so repairs stop on a cancelled\
  \ run (#587); four shakedown fixes\n  raising roll-success odds (#505).\n- **Removed**\
  \ the unconsumed `qa.validate_repair` step (#558) — its verdict was never read.\n\
  \n### Fixed — the scaffold's own contract\n- Success status is declared in the manifest\
  \ so the skeleton can satisfy its own probe\n  (#600), and is included in the content\
  \ hash (#601).\n- The scaffold-owned status code is held inside fill slots (#602);\
  \ the router takes no\n  prefix — stated in the stub and enforced on emission (#608).\n\
  - The in-memory store the manifest already declares is emitted rather than left\
  \ for the\n  planner to invent (#606).\n- The seeded scaffold reaches `qa.test`\
  \ and `builder.assemble` (#445).\n\n### Fixed — acceptance checks and emission parsing\n\
  - `import_present` matches relative imports (#437) and dotless specs (#442); the\
  \ backend\n  import check imports package members by qualified name (#471); the\
  \ delivered backend is\n  verified to import, not just its tests (#393).\n- `regex_match`\
  \ criteria restricted to document artifacts — the style-lottery guard\n  (#468);\
  \ AST checks skip non-Python files instead of erroring (#607).\n- A missing command\
  \ binary skips instead of erroring (#463); failed suites disclose\n  exit-code meaning\
  \ (#514); the coverage denominator comes from the bound contract rather\n  than\
  \ dispatched checks (#513); behavioral rows are stamped with their contract criterion\n\
  \  ids (#519); unbound criteria attach to the tail `qa.test` at dispatch (#516).\n\
  - Package dirs stay off the test runner's `PYTHONPATH` (#455); the runner refuses\n\
  \  non-pytest suites precisely, and the QA fragment gained a discovery contract\
  \ (#518).\n- Fenced-parser hardening: nested fences (#432), path-prefix on the first\
  \ body line (#490),\n  path-labelled headers and unterminated-at-EOF fences (#528).\n\
  - Probe readiness accepts any HTTP response rather than only 200 on `/health` (#521);\n\
  \  create-probes expect 201, resolving a contract that contradicted the PRD it verifies\n\
  \  (#523); typed sample values for probes (#526).\n\n### Fixed — plan authoring\
  \ and framing\n- A system plan-validation rejection re-rolls framing instead of\
  \ killing the cycle (#525);\n  pre-gate plan rejection records a system gate decision\
  \ instead of dying silently (#476);\n  the inter-workload gate stops the sequence\
  \ on `returned_for_revision` (#467).\n- Plan substitution preserves the workload-invariant\
  \ tail (#440); invariant tasks run in\n  canonical order, assemble before `qa.test`\
  \ (#459); warning/info-severity criteria\n  violations are tolerated rather than\
  \ rejecting the plan (#530).\n- Command-safelist lint at the authoring boundary\
  \ + manifest retry runway (#425);\n  style-dependent regex criteria forbidden in\
  \ guidance (#438); the bind-criteria proposer\n  leaves `criteria_refs` empty for\
  \ contract-owned files (#537); the strategy proposer\n  supplies `guidance_id`,\
  \ unblocking multi-role framing (#485); `qa.test` prompt content\n  routed through\
  \ the fragment system (#450); test-isolation doctrine in the QA fragment\n  (#460).\n\
  - Bind mode requires a framing-emitted interface manifest (#495) and seeds the canonical\n\
  \  one (#497).\n- Deterministic fill-slot binding at plan authoring landed (#552)\
  \ and was **reverted**\n  (#553) to keep the measurement baseline free of an unvalidated\
  \ confound.\n\n### Fixed — runtime and ops\n- Agent identity is never fabricated\
  \ (#387); the agent secret is provisioned on deploy and\n  fails honestly when absent\
  \ (#391); runtime-api application logging reaches stdout (#492);\n  `init: true`\
  \ on agent containers reaps subprocess zombies (#543).\n- `runs retry` resolves\
  \ `workload_type` positionally instead of defaulting to `None`\n  (#479); forwarding\
  \ overrides are rebuilt from durable state on mid-sequence entry (#480).\n- group_run\
  \ manifest path param renamed `{id}` → `{run_id}` (#565); anchored hash\n  replacement\
  \ in `regen_fragment_manifest.py` (#453).\n\n### Removed\n- Vestigial analysis skills\
  \ and their dead JSON parsing (#400).\n- The dead SIP-0.8.8 skill handler layer,\
  \ end to end (#403).\n- Warmboot operational artifacts, with the era's lessons distilled\
  \ for the book (#406).\n\n### Docs & SIP lifecycle\n- **Proposed:** Contract-First\
  \ Build Scaffolding (#383), Verification Contracts (#475),\n  Cycle Replay Harness\
  \ (#594), LLM Emission Contracts (#570), fine-grained issue\n  enumeration (#384),\
  \ process lexicon (#599).\n- **Accepted:** SIP-0098 + SIP-0099 with both implementation\
  \ plans (#477), SIP-0100\n  (#539, plan #540), SIP-0101 (#596).\n- Night triage\
  \ runbook (#609); RuntimeActivity lifecycle requirements (#546); enum-shadow\n \
  \ architecture guardrail failing CI on status string-literal comparisons (#382);\
  \ idea and\n  vision drafts tracked under `docs/ideas` (#366); CLI cheatsheet corrections\
  \ (#499)."
