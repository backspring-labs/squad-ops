showcase:
  cycle_id: cyc_b6596791666a
  reason: 'Counted React roll 2, the one counted roll whose correction round shows
    the line''s recovery path: a failed qa.test (frontend view tests) went to data.analyze_failure
    and governance.correction_decision, and the dev correction repair spent its whole
    12,288-token budget on reasoning, was asked again once with the fact (1.8.2 item
    2), and its anchored edit (8% of RunListView.jsx) was accepted, verified and retested.
    Chosen because that recovery is what this release adds, not because the roll is
    typical: 2 of the 6 counted rolls corrected.'
  role: counted
