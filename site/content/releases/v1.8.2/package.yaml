narrative: "**The unattended release: a cycle you can leave running.** Plan: `docs/plans/1-8-2-plan.md`\n\
  (rev 4). Record: `docs/plans/1-8-2-deploy-a-preregistration.md` §10, deploy A′,\
  \ with the cut record\nthere.\n\n**The claim, measured on deploy A′ (`8e2c2e87`).**\
  \ A cycle is safe to leave running when four\nthings hold:\n- it reaches a terminal\
  \ state within a bound;\n- a cancel leaves nothing running;\n- a crash or a hang\
  \ is contained and recorded as a typed fact;\n- the next cycle starts on a quiet\
  \ box.\n\nThe `unattended-chain` diagnostic ran four React cycles back to back,\
  \ with an injected cancel, a\nkilled agent and a hung handler, and read **YES on\
  \ every row**. The cancel ended its wait in 6 s,\nwhere deploy A held it for 30\
  \ minutes (#1699). Every cycle was assessed, and no step was manual.\n\nThe counted\
  \ set: **six of six rolls accepted** (React 21/21 ×4, Next.js 18/18 and 17/17),\
  \ with L1\nheld on every one. **No 1.8.3 opens** (plan §3.10): no qa task failed\
  \ by its declared wait, and\nno contentless emission went unrecovered.\n\n**The\
  \ unattended seams.**\n- A run's cancel reaches the agent already holding its task\
  \ (#1683).\n- A cancel ends the run's open reply wait, and the quiet check sees\
  \ an unfinished executor (#1700).\n- The per-task wait is declared, never inherited,\
  \ and is the same bound on both sides (#1675,\n  #1678).\n- The JSX parse runs in\
  \ a worker process, so a native fault kills the worker and not the agent\n  (#1679).\n\
  - The repair records which correction-decision section its brief carried (#1674).\n\
  - A call that spent its whole token budget and wrote nothing is asked again once,\
  \ with the fact\n  (#1681).\n\n**Capability.**\n- **The self-evaluation pass becomes\
  \ the model's compile loop** (SIP-0086 §12a changes 1–3):\n  - the loop's depth\
  \ is declared by the request profile (#1682), and each pass is booked under its\n\
  \    own usage key (#1686);\n  - a failed TypeScript build carries every type error,\
  \ not the first (#1687);\n  - a pass, and a qa re-take, see what they edit (#1688).\n\
  - **A producer's dispute of a check is captured, marked, routed and read** (SIP-0096\
  \ §17a, #1684,\n  #1685; closes #1581).\n- **The qa repair brief shows the line\
  \ each failing case failed on** (#1680).\n\n**Evidence that survives an unattended\
  \ line.**\n- Records have one home, the main checkout's `var/` (#1666).\n- `worktree_hygiene.py`\
  \ and cut step 8 (#1667).\n- A line's records are attached to its Release after\
  \ a credential scan (#1670).\n- The chain command runs K cycles back to back (#1668).\n\
  - A marker self-check at preflight (#1672).\n- The retest readout (#1676).\n- The\
  \ delivered-app capture reads the run's own interface (#1671).\n- The closure guard\
  \ reads the title and the commits (#1669).\n- A secret scan over every change (#1713).\n\
  - The release-package capture obtains its own token (#1721).\n\n**Not landed, stated.**\n\
  - **SIP-0107's flip.** N was unmet a third time: the total was 8 against 6, but\
  \ dev × Next.js was\n  at zero (SIP-0107 §46q). Step 7 is now a 2.0 decision.\n\
  - **The convergence replay (item 12), #1039 and the ops rider** move to 1.9 (plan\
  \ §3.9).\n- **SIP-0086 §12a change 4** is held for the owner.\n- **Two diagnostic\
  \ seams unreached on A′, each by the owner's ruling:** the dev lane, whose fault\n\
  \  the task's own self-evaluation reverts (#1716), and F1's rewind path (#1723).\n\
  - **Deploy A was voided** for #1699, and the set re-made on A′."
