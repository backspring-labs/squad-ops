narrative: "**The 2.2 line's first patch: a failed proposal and an abort end with\
  \ a record, never a wedge** (plan\n`docs/plans/2-2-1-plan.md`). It fixes the three\
  \ defects the 2.2 cut's tier diagnostic found, and a security fix to the\ndeploy's\
  \ `.env`.\n\n**The evidence, lean by the owner's ruling** (the plan's §3, D3):\n\
  - each fix's wiring test, entered where a live cycle enters, and each checked to\
  \ fail without its change;\n- `rebuild_and_deploy.sh runtime-api` (`dep_b0c134405d55`,\
  \ `dba4f0c2`), with every loaded check answering (71 of 71);\n- one diagnostic campaign,\
  \ `cmp_bf5daecdf444`, whose rails refuse every proposal, so the refused-proposal\
  \ path is\n  read live. It closed itself at its cycle cap at 13:53 ET. Every proposal\
  \ run failed without the correction loop,\n  and no task exception went unretrieved\
  \ (the plan's §6, R1–R4).\n  - **Its one misprediction is #2231,** placed in 2.3:\
  \ `max_proposal_run_retries` is never read, so failed proposals are\n    retried\
  \ by new cycles until `max_cycles`.\n\nNo regression set: every changed seam is\
  \ on a campaign's path only. The tier's timeout half, read live, is placed in\n\
  2.3 (D2).\n\n**Campaigns (SIP-0109).**\n- **A refused increment proposal fails its\
  \ run.** It never enters the build correction loop, whose repair had written\n \
  \ product source into a proposal run that then completed `accepted` with no change\
  \ request. The proposal step joins\n  `TaskType.fails_without_correction`, beside\
  \ D9's definition of done (#2212; #2224).\n- **A proposal run completes only with\
  \ its change request,** and an inter-workload gate that raises ends the cycle\n\
  \  `gate_failed` through the completion boundary, recorded, with its campaign told.\
  \ The campaign reads it as\n  `proposal_failed` on a proposal, and as a rejected\
  \ plan on a plan gate. A cycle's execution that raises anything else\n  is retrieved\
  \ and named, never left to asyncio's \"Task exception was never retrieved\". Migration\
  \ 1696 adds\n  `gate_failed` to `cycle_ends`' CHECK list (#2213; #2225).\n- **An\
  \ abort cancels a cycle waiting between workloads.** It reads \"ended\" the way\
  \ the cycle route does, through one\n  shared reading, `cycle_status_of` (#2214;\
  \ #2226).\n- The diagnostic's definition, `2-2-1-proposal-failure-diag.yaml` (#2227).\n\
  \n**Plans and SIPs.**\n- **The 2.2.1 plan,** adopted, with its record (#2223).\n\
  - **The 2.3.0 plan, adopted:**\n  - TensorFold first, carried to the owner's G4\
  \ decision, with Qwen3.8-Flash-Next as a second candidate;\n  - then stabilization\
  \ on the engine that ships;\n  - SIP-0111 §9a ruled with it (#2228; G3 and G4 #2229,\
  \ Flash-Next #2230);\n  - #2231 placed in its R3 (#2232).\n\n**Security.**\n- **`.env`\
  \ is owner-only** (advisory GHSA-wrfh-h7jx-w578, low). Bootstrap had copied it at\
  \ the umask (`0664` under\n  `0002`), and `deploy_credentials.py` wrote every credential\
  \ into it without changing its mode. `ensure` now makes it\n  `0600` on every run,\
  \ before writing; `rotate` does the same; bootstrap creates it with `install -m\
  \ 600`; and the\n  doctor's credential check fails a `.env` another account can\
  \ read (#2233).\n\n**Upgrade from 2.2.0:** the runtime applies migration 1696 at\
  \ startup. The next `deploy_credentials.py ensure`, which\nevery deploy runs, makes\
  \ an existing `.env` owner-only; or run `chmod 600 .env` now."
