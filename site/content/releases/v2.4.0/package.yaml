narrative: "**The 2.4 line: an even minor, a feature release with one headline per\
  \ lane. Project Lifecycle Management (SIP-0112,\nthe MacBook lane) develops a product\
  \ SquadOps doesn't own, in that product's repository, by its own checks and through\n\
  its own review process, and starts a greenfield product the same way. Outcome Evaluation's\
  \ phase 1 (SIP-0113, the\nSpark lane) is the yardstick, reporting only** (plan `docs/plans/2-4-0-plan.md`).\
  \ Project Lifecycle Management is the\nheadline because Outcome Evaluation's feature\
  \ half didn't ship whole, as the plan ruled it would be then (D14). On the\nmeasurement\
  \ window's record the owner split that feature half (D4, 2026-10-22): the proposal\
  \ is now shown its\ncampaign's outcomes, and the outcome target is held. SIP-0110's\
  \ memory entry points ship beside both, and QA's half of the\nrisk-first test instructions\
  \ (#1966) was adopted on 2026-10-23.\n\n**The cut's evidence: PASS** (`docs/plans/2-4-0-cut-preregistration.md`,\
  \ registered in #2703, #2707 and #2708, read\nin §13). It was read on the final\
  \ deploy (`b3acbc82`, `dep_d7ff50b9b39c`):\n- **the counted set:** 4 of 4 regression\
  \ rolls accepted on TensorFold, two per stack, with memory disabled. Every\n  criterion\
  \ was verified (22, 17, 21, 19), every boot audit passed, and the rolls took 2,\
  \ 0, 1 and 1 correction rounds;\n- **every model call was TensorFold's:** 80 of\
  \ 80, read from the agents' per-call metrics and matched in their logs;\n- **the\
  \ line's code is what ran:** all 179 tracked loaded checks answered as expected\
  \ in every roll, `1966` among them;\n- **memory inert where it is disabled:** all\
  \ 45 exposures read `memory_disabled`, and all 45 captured envelopes\n  reconstruct\
  \ byte for byte;\n- **#1966's no-loss checks held, so the owner's revert rule wasn't\
  \ triggered:** every always-pass held-out scenario\n  passed on every roll's tree,\
  \ and no roll had more than one QA repair whose retest passed. Reported beside them:\
  \ the\n  Next.js rolls passed 9 and 10 of 31 scenarios against their baselines'\
  \ 11–12, mostly scenarios only one baseline's\n  surface reaches. One scenario passed\
  \ on both like-shaped baselines and failed on both rolls;\n- **the shakeout campaign\
  \ met its exit rule in its second round:** the tier decided every plan gate, no\
  \ increment\n  regressed a scenario, the proposal evidence reached every proposal,\
  \ and no step value or goal reached a squad role.\n  Round 1, a diagnostic on a\
  \ superseded deploy, found #2706;\n- **beside the set, on the same deploy:** IR-1\
  \ (a cycle of each of the five seeded projects), IR-2 (a standalone cycle\n  and\
  \ a Campaign's on an external Project reading one source context, each unit with\
  \ its own snapshot) and IR-8's\n  registry half passed. #2183's memory acceptance\
  \ matrix passed, T1–T17: T12 and T6's campaign half on the Spark's cut\n  deploy,\
  \ the rest on the Mac's deploys of main, with five sub-cases held by unit tests\
  \ and named on the issue;\n- **what it does not cover:** the tagged tree differs\
  \ from the validated deploy only by documents and the version\n  string. Nothing\
  \ under `src/`, `adapters/`, `agents/`, `config/` or `scripts/` differs, and under\
  \ `infra/` only the\n  evaluator's accepted-advisory list, which the image doesn't\
  \ copy. Outcome Evaluation\n  of an external Project (IR-4 to IR-7, and the evaluation\
  \ halves of IR-8 and IR-9) is not run, waiting on #2619 in\n  2.5. #1966 is read\
  \ on Next.js greenfield builds only, and the memory matrix's Mac cycles ran on `lite-14b`,\
  \ so they are\n  machinery evidence, not quality.\n\n**Project Lifecycle Management\
  \ (SIP-0112).**\n- **The shared fixture landed first:** a small product with one\
  \ failing check and one binary file, and each lane's\n  recorded outputs, freezing\
  \ four shared contracts with their tests (#2407, #2414; #2440, #2507).\n- **One\
  \ writable Project registry, cut over from `config/projects.yaml` with a guarded\
  \ rollback.** A required\n  selector, `cycles.project_registry_provider` (`config`,\
  \ `postgres` or `postgres_read_only`), chooses it. On\n  `postgres` each config\
  \ project is seeded once as `READY`; a rollback that would hide a registered Project\
  \ stops the\n  runtime API; and a Project not ready is refused with 409 `PROJECT_NOT_READY`\
  \ (#2408; #2444).\n- **An existing product is registered** through `POST /api/v1/projects`\
  \ and `squadops projects import`, idempotent by\n  key, behind the locator rules:\
  \ `https`, `ssh` or the scp form, no credential or option-like segment, and none\
  \ of the\n  deploy's own hosts unless allow-listed (#2408, #2459; #2452).\n- **Discovery\
  \ and the inherited baseline.** `projects validate` mirrors the product into a managed\
  \ clone no agent tool\n  reaches and moves it to `READY` at its base ref's commit;\
  \ the Development Configuration is versioned and checked\n  field by field; and\
  \ `projects baseline --capture` records each of the product's own checks on the\
  \ pinned source as\n  PASS, FAIL (inherited) or UNVERIFIED with its reason (#2409,\
  \ #2459; #2468).\n- **A source-backed run** pins its source context before dispatch,\
  \ starts from the product's tree, and verifies its\n  change by the product's own\
  \ checks against the inherited baseline, each attributed `inherited`,\n  `introduced/regressed`,\
  \ `resolved` or unverified. An accepted change is captured as one commit, without\
  \ the squad's\n  test records, and the owner contributes it as a review request\
  \ or a patch (#2410, #2591; #2484).\n- **A sync reads the upstream against the approved\
  \ baseline** and files each changed path by the evidence it\n  invalidates (`instructions`,\
  \ `command_inputs`, `dependencies`, `toolchain`, `contribution_policy`, `source`).\
  \ A\n  contribution reads `integrated` once its commit or merged review request\
  \ reaches upstream, and `validate`\n  re-validates a `READY` Project at the new\
  \ commit (#2411; #2565).\n- **Greenfield:** `projects initialize` writes a blueprint's\
  \ layout as the first commit of an empty repository the\n  owner made, pushed with\
  \ the owner's token for that one act, never stored or forced; `validate` and `sync`\
  \ take the\n  same token, so a private product can be reached (amendment H.1; #2412;\
  \ #2584).\n- **What the brownfield demonstration found** (amendment H.2): a sync\
  \ lists SquadOps's own integrated files apart from\n  outside change (`source-drift/v2`),\
  \ and relevant drift holds new cycles until the Project is reconciled (#2606,\n\
  \  #2608; #2610). An outside instruction change under a running Campaign (amendment\
  \ H.3) is tested at the launcher: new\n  launches wait for reconciliation, and each\
  \ later cycle binds the new content at its own commit (#2411; #2616).\n- **A check\
  \ that already fails is compared finding by finding when it declares a reader**\
  \ (`ruff`, `pytest` or\n  `lines`; `no-introduced-regression/v2`): a key whose count\
  \ grew is `introduced/regressed`. The sandbox reads the\n  command's whole output\
  \ before its tails are cut, and each tail says whether it was cut (amendment H.5;\
  \ #2609, #2622;\n  #2620, #2623, #2630).\n- **The managed clones are mounted from\
  \ `./data/repo_cache`,** so a redeploy keeps a captured change not yet\n  contributed\
  \ (#2588; #2589). A baseline capture waits out each step's own bound, not 30 s (#2586,\
  \ #2605; #2587,\n  #2627).\n- **The demonstrations, run and read on the Spark**\
  \ (`docs/plans/2-4-0-demonstrations-readout.md`). A private copy of\n  an existing\
  \ product went through all six brownfield stages, stage 5 holding once #2610 was\
  \ deployed; the greenfield\n  product's first contribution turned its failing backend\
  \ check to PASS and was read back as integrated (#2410, #2412;\n  #2601, #2604,\
  \ #2611).\n\n**The sandbox (SIP-0102), built by the Spark lane for both.**\n- **A\
  \ Git checkout's tracked tree round-trips exactly:** a `git_checkout` revision origin\
  \ (X-1); bytes, line endings\n  and the executable bit, with every existing revision\
  \ ID unchanged (X-2); and a refused seed or patch leaves the live\n  tree as it\
  \ was and answers 400, where it had answered 500 (#2419, #2420; #2441, #2442).\n\
  - **A product's declared command runs against a pinned revision in a disposable\
  \ copy** (X-3a), and a product starts\n  there from its own declaration (X-3b) (#2421;\
  \ #2447, #2450).\n- **The runtime API reaches the sandbox service through one client**\
  \ with its own required selector, URL and token;\n  seeding, the pinned read and\
  \ the workspace release are on the port, and the service's apps run on an internal\n\
  \  network with no route out (`squadops-sandbox-apps`), by name with no host port\
  \ (#2451, #2473; #2456, #2458, #2460,\n  #2461, #2471, #2527).\n\n**Outcome Evaluation\
  \ (SIP-0113), phase 1: the instruments, reporting only.** No scenario result reaches\
  \ a squad role,\na row, a gate or a prompt.\n- **The held-out scenario store** (`/api/v1/scenario-suites`,\
  \ `squadops scenarios`): a scenario is a goal, held-out\n  steps and checks, content-addressed,\
  \ and a campaign pins a suite. `scenarios:read` never shows a step, a\n  `squadops-supervisor`\
  \ user drafts, and only the owner approves; a suite file inside a Git working tree\
  \ is refused\n  (#2413, #2464; #2448, #2465, #2476).\n- **The runner and the evaluation\
  \ service:** a cycle's delivered app is started in a disposable copy in the sandbox\n\
  \  service and its scenarios run outside every squad container. An `EvaluationRecord`\
  \ is written whatever happened,\n  `blocked_unverified` with its reason where nothing\
  \ could run, and each campaign cycle is evaluated at its end\n  (#2414, #2415; #2449,\
  \ #2450, #2453, #2472).\n- **A scenario reaches each delivery as that delivery built\
  \ itself:** at the declared `http_base` or the stack's API\n  prefix, with fields\
  \ named by concept and resolved on the delivery's own manifest and entity names,\
  \ and a `where`\n  check that finds a listed element by its fields, not its place\
  \ (#2421, #2464, #2542; #2466, #2467, #2499, #2543).\n- **Quality baselines in the\
  \ evaluator's image** (`infra/evaluator`): Lighthouse and axe per declared page\
  \ and #1937's\n  lint over the tree, each with its delta from the tree an increment\
  \ built on and from its campaign's calibration,\n  like with like only; ESLint now\
  \ reads `.jsx`. `remeasure_quality.py` reads each measure's spread on an unchanged\n\
  \  tree (#2416, #2478; #2455, #2474, #2479, #2480, #2501, #2594).\n- **One evaluator\
  \ tag is one image:** the base pinned by digest, Debian's archive by a dated snapshot,\
  \ and the\n  browser's bound measured at 5 s. A deploy builds the image when its\
  \ pinned tag is absent and never rebuilds under a\n  tag (#2580, #2583; #2581, #2661).\n\
  - **The intervention ledger** is a classified projection of the control log, never\
  \ a second record of it (#2417;\n  #2454). **Contribution per increment** (`regressed`,\
  \ `unverified`, `contributed` or `neutral`), read from two\n  evaluation records\
  \ of one suite. The package and digest carry each cycle's readings, held out of\
  \ every squad task,\n  and a campaign declares its work class, by which Autonomous\
  \ Outcome Reliability reads four inputs per campaign, one\n  of them the 2.0 set's\
  \ seven safety guarantees (#2418; #2470, #2481, #2485, #2487, #2489).\n- **Holding\
  \ out, checked:** a sweep for the suite's step values across the deploy's databases,\
  \ the window's vault and\n  every squad container, reported by count and hashed\
  \ id (#2590); a pre-push scan of what a change adds (#2615,\n  #2650); a draft-time\
  \ check for values already public (#2617; #2698); and made-up example values in\
  \ the code (#2614).\n- **The browser runner.** A page scenario's browser steps run\
  \ in the evaluator, each segment its own container on the\n  app network. A control\
  \ not found by its role and names reads `control_absent`, unverified, never failed,\
  \ and the\n  package counts them. A failed page scenario's evidence is scrubbed\
  \ and readable by the owner alone, and the cut\n  purges it and records the count\
  \ (#2564; #2646, #2647, #2651–#2653, #2655, #2656).\n- **A seeded quality reading:**\
  \ a second instance of each evaluated tree, seeded through its own API and measured\
  \ on\n  every page. Re-measures are their own records, compared only with their\
  \ own series (#2562; #2632–#2635).\n\n**Outcome Evaluation's readings,** each pre-registered\
  \ as a mechanism with its falsifier.\n- **The measurement window** (`docs/plans/2-4-0-window-close.md`):\
  \ four campaigns, two per stack, on one frozen\n  deploy. The scenarios discriminated\
  \ on its pairs, each quality measure spread at most 0.03, the ledger matched the\n\
  \  control log, no evaluation changed its tree, and memory supplied nothing. Two\
  \ readings were falsified as written:\n  one held-out step value was in every agent\
  \ image (suite revision 4 retired it), and all six counted accepted\n  increments\
  \ read `contributed` (#2502, #2568, #2596).\n- **The seeded reading:** stable, and\
  \ falsified on seeing the increments. No pair moved a seeded measure on a page it\n\
  \  changed, because the measures are coarser than the change; a finer reading, #2637,\
  \ is placed in 2.5 (#2562; #2638).\n- **The page scenarios, on suite revision 5,**\
  \ read with a tool whose fault-injected diagnostic runs the same path:\n  each main\
  \ page scenario discriminates on every pair, the fault-injected tree fails where\
  \ its source passes, and\n  three rounds on two trees agreed. The leak check is\
  \ falsified as written by a value already public, not by a leak\n  (#2564; #2657,\
  \ #2658, #2660).\n\n**Outcome Evaluation's phase 2, its first half: the proposal\
  \ is shown its outcomes** (SIP-0113 §4.5, #2677; the\nowner's split #2678, its design\
  \ review #2680).\n- **The evidence goes on the proposal task's own inputs through\
  \ a port, and nowhere else,** never into the cycle's\n  resolved config, which the\
  \ registry stores and a retry copies (#2683).\n- **What it shows:** the pinned suite's\
  \ goals as `passed`, `failed` or `not verified` on the accepted tree, each\n  quality\
  \ measure against the calibration, and the accepted increments' PRD sections. A\
  \ goal carrying a suite marker\n  is held back, and a request that copies a goal's\
  \ statement is refused (#2687, #2688).\n- **A change request may name the goals\
  \ it means to move** (`moves_goals`), seen only by its proposer and the\n  supervisor;\
  \ an id it wasn't shown is refused. The package reads what became of each named\
  \ goal, by id (#2686,\n  #2689).\n- **The live reading** (`cmp_ca24f3776ef8`): the\
  \ evidence reached and rendered in 4 of 4 proposals; 6 of the 10 named\n  goals\
  \ moved, against 0 of the 40 unnamed; no step value or goal reached a new place.\
  \ \"A proposal shown a failing\n  goal aims at one\" was falsified as written by\
  \ a proposal shown none (#2690, #2691, #2696).\n\n**Campaigns (SIP-0109).**\n- **A\
  \ campaign declares its stack,** and every launch carries it; a stack it can't run\
  \ on is refused at creation with\n  422 (#2443; #2446). The FastAPI + React shakeout's\
  \ definition is the Next.js one's twin (#2516).\n- **A repair's or retry's block\
  \ is built from the increment's own keys and its lineage, never copied from the\
  \ failed\n  cycle's:** a retry of a repair starts from the accepted tree, and no\
  \ earlier cycle's brief rides along (#2558,\n  #2576, #2578; #2574, #2699).\n- **An\
  \ accepted repair freezes its criteria with what they assert,** and the digest names\
  \ one recorded without; one of\n  the window's campaigns had lost its evidence package\
  \ to it (#2595; #2597). A fresh proposal is shown up to ten\n  proposals its campaign\
  \ never approved, each with its ruling's reason (§24bu; #2593; #2598).\n- **A cycle\
  \ stopped at its plan gate built nothing, so it has no verdict;** a calibration\
  \ whose plan was rejected had\n  been promoted with an empty tree (#2704; #2705).\
  \ A control operation answers after its own drain, naming a launch\n  that drain\
  \ refused (#2621; #2625).\n- **A cycle held on its instruction bindings escalates\
  \ as its own kind, `binding_hold`,** released by re-supply and\n  never parked;\
  \ an expired hold's run cancel is retried by the next sweep (§24bw; #2178, #2642;\
  \ #2628, #2643).\n\n**Stacks and scaffold.**\n- **What the Next.js shakeout found\
  \ before the window,** each fixed before the window's deploy froze:\n  - a page\
  \ criterion's test is a file its runner collects, and a footprint reads a dynamic\
  \ route's brackets literally\n    (#2511, #2512; #2514);\n  - a route handler states\
  \ its request fields, its errors and its response entity's fields, so an increment\
  \ that\n    changes them has the route in its footprint (#2522, #2538; #2523, #2539);\n\
  \  - the runner collects `.test.tsx` under `__tests__/` (#2531; #2532); a page suite\
  \ runs in jsdom with Testing Library\n    (#2395, #2534; #2535); the frozen API\
  \ client is declared to the suite's author (#2540; #2541); and a suite that\n  \
  \  renders a page or component counts as invoking the application (#2547; #2548).\n\
  - **A Next.js criterion's test calls its route through a frozen route caller,**\
  \ so a route the change adds can\n  discriminate (#2577; #2599).\n- **An endpoint\
  \ declares its query inputs,** and the stub, the signature check, QA's contract\
  \ and the Next.js route\n  read them: #2378's proper fix (#2378; #2670). An authored\
  \ import of the app's entry module is dropped where the\n  harness boundary is bound,\
  \ since no suite can pass both (#2572; #2573).\n\n**Memory entry points (SIP-0110\
  \ Appendix A).**\n- **The typed memory records:** notes, preferences, and project\
  \ and task instructions, with permissions by kind,\n  provenance and revisions (#2177;\
  \ #2508).\n- **Task instructions reach the tasks they name, and only those:** given\
  \ at cycle create (`--instruction … --for …`)\n  or a campaign's launch, after admission\
  \ as an intervention refused once its task dispatched (`squadops\n  instructions`),\
  \ at the increment gate, or carried into a repair or retry, with `@current` bound\
  \ when written. A run\n  whose binding can't be read or fitted is held, not failed,\
  \ until re-supply completes it, and an emergency withdrawal\n  halts the work built\
  \ on it and restarts the run without it (#2178; #2513, #2549, #2554, #2556, #2559,\
  \ #2636, #2639).\n- **Project instructions are pinned in a unit's snapshot at admission**\
  \ and bind on the tasks they apply to. The\n  lessons take the budget they leave;\
  \ a `memory_context: none` arm withholds both; a counted roll records the set it\n\
  \  pinned; a withdrawal names the units that pinned it; and a running unit is re-bound\
  \ forward only (`squadops\n  snapshots`) (#2179; #2515, #2526, #2528, #2533, #2544,\
  \ #2546).\n- **References:** a project instruction's `@current` is bound at admission\
  \ through a resolver port per family, under\n  one time bound; one no unit can bind\
  \ is refused at write; a campaign's are bound per cycle against its snapshot; the\n\
  \  content is read at each dispatch and shown under its instruction; and a bound\
  \ revision is re-bound without revising\n  its instruction (#2179, #2575; #2555,\
  \ #2567, #2570, #2579, #2668, #2669).\n- **Each task is composed at its own dispatch\
  \ and measured as its handler renders it.** A unit's dispatches and the\n  changes\
  \ to what they're handed are ordered by its dispatch turn, a pin is settled against\
  \ a withdrawal that landed\n  while it was taken (#2545, #2681, #2684; #2551, #2603,\
  \ #2693), and the monolithic `qa.test` and\n  `development.develop` prompts render\
  \ the slots their focused paths do (#2509, #2674, #2682; #2510, #2675, #2685).\n\
  - **Chat on the memory substrate:** a server-side project binding, each turn's context\
  \ and exposure, and confirmed\n  capture of a project or task instruction, judged\
  \ by the records API's rules. Chat explains approved lessons and is\n  never guided\
  \ by them, and a conversational claim is a suggestion note. A person deletes their\
  \ own sessions, and none\n  expire (Q29) (#2180, #2181; #2422, #2517, #2518, #2525,\
  \ #2550).\n- **The console's memory record view:** a record's uses apart from its\
  \ effect, its capture taken live; a long record\n  no longer stretches the list\
  \ (#2182, #2692; #2524, #2695, #2701).\n- **A paired comparison's arms are read\
  \ as one,** and a pair handed different bindings is reported invalid\n  (`memory_exposure_report.py\
  \ --pair`) (#2183; #2702).\n\n**QA: risk-first test design (#1966).**\n- **QA plans\
  \ and writes tests by the faults a change could have:** each acceptance criterion\
  \ still gets its test, and\n  beyond those no further test is a correct answer (three\
  \ prompt assets). In its pre-registered A/B on four replayed\n  window increments,\
  \ nothing was lost on either arm, QA repairs whose retest passed went from 2 to\
  \ 1, and QA's own\n  tests fell on 2 of 4 against a prediction of 3. The cut's set\
  \ read it under the owner's revert rule, and both of\n  its no-loss checks held\
  \ (above). The builder half was never measured and is not built (#1966; #2666, #2700).\n\
  - **An increment replay runs on the stack its source ran on** (#2667).\n\n**Correction\
  \ and execution.**\n- **A red retest is judged by the tests that fail,** with the\
  \ row's facts by their direction, so a repair that cleared\n  an application error\
  \ or made a suite load is kept (SIP-0086 §12e). On its pre-registered replay of\
  \ 18 stored red\n  retests it kept four more and lost none main kept. The rest of\
  \ the converging-repair question was read on every keep\n  since #1522 and left\
  \ as it is (§12f) (#2306; #2662, #2663, #2673).\n- **A handler's input refusal fails\
  \ the run at once,** naming it, with no retry or correction (#2553; #2566); a QA\n\
  \  re-take that a repair then patched is stored as the patch it verified (#2536;\
  \ #2537); a plan index that isn't an\n  integer is refused with its value (#2488;\
  \ #2490); a builder squad with no `build_profile` is refused at cycle\n  create,\
  \ not at implementation (#2437; #2438); and an emitted file keeps its final newline\
  \ (#2607; #2618).\n- **Routing a failing slot assertion by defect ownership is not\
  \ built:** the shell's construction already routes it as\n  SIP-0104 §13d asks,\
  \ and 37 days of runs show no route it would change (§13e; #2153; #2665).\n\n**Request\
  \ profiles (SIP-0114).**\n- **The operator's seven request profiles** (`smoke`,\
  \ `build`, `validate`, `implement`, `ship`, `wrapup`,\n  `benchmark`), each stack's\
  \ request defaults beneath an operator profile's own keys, and every 2.3.1 profile\
  \ frozen\n  byte for byte and still resolving by name (#316; #2445, #2494, #2500,\
  \ #2519).\n- **The console's cycle create resolves its request on the server** with\
  \ the builder the CLI uses (`POST\n  /api/v1/cycle-request-profiles/{name}/resolve`),\
  \ so a console cycle carries its profile and the CLI's config hash\n  (#2520; #2529).\
  \ `cycles create --set` reads a list or mapping value as JSON (#2496; #2497).\n\n\
  **Deploy, configuration and telemetry.**\n- **Every service mounts exactly the secrets\
  \ it reads:** the agents hold no database credential, and nothing holds\n  Keycloak's\
  \ admin password (#2457, #2498; #2506).\n- **Deploys:** one that runs the sandbox\
  \ builds its pinned environment image when the tag is absent (#2582; #2585);\n \
  \ the record declares each agent instance's own model, so a chat turn leaves the\
  \ box quiet (#2676; #2679); and a\n  failed Keycloak realm sync fails the deploy\
  \ (#2426; #2429). Ollama is asked for the context the registry budgets\n  each model\
  \ at (#2427; #2434), and `lite-14b` is `lite` on qwen2.5:14b, the MacBook's build\
  \ check (#2435; #2436).\n- **Quieter and stricter settings:** the console reads\
  \ every setting as required (#2431; #2432); a successful\n  heartbeat or health\
  \ probe leaves the access log (#2425; #2428); and the collector stops printing every\
  \ metrics\n  batch, Grafana's usage reporting is off and three images are pinned\
  \ (#2424; #2430).\n- **A generation's full rendered request is kept beside the capped\
  \ display text,** readable by id\n  (`read_full_prompt.py`), and the connection-string\
  \ redaction no longer crosses lines (#1756; #2463). The generic\n  `api-`/`key-`\
  \ redaction spares the framework's own ids and still redacts a real key (#2462;\
  \ #2505).\n- **Loaded checks for each batch,** one id per check, and every row answers\
  \ its expect on the source in CI before a\n  rebuild, with `docker` shadowed (#2694;\
  \ #2475, #2477, #2482, #2483, #2492, #2503, #2552, #2600, #2697).\n\n**Dependencies\
