  \ family\n1.45.1/0.66b1, past GHSA-xcq7-p3pf-p88h (#2671), in the locks and CI's\
  \ constraints. Five npm advisories published on\nthe cut's day, in the evaluator\
  \ image's lock, are accepted for 2.4.0 by the owner's ruling of 2026-10-23, each\
  \ with its\nreason: `zod`'s belongs to a peer package the image never loads, and\
  \ `fast-uri`'s four sit inside `ajv`'s resolution\nof library schemas. The lock's\
  \ fix lands with the evaluator's next image (#2712). The dependency audit reads\
  \ an npm\nendpoint error as not run, never as no advisories (#2644; #2645), and\
  \ runs under macOS's bash (#2648); the scenario\nCLI's tests read past Rich's wrapping\
  \ (#2491; #2504).\n\n**Plans and SIPs.** The 2.4 plan, adopted (#2387); SIP-0112\
  \ and SIP-0113 accepted (#2401, #2406); SIP-0111's second\nengine candidate redirected\
  \ to the upgrade to TensorFold 1.x, still unplaced (#2230; #2423); and the Spark\
  \ thermal\nrule's no-data alert placed in 2.5 (#2433; #2439). Outcome Evaluation's\
  \ design records: the safety guarantees\nAutonomous Outcome Reliability reads (#2486),\
  \ the seeded reading and the browser runner proposed (#2563) and reviewed\n(#2631,\
  \ #2641), the owner's rulings of 2026-10-20 (#2569), the ledgers re-read before\
  \ the cut (#2629), and a Campaign\non a repository-backed Project designed for 2.5\
  \ (#2624, #2626). The integration record\n(`docs/plans/2-4-0-integration-record.md`):\
  \ of the ten cross-lane scenarios, four passed (IR-1, IR-2 and IR-10, each\non the\
  \ cut deploy too, and IR-3 on three of its four points); two ran in part (IR-8,\
  \ whose registry half passed on the\ncut deploy, and IR-9); and four were not run,\
  \ each waiting on #2619 (#2640, #2649, #2654). The cut's pre-registration and registration\
  \ (#2703, #2707, #2708),\nand the v2.3.1 package (#2404).\n\n**Not in this release:**\n\
  - **A Campaign on a repository-backed Project** (#2619): it calibrates but can't\
