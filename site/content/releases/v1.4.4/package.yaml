narrative: '**No False Verdicts** (verification integrity). Every verdict is earned:
  greens are

  enforced, reds are explained, budgets are honored. Seven premise-verified fixes,
  one PR

  each — **#427** terminal failure reason persisted on the run row and surfaced by

  `runs show` (migration 1010); **#426** builder offer and gate net both key off configured

  `build_profile` via the new single-source `Cycle.resolved_config()`; **#715** a
  qa task

  whose declared artifacts can never satisfy required `tests_pass` is rejected at
  authoring,

  on both gate seams; **#423** an authored check the evaluator cannot run is an evidence
  gap

  and never `passed: true`; **#424** plan-authoring collapse is a gate rejection,
  never a

  silent static-step fallback; **#511** the time budget gates every dispatch lane
  including

  correction chains; **#571** semantic-memory recall prefilters in-query with a valid
  cosine

  metric.


  Verified as a line on an integrated overnight deploy: in-container validator replays

  against stored artifacts, a designed-failure probe budget-killed at the first boundary,

  and confirmation shakedown **shk-5 green** — verdict accepted, zero corrections,
  the new

  nets silent on a well-formed roll.'
