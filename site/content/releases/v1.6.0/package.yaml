version: 1.6.0
tag: v1.6.0
previous_tag: v1.5.0
date: '2026-08-21'
commit: cb63ae76c3be36a3dba6987b4de18d746c8ef25f
narrative: 'In-flight **1.6 — the Authorship release**. The rung above 1.4: from *filling*
  a given

  interface design to **authoring the design from the PRD**. Lane M is SIP-0103

  (Squad-Authored Manifest, accepted 2026-08-07); Lane S is Generalized Build Capability,

  whose Stack Blueprint SIP is deliberately held until a second real stack exists.


  Landed so far, gates before author: the queue-front fixes (#762 bind-mode preflight,

  #766 Langfuse prompt linkage, #770 SIP promotion), then the M-ladder — M0a contract

  derivation pinned to the deployed reference pair (#777), M0b derive-at-seed when
  a cycle

  seeds a manifest but no contract (#779), M3 winnability gate (#781), M2 schema gate
  and

  the `decisions[]` judgment record (#783), M6 authoring failure taxonomy (#785),
  and **M1

  the authoring stage itself (#791)** — a dedicated `development.author_manifest`
  framing

  step that revises against the gates, replacing the ungated proposer-side emission
  it

  relocates, and **#796** — the fix V4 roll 1 exposed: an authored manifest now derives
  and

  pins its contract mid-framing, so the plan authors bind to the design their own
  squad just

  wrote instead of inventing paths, and every contract-gated net engages. M4 (the
  human

  manifest gate, narrowed to question-gated review — #807: the gate stops only when
  the

  design declares an unresolved decision, and the question itself is what the operator
  is

  shown; a design that asks nothing records a distinguishable system approval and
  proceeds) and **M5 authoring provenance (#803)** —

  a system-owned block recording mode, cycle, task, attempt count and the *classified*
  reason

  for each revision, excluded from the manifest''s canonical projection so recording
  how a

  design was written can never move the hash its contract binds.

  **#811** closes the revision loop: a design question the gate asks can now be *answered*
  —

  `RETURNED_FOR_REVISION` re-executes framing with the notes and the prior manifest
  as

  authoring context, bounded by `manifest_max_attempts`, instead of stopping the sequence
  for a

  manual retry run. It **restores the prefix the note does not invalidate** via SIP-0101''s

  checkpoint translation — enabled by framing task ids becoming deterministic in the
  same

  change — and re-runs from the technical design, so the design answers the note rather
  than

  describing an interface the revised manifest no longer has.

  **#812** makes a gate decision say who made it. `decided_by` was a hardcoded `"system"`
  with

  a TODO beside it, so all 140 human approvals in the project''s history carried the
  word that

  means *no human was involved* — in the same namespace the machine paths use. It
  now composes

  `{actor}:{principal}` from the request identity, and an agent can declare itself

  (`--as-agent`) since a token cannot tell.

  **B1 (#809)** closes the one item whose omission would have been permanent: rejections
  are

  now classified at the moment they happen — plan-validation by producing validator,
  authoring

  by M6 class — so the pre-memory recurrence baseline Cross-Cycle Memory will be measured

  against is capturable. Read by nothing in 1.6, deliberately.

  **Track S opens with S1**: the five per-stack facts — expander, fill slots, QA namespace,

  harness boundary, check-stack vocabulary — collapse from four module-level dicts
  plus one

  inline answer into a single `ScaffoldStack` registration. Pure refactor; the reference

  manifest and contract hashes are unmoved. It removes a silent-omission trap: `fill_slot_paths`

  guarded on whether a stack was *registered* and then returned FastAPI''s slot map
  to whoever

  asked, so a second stack would have inherited `backend/routes.py` with nothing objecting.

  Plan: `docs/plans/1-6-0-authorship-plan.md`.


  Closed out 2026-08-21 at the cut. Later stages beyond the narrative above: Stage
  2g

  rewrote the Stack Blueprint Contract against main and it was **accepted 2026-08-17
  with

  its unbuilt parts named (SIP-0105)**; SIP-0104''s deterministic verification scaffolding

  carried both measurement windows. **Release gate MET**: the pre-registered V7

  authored-mode FAY window closed **amended 4/6 functional** (dual record 3/6 pre-registered

  instrument / 4/6 corrected, #1004/#1005, both always reported), zero manual interventions;

  the V38 model-comparison window (qwen3.8:27b) re-exercised the full authored path
  at

  **4/6, roughly half the wall-clock**, and its §6 synthesis records the failure-class

  shift toward framing-rooted contract violations. **Cut basis:** zero code drift
  between

  the window-validated frozen deploy `f7a5e0a2` and main (docs only); full regression
  7,615

  passed; Guard 1a/1b green. SIP-0103 promoted to implemented at the cut. Post-window

  queue deferred to 1.6.1+: #1011, #1012 (byte-verified reproducer banked), #1013,
  #1014,

  #1015, compile-credit bookkeeping.'
