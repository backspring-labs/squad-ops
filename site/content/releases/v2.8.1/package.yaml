narrative: "The 2.8 line's first patch (`docs/plans/2-8-1-plan.md`; the cut record\
  \ is `docs/plans/verification-sets/2-8-1-cut-record.md`): what the 2.8 windows met,\
  \ fixed.\n\n### Added\n- **The skills replay reads the gate's rules** (#3199; SIP-0116\
  \ §17y; the 2.8.1 plan's item 4): the cases\n  version `roblox-skills@3` adds the\
  \ 2.8 window's two items. A new expectation, `scenario_rules`, reads the\n  accepted\
  \ change request against facts its case states before the run:\n  - the revised\
  \ skill's fixed words;\n  - each of the item's sentences read by a criterion;\n\
  \  - no wait on a state no action reaches, or on an attribute nothing sets;\n  -\
  \ a named check that rejects what the broken builds show, accepts a correct reading,\
  \ and reads a changing\n    value as a stated band.\n\n  Read against every B-1\
  \ and B-2 proposal on record, it flags all 8 returned versions, each for the reviewer's\n\
  \  reason, and meets all 7 approved ones.\n- **A fault whose client stops at start,\
  \ for the Campaign-level repair diagnostic** (#3222, the 2.8.1 plan's item 5):\n\
  \  `luau_client_throws_at_start` adds a throw to the candidate's first client script\
  \ that fires only where Roblox\n  loads it (`typeof(game) == \"Instance\"`), so\
  \ the product's headless specs pass and every play reads `setup_failed`.\n  The\
  \ cycle reads `blocked_unverified` and the Campaign routes §10 row 8. A fault can\
  \ now stay out of a Campaign's\n  repair and retry cycles (`bound_cycles`), so the\
  \ repair builds without it. The request profile\n  `campaign-increment-source-client-stops`\
  \ declares it, with `max_correction_attempts: 0`.\n- **The runtime names what holds\
  \ its event loop, and its slow requests** (#3218's instruments, the 2.8.1 plan's\n\
  \  item 6): a loop held for over a second is logged with the loop thread's stack\
  \ (`event_loop_stalled`), and how\n  long it was held when it clears. A request\
  \ or a database connection slower than a second is logged too\n  (`slow_request`,\
  \ `slow_pool_acquire`). The watchdog stops with a start-up that fails, and doesn't\
  \ read a loop\n  that has stopped running as a held one.\n\n### Changed\n- **The\
  \ artifact vault no longer holds the runtime's event loop** (#3218, the 2.8.1 plan's\
  \ item 6): the\n  artifact-id index (92,000 entries, 8 MB on the Spark) is kept\
  \ in memory, so a lookup reads no file, and every\n  vault operation's file IO runs\
  \ in a worker thread. Concurrent stores share one index write, and each store\n\
  \  still returns only once the index file holds its entry. Before this, each store,\
  \ promote and retrieve parsed the\n  index on the loop, and each store rewrote it.\
  \ A run's checkout seeding and a gate's promotion held the API for\n  18 to 41 s.\n\
  - **A Luau product's suite author is told its own runner's rules** (#3147; SIP-0112\
  \ H.37): the `qa.test` system\n  prompt named pytest and vitest, with FastAPI, Next.js\
  \ and JSX examples, on every product. A product that tests\n  only with Luau runners\
  \ is now sent a fragment written for its runner, with the rules that hold on every\
  \ stack.\n  Every other run's `qa.test` system prompt is byte for byte what it was.\n\
  - **The Roblox scenario-writing skill carries the rules the increment gate applies**\
  \ (#3199; SIP-0118 R5.8):\n  `play-scenario-authoring` gains six rules, each with\
  \ a worked example: coverage, reachability, the broken build,\n  timing, preservation\
  \ and the kind of evidence. It ends with a self-review answered in each criterion's\n\
  \  `observable` (`Played.` or `Headless.`, `Reads:`, `Fails on:`, `Band:`, `Not\
  \ played:`). Coverage is worked from\n  the objective's own sentences, each quoted\
  \ by the criterion that reads it and kept in the `prd_delta`. A value\n  that changes\
  \ is read as the first band a stuck value can't show, inside one wait with at least\
  \ 10 s to spare. A\n  state no action reaches is played as far as a scenario goes\
  \ and proved headless for the rest, with the gap\n  declared.\n\n### Fixed\n- **A\
  \ cycle's recorded ending decides its status** (#3201): a cycle a Campaign ended\
  \ at the gate kept its later\n  workloads pending, so the cycle route read it `active`,\
  \ and rehearsal 3's abort cancelled it 40 minutes after it\n  ended. The latest\
  \ `cycle_ends` row now maps onto the status, and the cycle's response names it\n\
  \  (`recorded_ending`). A run still live from before the ending, or a cancel after\
  \ it, is named as a\n  `status_conflict` and never hides the other record. The abort,\
  \ the cycle list and detail, the memory routes and the\n  binding fill read it the\
  \ same way; the list reads every cycle's ending in one query.\n- **A person's decision\
  \ on an escalated plan gate ends its escalation** (#3174; SIP-0109 §24eh): an approval\
  \ left\n  the escalation reading `pending` when the run ended before the next sweep,\
  \ since only the sweep wrote the ending\n  and only for a building campaign.\n \
  \ - The gate route writes the ending as soon as the decision is stored, once, with\
  \ who decided and when. The\n    sweep writes it for a stored decision whose ending\
  \ is missing, in any state the campaign has reached.\n  - `resolved` is a decision\
  \ made before the ruling bound, by the decision's own time. One made after it reads\n\
  \    `expired` and names the decision, which stands on the run.\n- **A Studio that\
  \ moved release channel runs nothing until it is re-qualified** (#3206; SIP-0117\
  \ R5.29): Roblox's\n  updater moves an install between channels at one version number,\
  \ and the worker's proof held only the version\n  and the tool list. The proof is\
  \ now the version, the channel and the tool list.\n  - The channel is read from\
  \ the startup log the running Studio holds open, at every claim and on both sides\
  \ of\n    every reset. One that differs or can't be read reads `not_executed`, flagged\
  \ as the worker's own (R5.28).\n  - The qualification record (schema `/2`) names\
  \ the channel. A record from before it is still read, and as the\n    newest passing\
  \ record it runs nothing: **a worker upgraded from the 2.8 line's first release\
  \ is re-qualified once**\n    (`scripts/dev/studio_requalify.py`).\n  - Each result's\
  \ `ran_with` carries the proof's Studio (`qualified.*`) and the one the play ran\
  \ on (`played.*`).\n  - `squadops doctor`'s `qualified` check and the worker's registration\
  \ name the channel."
