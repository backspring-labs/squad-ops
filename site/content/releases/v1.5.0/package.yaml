narrative: "**Finish the Promises, Extract the Proven** — the odd-minor stabilization\
  \ release.\nFeature-free by rule and verified as such at the cut: no new contract\
  \ fields, manifest\nfields, request-profile capabilities, or squad-facing handler/workflow\
  \ surfaces, and\n**contract v9 / manifest v4 byte-stable line-wide**. 34 PRs, one\
  \ per issue, across three\ngates. Plan: `docs/plans/1-5-0-stabilization-plan.md`.\n\
  \n### Added — verification integrity, finished\n- **SIP-0096 implemented**, not\
  \ merely promoted. Gate waivers as additive schema plus CLI\n  `--waive/--waiver-reason`,\
  \ where a waived check is recorded and disclosed but the\n  verdict itself is never\
  \ rewritten (#682, migration 1030); wrap-up consumes the\n  `CycleOutcome` seam\
  \ and **clamps** over-claiming closeout prose to the evidence it cites\n  (#683);\
  \ inert-cycle detection derived on read — a squad that stops producing evidence\
  \ is\n  detected rather than read as passing (#684). The promotion PR also caught\
  \ its own\n  premise delta: the audit's fourth normative item (a SKIP-only pulse\
  \ is zero evidence,\n  not a pass) had been dropped from the plan and was implemented\
  \ rather than waved through.\n- **qa joins the typed-acceptance seam (#670)** —\
  \ authored checks *and* framework\n  injections now reach both authoring surfaces,\
  \ closing the gap shk-3 found where\n  `undefined_names` stopped at the qa boundary.\n\
  - **SIP-0101 Cycle Replay Harness, minimum slice** — maintainer-only replay from\
  \ a\n  recorded execution boundary, rails before mechanism (#735–#737, migration\
  \ 1020).\n\n### Added — correction evidence and termination\n- **#687** captures\
  \ the application's real traceback from the probe runner's spool delta;\n  **#431**\
  \ makes emission accounting explicit at four producer seams so extraction loss is\n\
  \  *named* rather than silently truncated. Together: the correction loop's long-standing\n\
  \  diagnosis blindness.\n- **#435** progress-aware correction termination — a moving\
  \ chain is never cut short, a\n  repeating one never burns the budget.\n- **#629**\
  \ a test suite whose assertions contradict the frozen contract is a blocking\n \
  \ failure; the prose half ships advisory by construction.\n\n### Changed — the structural\
  \ quarantine\n- **#663** the executor's context assembly becomes a declared `ContextAssemblyContract`\n\
  \  per task type, replacing five tables and three branches — landed in three golden-first\n\
  \  slices, 19 goldens captured *before* each refactor and byte-identical through.\n\
  - **#331** the 1,887-line planning handler splits into a package by authoring stage;\
  \ a\n  pure move, AST-verified 20/20 top-level names, every pre-split test passing\
  \ unmodified.\n- **#730 + #504** every typed check declares its own governance metadata\
  \ in one registry\n  with required, no-default fields — a new check cannot be added\
  \ without declaring who\n  owns its failures and whether it replays — plus the blocking\
  \ `fill_slot_signature` check\n  and a generated menu pinned by drift tests.\n-\
  \ **#481** stranded-cycle detection as a fourth startup sweep, read-only, emitting\
  \ the\n  exact recovery command. Its first live boot surfaced two genuinely stranded\
  \ cycles that\n  had been invisible for weeks.\n- **#734** every acceptance verdict\
  \ names the workspace revision it measured.\n- **#506** transport owns the full\
  \ task lifecycle, fixing retry attempts that never\n  re-entered RUNNING; **#724**\
  \ ~20 config reads swept onto `resolved_config`; **#452** the\n  last live-path\
  \ prompt prose moved into managed assets with byte-equivalence pinned.\n\n### Verified\
  \ as a line\nTwo green confirmation shakedowns on integrated deploys — the Gate-2\
  \ exit\n(`cyc_ea0b82cfbd17`, accepted, 17/17, zero corrections) and the cut shakedown\n\
  (`cyc_b07183b3cf5c`, accepted, 36/36 checks, 15/15 contract criteria, zero corrections,\n\
  zero machinery defects) — plus a live replay demonstration, a waiver end-to-end\
  \ probe, and\na replay zero-diff over the stored green corpus.\n\n### Filed forward\n\
  #761, #762, #668's suite half, #707, `package_builds` (declared-unbuilt with its\
  \ trigger\nrecorded in the registry), SIP-0102 migration steps 3–7, SIP-0092's M3,\
  \ and the #557\npost-retest governance review (SIP drafted) → v1.6+."
