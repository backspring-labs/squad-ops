narrative: '**Correction Aim + Authoring Prevention** — the correction chain aims
  true, and known

  authoring classes can''t be authored. Every fix traces to shk-2''s diagnosed loss
  chain,

  where a one-line defect survived two correction attempts: **#688** repair targeting
  now

  leads with the owning fill slot (failed probe → endpoint → contract''s endpoint→slot
  map);

  **#691** scaffold-frozen paths excluded from interface-drift detection; **#689**

  `undefined_names` (pyflakes F821) framework-injected at emission acceptance on `.py`
  fill

  slots — the call-time NameError class every prior gate missed; **#686** plan-shape
  rules

  rendered into the four authoring prompts.


  **Corrected premise, recorded:** #691''s filing blamed an unauthorized dev write;

  provenance showed the artifacts were scaffold-seeded and hash-identical to the contract''s

  frozen entries. The real defect was drift detection reporting the scaffold''s own
  probe as

  producer drift — a permanent false positive on every bind-mode cycle that corrects.
  The

  issue was rewritten before it was built.


  Confirmation **shk-3 green**, zero corrections; #686 confirmed at framing in its
  strongest

  form (a compliant plan on the first roll, where shk-1 needed a rejection plus a
  re-roll).'
