showcase:
  cycle_id: cyc_9727f1c382e2
  reason: 'Counted React roll 4, rejected after three correction rounds: a builder
    round, then two repairs aimed at a test timeout whose cause, a TypeError only
    jsdom raises, was printed where nothing read it (#1784). Its delivered app boots,
    lists runs and renders its create form; its detail page cannot be shown, because
    the scaffold wrote its manifest''s route as /runs/{run_id}, which the router never
    matches (#1794)'
  role: counted
