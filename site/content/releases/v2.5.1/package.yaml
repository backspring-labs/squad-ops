version: 2.5.1
tag: v2.5.1
previous_tag: v2.5.0
date: '2026-11-03'
commit: 60a4498e7a8827575a14b11680edf39df89ddd45
narrative: "**A patch on 2.5, an odd line that is feature-free by rule, carrying one\
  \ addition by the owner's decision.**\nOn 2026-11-03 the owner chose to acknowledge\
  \ the one feature merged to main during the 2.6 plan's spikes. The tag is\ncut from\
  \ the tree those spikes ran on, not from a branch of fixes only. #2854 is recorded\
  \ as a fix: a ruling's notes\nwere recorded and then dropped.\n\n### Added\n\n-\
  \ **A registered product's file at the Project's integrated commit,** `GET /api/v1/projects/{id}/source-file?path=`\n\
  \  (#2855, #2856). It is read-only, so the crew's Campaign drafting reads the goals\
  \ a Campaign will actually work from.\n  Spike 2 needed it, and it is the one feature\
  \ this patch carries.\n\n### Fixed\n\nThe 2.6 plan's §0 and §0a spikes found the\
  \ first ten on `prj-shelfnote`. The rest are the 2.5 cut's own open\ndefects, on\
  \ a Campaign's path or in the cut's tooling (D11).\n\n- **A product's `qa.test`\
  \ failing only `tests_pass` in the qa image is judged on the product's own runner**\
  \ (#2818,\n  #2835). A product's suite is re-judged when the qa image fails it beside\
  \ environment-sensitive checks, and a\n  skipped row isn't a failure (#2838, #2840).\
  \ The suite's workspace id is in the sandbox's alphabet, and a judgement\n  that\
  \ can't run leaves the agent's result (#2845, #2846).\n- **A repair or retry binds\
  \ its proposal's approved version,** not the launch block's first (#2824, #2836).\n\
  - **The campaign supervisor answers a Campaign cycle's plan gate,** and only a Campaign\
  \ cycle's (#2837, #2843).\n- **A repository-backed increment's plan gate reads its\
  \ approved change request as its design** (#2796, #2844;\n  SIP-0109 §24cs).\n-\
  \ **An already-met criterion beside discriminating ones is kept as a preservation\
  \ check,** and row 16's abandonment\n  counts toward no unaccepted limit (#2849,\
  \ #2850; SIP-0109 §24ct).\n- **A busy engine serving only declared models is a quiet\
  \ box,** so the crew's own model call on the shared\n  TensorFold engine no longer\
  \ blocks a Campaign launch or a run start (#2851, #2852; SIP-0109 §24cu, SIP-0111\
  \ §9n).\n- **The notes on an increment's approval reach its framing** as the reviewer's\
  \ guidance. Before this, an\n  `approved_with_refinements` ruling's notes were recorded\
  \ but never shown to a model (#2854, #2857; SIP-0109 §24cv).\n- **A product's criterion\
  \ file sits beside its runner's own tests,** and the plan gate refuses a planned\
  \ file that\n  shares a basename with a criterion file or a frozen verifier. A root\
  \ `test_criterion_T1.py` and a qa test of the\n  same name under `tests/` had stopped\
  \ pytest at collection (#2858, #2859; SIP-0109 §24cw).\n- **A criterion file is\
  \ never placed under a file name the product already holds elsewhere** in its tree,\
  \ which\n  would stop pytest at collection (#2860, #2865; SIP-0109 §24cx).\n- **tree-sitter\
  \ is pinned below 0.26.** 0.26.0 corrupts the tree of a JS/TS file past about 257\
  \ lines, or kills\n  the parse worker, so a product's long module had no anchored-edit\
  \ entities. 0.25.2 parses the same inputs\n  clean (#2814, #2866).\n- **A product's\
  \ qa run is bounded** (#2817, #2867; SIP-0112 H.16):\n  - The qa image's suite runs\
  \ under the framework's own, empty pytest configuration, never the product's. A\n\
  \    product's `python_files`, `addopts`, `required_plugins`, `filterwarnings =\
  \ error` or `strict_config` no longer\n    stops or fails it.\n  - A product runner's\
  \ file pattern names a test only under that runner's roots.\n- **A develop task's\
  \ typed check on a criterion file the merge gives to qa is resolved as its evaluator\
  \ reads it:**\n  a command against its `cwd`, a glob against the files. A `frontend_compiles`\
  \ on it is re-pointed to a file the\n  task keeps, not dropped (#2804, #2868; SIP-0093\
  \ §15c).\n- **`qa.test`'s monolithic prompt chooses its validation plan by one rule,\
  \ shared by the handler and the budget,**\n  and a plan that is also a source file\
  \ is counted as often as it is shown (#2809, #2869; SIP-0110 §5ap).\n- **A correction\
  \ repair's call, its anchored-edit retry included, is refused by name over its model's\
  \ window,**\n  never sent and never truncated past its output instructions (#2813,\
  \ #2870; SIP-0110 §5aq).\n- **The release records attach scans for held-out step\
  \ values and goals** as well as credentials, refuses to run\n  with no suite named,\
  \ and leaves a file out only through a withhold list with reasons (#2830, #2871).\n\
  \n### Documentation\n\n- **The 2.6 plan drafted for outside review,** §0's CLI spike\
  \ adopted, and §0a's second spike, crew-driven from Buzz\n  on outcome goals (#2832,\
  \ #2853).\n- **Project Goals and Backlog filed for design review** (#2833), proposed\
  \ as 2.6's headline.\n- **The v2.5.0 release package:** the cut's evidence, screenshots,\
  \ the records on the Release, housekeeping (#2831).\n- **The TensorFold 1.x upgrade\
  \ deferred to 3.x** by the owner, replacing the 2.5 plan's placement in 2.6 (#2829).\n\
  \n### Security\n\n- **`pyasn1` 0.6.4 → 0.6.5** in the agent image's lock (`CVE-2026-119194`\
  \ to `CVE-2026-119197`), and in\n  `ci-constraints.txt`.\n- **The evaluator image's\
  \ `minimatch` 10.2.6 → 11.0.1** (`GHSA-g3hv-75wg-m249`), pinned by `overrides` under\n\
  \  eslint 10.12 and typescript-eslint 8.71. The evaluator's tag moves to **`-8`**.\
  \ The delivered-lint runner's\n  output on a fixture tree is byte-identical under\
  \ both versions, and Lighthouse, axe, the driver and the\n  Chromium pin are `-7`'s,\
  \ so `-8`'s quality series start fresh as every tag's do."
