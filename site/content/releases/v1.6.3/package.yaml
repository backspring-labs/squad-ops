narrative: "**The measurement patch line.** 1.6.2 merged roughly twenty fixes and\
  \ none of them had been\nmeasured. This release ships three fixes and, for the first\
  \ time, a **rate**.\n\n### The evidence\n\nA pre-registered eight-roll set on a\
  \ frozen deploy — `docs/plans/1-6-3-repeatability-set-record.md`,\nregistered before\
  \ roll 1 and unchanged throughout. **No voids, no resets.** Every gate was decided\n\
  by `system:no_open_questions`, so zero manual intervention is literally true rather\
  \ than\ntrue-by-ruling.\n\n- **5 of 8 functional — 62.5%, 95% CI [30.6%, 86.3%]**\
  \ (verdict *and* boot audit *and* zero\n  intervention). The interval is wide and\
  \ was pre-registered as such: this establishes a baseline,\n  it does not claim\
  \ an improvement it cannot detect at N=8.\n- **8 of 8 delivered applications booted**\
  \ and answered their declared status codes.\n- **Zero framing re-rolls across all\
  \ eight**, and ten consecutive cycles have now framed on the\n  first attempt —\
  \ against **three** framing runs for the pre-1.6.2 green roll. That is 1.6.2's\n\
  \  success-status single-sourcing (#1067/#1070A), measured rather than asserted.\n\
  \n**The finding that outranks the rate — corrected 2026-08-25 (record §6):** the\
  \ cut-time reading\nwas that two of the three failures were the framework wrongly\
  \ rejecting a working application\n(#1087). The stored per-round test reports say\
  \ otherwise: all three rejected applications failed\nthe frozen response floor of\
  \ the join probe at every round, and the phantom-table assertion was a\nsecond failure\
  \ in two of them, never the only one. The loss mode is the repair round not acting\
  \ on\na correct round-0 diagnosis — wrong file emitted, nothing emitted, or a correct\
  \ repair discarded by\na contract-violating fill (#1094). #1087 stands as a defect;\
  \ its yield on this set was zero rolls.\n\n### Fixed\n\n- **#971** — a failed task's\
  \ emission is banked for triage instead of discarded. Before this, the\n  one artifact\
  \ guaranteed absent was the one that *caused* the failure. Triage-only, with three\n\
  \  independent exclusions so known-bad bytes can never reach a workspace or the\
  \ deliverable. The\n  set banked 44/48/11/48/11 failed emissions on the rolls that\
  \ needed them, and roll 1's root\n  cause was traced by reading artifacts that would\
  \ not previously have existed.\n- **#1082** — an emission that stopped mid-construct\
  \ is caught at the task that wrote it, rather\n  than surfacing later as the consumer's\
  \ test failure. Validated against all 4,513 scannable\n  source artifacts in the\
  \ banked corpus: 8 flags, every one a genuine truncation, zero false\n  positives.\
  \ Two false positives found *during* that validation drove real fixes (JSX punctuation\n\
  \  read as a regex opener; parens counted inside JSX text) rather than a tuned threshold.\n\
  - **#1079** (parity half) — the boot-audit oracle and the in-cycle probe runner\
  \ judge a contract\n  with the same code. The oracle had re-implemented the expectation\
  \ block and carried two of the\n  three kinds, making the more trusted of two judges\
  \ the more permissive one.\n- **#1076** — the release package captures cycle evidence\
  \ instead of reporting that it did.\n\n### Known and named, not fixed\n\n- **#1087**\
  \ — the frozen store exports a table handle for every declared entity, including\n\
  \  embedded shapes and response projections no correct application writes. Two of\
  \ this set's three\n  rejections. Fixing it moves the generator hash, so it is a\
  \ deliberate 1.6.4 scaffold change.\n- **#1079** (producer half) — `json_has` still\
  \ has no producer, so **contract probes do not verify\n  response bodies**. The\
  \ boot audit certifies that an app boots and answers with the right status\n  codes,\
  \ not that it answers correctly. Roll 5 is the demonstration: rejected for a real\
  \ missing\n  field, audit passed.\n- **#1021** — `criteria_unevidenced` never settled\
  \ across eight rolls on one frozen deploy (1–5\n  `vc-compiles-*` dropped per roll).\
  \ Marked confounded before the set opened; the set is now the\n  largest same-configuration\
  \ sample the question has.\n- **#1089** — the single-sourced framework version reads\
  \ stale editable-install metadata. Found\n  during this cut.\n\n### Scope of the\
  \ evidence\n\nThe set ran `full-38` (qwen3.8:27b) with `build_profile=nextjs_ts`\
  \ and `dev_capability=nextjs_ts`\non `group_run`. `full` (qwen3.6) remains the canonical\
  \ squad and the meaning of every historical\nrecord; this set says nothing about\
  \ it. Nothing in eight rolls was truncated, so #1082 demonstrated\nonly that it\
  \ does not reject healthy work — its catching behaviour rests on the corpus sweep.\n\
  \n**Code drift between the tagged tree and the validated deploy: zero.** The freeze\
  \ held from roll 1\nto the tag."
