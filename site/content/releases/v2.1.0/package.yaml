version: 2.1.0
tag: v2.1.0
previous_tag: v2.0.1
date: '2026-10-07'
commit: 62cdb25973efee9ef0fe92e7e8d782a4b43f77de
narrative: "**The 2.1 line: hardening after 2.0's campaign headline, feature-free\
  \ by rule** (CLAUDE.md, #281). It closes the\ndebt 2.0 deferred, and every path\
  \ the campaign relies on now holds on its own terms. Plan:\n`docs/plans/2-1-0-plan.md`,\
  \ which carries the owner's grant, rulings and each day's record.\n\n**The cut's\
  \ evidence: PASS** (`docs/plans/2-1-0-preregistration.md`, registered in #2090;\
  \ its §10 in #2108). It was read\non the final deploy (`fcc7ce04`, `dep_5e77a9060e68`):\n\
  - **the counted set:** 4 of 4 regression rolls accepted, two per stack, every criterion\
  \ verified (21, 15, 21, 16) and\n  every boot audit passed. There was one correction\
  \ round, with its reason recorded. P1–P4 held: lint readings,\n  failed-round reasons,\
  \ the Next.js detail page rendered, and the console acting as its caller;\n- **the\
  \ shakeout campaign:** clean in one round, with two increments accepted;\n- **the\
  \ recovery diagnostics, all PASS:** #1824's infrastructure retry end to end, and\
  \ the restart set (#1934, #2007,\n  #2042);\n- **two defects found by #1824's live\
  \ path** and fixed before the set: a refused run could not leave `queued` (#2094),\n\
  \  and the retry rows were asked after the blocked rows (#2101).\n\nThe tagged tree\
  \ differs from the validated deploy by #2104's LangFuse compose `HOSTNAME` and by\
  \ prose. No squad image or\ncode differs.\n\n**Campaigns: the 2.0 set's findings\
  \ (SIP-0109).**\n- **The proposer and its rails:** the rails refuse a behaviour\
  \ change with nothing to build (#2011);\n  the proposer is told every convention\
  \ its stack's frozen code decides (#1962, #1950; #2013), and\n  that a PRD delta\
  \ states only what the request delivers (#1995; #2014).\n- **#1884, by the owner's\
  \ rule:** every author of an increment's tests is held to it (#2012), and\n  behaviour\
  \ a qa author would test but nothing accepted requires is returned as a proposal\
  \ (#2019).\n- **The supervisor:** its instruments are tracked, each verdict a tested\
  \ function (#2025); it\n  creates and manages a campaign, while escalations and\
  \ limit pauses stay the owner's (#1940;\n  #2047).\n- **Recovery:** the sweep re-hears\
  \ an ended cycle between restarts (#1972; #2038); a restart starts\n  a successor\
  \ run left queued (#2042; #2048); a launch the cycle-create path refuses escalates\
  \ to\n  the owner, who retries it or aborts (#1971; #2052). A cycle that failed\
  \ outside the work is retried: the retry\n  rows read the failure's attribution,\
  \ and the box's and the queue's refusals are declared as such\n  (#1824; #2080).\
  \ The retry rows are asked before the blocked rows, since a run the box refused\n\
  \  verified nothing and reads `blocked_unverified` (#2101; #2102, SIP-0109 §24bh).\n\
  - **A recovery cycle** is told what each correction round of the failed cycle tried,\
  \ and the digest\n  measures what recurred (#1692; #2071).\n- **Evidence:** any\
  \ increment can be replayed outside its campaign, on the current deploy (#1959;\n\
  \  #2026); a campaign's creation row records the definition file that made it (#1954;\
  \ #2050); the\n  digest scores each increment from the package alone (#1960; #2027);\
  \ a definition's comment names\n  no deploy or round unless its bytes are pinned\
  \ (#1958; #2039).\n- **Next.js increments:** their pages are read, and a page written\
  \ as the API writes it is seeded\n  (#1973; #2059), including one whose collection\
  \ sits under a prefix written into each endpoint path\n  (#2084; #2085, SIP-0109\
  \ §24be).\n\n**Cycles and the correction loop.**\n- One recorder for every gate\
  \ decision, and a refinement approval promotes (#1986; #2030); its notes\n  are\
  \ promoted when they are stored, and the CLI says who reads them (#2029; #2049).\n\
  - The restart re-attach replays a proposal task and ends the flow runs a dead process\
  \ left open\n  (#1934, #2007; #2033).\n- A rewind on a `model_limitation` with repair\
  \ unspent is a patch, and every override is recorded\n  with the run (#1757; #2053).\n\
  - A qa task evaluates the set it stores, and a re-take proves it (SIP-0107 §20;\
  \ #1727, #1913;\n  #2061).\n- A failed check's own account of why is kept with its\
  \ round and its failure record (#2028; #2056),\n  a failed `tests_pass` round's\
  \ included: its failing cases and any runtime error (#2086; #2087). An\n  empty\
  \ repair records whether it was offered the scoped edit form (#1911; #2055).\n-\
  \ The last correction attempt is held for a required check (#414; #2067).\n- Reporting-only\
  \ lint and complexity findings on the delivered app (ruff, and the pinned ESLint\
  \ on a\n  TypeScript tree) are kept with each qa run and carried in the campaign\
  \ package. They are evidence,\n  never a gate (#1937; #2088).\n- A run that fails\
  \ before it starts ends failed, instead of staying queued (#2094; #2095, SIP-0064\n\
  \  §15a).\n- The manifest author is taught each error code's conventional status,\
  \ and an unwarranted departure\n  is reported (#1031; #2070).\n- The boot audit\
  \ renders each declared route, by the increment evaluation's own render (#1796;\n\
  \  #2060).\n- The flow executor's dependencies are required keywords, so a misspelling\
  \ fails at boot (#1987;\n  #2051).\n\n**Processes and the sandbox.**\n- Every check,\
  \ build, boot and browser the agents run ends with everything it started, and a\n\
  \  timed-out test run ends its whole process group (#1983; #2043, #2046).\n- A sandbox\
  \ run that outlives its limit is killed by name, and its docker client ended (#2045;\n\
  \  #2057); a `secret://` service token is resolved by the provider the secrets section\
  \ selects\n  (#1982; #2035).\n\n**Architecture.**\n- One map of every package, guarded\
  \ both ways (#1989; #2021). The package roots import nothing, and the\n  packages'\
  \ import direction is guarded (#1985; #2063).\n- Tooling targets Python 3.12, and\
  \ mypy runs in CI as a ratchet against a recorded baseline (#1988;\n  #2020).\n\
  - Four layers no composition root builds are deleted (#1984; #2031), and so are\
  \ the four\n  stack-blueprint fields the second stack falsified (#1975; #2037).\n\
  - Every environment read outside the config loader is inventoried and guarded both\
  \ ways (#1991;\n  #2054); one helper each for the CLI client, text digests, string\
  \ lists, the scaffold-integrity\n  emitter and an unreadable vault ref (#1990; #2066).\n\
  - Cross-Cycle Memory's recall port, inert, and its call site (#1964; #2058).\n-\
  \ The benchmark registry refuses a replayed cycle (SIP-0101 §4.1; #2036).\n\n**Security\
  \ and dependencies.**\n- **Every credential is the deploy's own,** generated at\
  \ bootstrap and rotatable in place: a\n  registry of the deploy's credentials, compose\
  \ requiring each one, and a doctor check (#2006;\n  #2069).\n- **The token verifier\
  \ moves to PyJWT** (#2073; #2075). python-jose had stopped releasing and\n  carried\
  \ two advisories with no fix version (GHSA-3qf3-8w2g-rqmx, and PYSEC-2026-1325 against\n\
  \  `ecdsa`), both unreachable and accepted with their reasons in the meantime (#2074).\
  \ PyJWT refuses\n  three tokens python-jose accepted (no `aud`, no `kid`, an `iat`\
  \ beyond the skew ahead), none of\n  which the deploy's clients issue.\n- multidict\
  \ moves to 6.9.1 for GHSA-54p9-h82j-f925 (#2074).\n- **Every console call to the\
  \ runtime API carries its caller's own token,** and the console's service\n  client\
  \ is retired (#2068; #2081).\n- The copy of `.env` a credential rotation keeps beside\
  \ it is ignored by git (#2099; #2100).\n- LangFuse listens on every interface, so\
  \ its loopback health check passes. It had never passed since #581 (#2103;\n  #2104).\n\
  \n**SIPs.**\n- `update_sip_status.py` can retire a proposal without accepting it\
  \ (#1968; #2015), and the 13\n  proposals the portfolio ruled deprecated are retired\
  \ (#2023).\n- The delivery ledgers and the portfolio are guarded (#1969; #2016);\
  \ every SIP part's issue carries\n  `sip:NNNN`, matched to the ledgers both ways\
  \ (#2022); new SIPs start from a template with an\n  intake check and a delivery\
  \ ledger (#1981; #2018); the S5 admission gate reads an empty string as\n  unset\
  \ (#1967; #2017).\n- The release cut's SIP sweep is read from the ledgers, and the\
  \ release PR must name what it finds\n  (#1980; #2032).\n- **Cross-Cycle Memory\
  \ is accepted as SIP-0110** (revisions 4 and 5), with the 2.2 plan (#2097, closing\
  \ #1964's\n  re-read). Its Phase 1, the 2.2 headline, is the campaign's proposal\
  \ gate, and is measured before 2.2.0's cut.\n\n**Release and verification tooling.**\n\
  - A verification set records the tracked loaded checks, and refuses a deploy that\
  \ answers with the\n  old code (#2064); each rebuild adds its rows (#2077, #2091).\n\
  - The recovery diagnostics read #1934, #2007 and #2042 live (#2065), and hold the\
  \ box past one lease\n  to read #1824's retry back (#2089).\n- The cut's shakeout\
  \ campaign definition: two increments on 2.0's set policy (#2092).\n- Cut steps\
  \ 4 and 8 are checked: the ROADMAP entry and a recorded housekeeping run (#1957;\
  \ #2040).\n- The delivered-app capture photographs a reference-scenario cycle, whole\
  \ (#2008; #2024); the\n  records scan names a secret the repository already carries\
  \ (#2005).\n- Tests: the OTel adapter tests stop the exporter threads they start\
  \ (#1930; #2034), and one helper\n  watches a test's process end (#2076)."
