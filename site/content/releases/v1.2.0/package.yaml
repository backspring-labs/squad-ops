narrative: "First **feature release** on the even/odd minor cadence (#281): even minors\
  \ carry\nfeatures, gated by headline feature SIPs. 1.2.0 is led by three — the SIP-0089\n\
  runtime-arc completion, the SIP-0090 Agent Embodiment Substrate (Phase 1), and the\n\
  SIP-0095 Cycle Create Preflight — riding a hardening base (#158, #231). Two lanes\n\
  fed it: features from the Macbook lane, hardening + supporting decisions from Spark.\n\
  \n### Added\n- **SIP-0090 Agent Embodiment Substrate — Phase 1 (core model).** The\
  \ internal\n  substrate for embodied agents: an `Embodiment` lifecycle state machine\n\
  \  (`unattached→attaching→attached→desynced→reconnecting→detached`) with an explicit\n\
  \  transition allow-list and a single-active-embodiment-per-agent invariant (enforced\n\
  \  both in code and by a Postgres partial unique index); resource budget primitives\n\
  \  (attention/compute/action consumables + a concurrency capacity gauge, with\n\
  \  non-silent exhaustion made type-unrepresentable); an `EmbodimentStatePort` with\
  \ a\n  Postgres adapter; and an `EmbodimentCoordinator` that validates transitions\
  \ and\n  emits canonical events. No adapter yet — Discord/browser embodiments are\
  \ later\n  phases (#312, #317).\n- **SIP-0095 Cycle Create Preflight.** A create-time\
  \ fail-fast gate: a cycle is\n  rejected (HTTP 422 `PREFLIGHT_REJECTED`) when the\
  \ squad can't satisfy the requested\n  workloads' required roles, or names a model\
  \ definitively not pulled (exact\n  canonical-tag match, no family inference). An\
  \ unreachable LLM backend\n  warns-and-allows rather than blocking on missing evidence;\
  \ warnings surface on the\n  create response and in the CLI. `squadops doctor` gained\
  \ model-availability parity\n  via the same shared decision (#298, #309, #311, #315,\
  \ #321).\n- **SIP-0089 runtime-arc completion.** Cycle recruitment now routes through\
  \ the\n  RuntimeCoordinator with FocusLease arbitration (a lease conflict is a deferral,\
  \ not\n  a failure) (#233), and coordinator transitions commit lease + activity\
  \ + mode in a\n  single `RuntimeTransaction` unit of work with live-validated rollback\
  \ (#244).\n- **Validated-fullstack request-profile** — instrumentation + builder\
  \ + stack for\n  end-to-end framework validation (#279).\n\n### Changed\n- **Health\
  \ signal consolidated to a single source of truth (#231).** `runtime_status`\n \
  \ is now the canonical health signal across every read surface (API single + list\n\
  \  routes, CLI, both console plugins); it is always-populated (the heartbeat ensures\n\
  \  the runtime row and reconciliation backfills legacy agents), and the\n  `runtime_status\
  \ || network_status` fallback is gone. `network_status` is demoted to\n  a deprecated\
  \ back-compat field (column drop tracked separately) (#302).\n- **Squad profiles\
  \ consolidated to `smoke` / `lite` / `full`** (#173).\n\n### Fixed\n- **CLI now\
  \ renders cycle-route error messages (#319).** They were nested under\n  FastAPI's\
  \ `detail` and silently dropped — the operator saw `validation failed —`\n  with\
  \ no reason (e.g. the preflight's actionable \"pull model X\"). Found via live\n\
  \  cycle validation (#320).\n- **Operational hardening (#158)** — configurable adapter\
  \ timeouts + a DDL↔model\n  drift guard; the `_schema_migrations` applier remains\
  \ idempotent.\n- Local-spark bootstrap models reconciled with the squad profiles\
  \ (#285); QA-harness\n  robustness + portable-frontend build fixes (#303, #296,\
  \ #280).\n\n### Deferred / follow-ups\n- SIP-0095's materialized-plan capability\
  \ check at the plan-review gate (#295) —\n  deferred to land with the #186 executor\
  \ decomposition; the dispatch-time check\n  remains the net.\n- SIP-0090 Phase 1\
  \ budget persistence + composition-root wiring — no live consumer\n  until Phase\
  \ 2 (Discord)."
