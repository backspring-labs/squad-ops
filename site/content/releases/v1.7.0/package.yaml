narrative: "**The Reasoning line opens.** Plan: `docs/plans/1-7-0-plan.md` (rev 3).\
  \ Cut record:\n`docs/plans/1-7-0-cut-record.md`.\n\nGated on a two-stack shakeout\
  \ pair on frozen deploy `bbf42f8d`, **zero code drift between\nthe deploy and the\
  \ tag**: Next.js+TS `cyc_2a88dabad94b` 15/15 and FastAPI+React\n`cyc_cb49b16c2fa6`\
  \ 15/15, both accepted, zero correction rounds, both boot audits PASS.\n\nIt took\
  \ six rolls. Rolls 3–5 produced five rejections across four distinct causes, every\
  \ one\na real defect the shakeouts surfaced — recorded in the cut record §3 because\
  \ the plan's\ncalibration assumes a line's rolls mostly pass and this one did not.\n\
  \n### Changed — the LLM provider is required configuration (#1157, SIP-0106 Ruling\
  \ 3)\n- **`SQUADOPS__LLM__PROVIDER` is required and never defaulted.** Two adapters\
  \ were in the\n  tree while the factory defaulted `provider=\"ollama\"`, the agent\
  \ entrypoint never passed\n  one and `LLMConfig` had no field — the vLLM adapter\
  \ was unreachable by any configuration\n  since it landed. Now `LLMConfig.provider`\
  \ and `create_llm_provider(provider, …)` have no\n  default; a missing value fails\
  \ at config load the way an unknown one fails in the\n  factory. Every deploy surface\
  \ writes the value: the eight SquadOps service blocks in\n  `docker-compose.yml`,\
  \ `.env.example` (uncommented), the test fixtures. The switch to\n  another provider\
  \ is one PR changing that value (SIP-0106 §5).\n- **Both composition roots go through\
  \ the factory**: the runtime-api no longer constructs\n  `OllamaAdapter` directly\
  \ (the LLM half of #301), and the cycle-create model preflight asks\n  the port\
  \ for `MODEL_LISTING` instead of `isinstance(OllamaAdapter)` — on any other\n  provider\
  \ it was silently unverifiable.\n- The mis-nested `SQUADOPS__LLM__USE__LOCAL` example\
  \ and the `use_local` field it never\n  reached are gone.\n\n### Added — the Atlas\
  \ adapter (#1159, SIP-0106 P4)\n- **`adapters/llm/atlas.py`**, selected by `SQUADOPS__LLM__PROVIDER=atlas`:\
  \ its own file,\n  not a subclass of the vLLM adapter (SIP-0106 §3.5a), because\
  \ the dialect diverges where\n  it matters — every item measured on the Spark on\
  \ 2026-08-28. A bearer token is mandatory\n  once the server is bound off localhost\
  \ (`SQUADOPS__LLM__API_KEY`, a `secret://` ref the\n  loader resolves; a 401 names\
  \ that setting rather than reporting a network failure); the\n  engine's own `response_token/s`\
  \ is reported instead of a wall-clock derivation;\n  `reasoning_tokens` are counted\
  \ separately (`thinking_tokens: True`); the port's level\n  maps onto Atlas's `reasoning_effort`\
  \ ladder verbatim except `high → xhigh`, which the\n  served Qwen3.8 template requires;\
  \ streamed `reasoning_content` deltas never reach the\n  text. Registered as the\
  \ conformance suite's third case, with the measured shapes.\n- `ChatMessage` / `LLMResponse`\
  \ gain `reasoning_tokens` (None when not reported, never\n  zero); `Qwen/Qwen3.8-27B-FP8`\
  \ joins the model registry with the window the A/B recipe\n  serves — 64K, raised\
  \ from the first recipe's 32K because that left the prompt guard a\n  24,576-token\
  \ budget and 5.9% of the arm's real prompts run longer (#1160 §1.4).\n\n### Added\
  \ — reasoning is a level on the port (#927)\n- **The port carries `reasoning: none\
  \ | low | medium | high`**, never a provider's\n  switch. Ollama maps `none → think:false`\
  \ and any graded level → `think:true`; vLLM\n  maps by the dial the model spec declares\
  \ (`chat_template_kwargs.enable_thinking`\n  for a toggle model, `reasoning_effort`\
  \ for an effort model, nothing for a model\n  with no channel). `LLMCapability.REASONING_CONTROL`\
  \ declares whether a level\n  reaches the wire, and the conformance suite asserts\
  \ the declaration against the\n  request bodies for every adapter. No level sent\
  \ ⇒ the wire is byte-identical to\n  what it was before this change.\n- **Every\
  \ capability declares how much reasoning its output wants**\n  (`capabilities/reasoning_policy.py`):\
  \ a transcription — filling scaffold slots,\n  a repair verdict, a stored report\
  \ — is `none`; an argument — the manifest, the\n  analyses, the plan — is `high`.\
  \ #924 measured the difference on the deployed qa\n  fill brief: 5,727 completion\
  \ tokens with the channel on, 413 with it off, the same\n  eight fences. No default:\
  \ an undeclared capability raises, and a test over the\n  handler registry makes\
  \ the gap a CI failure.\n- **Resolution is the chain every other knob uses**: the\
  \ declaration →\n  `config_overrides.reasoning` (a new allowed key, value validated\
  \ at the profile\n  boundary) → the model's dial (`ModelSpec.reasoning_control`,\
  \ required on every\n  registry entry; qwen3.x `toggle`, qwen2.5/llama3 `none` —\
  \ a model with no channel\n  gets no level, since Ollama rejects `think` for it).\n\
  - **`GenerationRecord.reasoning`** carries the sent level to LangFuse, so \"how\n\
  \  much did this call think\" is read per generation rather than inferred from a\n\
  \  token count."
