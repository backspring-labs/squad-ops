narrative: "Hardening patch on the 1.1.0 runtime line. The runtime lane (SIP-0089)\
  \ was\nlive-validated end-to-end after 1.1.0, surfacing two regressions the unit\n\
  suites couldn't catch (#270, #272); both are fixed here alongside the resume\nand\
  \ reliability work from the 1.1.x hardening plan. No new SIPs — the additive\nitems\
  \ are backward-compatible and the one rename (#79) is internal.\n\n### Added\n-\
  \ Per-role Prefect task names: tasks render as `{role} [{n}/{total}]: {title}`\n\
  \  so a role appearing multiple times in a plan is distinguishable in the\n  Prefect\
  \ UI (#94).\n- Agent **`mode`** and **`runtime_status`** are now surfaced on the\
  \ agent-list\n  API and the console agent view, alongside the heartbeat fields —\
  \ health is\n  `runtime_status`, posture is `mode` (see\n  `docs/agent-runtime-status-model.md`)\
  \ (#230, #231).\n\n### Fixed\n- **Auth:** cycle API routes returned 403 for every\
  \ authenticated user — #150\n  applied `cycles:read`/`cycles:write` scope checks,\
  \ but the role-centric\n  Keycloak realm issues *roles*, not those scopes. Bridge\
  \ realm roles to their\n  implied scopes in `resolve_identity` so role-bearing tokens\
  \ authorize as\n  intended (#270).\n- **Duty scheduler:** duty windows never auto-opened\
  \ under the default\n  `missed_window_policy=\"skip\"` — the poll-cadence lag before\
  \ the first\n  observing tick was misread as a missed window. A just-active window\
  \ is now\n  treated as on-time within one poll interval (plus jitter margin) (#272).\n\
  - **Resume:** a duty-deferred run is now re-attempted *and* actually\n  re-executed\
  \ on resume — the resume route never re-invoked the executor\n  before (#222).\n\
  - **Resume:** mid-sequence runs resume at the correct workload index instead of\n\
  \  re-running from workload 0 (#257).\n- **Comms:** `publish()` now retries with\
  \ bounded backoff across the RabbitMQ\n  reconnect window instead of failing the\
  \ first send after a drop (#245).\n- **Capabilities:** strip `<think>` blocks before\
  \ fenced-code parsing, and log\n  the raw output on zero extraction so empty parses\
  \ are diagnosable (#130).\n- **CLI/API:** `runs retry` now actually executes the\
  \ run (it previously\n  no-op'd); corrected stale docstrings (#133, #205).\n- **Telemetry:**\
  \ the `BrokenExporter` test no longer leaks a global OTel\n  provider into sibling\
  \ tests (#239).\n\n### Changed\n- Renamed the `governance.establish_contract` capability\
  \ → **`governance.define_done`**\n  and its `run_contract.json` artifact → **`definition_of_done.json`**\
  \ (the fields\n  are a standard Definition of Done, not a \"contract\"). Internal\
  \ rename, no\n  behaviour change; historical artifacts on disk are left as-is (#79).\n\
  \n### Internal / tooling\n- Regression suite runs in parallel via `pytest-xdist\
  \ -n auto` (#216).\n- `update_sip_status.py` now rewrites the body `**Status:**`\
  \ line on promotion,\n  not just the frontmatter (#253).\n- Deduplicated three copies\
  \ of the JSONB-parsing helper into one (#156); routed\n  the dispatched-flow factory\
  \ through `create_workflow_tracker` (#250); corrected\n  stale flow-executor references\
  \ in the control-plane context doc (#168)."
