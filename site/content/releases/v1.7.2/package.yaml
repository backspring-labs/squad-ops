narrative: "**Loop Honesty — the second patch line of 1.7.** Plan: `docs/plans/1-7-2-plan.md`.\
  \ Record:\n`docs/plans/1-7-2-verification-set-record.md`.\n\nValidated by a pre-registered\
  \ two-set verification run on frozen deploy `d95af712` (HEAD pinned\nat `b5e8fe12`),\
  \ **zero code drift between the deploy and the tag** — the tag adds only the record\n\
  and this release commit: **FastAPI+React 5 of 6 functional** and **Next.js+TS 3\
  \ of 3**. The one\nrejection is an application defect (join/leave returned a response\
  \ missing the Run body); the\ndelivered app passed the boot audit on **eight of\
  \ nine** rolls.\n\n**The line's bar was L1, and it held: 0 contentless qa first\
  \ attempts across 172 emissions.**\nThat is what #1268 fixed — on the 1.7.1 tree\
  \ the qa role's first attempt had become a sentence of\nintent and nothing else,\
  \ on three of five React rolls and both Next.js rolls, and it was reaching\nfour\
  \ pre-existing recovery-path seams for the first time.\n\n**Stated rather than implied:**\
  \ five of the eight predictions (L2, L5, L6, L7, L8) entered the\nset unexercised\
  \ and left it unexercised — no absent-suite repair, no re-dispatched suite, no app\n\
  runtime error, no qa-owned failure and no path-prefix emission arose in nine rolls.\
  \ They are held\nonly by the shakeout loop's injected diagnostics. And the shakeout\
  \ loop is reported as two\nnumbers: **five rounds against a budget of three, zero\
  \ attributable to the pack** — twelve\ninstrument defects, none in the items being\
  \ measured.\n\n### The pack\n\n- **The qa authoring pair gets the reasoning channel\
  \ back** (#1268) — the contentless first\n  attempt, the condition every other prediction\
  \ is measured through.\n- **A qa-owned defect is detected per runner** (#1270) —\
  \ the own-frame detector was pytest-shaped\n  and the vitest side had none; and\
  \ **the fullstack merge stopped discarding every\n  `suite_defect`** (#1305), which\
  \ is why 1.7.1's R2 looked unfixable.\n- **A passing qa task hands its evidence\
  \ to the ledger** (#1271); **the retest is keyed on what\n  the patch contains**\
  \ (#1269); **a prose-only repair is refunded and the termination says which\n  absence**\
  \ (#1273).\n- **The failing cases reach the model** — on the re-dispatch and at\
  \ all (#1260, #1289) — and\n  **the repairer reads the traceback**, with the fence\
  \ example naming the task's own file\n  (#788, #1272).\n- **An accepted patch supersedes\
  \ the failed attempt's rows** (#1318) — the ledger's supersession\n  identity had\
  \ gained a criterion since #1021 and the patch row never carried it, so a run could\n\
  \  be rejected on a defect its own accepted patch had fixed. Found by voiding a\
  \ counted roll.\n- **The rejects-blank probe derives its status from the authored\
  \ mapping on both stacks** (#1321)\n  — stack 1 hardcoded 422 on a premise its own\
  \ frozen error seam falsifies, so any manifest\n  declaring 400 produced an unwinnable\
  \ probe.\n- **The Next.js qa namespace is the co-located convention, not the application**\
  \ (#1292).\n\n### Instrument\n\n- **A cycle can be made to fail on purpose, on its\
  \ own path** (#1251) — fault injection, so a\n  recovery-path prediction can be\
  \ exercised rather than waited for.\n- The retry path says whether the remedy reached\
  \ the prompt (#1110); one home for the gate rule\n  (#1150); the fan-out path records\
  \ verification evidence (#1148); a fault that cannot bite says\n  so instead of\
  \ claiming an exercise (#1300); a fault declaration survives the wire it arrives\
  \ on\n  (#1298); a record names the deploy it observed rather than the one someone\
  \ typed (#1296).\n\n### Known and open at the cut\n\n- **#1323** — a builder's unrequested\
  \ source file is admitted because the failed-emission storage\n  route performs\
  \ no write authorization, and the repair that fixes it is dropped. Found on\n  counted\
  \ roll 1.\n- **#1324** — the boot audit discards the response it judged, so a failed\
  \ probe cannot be\n  root-caused from the record.\n- **#1312** — `qa_handoff.md`\
  \ is required, multiply-verified and read by nothing; its declared\n  signature\
  \ was not hit in this set.\n- **#1316** — nine unit-test directories (437 tests)\
  \ are outside the regression gate.\n- The driver's `refused_patches` truncates mid-word,\
  \ and **\"qa primary tokens\" is declared as\n  texture in the pre-registration\
  \ with no producer** — which is why #1285's reading cannot be\n  made from this\
  \ set."
