commit: f203e1c232cc8c46c96f53c340dd15de76afda31
narrative: "**The 2.2 line: Cross-Cycle Memory, Phase 1** (SIP-0110), a feature release.\
  \ Memory's unit is the cycle. Every\neligible cycle is observed. A reviewed lesson\
  \ can be supplied to the cycle's plan writing, build authoring, repair and\nproposal\
  \ writing, and to nothing unless it is approved. Beside it is #1708's plan-review\
  \ tier, which decides a\ncampaign's plan gates when the campaign declares it. Plan:\
  \ `docs/plans/2-2-0-plan.md`, which carries the owner's grant\nand rulings.\n\n\
  **The window's finding: no demonstrated useful benefit** (SIP-0110 §5h; `docs/plans/2-2-0-slice4-preregistration.md`\n\
  §12).\n- **The instrument is valid:** 5 of 5 cases reconstructed byte for byte,\
  \ on one deploy, with the window's manifest held.\n- **The one lesson,** on proposal\
  \ writing, improved 1 case, worsened none and tied 4. The pre-registered bar needs\n\
  \  three improvements.\n- **The owner disabled the lesson at the cut, and kept the\
  \ mechanism.** No lesson is approved in 2.2.0, so memory\n  supplies nothing until\
  \ the owner approves one.\n\n**The cut's evidence: PASS** (`docs/plans/2-2-0-cut-preregistration.md`,\
  \ registered in #2216; its §10 in #2219). It\nwas read on the window's deploy (`ed540e1b`,\
  \ `dep_4015cab5e042`):\n- **the counted set:** 4 of 4 regression rolls accepted,\
  \ two per stack, with memory disabled. Every criterion was\n  verified (21, 16,\
  \ 21, 18) and every boot audit passed. No roll had a correction round or a re-roll;\n\
  - **memory inert where it is disabled:** all 41 exposures read `memory_disabled`,\
  \ and all 41 envelopes reconstruct\n  byte for byte;\n- **the shakeout campaign:**\
  \ clean in one round. Two increments were accepted, and the tier decided all 3 plan\
  \ gates;\n- **the tier's diagnostic:** the escalation path was read live as far\
  \ as the delegate's answer. It found three\n  defects, which the owner placed in\
  \ 2.2.1 (#2212, #2213, #2214). Until their fixes, the timeout half (expiry, the\n\
  \  parked cycle, the continuation) is read in unit tests only.\n\nNo deployed code\
  \ differs between the tagged tree and the validated deploy. The difference is campaign\
  \ definitions, the\nset's configs, the replay's rubric and prose.\n\n**Cross-Cycle\
  \ Memory, Phase 1 (SIP-0110).**\n- **Revision 6 restores the cycle as Phase 1's\
  \ unit** (#2111). The plan is adopted with D1–D15 (#2113), and §5e\n  records the\
  \ source-case inspection (#2115).\n- **Slice 1: capture.** Each authoring seam's\
  \ pre-authoring state is captured at its first model call and recorded in\n  the\
  \ cycle registry (#2116). An envelope's handler is re-run in its own container to\
  \ compare the prompt byte for byte\n  (#2119). Envelopes are stored as `json`, so\
  \ their inputs keep their order (#2123). The plan proposers derive the id\n  they\
  \ render, so their envelopes reconstruct (#2141; #2142). Every seam reconstructs\
  \ on a live cycle (#2105; #2131).\n- **Slice 3: the mechanism, inert until approved**\
  \ (#2096; #2143).\n  - **Observation:** rejected plans, failed rounds and returned\
  \ proposals are observed, and stored beside the cycle\n    registry (#2120). The\
  \ runtime projects recent cycles and campaigns every five minutes (#2122).\n  -\
  \ **The failure-shape sorter** reads the test runner's per-runner tables, and the\
  \ repeat report reads repeated\n    signatures (#2121).\n  - **Lessons:** lessons,\
  \ approvals, the pinned snapshot and deterministic recall (#2124), and their store\
  \ (#2125).\n  - **Pins:** a standalone cycle pins at creation, a campaign at its\
  \ start, and a counted roll declares memory\n    disabled (#2126).\n  - **Supply:**\
  \ recall and slots at each consuming task, with every answer disclosed (#2127),\
  \ and the correction loop's\n    repair slot (#2129). The pulse-check repair chain\
  \ runs on its roles' squad-profile models (#2128; #2130).\n  - **Approval:** approval\
  \ with its combined check, revocation, the lessons API and CLI, assessment, and\
  \ the app-build\n    indicators (#2134).\n  - **Exposures:** a re-dispatched authoring\
  \ records its own exposure (#2162; #2163), stored as one invocation's\n    (#2165;\
  \ #2166).\n  - **Returns:** a return classified only in prose enters through a reviewed\
  \ annotation (#2160; #2186).\n- **Slice 2: the authoring replay.** Three arms differ\
  \ only by the intervention, with validity first, temporal validity\n  by evidence\
  \ time, a frozen manifest, and no store writes (#2137). The in-container replay\
  \ loads the agent's config\n  with the secret provider (#2139). The replay's call\
  \ record uses the envelope's own digest (#2106; #2140). The\n  convergence replay\
  \ hands its repair the memory-disabled recall (#2144).\n- **Slice 4: the first lesson\
  \ and the window** (#2107).\n  - the slice 4 pre-registration, and the rubric it\
  \ fixes (#2161);\n  - the window's five campaign definitions, one objective each\
  \ (#2196);\n  - the finding (#2207);\n  - the cut's pre-registration, with the lesson\
  \ disabled at the cut (#2209).\n- **SIP-0110 records:**\n  - Memory Entry Points\
  \ for chat and task assignment, accepted by the owner and absorbed into SIP-0110\
  \ as §5g and\n    Appendix A (#2185). Its eleven parts are placed in 2.3–2.5 (#2174–#2184);\n\
  \  - §5i: a memory-disabled unit pins a disabled snapshot with no lessons, as built\
  \ since #2126 (#2217; #2218).\n\n**Campaigns: the plan-review tier and its escalation\
  \ queue (SIP-0109, #1708).**\n- **A return names what went wrong**, or says nothing\
  \ fits and why (§24bi, the plan's D2; #2132).\n- **The policy**, as the owner ruled\
  \ it (#2145).\n- **The tier:** a campaign declares who decides its plan gates, and\
  \ the tier decides them when it says so (#2146).\n  It approves a plan with no open\
  \ question, inside the objective's scope, framed once. Anything else escalates.\n\
  - **The escalation queue:** an unanswered gate expires at the bound, and its cycle\
  \ is parked, unaccepted (#2147). A\n  late answer is recorded (#2148), and it reaches\
  \ a plan only by being carried, and only to the same question (#2188;\n  #2189).\
  \ The tier's docstrings describe the carried answer (#2195), and §24bk is ratified\
  \ as written (#2197).\n- **Activated** in the cut's shakeout, where it decided all\
  \ 3 plan gates (#1708).\n- **The proposer** is told what its stack does with a request\
  \ field the manifest does not declare (#2114; #2117).\n\n**Cycles, the correction\
  \ loop and the audit.**\n- **A block cut by the completion cap** is dropped and\
  \ the call asked again once. It is never taken as written\n  (#2149; #2150).\n-\
  \ **Scaffold attribution:** an error the app raised under the spine's own call is\
  \ the app's, never the fill's\n  (#2152; #2156).\n- **The boot audit:** a UI call\
  \ answered with an error status and no JSON is reported as what came back, never\
  \ as a\n  page (#2154; #2157).\n- **The analyzer-claim refutation** knows the scaffold's\
  \ frozen files, so a true claim about one stands (#2155; #2158).\n\n**Security,\
  \ auth and deploy.**\n- **The realm admin's password is the deploy's own,** held\
  \ in `.env`, and the realm exports commit none (#2079;\n  #2138).\n- **The realm\
  \ sync** gives each service account the realm roles its export declares (#2083;\
  \ #2133).\n- **nat, eve and han keep their memory store** on a volume of their own,\
  \ and a guard holds every agent to it (#2112;\n  #2172).\n- **The deploy record:**\
  \ the sandbox is rebuilt before it is written, and a stale record fails `verify_loaded`\n\
  \  (#2193; #2194).\n\n**Release and verification tooling.**\n- **Loaded checks:**\
  \ each rebuild's regression pair adds its rows (#2135, #2136, #2192). `verify_loaded\
  \ --only` with\n  an id that names no row runs nothing, and says so (#2190).\n-\
  \ **Disputes:** a dispute is read as the appendix shows it, so a reason that quotes\
  \ code still disputes (#2168;\n  #2169).\n- **Configs:**\n  - the regression pairs'\
  \ configs for rebuilds 5–9 (#2151, #2159, #2164, #2167, #2170);\n  - the redispatch\
  \ diagnostic's config (#2191);\n  - the cut set's configs (#2211).\n- **The cut's\
  \ records:** the pre-registration's amendment (#2215), registration (#2216) and\
  \ readings (#2219).\n- **Tests:** the console command-handler stubs restore the\
  \ state they found (#2082; #2118).\n\n**SIPs.**\n- **SIP-0111, TensorFold provider\
  \ adapter, accepted** (#2198): a third candidate engine on GB10, behind SIP-0106's\n\
  \  seam, gated by measurement.\n- **SIP-0104:** a failing slot assertion's location\
  \ says who wrote it, not what is wrong (#2187)."
