tag: v2.7.0
previous_tag: v2.6.1
date: '2026-11-10'
commit: be3d02133c60a422d8e1c01845307ece1420d3c1
narrative: "Stabilization, feature-free by rule (`docs/plans/2-7-0-plan.md`): the\
  \ 2.6 line's debts closed. The cut's evidence is\n`docs/plans/verification-sets/2-7-0-cut-record.md`;\
  \ the soak's record is `2-7-0-soak-record.md` beside it.\n\n### Added\n- **A scripted\
  \ squad for machinery cycles** (#2495): the `machinery` squad profile's agents all\
  \ name the model\n  `scripted`, and every call they make is answered from a recorded\
  \ script\n  (`--set llm_script=<name>@<version>`, scripts in `src/squadops/llm/llm_scripts/`),\
  \ with no model loaded. The\n  answers sit behind the existing LLM port, so dispatch,\
  \ emission, correction and acceptance run their normal\n  paths, and every other\
  \ profile keeps the engine on the same deploy. A missing answer fails the task naming\
  \ its\n  key `(task_type, occurrence, call)`; it never falls back to a model. Cycle\
  \ create refuses a scripted squad with\n  no script, an unpinned or stale version,\
  \ or a mixed squad, and refuses a script named on a model squad. A\n  scripted cycle\
  \ produces no Cross-Cycle Memory observation, and its calls are charted under the\
  \ engine\n  `scripted`. `scripts/dev/record_llm_script.py` records a script from\
  \ a run's stored emissions; an answer may\n  carry its recorded latency, which the\
  \ provider waits out when the script sets `replay_latency`.\n- **A scripted Campaign\
  \ answers each cycle from its own script** (refs #2892, SIP-0109 §24dt): a Campaign's\n\
  \  `policy.llm_scripts` names one pinned script, `<name>@<version>`, per cycle it\
  \ launches, in launch order, bound at\n  the launch from the control log's own count,\
  \ so a restart doesn't reset it. A Campaign of several scripted\n  increments can\
  \ now make a different change in each. A launch past the last script is refused,\n\
  \  `LLM_SCRIPT_MISSING`, and the Campaign escalates; it's never answered from another\
  \ script or by a model.\n  Creation refuses a script the deploy doesn't hold at\
  \ that version. `record_llm_script.py` gains\n  `--latency-scale` and `--latency-cap`,\
  \ written into the script's `recorded_from.latency` with the replayed total:\n \
  \ a recorded gap includes any gate wait between two stored files, which can outlast\
  \ the deploy's per-task\n  timeout. The soak's pre-registration is `docs/plans/verification-sets/2-7-0-soak-preregistration.md`.\n\
  - **The draft's integration check** (#2862, SIP-0112 H.30): `POST /api/v1/projects/{id}/integration-check`\n\
  \  (`campaigns:manage`), or `squadops projects check-integration <project> [--token-from-gh]`.\
  \ Before the next\n  Campaign is drafted on a repository-backed Project, it syncs\
  \ where a contribution is pending, reading each\n  review request's merge on the\
  \ forge, re-validates where one merged, and answers what is still not in, each row\n\
  \  with what it waits on. The forge is only read. One sync is recorded per upstream\
  \ commit. With no token (the\n  request's, else the one the deploy holds for the\
  \ Project) the merge is answered unread, `no_token`, never \"not\n  merged\". A\
  \ patch export is read by ancestry with no forge token, and a fetch refused for\
  \ its credentials is\n  `fetch_unauthorized`. Its re-validation is bounded: a READY\
  \ Project, after its own sync, at that sync's commit. It\n  replaces the host-side\
  \ merge sweep and its timer, which the owner ruled against on 2026-11-08 and which\
  \ was never\n  installed.\n- **A validation is fenced on the baseline it read**\
  \ (#2862, SIP-0112 H.30): one that another validation overtook\n  writes nothing,\
  \ and `POST /api/v1/projects/{id}/validate` answers 409 `BASELINE_MOVED`, so a slow\
  \ validation can\n  no longer move a newer adoption back.\n\n### Changed\n- **An\
  \ outside operator's pull request is held to its branch's boundary by a policy the\
  \ repository doesn't\n  hold** (#2975, PR #2991): `operator branch checks` runs\
  \ on `pull_request_target` from the default branch,\n  never runs the pull request's\
  \ code, and reads the policy from the `OPERATOR_BRANCH_POLICY` repository\n  variable,\
  \ which only an administrator can change. It fails closed on a missing or malformed\
  \ policy, an\n  undeclared role, an unresolved commit identity or a foreign author,\
  \ and the check's own files are out of\n  bounds to every operator branch. It is\
  \ now the required check, and the check it replaces is removed\n  with its script\
  \ and its in-repository boundary file.\n\n### Fixed\n- **A product's change request\
  \ can't reuse the anchor of a page an earlier increment added** (#2783, SIP-0109\
  \ §24dq):\n  the PROMOTE row on a campaign branch records each page the increment\
  \ added and acceptance held, with every test id\n  its page carried. The next launch\
  \ pins that inventory beside the frozen criteria. The rails judge an accepted page\n\
  \  as a pinned one and refuse an added page's anchor that one carries. The proposer\
  \ is shown those pages and their ids.\n  Acceptance renders them in the expected\
  \ set, so a candidate that drops one is rejected, and a page never built\n  that\
  \ reuses one's anchor is blocked, never held. A product with no approved manifest\
  \ is covered by the same\n  inventory. After its outside review (§24dr): an added\
  \ page's anchor is also held unique against the candidate's\n  own rendered pages;\
  \ each promotion records the inventory's pages again with the ids they carry now;\
  \ a pinned\n  route's inventory ids stay taken at acceptance. A launch or promotion\
  \ from before the inventory is refused rather\n  than read as empty: the proposal\
  \ and acceptance refuse a block without one, and a Campaign whose log has such a\n\
  \  promotion escalates before its next proposal, naming the row. Both the runtime-api\
  \ and nat images have to answer\n  their loaded checks (`2783-runtime`, `2783-nat`)\
  \ before the fix is relied on.\n- **A suite handed to the product's own runner is\
  \ banked as handed off, not failed** (#2949): on a product\n  only its own runner\
  \ runs (SIP-0112 H.26), every `qa.test` banked its emission `emission_status=failed`\n\
  \  seconds before the runner passed the task. The router now takes the runner's\
  \ reading before the bank, and an\n  emission whose hand-off the runner passed is\
  \ banked `handed_off`. It stays out of every workspace, delivered\n  tree and deliverable,\
  \ as a failed one does, and the scorecard's `failed_emissions` and the verification-set\n\
  \  records no longer count it. A runner that fails the suite, a pass refused on\
  \ the head, and a suite the image\n  ran and failed still bank `failed`. Stored\
  \ rows read as they did. The Prefect task run, the agent's activity\n  and `task.failed`\
  \ still read the hand-off as failed (#3000).\n- **A product's repaired suite is\
  \ read by the product's own runners** (SIP-0112 H.29, #2827 item 2): patch acceptance\n\
  \  found a repaired suite by the stack's collected-test vocabulary, and `nextjs_ts`'s\
  \ is the scaffold's `__tests__/`\n  rule (#1534). A product made from that blueprint\
  \ runs under it, so a repair placed where the product's vitest\n  collects it was\
  \ never retested, and one placed by the scaffold's rule was. Now the dispatched\
  \ task's runners (their\n  roots and file pattern) decide, and a sample application,\
  \ or a product with no runner, keeps the stack's reading.\n- **A plan-less product\
  \ cycle's test author is shown the product** (SIP-0112 H.29, #2827 item 2): the\
  \ monolithic qa\n  prompt (`request.qa_test.test_validate`, version 6) shows the\
  \ product's repository view, its map, conventions,\n  checks and runners, as a plan's\
  \ task is shown it. The scaffold's harness paragraph is now a sample application's\n\
  \  block only, and a sample application's prompt renders byte for byte as before.\
  \ Where the view shows a stack's\n  conventions for a product, the profile's test\
  \ supplement is left out in their favour, as the developer's is.\n- **The vault's\
  \ metadata is readable again by its readers on the host** (a regression from PR\
  \ #2968): the atomic\n  write kept `mkstemp`'s 0600, so every metadata file written\
  \ after it deployed was unreadable to the release\n  capture, the verification-set\
  \ driver and triage, which read the vault as another user. Files are 0644 again,\
  \ as\n  `write_text` left them."
