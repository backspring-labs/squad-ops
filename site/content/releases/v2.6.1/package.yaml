narrative: "The 2.6 line's first patch (`docs/plans/2-6-1-plan.md`): what an operator\
  \ meets first on 2.6.0, fixed small.\n\n### Fixed\n- **A rebuilt console plugin\
  \ reaches a browser without emptying its cache** (PRs #2958, #2959, backspring-labs/continuum#4):\n\
  \  Continuum 1.0.3 versions each plugin bundle's URL by its content, caches the\
  \ current one for good and revalidates the\n  rest, and answers 304 for an unchanged\
  \ file. #2958's Caddy `no-cache` stopgap is removed.\n- **The selected model engine\
  \ comes back after a reboot** (#2932 ask 1, PR #2962): TensorFold runs `--restart\n\
  \  unless-stopped`. The switch's removal, compose's stop and the watchdog's kill\
  \ all keep a deselected engine down.\n- **A deploy runs the Caddyfile it pulled**\
  \ (#2960, PR #2963): Caddy mounts the file singly, so a pull never reached it\n\
  \  and a reload re-read the old one. Every deploy compares the two and restarts\
  \ Caddy when they differ.\n- **Home's Create Cycle opens the Cycles create form**\
  \ (#2909, PR #2964): it called a window function the console never\n  defines. It\
  \ now hands the request to the Cycles panel, as the Campaigns link to the goals\
  \ panel does.\n- **The qa briefs show a criterion test that asserts on something\
  \ it made sure is there** (#2933, PR #2965): a non-empty\n  check before a loop\
  \ and the suite's own fixture, on both stacks; a qa repair keeps the suite's fixture.\n\
  - **The console's Signal view no longer holds the runtime API for seconds** (#2921,\
  \ PR #2968): its artifact panels read\n  every page of every Project's artifacts,\
  \ and each page walked all of a Project's metadata on the event loop, so a\n  5\
  \ ms call on Home could take 9 s. The panels read each Project's newest page, and\
  \ the vault's walk runs in a worker\n  thread, with metadata written whole and renamed\
  \ into place.\n\n### Moved to 2.7\n- A suite handed to the product's runner reading\
  \ as handed off rather than failed (#2949's remainder).\n- D1: a criterion that\
  \ passes on the head on qa's first emission refused to qa rather than abandoned\
  \ at row 19 (#2933)."
