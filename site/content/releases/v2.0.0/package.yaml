commit: 962e62a90bc948bc0b785c04192097ec1cf878fa
narrative: "**Campaign: the squad evolves one delivered app increment by increment,\
  \ unattended between one\nsupervised gate per increment.** SIP-0109 (Campaign Orchestration),\
  \ the 2.x line's headline. Plan:\n`docs/plans/2-0-0-plan.md` (rev 10). Record: `docs/plans/2-0-0-preregistration.md`\
  \ §10.\n\n**The claim, measured on rebuild 22 (`b09883c9`, `dep_bb1eadeac4e7`):\
  \ PASS.** Two pre-registered\ncampaigns ran group_run from a calibration cycle through\
  \ three accepted increments each, with a\nsupervisor ruling each proposal through\
  \ the interface and no owner action.\n- **Both campaigns completed by their objective**\
  \ (§10 row 3). Every increment was built on the one\n  before it, and every earlier\
  \ frozen criterion passed on each later increment.\n- **Every safety guarantee held\
  \ in both:**\n  - no build without an approving ruling bound to its proposal version\
  \ and accepted tree;\n  - no stale, conflicting or lost ruling;\n  - one cycle per\
  \ launch intent;\n  - every promotion carries its whole tree (`tree_ref`) and its\
  \ criteria's bundles;\n  - no launch beside a crew model.\n- **Both evidence packages\
  \ were complete at close.** No escalation, no limit reached, no framework fix\n\
  \  during the set.\n- **Five predictions held** (P1, P2, P3, P6, P7) and three were\
  \ not exercised (P4, P5, P8), since no\n  increment failed. **P9 is falsified:**\
  \ each approved request stated only its feature, but two\n  criterion files frozen\
  \ at promotion add rules none stated (a tie order; a white-box store check).\n \
  \ #1884 moves to 2.1.\n- **The reference scenario,** a fixed increment on a pinned\
  \ baseline outside any campaign, gave the\n  same outcome before and after the two\
  \ campaigns.\n- **The shakeout loop took ten campaigns.** The first four each found\
  \ the next seam defect, and the\n  tenth found none on the registered deploy.\n\n\
  **The campaign (SIP-0109).**\n- **The campaign object:** its lifecycle, control\
  \ log and launch outbox, in Postgres, with\n  `/api/v1/campaigns`, the supervisor\
  \ and triage roles, the `squadops campaigns` commands, and every\n  control-log\
  \ row projected as an event and an audit record (#1808, #1809, #1815, #1816, #1838).\n\
  - **The continuation decision:** §10's fourteen rows as a pure function; the completion\
  \ hook that\n  hears a cycle end; the owner's word on a held or escalated action;\
  \ the objective's measurement,\n  read so row 3 can end a campaign in success (#1825,\
  \ #1834, #1835, #1907).\n- **The increment proposal and its gate:** a typed change\
  \ request with its rails, written by the\n  strategy role's proposal run (#1818,\
  \ #1820, #1821). At the increment gate the submission is\n  recorded, and the ruling\
  \ is bound to the version and accepted tree, recorded before it acts\n  (#1828).\
  \ A returned proposal is revised in a new run from the version it returned (#1830),\
  \ and a\n  supervisor rules from the change request they reviewed (#1836). The proposal\
  \ ledger and the\n  supervisor's classification (#1841); the ruling bound, recorded\
  \ as it passes, for whoever holds the\n  seat (#1895, #1920).\n- **The brownfield\
  \ increment cycle:** an approved increment binds its framing to the candidate\n\
  \  manifest and frames only its approved change; its implementation starts from\
  \ the accepted tree and\n  writes only the slots its change touches; each new criterion\
  \ is proven in its own test file; the\n  increment ends in its evaluation, and an\
  \ accepted one is promoted with its criteria frozen; every\n  declared route renders,\
  \ read in the qa container (#1840, #1842–#1844, #1847–#1852, #1854).\n- **Accumulated\
  \ acceptance:** the evaluator trees, verifier bundles and test identity; discrimination,\n\
  \  frozen criteria and route rendering, executed on the stack's runner; frozen verifiers\
  \ protected,\n  retired criteria leaving the frozen set, a replaced verifier frozen\
  \ anew (#1822, #1823, #1839,\n  #1855, #1863).\n- **Repair and retry:** a rejected\
  \ increment is repaired from its own candidate under its approved\n  plan; a retry\
  \ reuses the increment's bound request, ruling, baseline and footprint; each is\
  \ shown\n  the failed cycle's own record (the prior-cycle brief), and a proposal\
  \ after an abandoned increment\n  is shown why it was abandoned (#1856, #1858, #1861,\
  \ #1862).\n- **Recovery:** a cycle whose completion hook did not decide is re-heard\
  \ at startup; a restart takes\n  up the campaign cycle it died inside; a task a\
  \ restarted runtime asks for again is answered, not run\n  twice; the recovery diagnostics\
  \ harness (#1860, #1923, #1924, #1932).\n- **The box lease and the quiet-box check:**\
  \ stored, with its API, and refused at every launch path.\n  A run start waits for\
  \ a quiet box as a launch does (#1829, #1915, #1931).\n- **Evidence:** a cycle's\
  \ failure records persisted at its ending, and the attribution read from them;\n\
  \  the package and morning digest materialized at close; what died with the container\
  \ logs (the runs'\n  revision forms, each cycle's log window) kept (#1811, #1813,\
  \ #1837, #1919). **After the set,** the\n  digest says what each increment shipped,\
  \ how each proposal was ruled, and the package's size against\n  its bound (#1998).\n\
  - **The reference scenario's build and proposal halves,** with a per-mechanism report\
  \ and a typed\n  rating (#1853, #1879, #1882, #1896).\n- **Campaign definitions\
  \ are tracked with their project,** each reconciled against the stored\n  campaign,\
  \ and the records tarball carries the line's campaigns' outputs through the same\
  \ scan\n  (#1942, #1953).\n- **The runbook:** running, supervising and recovering\
  \ a campaign (#1904). After the set, it gained the\n  outer loop's second half and\
  \ the approval boundary (#1997).\n\n**What the proposer is told, each from a shakeout's\
  \ finding.** Each frozen criterion's assertion,\nnot only its id (#1939). The rule\
  \ a new criterion is judged by: it must fail on the accepted tree\n(#1947). What\
  \ an optional field left out comes back as on the stack (#1949). An increment's\
  \ plan asks\nonly for tests of what the approved change states (#1886).\n\n**SIP-0107's\
  \ flip** (step 7): a repair's whole re-emission of an offered file is refused (#1909),\n\
  read on its checkpoint pair before registration (#1910).\n\n**Found by the shakeouts,\
  \ each fixed and closed:**\n- the completion hook counts a cycle's stored usage\
  \ instead of crashing on it (#1857);\n- the plan check judges only the workloads\
  \ whose gate judges the plan (#1864);\n- an escalated campaign can be resumed with\
  \ the owner's action (#1866);\n- an increment's plan authors are told which footprint\
  \ files the scaffold writes (#1868);\n- an increment's framing runs the plan proposers\
  \ (#1870);\n- the startup sweep skips a cycle that ended through the completion\
  \ boundary (#1872);\n- an increment's proposers see every surface the merger does\
  \ (#1874);\n- an increment builds on its candidate's frozen files, and request models\
  \ take their entities' types\n  (#1876, #1877);\n- an increment's evaluation judges\
  \ the candidate with its qa suites (#1880);\n- a question the accepted cycle's gate\
  \ answered is not asked again (#1885);\n- an increment's accepted tree is the whole\
  \ app, recorded at promotion (#1887);\n- the cycles list pages, and a status filter\
  \ reads past the newest page (#1891);\n- a self-evaluation pass's edit keeps the\
  \ type of the file it edits (#1897);\n- `contract_assertions_match` reads a reused\
  \ name as its latest call (#1898);\n- an accepted repair proposes from the manifest\
  \ it ran against (#1902);\n- an increment's plan gate reads the seed forwarded to\
  \ its framing (#1905);\n- a qa test task declares the suite it authors (#1912);\n\
  - the frozen-statement lookup is a function of stored data alone (#1943).\n\n**Carried\
  \ in from 1.9, landed.**\n- The two jsdom-safe forms are shown to the develop and\
  \ qa roles (#1785).\n- A manifest route's parameter renders in the stack's router\
  \ syntax (#1794).\n- An endpoint error the contract does not define is unwinnable\
  \ (#1819).\n- The technical design shows the revision request it is handed (#1845).\n\
  - One rule for the files a run delivered (#1833).\n- A qa re-take keeps the suite\
  \ files it leaves alone (#1755).\n- The replay keeps each repair's responses (#1788).\n\
  - `campaign:` and `deploy:` Prefect flow-run tags (#1728).\n\n**Records.**\n- Every\
  \ accepted SIP carries a delivery ledger, and `sips/PORTFOLIO.md` tracks overlap\
  \ and\n  reconciliation (#1970).\n- SIP-Outcome-Evaluation is proposed (#1963).\n\
  - The 2.1.0 plan is adopted (#1955).\n\n**Not landed, stated.**\n- **#1884 stays\
  \ open:** the set read P9 falsified. The fix is on the qa author's side, or in what\
  \ the\n  evaluation freezes (2.1.0).\n- **The set's other findings,** #1961, #1962\
  \ and #1995, are placed in 2.1.0. Each was caught by the\n  supervisor at the gate,\
  \ and none was fixed during the set.\n- **#1708's auto-decision tier and escalation\
  \ queue** are 2.2.0.\n- **#1710's squad first pass** is not built: who writes it\
  \ is the owner's open question.\n- **#1824:** §10's retry rows stay unreachable,\
  \ since no cycle produces an environment-attributed\n  rejection (2.1.0).\n- **SIP-0109's\
  \ unbuilt items** are placed: #1971, #1972, #1973 (2.1.0).\n\n**Drift from the registered\
  \ deploy, declared.** After the set: the digest's renderings (#1998, digest\ntext\
  \ only, with no verdict, gate or package identity), the runbook (#1997), the records\
  \ tool (#1953),\nand docs and SIP records. None of the set's evidence depends on\
  \ them."
