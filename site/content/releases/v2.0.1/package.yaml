narrative: "**Security: an artifact is written inside its own directory, whatever\
  \ filename or id it carries**\n(advisory GHSA-3rw2-35gr-mvh3, #2003). The artifact\
  \ ingest route passed a client-supplied `filename`\nunvalidated to the filesystem\
  \ vault, so an absolute name or one with a `..` segment was written\noutside the\
  \ vault. Exploiting it needed `cycles:write`.\n- **One rule:** a filename is relative,\
  \ has no `..` segment, is not blank and has no NUL.\n- **The route** refuses a name\
  \ that breaks it (`422 INVALID_FILENAME`), and nothing is stored.\n- **The vault**\
  \ refuses it too, for every caller, and checks that the artifact's directory and\
  \ file\n  both resolve inside the vault.\n- **Model emissions were already guarded**\
  \ by the fenced parser.\n\nNone of the deploy's 35,522 stored filenames is refused\
  \ by the rule. **Upgrade from 2.0.0.**\n\n**Also since 2.0.0:**\n- the release capture\
  \ rebuilds a campaign increment from the accepted tree its promotion recorded,\n\
  \  not from its run's scaffold stubs (#2000);\n- the v2.0.0 release package (#2001);\n\
  - SIP-0107 is promoted to implemented, its step 7 having shipped in 2.0.0 (#2002)."
