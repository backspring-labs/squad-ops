commit: 6b769a854d268af7fc53c813ff70bbf74563b3d0
narrative: "### Added\n- **The squad is shown its own reading** (SIP-0109 §24dk, #2944,\
  \ PR #2945): a goal-set Campaign's proposal carries the product's\n  reading of\
  \ the last increment it accepted. It still reports, and decides nothing.\n- **A\
  \ product's declared reading of an accepted increment** (SIP-0109 §24dj, #2938,\
  \ PR #2942): `technical.commands.readings`\n  run on the candidate in the sandbox,\
  \ and what each one prints is kept on the evaluation and the promotion, and shown\
  \ in the digest\n  and each open gate's evidence. Report-only: a reading never changes\
  \ a verdict.\n- **A repository-backed product runs on its own stack** (SIP-0112\
  \ H.26, #2937, PR #2941): its development profile is selected\n  from the derived\
  \ facts at `prepare_cycle`, with its origin and a fingerprint recorded, and a named\
  \ profile that contradicts\n  its runners is refused. `node_vitest` is new, and\
  \ `product_neutral` with a `stack_unmatched` gap replaces a silent\n  `python_cli`.\
  \ The product's runner now reads every failing `tests_pass`, for Python products\
  \ too, and `test_report.md` says\n  what ran, where and on which runner.\n- **A\
  \ Project's goal set** (SIP-0115 slice 1, #2884, PR #2899): the goal, expected results\
  \ with where each is\n  observed, constraints, out of scope, the ordered backlog\
  \ and candidates, written as immutable numbered revisions\n  with author, reason\
  \ and `source_ref`. `/api/v1/projects/{id}/goal-set` reads the active revision,\
  \ `/revisions`\n  the history and one by number, and `POST /revisions` writes the\
  \ next against an expected revision (409 when\n  another was written first). Read\
  \ with `cycles:read`, written with `admin:write` only. `squadops goals\n  show|edit|history`;\
  \ `show` prints YAML that `edit -f` takes back. Migration `2100_project_goal_sets.sql`,\
  \ the first\n  of SIP-0115's range `2100–2199`.\n- **A Campaign works through its\
  \ Project's goal set, one backlog item per increment** (SIP-0115 slice 2, #2885;\n\
  \  SIP-0109 §24cy, SIP-0115 §10b). A repository-backed Campaign names `objective.goals:\
  \ {goal_set: <its project>,\n  revision: <n> | current}` or `objective.requirements`,\
  \ never both and never neither; a pinned revision the goal\n  set doesn't hold,\
  \ a Project with no goal set, another Project's goal set, or `stop_when` without\
  \ goals is refused at\n  creation. The proposer is shown the goal, expected results,\
  \ constraints, out of scope and the backlog with each\n  item's status in this Campaign\
  \ and the next item; its change request names it (`backlog_item`), and the rails\n\
  \  return one naming none or any other (`not_the_next_backlog_item`) before a cycle\
  \ is spent. Each item's status\n  (`pending`, `proposed`, `in_increment`, `accepted`,\
  \ `abandoned`, `removed`, and `accepted (removed in rN)` /\n  `accepted (results\
  \ changed in rN)`) is derived from the control log, never stored, and read at\n\
  \  `GET /api/v1/campaigns/{id}/backlog` and `squadops campaigns backlog <id>`. A\
  \ proposal is bound to the revision it\n  was created under; at its ruling a later\
  \ revision that moved its item or changed what it serves returns it as\n  `goals_revised`,\
  \ which spends neither a rejection nor a revision. `stop_when: backlog_done` stops\
  \ a Campaign at\n  §10 row 3 when every item of the revision read at the decision\
  \ is accepted, and the decision's row records which.\n- **The console's goals panel**\
  \ (SIP-0115 slice 4, #2887, PR #2916): a panel of the Projects plugin\n  (`squadops-projects-goals`,\
  \ in the Projects view) that follows the Project selected in the list, or a Campaign\n\
  \  selected anywhere (`squadops:select-campaign`). It shows the goal, expected results\
  \ with where each is observed,\n  constraints and out of scope; the backlog in the\
  \ goal set's order with each item's derived status and increment\n  (proposal, version,\
  \ cycle) in a chosen Campaign of the Project, read from `GET /api/v1/campaigns/{id}/backlog`,\n\
  \  and the revision that Campaign reads; the candidates waiting, read-only; and\
  \ the revision history. A Project with\n  no goal set and a Campaign naming none\
  \ (`CAMPAIGN_HAS_NO_GOAL_SET`) read as such, not as failures. A viewer\n  holding\
  \ `admin:write` can edit the goal, expected results' statements, constraints, out\
  \ of scope and the backlog\n  (reorder, retitle, change what an item serves, add,\
  \ remove), and with a reason the edit is written as the next\n  revision through\
  \ the command bus: the new confirm-level `squadops.revise_goal_set`, whose console-app\
  \ handler\n  posts `POST /api/v1/projects/{id}/goal-set/revisions` against the revision\
  \ the edit began from. A revision\n  written first by someone else (409 `STALE_GOAL_SET_REVISION`)\
  \ is said plainly and the edit kept, never retried\n  over. The panel's reads and\
  \ write are `goals.js`, tested under node (`npm test` in the plugin's `ui/`, run\
  \ in CI).\n- **The console's Campaigns plugin, read-only** (#2834, the 2.6 plan's\
  \ Track G and D13): a new plugin,\n  `squadops.campaigns`, in its own Campaigns\
  \ view. The list has every Project's Campaigns with state, outcome, start\n  and\
  \ current increment (`#3 · repair`, read from each control log six at a time; a\
  \ closed Campaign's is read once\n  per page). A Campaign's view shows its objective,\
  \ what it works from, accepted increments against the target, the\n  current increment\
  \ and cycle; its open escalations and the proposals waiting for a ruling; the ledger\
  \ (ruling,\n  verdict, deciding row and each carrying cycle, as `squadops campaigns\
  \ ledger`); the digest (`campaigns digest`);\n  and the control log's latest rows\
  \ (`campaigns log`). An unknown Campaign (`CAMPAIGN_NOT_FOUND`), and one with no\n\
  \  ledger, escalations or package yet (`PACKAGE_NOT_FOUND`), read as such rather\
  \ than as failures, and one unreadable\n  part never blanks the rest. It polls every\
  \ 30 s while open and visible. A Campaign that names a goal set links to\n  the\
  \ goals panel with that Campaign chosen: `squadops:select-campaign` is kept until\
  \ the panel mounts, and the\n  Projects view is opened through the shell's own nav\
  \ entry (`shared/selection.js`), since the pinned shell gives a\n  plugin no way\
  \ to open another view. The plugin registers no command and writes nothing: launch,\
  \ rule, pause,\n  resume and abort stay with the operator's broker and the CLI.\
  \ SIP-0069 §14 records this and names what stays off the\n  console. The reads are\
  \ `campaigns.js`, tested under node in CI.\n- **The operator's surface** (SIP-0115\
  \ slice 5, #2888; §10d; SIP-0109 §24df). The operator's `campaign-supervisor` and\n\
  \  `campaign-triage` principals read the goal set and its derived backlog, with\
  \ no scope changed. **A gate's evidence:**\n  `GET /api/v1/campaigns/{id}/ledger`,\
  \ which the operator's reviewer reads, names each goal-set version's `backlog_item`\
  \ and\n  `goals_revision`, and the version an open gate can be on carries `goal_evidence`\
  \ (the goal, the item and the expected\n  results it serves, at the revision it\
  \ is bound to). A requirements Campaign's rows are unchanged. **Assessments:**\n\
  \  `POST /api/v1/projects/{id}/goal-set/assessments` records the operator's or the\
  \ owner's judgement of one expected result in\n  a Campaign (`reading`: `met`, `not_met`\
  \ or `unclear`; `cause` with `not_met`: `app_work`, `framework_defect`,\n  `framework_gap`\
  \ or `needs_owner`; `issue` with a framework cause; `evidence` by id; `log_seq`,\
  \ the control-log row the\n  evidence was read at; `source_ref`, the operator's\
  \ signed statement). It needs no Campaign grant, a completed Campaign takes one,\
  \ and it is append-only and decides nothing.\n  `GET …/goal-set/assessments` is\
  \ the history and `GET /api/v1/campaigns/{id}/assessments` how each result stands\
  \ now\n  (`current`, `stale`, `conflicting` or `unassessed`). Migration `2103_goal_set_assessments.sql`.\
  \ The Campaigns plugin's\n  placeholder is replaced by that view, and the goals\
  \ panel shows it on each expected result, with the Campaign's own\n  text where\
  \ a pinned revision defines the result differently.\n- **A source-backed change\
  \ can remove a file** (#2612, SIP-0112 H.23). A step removes a file with a `delete:<path>`\
  \ fence\n  with nothing inside, shown to the steps that may use it. `development.develop`\
  \ and its repair may remove any text\n  file of the product; `qa.test` and its repair\
  \ only a test one of the product's runners holds. A path outside the\n  product's\
  \ tree, a binary or generated file, one the same emission writes, or one outside\
  \ the step's grant is refused\n  by name, and the emission with it. A removal is\
  \ stored in order among the writes, later tasks are shown the tree\n  without the\
  \ file, and delivery patches it out of the candidate: `changed_paths` names it,\
  \ the product's own checks\n  run without it, and the captured commit and its patch\
  \ lack it. A repair's removal is taken in the end-of-plan round\n  (H.20) and refused\
  \ inside the plan, where the verifier can't hold one. A fence reading `delete:`\
  \ wrote an empty file\n  before. Runs with no pinned source refuse the form.\n-\
  \ **A regression at a source-backed run's end of plan gets one repair round** (#2613,\
  \ SIP-0112 H.20). When the\n  product's own checks read `regressed`, the run no\
  \ longer fails there: the regression enters the plan's correction\n  chain (analyze,\
  \ decide, repair) through the same budget check and run counter as an in-plan failure,\
  \ about the\n  plan's last source author. The analysis and the repair read each\
  \ blocking check as the product's runner read it in\n  the sandbox: its id, exit\
  \ code and output tails, never a re-run in an agent's image (#2913). The repair\
  \ is stored as\n  that task's own and the candidate is delivered again; its verification\
  \ records `repair_of`, and every check that\n  regressed must execute and pass.\
  \ A spent budget, a round that repairs nothing, or a second regression fails the\
  \ run\n  as before, the verification naming the checks. One round only, whatever\
  \ budget remains. Runs with no pinned source\n  are unchanged.\n- **A size preflight\
  \ at a repository-backed Campaign's start** (#2889; SIP-0112 H.21, SIP-0109 §24db).\
  \ Before its\n  calibration record is written, every task type the Campaign's increments\
  \ dispatch (`dispatched_task_steps`, the\n  reading the #2810 guard now shares)\
  \ is composed on the product's tree at the record's commit and counted by the\n\
  \  composer's own estimate with its completion reserve, against the window of the\
  \ model its squad binds the role to.\n  A binding that can't fit, measured at the\
  \ least its prompt can be on that tree, refuses the start (409\n  `CALIBRATION_REFUSED`,\
  \ cause `blocking_gap`, gap `prompt_over_window`), naming each task type, role,\
  \ model, size,\n  reserve and window, and nothing is written. A model with no known\
  \ window, a squad or proposal profile that can't\n  be read, and a tree that can't\
  \ be read or is past 2.4's limits refuse it as `size_unmeasured`. A product that\
  \ fits\n  starts as before, and a sample application's Campaign is never measured.\n\
  - **Unattended resume** (SIP-0109 §24da, #2891; the 2.6 plan's D6 and D7). A Campaign\
  \ declares\n  `policy.unattended_resume`: the escalation classes the operator's\
  \ `campaign-supervisor` principal may resume on its own,\n  `plan_gate` (a plan\
  \ gate the tier escalated, answered at the gate), `in_cycle_failure` (a `repair`\
  \ or `retry` after\n  the cycle's own failure, within the per-increment limits)\
  \ and `launch_blocked` (the relaunch). It is fixed at\n  creation and part of the\
  \ creation hash when set; an unknown class, including the never-classes (an upstream\n\
  \  conflict, a limit's pause, a security finding, the owner's pause), is refused\
  \ at creation. Anything else the operator\n  asks is refused 403 `RESUME_NOT_DELEGATED`\
  \ with its reason; every delegated resume and every refusal is a\n  control-log\
  \ row naming the principal, the class, the escalation and the definition hash (refusal\n\
  \  `resume_not_delegated`, migration `2002`), and the digest lists them. The owner's\
  \ pause revokes the grant until the\n  owner resumes. The supervisor seat's refused\
  \ resume is now recorded rather than refused unwritten.\n- **A criterion already\
  \ met is found as soon as its test exists** (#2890; SIP-0109 §24cz, the 2.6 plan's\
  \ D9). On a\n  repository-backed increment, once the qa task's criterion files are\
  \ stored on the run, each is run alone on the\n  product's own runner in the sandbox\
  \ against the campaign branch's head, with no development emission on the tree.\n\
  \  One that passes there is already met: the run ends with `criteria_not_checkable`\
  \ before anything is delivered or\n  judged (a new cycle ending, migration `2003`),\
  \ and §10's new row 19 returns the increment to a new proposal told\n  which criteria\
  \ the head meets, counted toward neither `max_unaccepted_increments` nor\n  `max_rejected_proposals_in_row`.\
  \ The reading is the run's `criterion_head_check` record. Where the check can't\
  \ run\n  (no sandbox or clone, no profile at the pin, a runner with no test-id reader,\
  \ a sandbox error) the cycle proceeds\n  as before and the skip is logged with its\
  \ reason; acceptance's own read stays the last line.\n\n- **A Campaign's close records\
  \ what contribution is due, and the supervisor opens it** (#2861; SIP-0109 §24dc,\n\
  \  SIP-0112 H.22). The row that closes a repository-backed Campaign (its terminal\
  \ decision, or the abort) records\n  `contribution`: `{due: true, accepted: [cycles]}`,\
  \ or `{due: false, reason: \"no accepted increment: …\"}`, derived\n  under the\
  \ Campaign's lock and outside the request's hash. A close pushes nothing and opens\
  \ nothing, whatever the\n  deploy holds: the owner chose to drop the automatic open\
  \ on 2026-11-04, keeping §24ci (b) as ruled. The supervisor\n  opens it: `POST /api/v1/campaigns/{id}/contributions`\
  \ (`campaigns:manage`, `token` required) or `squadops campaigns\n  contribute <id>\
  \ --token-from-gh`, through E.4.3's contribution path: the branch's head with the\
  \ criterion files\n  its increments froze renamed out of the `criterion_` stem and\
  \ moved off the root (`test_criterion_T1.py` →\n  `tests/test_campaign_<hash>_T1.py`,\
  \ #2860's interim made the rule), each live one first run on the product's runner\n\
  \  in the sandbox where it moved, pushed as `squadops/<campaign>`, never forced,\
  \ the review request opened, and\n  recorded `pending` as one of the Project's contributions\
  \ under the Campaign's id (`campaign_id`, `run_id:\n  campaign`), so a sync tracks\
  \ its merge as any contribution's. Merging stays the owner's. A failed attempt,\
  \ a moved\n  criterion that doesn't hold among them, is a `contribution_failed`\
  \ row on the closed Campaign (migration `2004`),\n  and the supervisor's next request\
  \ tries again.\n- **A read-only signal for accepted Campaign work not yet in a Project's\
  \ integrated commit** (#2863; SIP-0109 §24dc).\n  `GET /api/v1/projects/{id}/unintegrated-increments`\
  \ (`cycles:read`) lists each accepted increment the Project's\n  `integrated_upstream_commit`\
  \ doesn't carry: `campaign_id`, `campaign_state`, `cycle_id`, `title` (its backlog\n\
  \  item's, or null), `commit`, `standing` (`not_contributed`, `contribution_pending`,\
  \ `merged_not_synced` or\n  `contribution_closed`) and `review_url`. A run's own\
  \ contribution counts beside its Campaign's. An empty list means\n  every one is\
  \ integrated; a sample application is refused (409 `NO_SOURCE_REPOSITORY`). A forge\
  \ merge is read only\n  once a sync records it (#2862 isn't built), so until then\
  \ it stands `contribution_pending`. A request closed\n  unmerged keeps blocking:\
  \ the owner reopens it on the forge, merges it with a merge commit and re-validates,\
  \ and\n  `campaigns contribute` can't do that for them. `squadops projects unintegrated\
  \ <project>`.\n- **Candidates promoted or dropped, and a backlog item split, each\
  \ a goal-set revision naming its action**\n  (SIP-0115 slice 3, #2886; SIP-0115\
  \ §10c). `POST /api/v1/projects/{id}/goal-set/candidates` adds a candidate;\n  `…/candidates/{id}/promote`\
  \ moves it into the backlog keeping its id, at a position or the end, serving the\
  \ results\n  named; `…/candidates/{id}/drop` drops it with the reason; `…/backlog/{id}/split`\
  \ puts two or more new items in its\n  place, inheriting what it served unless they\
  \ say otherwise. Each is written against an expected revision, answers\n  201, and\
  \ the revision carries `change` (`candidate_added | candidate_promoted | candidate_dropped\
  \ | item_split`,\n  with the subject, the position taken, the parts a split produced\
  \ and the Campaign the operator acted within; migration\n  `2101_goal_set_revision_change.sql`).\
  \ The owner (`admin:write`) may do each; the operator's supervisor seat\n  (`campaigns:supervise`)\
  \ adds freely and promotes, drops or splits only within a Campaign the owner has\
  \ granted it\n  (named in the request; live, on this Project, reading this goal\
  \ set; `403 NOT_DELEGATED` otherwise), appending a\n  promoted candidate and never\
  \ reordering (Q41). **The grant** is the owner's, on each Campaign the operator\
  \ should curate,\n  whoever created it (the owner's ruling of 2026-11-04): `POST\
  \ /api/v1/campaigns/{id}/goal-delegation`, `squadops\n  campaigns delegate <id>\
  \ --reason …`, `campaigns:control`, so the supervisor can't grant itself. It is\
  \ a\n  `goal_delegation_granted` control-log row for the Campaign's life, which\
  \ a completed Campaign refuses (migration\n  `2102_campaign_goal_delegation.sql`;\
  \ SIP-0109 §24dd). A split waits (`409 BACKLOG_ITEM_IN_PROGRESS`) while a live Campaign\n\
  \  reads the item `proposed` or `in_increment`; the derived backlog reads a split\
  \ parent as `removed` with\n  `split_into`. `squadops goals candidates|promote|drop|split`.\n\
  \n### Fixed\n- **SquadOps names no external supervisor** (the owner's ruling of\
  \ 2026-11-07, SIP-0115 §10e): what drives a Campaign from outside is an\n  API client,\
  \ and the product calls it the operator, in its code, console, messages and the\
  \ safety guarantee's label. No route,\n  scope or field changed, and a guard holds\
  \ it.\n- **A qa suite is shown the code it calls** (#2952): a focused `qa.test`\
  \ and a qa repair see what the suite imports, and the\n  files the task names, from\
  \ outside its package, counted in the prompt budget. On a product whose suite and\
  \ helper live apart,\n  qa guessed the helper's field names and a real count read\
  \ 0. `test_report.md` no longer reads a suite left to the product's\n  runner as\
  \ a failure (#2949).\n- **A repair cycle keeps the ending its run declared** (SIP-0109\
  \ §24cz, #2946): a repair whose test already passed on the head\n  recorded `single_workload_ended`,\
  \ so the Campaign escalated at row 9 instead of proposing anew at row 19.\n- **A\
  \ proposal keeps what the product already does inside the criterion that changes\
  \ it** (#2935, SIP-0109 §24di). BT-2's\n  item was half true on the head, so its\
  \ proposal wrote the half that held as its own criterion, whose pass on the head\n\
  \  abandoned the whole increment at row 19. The product proposal's request now shows\
  \ the case.\n- **A repaired test that passes on the head no longer abandons a backlog\
  \ item** (#2933, SIP-0109 §24dh). A qa repair\n  rewrote BT-2's test with a fixture\
  \ the product filtered out, so its assertions ran over nothing and it passed on\
  \ the\n  head; row 19 then discarded development's correct change as \"already met\"\
  , and the next proposal was told so. The head\n  doesn't change between a suite's\
  \ failure and its repair, so that pass is news about the test. A criterion file\
  \ a repair\n  rewrote is now run on the head before the repair is accepted: passing\
  \ there refuses the repair, spends the round and\n  tells the next one. A later\
  \ emission that still passes fails the run instead of abandoning it, and neither\
  \ reading\n  writes the record the next proposal is briefed from. A first emission\
  \ that passes on the head stays row 19.\n- **A closed, unmerged Campaign contribution\
  \ can be dismissed** (#2926, SIP-0109 §24dg; the owner's choice of\n  2026-11-05).\
  \ It kept blocking the operator's integration gate with no way to clear it. The\
  \ owner's\n  `POST /api/v1/campaigns/{id}/contribution-dismissal` (`squadops campaigns\
  \ dismiss-contribution <id> --reason …`,\n  `campaigns:control`) records \"this\
  \ work won't land\" as a `contribution_dismissed` control-log row, with who, why\
  \ and\n  the commit and review request, and the row leaves `GET /api/v1/projects/{id}/unintegrated-increments`.\
  \ Anything but a\n  closed, unmerged contribution is `409 CONTRIBUTION_NOT_DISMISSABLE`,\
  \ a retry with its key replays, and nothing is\n  deleted. Re-opening is not built.\
  \ Migration `2104_campaign_contribution_dismissed.sql`.\n- **A suite that fails\
  \ on the product's runner is read there, not in the qa image** (#2913, SIP-0112\
  \ H.24). When the\n  runner ran a product's suite and it failed, the agent's result\
  \ stood, so an image that died on a dependency it lacks\n  (Shelfnote's `slugify`,\
  \ exit 4) stayed the evidence: the analysis called it an environment issue, the\
  \ repair changed\n  nothing, and the real failure (`PATCH /books/{id}` answering\
  \ 400) reached neither, which ended the Campaign. The\n  runner's reading now replaces\
  \ the image's, which stays beside it; a run that didn't exit leaves the agent's\
  \ result.\n- **The console's API proxies forward the query string** (#2915). `/api/v1/*`\
  \ and the two chat proxies forwarded the\n  path alone, so through the console's\
  \ own port `?project_id=` reached the runtime API missing (a 422) and `?limit=`/\n\
  \  `?offset=` read as the default page. Hidden on the Spark, where Caddy sends `/api/v1/*`\
  \ to the runtime API directly.\n- **The backlog says which limit ended a Campaign\
  \ on an item** (#2911). The ledger's projection of a decision left\n  out its `cause`,\
  \ so an item a Campaign ended on read \"the campaign ended at §10 row 4 (None)\"\
  ; the ledger's\n  outcome now carries `cause` and the backlog names it. Seen on\
  \ the Shelfnote Campaign `cmp_5947cfb57197`.\n- **The console's write buttons execute**\
  \ (#2903, #2904). Every plugin posted `{command_id, params}` to the shell's\n  command\
  \ route, whose body is `{command_id, args, dry_run, confirmed}` (Continuum v1.0.2),\
  \ so each handler got `{}`\n  and the bus's 200 `status: failed` passed as success;\
  \ and no plugin sent `confirmed`, so a confirm-level command\n  (`gate_reject`,\
  \ `cancel_cycle`, `cancel_run`, `set_active_profile`) was answered `pending` and\
  \ never ran. The body\n  is built once, in `console/continuum-plugins/shared/commands.js`:\
  \ it posts `args`, reads the answer's `status`\n  (`success` only; a `failed`, `timeout`\
  \ or `denied` answer and a handler's relayed API refusal are shown as the\n  failure\
  \ they are), and on `requires_confirmation` asks the user — the reject and set-active\
  \ dialogs — and re-posts\n  the same body with `confirmed: true`. The create modal\
  \ also read the handler's `cycle_id` from the answer's top\n  level rather than\
  \ its `result`. Guards: no plugin names the route or a `params` key\n  (`tests/unit/console/test_command_bus_bodies.py`),\
  \ the helper's node tests\n  (`console/continuum-plugins/shared`, `npm test`, now\
  \ a CI step), and the console app's route entered with the\n  plugins' bodies. SIP-0074\
  \ §5.1 and SIP-0069 are unchanged: the behaviour is theirs, restored.\n- **A private\
  \ Node package that declares a module interface is a package surface,** so a criterion\
  \ on a product\n  like battle-trainer can name its interface (#2875, PR #2879; SIP-0112\
  \ H.17).\n- **The qa plan proposer's worked example is in its product's runner's\
  \ terms,** pytest or vitest/jest (#2876,\n  PR #2880).\n- **A product's suite the\
  \ qa image couldn't run is read on the product's own runner,** whatever else failed\n\
  \  (#2877, PR #2878; SIP-0112 H.18).\n- **A dev repair's retest is judged on the\
  \ product's runner:** the failed task's own suite, with the repaired source\n  on\
  \ the tree, where before the repaired source was read as the suite and nothing was\
  \ judged (#2881, PR #2898).\n- **A product's suite on its own runner gets the product's\
  \ whole tree at the pin,** lockfile included, with the\n  run's changes laid over\
  \ it. Before, an npm product's `npm ci` failed setup on every run (#2900, PR #2902;\
  \ SIP-0112\n  H.19).\n\n### Documentation\n- **The 2.6 plan adopted** on the owner's\
  \ rulings of 2026-11-03: battle-trainer is the proving Project (PR #2883).\n- **SIP-0115\
