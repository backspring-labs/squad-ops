             IS returned for tag=fiction (membership, not list-equality).

          4. Tag-only path: GET /books?tag=fiction (no status) returns all books
             across statuses whose tags include "fiction"; total reflects that
             count.

          5. Status-only regression: GET /books?status=read (no tag) returns
             the same set as the pre-change T2 contract; total is correct.

