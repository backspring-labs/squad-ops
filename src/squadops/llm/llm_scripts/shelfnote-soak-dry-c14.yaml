- task_type: development.design_plan
  occurrence: 1
  call: 1
  content: |-
    # Technical Design: `GET /books` Tag Filter (ST1)

    ## Architecture Overview

    This change adds a single `tag` query parameter to the existing `GET /books` endpoint. The design touches two backend files and adds one test file — the exact footprint approved by the change request.

    ```
    Client
      │
      │  GET /books?status=read&tag=fiction&page=1&per_page=20
      ▼
    routes.py  ──►  store.py
      │                │
      │  parse:       │  filter: status == query AND tag ∈ book.tags
      │  status,     │  paginate: slice filtered result
      │  tag,        │
      │  page,       │
      │  per_page    │
      │              ▼
      │          [{"books": [...], "page": 1, "per_page": 20, "total": N}]
      ▼
    ```

    **Interaction with existing behaviour:**
    - `status` parameter already exists and filters by exact match.
    - `tag` is new. Books store tags as a list of strings; the filter checks membership (`tag in book.tags`).
    - When **both** `status` and `tag` are supplied, a book must satisfy **both** (logical AND).
    - When only one is supplied, only that filter applies.
    - Pagination metadata (`page`, `per_page`, `total`) reflects the result set **after** filtering.
    - Neither parameter is required; omitting both returns the full shelf paginated (existing T1/T2/T3 behaviour preserved).

    ## Interface Definitions

    ### Route layer — `backend/routes.py`

    The existing `GET /books` handler gains one parameter. No new endpoint, no new response shape.

    ```python
    @router.get("/books")
    async def list_books(
        status: Optional[str] = Query(None, description="Filter by reading status"),
        tag: Optional[str] = Query(None, description="Filter by tag (membership)"),
        page: int = Query(1, ge=1),
        per_page: int = Query(20, ge=1, le=100),
    ):
        # delegate to store
        # return {"books": [...], "page": page, "per_page": per_page, "total": total}
    ```

    **Contract notes:**
    - `tag` is `Optional[str]`; `None` means "no tag filter."
    - The handler remains well under the 30-line limit mandated by CONTRIBUTING.md.
    - Response JSON shape is unchanged: `{ "books": [...], "page": int, "per_page": int, "total": int }`.
    - A book in `books` has `status: str` and `tags: list[str]` (existing model).

    ### Store layer — `backend/store.py`

    The existing retrieval method gains a `tag` keyword argument.

    ```python
    def get_books(
        self,
        status: Optional[str] = None,
        tag: Optional[str] = None,
        page: int = 1,
        per_page: int = 20,
    ) -> dict:
        """Return paginated books filtered by status and/or tag."""
        books = self._books  # existing in-memory list

        if status is not None:
            books = [b for b in books if b.status == status]
        if tag is not None:
            books = [b for b in books if tag in b.tags]

        total = len(books)
        start = (page - 1) * per_page
        end = start + per_page
        return {
            "books": books[start:end],
            "page": page,
            "per_page": per_page,
            "total": total,
        }
    ```

    **Contract notes:**
    - Tag comparison is **exact, case-sensitive** string membership in the book's `tags` list. This mirrors the exact-match semantics the `status` filter already uses, keeping behaviour predictable and consistent with existing tests.
    - The two filters are applied sequentially (AND). Order does not affect correctness.
    - Pagination slicing occurs after both filters.
    - The method signature is backward-compatible: all existing call sites that pass only `status` (or nothing) continue to work unchanged.

    ### Test file — `tests/test_criterion_ST1.py`

    New file. Follows the product's pytest + `TestClient` convention.

    ```python
    # Test plan (assertions the file must contain):
    #
    # 1. Setup: seed the store (via fixture or API POST) with:
    #    - Book A: status="read",  tags=["fiction", "romance"]
    #    - Book B: status="read",  tags=["sci-fi"]
    #    - Book C: status="wanting", tags=["fiction"]
    #    - Book D: status="reading", tags=["fiction", "sci-fi"]
    #
    # 2. GET /books?status=read&tag=fiction
    #    - 200
    #    - body["books"] contains ONLY Book A
    #    - body["books"] does NOT contain Book B (status match, tag mismatch)
    #    - body["books"] does NOT contain Book C (tag match, status mismatch)
    #    - body["total"] == 1
    #    - body["page"] == 1
    #    - body["per_page"] == 20 (or whatever default the product uses per T3)
    #
    # 3. GET /books?status=read&tag=sci-fi
    #    - 200
    #    - body["books"] contains ONLY Book B
    #
    # 4. GET /books?status=read&tag=fiction&page=1&per_page=1
    #    - 200
    #    - body["books"] has length 1
    #    - body["total"] == 1
    #    - body["per_page"] == 1
    #
    # 5. GET /books?tag=fiction  (no status)
    #    - 200
    #    - body["books"] contains Books A, C, D (all with "fiction" tag)
    #    - body["total"] == 3
    #
    # 6. GET /books?status=read  (no tag — regression check)
    #    - 200
    #    - body["books"] contains Books A and B
    #    - body["total"] == 2
    #
    # 7. GET /books (no filters — regression check)
    #    - 200
    #    - body["total"] == 4
    ```

    The test uses the same fixture/setup pattern as `tests/test_criterion_T3.py` and `tests/test_tags_t1.py` (the product's existing books and tags tests). It fails on response content, not on imports of the change (CONTRIBUTING.md).

    ## Implementation Sequencing

    | Phase | Task | Dependency | Est. effort |
    |-------|------|------------|-------------|
    | 1 | Extend `store.py` `get_books()` with `tag` parameter and membership filter | None | 10 min |
    | 2 | Extend `routes.py` `GET /books` handler to accept `tag` query param, pass to store | Phase 1 | 10 min |
    | 3 | Write `tests/test_criterion_ST1.py` with the scenarios above | Phase 2 | 20 min |
    | 4 | Run full backend test suite (`pytest -q`) to confirm ST1 passes and T1/T2/T3/C1/C2/X1/N1/RD1/RD2 still pass | Phase 3 | 5 min |
    | 5 | Run boots check (`.venv/bin/python -c "from backend.main import app"`) | Phase 4 | 2 min |

    Total estimated execution: **~45 min**, well within the 3-hour budget.

    No frontend changes are required. The frontend's `api.js` and `BooksListView.jsx` are outside the footprint and are not touched.

    ## Proto Validation Plan

    This change is small and the approach is conventional (add an optional query param, filter a list). A full prototype is not warranted. Instead, a **single verification spike** is sufficient:

    **Spike: filter composition correctness**

    ```python
    # Throwaway script (not committed):
    # Verify that sequential filtering on status then tag produces
    # the same result as a single-pass combined predicate,
    # and that pagination total reflects the filtered count.

    books = [
        {"status": "read", "tags": ["fiction", "romance"]},
        {"status": "read", "tags": ["sci-fi"]},
        {"status": "wanting", "tags": ["fiction"]},
    ]

    status = "read"
    tag = "fiction"

    filtered = [b for b in books if b["status"] == status and tag in b["tags"]]
    assert len(filtered) == 1
    assert filtered[0]["tags"] == ["fiction", "romance"]

    print("OK")
    ```

    This confirms the AND-composition and membership-check logic before touching the real files. It takes < 2 minutes. No feasibility risk exists here — Python list filtering and FastAPI `Query` parameters are well-trodden patterns in this codebase.

    ## Unknowns Classification

    | # | Unknown | Classification | Rationale |
    |---|---------|---------------|-----------|
    | 1 | Exact current parameter names and defaults in `store.get_books()` | **resolved** | The existing T3 test (pagination) and T1/T2 tests (listing) define the contract; the `tag` param is purely additive and does not alter existing signatures. The design above uses the conventional names the product already uses (`status`, `page`, `per_page`). |
    | 2 | Whether `tag` filter should be case-sensitive | **resolved** | The `status` filter is exact-match (case-sensitive) per existing tests. For consistency within the same endpoint, `tag` uses the same exact-match semantics. A case-insensitive filter would break the principle of least surprise for an API that already treats `status` case-sensitively. |
    | 3 | Whether the store is in-memory, SQLite, or another backend | **resolved** | The product's `store.py` is 6.5 KB and the blueprint is `fullstack_fastapi_react` with no database dependency in `requirements.txt` (90 bytes — likely just `fastapi` and `uvicorn`). The store is in-memory. The filter logic (list comprehension) is backend-agnostic anyway. |
    | 4 | Whether existing tests seed books with multi-element tag lists | **acceptable_risk** | The ST1 test seeds its own fixture data (Books A–D above) with explicit multi-tag books. If the product's existing fixtures (used by T1/T2/T3) don't have multi-tag books, that's irrelevant — ST1 creates its own data. No risk to `must_not_break` tests. |
    | 5 | Interaction between tag filter and any sort/ordering the endpoint already applies | **acceptable_risk** | The filter reduces the set; existing ordering (if any) applies within the reduced set. This is standard behaviour and the criteria do not test a specific ordering beyond what T3 already covers. Mitigation: the ST1 test asserts on *membership* (which books are present), not on their *order*. |
    | 6 | Whether `per_page` upper bound (e.g., `le=100`) already exists in the current handler | **resolved** | T3 tests pagination and would fail if the bound were different. The design preserves whatever bound the current code has; the tag parameter does not alter pagination validation. |

    **No blockers identified.** All unknowns are resolved or carry negligible risk with clear mitigation.

    ## Must-Not-Break Verification

    The following existing test files must continue to pass unchanged (they are **not** in the footprint and are **not** modified):

    | Test file | What it checks | Why it's safe |
    |-----------|---------------|---------------|
    | `test_criterion_T1.py` | Basic book listing | No tag param → `tag=None` → no tag filter applied → same result |
    | `test_criterion_T2.py` | Book listing with status filter | `tag` defaults to `None` → skipped in store → same result |
    | `test_criterion_T3.py` | Pagination metadata | Tag filter is a no-op when not supplied; pagination logic unchanged |
    | `test_criterion_C1.py` | Book creation | Unrelated endpoint |
    | `test_criterion_C2.py` | Book update | Unrelated endpoint |
    | `test_criterion_X1.py` | Error handling / validation | Unrelated endpoint |
    | `test_criterion_N1.py` | Not-found handling | Unrelated endpoint |
    | `test_criterion_RD1.py` | Reading status (read) | Unrelated endpoint or different filter path |
    | `test_criterion_RD2.py` | Reading status (other) | Unrelated endpoint or different filter path |
    | `test_tags_t1.py` / `test_tags_t2.py` | Tag CRUD operations | Tag *modification* endpoints, not the list filter |
    | `test_search_t*.py` | Search functionality | Separate endpoint or separate parameter |

    The additive nature of the change (one new optional parameter, one new filter line in the store) guarantees that all existing call paths produce identical results when `tag` is not supplied.

    ## Deferrals

    Nothing from this change request is deferred. The entire footprint (`routes.py`, `store.py`, `tests/test_criterion_ST1.py`) fits comfortably in the 3-hour budget. No follow-up work is implied by the change request or the reviewer's notes.
- task_type: qa.define_test_strategy
  occurrence: 1
  call: 1
  content: |-
    # Test Strategy: ST1 — `GET /books` Tag Filter (Combined Status + Tag)

    ## 1. Acceptance Checklist

    This checklist is the pass/fail gate for ST1. Every item must be satisfied before the change is approved.

    - [ ] **ST1.1 – Combined filter returns intersection**
      `GET /books?status=read&tag=fiction` returns a JSON object whose `books` array contains *only* books whose `status` field equals `"read"` **AND** whose `tags` array includes `"fiction"`.

    - [ ] **ST1.2 – Cross-exclusion (status match, tag mismatch)**
      A book with `status: "read"` and `tags: ["sci-fi"]` is **absent** from the response to `GET /books?status=read&tag=fiction`.

    - [ ] **ST1.3 – Cross-exclusion (tag match, status mismatch)**
      A book with `tags: ["fiction"]` and `status: "wanting"` is **absent** from the response to `GET /books?status=read&tag=fiction`.

    - [ ] **ST1.4 – Pagination metadata present and consistent**
      The response includes `page`, `per_page`, and `total` fields. `total` equals the count of books matching the combined filter (not the total book count). `page` and `per_page` reflect the request query parameters (defaults per T3).

    - [ ] **ST1.5 – Tag-only filter works**
      `GET /books?tag=fiction` (no `status` param) returns books whose tags include `"fiction"`, across all statuses.

    - [ ] **ST1.6 – Status-only filter unchanged**
      `GET /books?status=read` (no `tag` param) behaves exactly as before: returns all books with status `"read"`, with pagination.

    - [ ] **ST1.7 – No-filter listing unchanged**
      `GET /books` (no query params) returns all books with pagination, identical to prior behaviour.

    - [ ] **ST1.8 – Empty result set**
      A filter combination that matches no books (e.g. `tag=nonexistent-tag`) returns `{"books": [], "page": 1, "per_page": <default>, "total": 0}` with HTTP 200.

    - [ ] **ST1.9 – Multi-tag book included on partial match**
      A book with `tags: ["fiction", "sci-fi"]` and `status: "read"` **is** returned by `GET /books?status=read&tag=fiction`.

    - [ ] **ST1.10 – Tag filter composes with pagination**
      `GET /books?status=read&tag=fiction&page=2&per_page=1` returns a single-book page consistent with the filtered set; `total` reflects the filtered count.

    - [ ] **ST1.11 – Response shape unchanged**
      The top-level JSON keys remain `{books, page, per_page, total}` (or whatever the existing shape per T3 dictates). No new top-level keys are introduced.

    - [ ] **ST1.12 – Status codes**
      The endpoint answers 200 for valid requests. No new status codes are introduced (per CONTRIBUTING: "a test for each status code it can answer" — if the endpoint can only answer 200, the test asserts 200).

    ### Must-Not-Break Verification (regression)

    - [ ] **MNB – All existing tests pass unchanged**
      Running `pytest -q -p no:cacheprovider` with the new code passes every pre-existing test file:
      `test_criterion_T1.py`, `test_criterion_T2.py`, `test_criterion_T3.py`,
      `test_criterion_C1.py`, `test_criterion_C2.py`, `test_criterion_X1.py`,
      `test_criterion_N1.py`, `test_criterion_RD1.py`, `test_criterion_RD2.py`,
      and all other `tests/test_*.py` files.

    - [ ] **MNB – Frontend unaffected**
      `npm --prefix frontend test --silent` passes. No frontend files are in the footprint.

    - [ ] **MNB – App boots**
      `.venv/bin/python -c "from backend.main import app"` succeeds.

    ---

    ## 2. Test Strategy Note

    ### Scope Decisions

    | Level | In scope? | Rationale |
    |---|---|---|
    | **Unit** (store-level) | Yes | `store.py` filtering logic is the core computation. Isolate the tag+status intersection to verify the query/filter semantics without HTTP overhead. |
    | **Integration / API** (route-level via TestClient) | **Primary** | ST1's `observable` is explicitly an HTTP endpoint response. CONTRIBUTING requires tests to "exercise the running app's API through the test client." All acceptance-checklist items (ST1.1–ST1.12) are verified here. |
    | **Contract** | No | No new public contract; the response shape is unchanged. |
    | **E2E / Frontend** | No | Frontend is not in the footprint. The React app consumes `GET /books` through `frontend/src/api.js` with a relative base; no new query-param plumbing is required by this change. |

    ### Test File: `tests/test_criterion_ST1.py`

    - Uses `httpx.AsyncClient` or `fastapi.testclient.TestClient` (matching the product's existing test conventions in `conftest.py` and sibling criterion tests).
    - Each test asserts on **response content** (status code, JSON body), not on imports or internal objects (per CONTRIBUTING).
    - No test may pass by virtue of framework defaults: e.g., a test asserting "the endpoint returns 200" for a valid filter must also assert the body contains the correct filtered set.
    - Tests are ordered so that fixture setup (creating books with known status/tags) is shared, and each test isolates the specific filter combination it validates.

    ### Fixture / Data Design

    The test file should seed the store with a controlled set of books covering:

    | Book | status | tags | Purpose |
    |---|---|---|---|
    | A | `read` | `[fiction]` | Included in ST1.1 |
    | B | `read` | `[sci-fi]` | Excluded by ST1.2 |
    | C | `wanting` | `[fiction]` | Excluded by ST1.3 |
    | D | `read` | `[fiction, sci-fi]` | Included by ST1.9 (multi-tag) |
    | E | `reading` | `[fiction, history]` | Excluded (status ≠ read) |
    | F | `read` | `[history]` | Excluded (tag mismatch) |

    This set is minimal and non-overlapping with data in other criterion test files (they manage their own fixtures via the `conftest.py` patterns).

    ### What is NOT tested here

    - The `status` filter alone is pre-existing; its tests live in the T-series files. ST1's tests do **not** re-verify status-only filtering as a new behaviour — that is a must-not-break, verified by the regression run.
    - Tag-only filtering (ST1.5) is new in this change (the `tag` parameter did not exist before), so it **is** tested.
    - Sorting, search, ratings, and reading-duration behaviours are untouched and covered by their own criterion files.

    ---

    ## 3. Defect Severity Rubric

    | Severity | Label | Definition | Examples in ST1 context |
    |---|---|---|---|
    | **S1 – Critical** | Blocker | The primary ST1 observable fails; the feature is absent or fundamentally wrong. | Combined filter returns books that do not match BOTH status and tag (AND logic broken, OR used instead). |
    | **S2 – Major** | High | A stated acceptance-criterion item fails, but the core intersection works. | Pagination `total` reflects unfiltered count; tag-only filter returns wrong set; response shape changed. |
    | **S3 – Moderate** | Medium | An edge-case or secondary path misbehaves; main path is correct. | Multi-tag book excluded when it should be included; empty-result case returns 500 instead of 200 with empty array. |
    | **S4 – Minor** | Low | Cosmetic or stylistic issue that does not affect observable behaviour. | Log-line wording, comment, variable naming. Response JSON key ordering (if order-agnostic consumers exist). |
    | **S5 – Trivial** | Info | No functional impact. Documentation typo in a docstring, unused import. | — |

    **Gate rule:** Any S1 or S2 finding blocks approval. S3 findings must be resolved or explicitly waived by the orchestrator. S4/S5 are logged for the next cycle.

    **Regression gate (separate):** Any pre-existing test that fails after the change is an **S1** regardless of which criterion it belongs to. A must-not-break failure is a blocker.

    ---

    ## 4. Risk-Based Test Priorities

    Ranked by the likelihood that the implementation introduces a fault and the severity if it does.

    | Priority | Area | Why it is risky | Coverage emphasis |
    |---|---|---|---|
    | **P1** | **AND-semantics in the filter** (`store.py`) | The most probable fault: implementing OR instead of AND, or applying the tag filter to a different field (e.g., title contains "fiction" instead of tags list membership). | ST1.1, ST1.2, ST1.3 — the three core exclusion/inclusion assertions. These are the highest-value tests. |
    | **P2** | **Pagination `total` under combined filter** | `total` must reflect the filtered count, not `len(all_books)`. Easy to forget when adding a new filter dimension. | ST1.4, ST1.10 — assert `total` equals expected filtered count for multiple filter combinations. |
    | **P3** | **Interaction with existing status filter** | The `status` parameter is pre-existing; adding `tag` may alter how the status filter is applied (e.g., the store method signature changes and the old path regresses). | ST1.6, ST1.7, plus the full regression suite (MNB). |
    | **P4** | **Tag-only path** (no status param) | New code path: `tag` provided without `status`. If the implementation requires both, this 500s or ignores the tag. | ST1.5. |
    | **P5** | **Empty / no-match result** | A filter that matches zero books should return 200 with empty array, not 404 or 500. | ST1.8. |
    | **P6** | **Multi-tag membership** | A book tagged `[fiction, sci-fi]` must match `tag=fiction`. Fault: equality (`tags == [fiction]`) instead of membership (`"fiction" in tags`). | ST1.9. |
    | **P7** | **Route handler line count** | CONTRIBUTING: "Keep each new endpoint handler under thirty lines." If the developer inlines complex filter logic in `routes.py`, it may exceed the limit. | Code review check; not a runtime test. Flag as S4 if exceeded. |

    ### Areas explicitly NOT at risk (deferred)

    - Frontend: no files in footprint; no new query-param plumbing required.
    - Ratings, reading duration, search, sorting: orthogonal to the `GET /books` tag filter. Covered by their own criterion tests in the regression run.
    - Docker / nginx / startup: untouched.

    ---

    ## 5. Execution Verification Commands

    When implementation is complete, the following commands in the product's own environment constitute the full verification:

    ```bash
    # 1. Boot check
    .venv/bin/python -c "from backend.main import app"

    # 2. Full backend test suite (includes test_criterion_ST1.py and all regression)
    .venv/bin/python -m pytest -q -p no:cacheprovider

    # 3. Frontend tests (regression only; no frontend changes)
    npm --prefix frontend test --silent
    ```

    All three must pass. The new test file `tests/test_criterion_ST1.py` is discovered by pytest because it matches `test_*.py` under the repository root (the product's test root per the runner configuration).

    ---

    ## 6. Stage A Maturity Note

    This document defines **what** to test and **how** to test it. It does not produce test code. The actual test file `tests/test_criterion_ST1.py` is written during the implementation workload. The acceptance checklist above is the specification the implementer's tests must satisfy, and the reviewer's pass/fail gate at plan completion.

    No out-of-budget work is identified. The change is two backend files and one test file, well within the 3-hour budget.
