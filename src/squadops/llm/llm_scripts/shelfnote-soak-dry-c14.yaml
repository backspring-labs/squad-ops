- task_type: governance.review_plan
  occurrence: 1
  call: 1
  content: |-
    ---
    readiness: go
    sufficiency_score: 5
    blocker_unknowns: 0
    ---

    ## Consolidated Plan

    ### 1. Objective Frame

    This cycle implements a single behavioural increment, **ST1**, on the already-accepted Shelfnote application:

    > `GET /books` accepts both `status` and `tag` query parameters simultaneously and returns only books matching **both** filters, with pagination metadata (`page`, `per_page`, `total`).

    No other requirement, interface, or file is in scope. The `prd_delta` and `manifest_delta` are empty: the requirements document and interface contract stand as accepted. This is purely additive — the endpoint gains the ability to combine two existing independent filters into a single AND query.

    **Baseline:** commit `847179a126c696acda8e435fb050f03c32079b84`.

    ---

    ### 2. Context Research (Accepted State)

    The accepted application already provides:

    | Capability | Covered by |
    |---|---|
    | Filter by reading status (`status=read`, `status=read`, etc.) | T1, T2, T3 |
    | Filter by tag (`tag=fiction`) | RD1, RD2 |
    | Pagination metadata on `/books` | T3 |
    | CRUD for books | C1, C2 |
    | Full-text search | X1 |
    | Create a new book | N1 |

    The current `GET /books` handler in `backend/routes.py` accepts `status` and `tag` as **separate, independent** query parameters. When one is present, the store filters on it. There is no existing logic that applies both simultaneously in a single request. Pagination is already computed in `backend/store.py` and returned alongside the books array.

    The existing `backend/store.py` exposes a query method that accepts optional filter criteria and returns a paginated result set. The AND combination is a straightforward addition to that method's filtering logic.

    ---

    ### 3. Technical Design

    **Footprint (only these files change):**

    | File | Change |
    |---|---|
    | `backend/routes.py` | The `GET /books` handler already parses `status` and `tag` as query params. Confirm both are forwarded to the store call in a single invocation. Handler must stay ≤ 30 lines (CONTRIBUTING.md). |
    | `backend/store.py` | The books-query method gains the AND condition: when **both** `status` and `tag` are non-`None`, the returned set is the intersection (book.status == status **AND** tag ∈ book.tags). When only one is provided, existing single-filter logic is unchanged. Pagination metadata is computed on the filtered set, consistent with T3. |
    | `tests/test_criterion_ST1.py` | New test file. Exercises the running app via `TestClient` / `httpx.AsyncClient`. Asserts response JSON structure and content. |

    **Design rules:**

    1. **AND semantics.** A book is included iff `book.status == requested_status` **and** `requested_tag in book.tags`. If either condition is unmet, the book is excluded.
    2. **Single-filter invariance.** If only `status` is given, behaviour is identical to the accepted T1/T2/T3 path. If only `tag` is given, identical to RD1/RD2. The new logic activates only when both are present.
    3. **Pagination on the filtered set.** `total` reflects the count after the AND filter. `page` and `per_page` follow the same convention as T3.
    4. **No new endpoint, no new route, no schema change.** The manifest is unchanged.
    5. **Handler size.** The `GET /books` handler in `routes.py` must remain under 30 lines. The AND logic lives in `store.py`, not in the handler.

    **What does NOT change:**
    - `backend/models.py`, `backend/errors.py`, `backend/main.py` — untouched.
    - All frontend files — untouched.
    - All existing test files — untouched; they must continue to pass.
    - No new dependencies, no config change, no CORS change.

    ---

    ### 4. Test Strategy

    **New criterion file: `tests/test_criterion_ST1.py`**

    The test file exercises the API through the product's test client (FastAPI `TestClient` or `httpx.AsyncClient`), per the blueprint convention and CONTRIBUTING.md. It must fail on response content, not on imports.

    Minimum test cases derived from the observable:

    | # | Scenario | Assertion |
    |---|---|---|
    | ST1-a | Seed books: A(status=read, tags=[fiction]), B(status=read, tags=[sci-fi]), C(status=wanting, tags=[fiction]). Request `GET /books?status=read&tag=fiction`. | Response 200. `books` array contains **only** A. `books` array does **not** contain B or C. |
    | ST1-b | Same seed. Request `GET /books?status=read&tag=fiction`. | Pagination fields `page`, `per_page`, `total` present and `total` reflects the filtered count (consistent with T3 convention). |
    | ST1-c | Same seed. Request `GET /books?status=read&tag=sci-fi`. | `books` array contains B but **not** A. (Confirms tag side of AND.) |
    | ST1-d | Same seed. Request `GET /books?status=wanting&tag=fiction`. | `books` array contains C but **not** A. (Confirms status side of AND.) |
    | ST1-e | Request with only `status=read` (no tag). | Behaviour identical to accepted T1/T2/T3 — no regression from the new code path. |
    | ST1-f | Request with only `tag=fiction` (no status). | Behaviour identical to accepted RD1/RD2 — no regression. |

    **Status codes to cover (CONTRIBUTING.md: "a test for each status code it can answer"):**
    - 200 (normal filtered result)
    - 200 with empty `books` array (no book matches both filters)
    - 404 or 422 if the endpoint already returns one for invalid input (verify against existing T-series behaviour; do not introduce a new error path)

    **Must-not-break verification:**
    The existing test files (`test_criterion_T1.py` through `test_criterion_RD2.py`) are **not modified**. They run as part of `backend_tests` and must pass unchanged. The `must_not_break` list (T1, T2, T3, C1, C2, X1, N1, RD1, RD2) is verified by the product's own `pytest` run, not by new assertions in ST1.

    ---

    ### 5. Sufficiency Assessment

    | Criterion | Rating | Rationale |
    |---|---|---|
    | **Scope clarity** | ✓ | One criterion (ST1), three files, one AND condition. The change request's `prd_delta` and `manifest_delta` are empty, confirming no scope creep. The `must_not_break` list explicitly bounds what must survive. |
    | **Technical feasibility** | ✓ | The codebase already handles both filters independently. The AND is a single logical conjunction in the store's query path. No new dependencies, no schema migration, no interface change. |
    | **Risk coverage** | ✓ | Primary risk: inadvertently altering single-filter paths when the new AND branch is added. Mitigated by the design rule "single-filter invariance" and by the existing T/RD test suites running unmodified. No unknowns classified as blocker. |
    | **Test strategy alignment** | ✓ | ST1-a through ST1-f directly map to the observable's positive and negative cases. Pagination assertion (ST1-b) aligns with T3. Single-filter regression checks (ST1-e/f) align with must-not-break. |
    | **Resource fit** | ✓ | Three file edits, one new test file. Well within a 3-hour budget. No architectural work, no new tooling, no cross-team coordination. |

    **Sufficiency score: 5 / 5.** All five criteria are met. No gaps identified.

    ---

    ### 6. Unknowns Register

    | ID | Description | Class | Mitigation |
    |---|---|---|---|
    | U-1 | Exact parameter names and types in the current `store.py` query method (e.g., does it accept `status: str | None` and `tag: str | None` separately, or a combined filter object?) | Informational | The dev agent reads `backend/store.py` at the baseline commit before coding. The design rule is the same regardless: apply both conditions when both are present. |
    | U-2 | Whether the current `GET /books` handler already passes both params to the store in one call or makes two calls | Informational | Dev reads `backend/routes.py` at baseline. Design dictates a single call with both filters. |

    No unknowns are classified as **blocker**. Both are resolvable by reading the two files in the footprint before writing code.

    ---

    ### 7. Execution Plan

    | Phase | Agent | Task | Est. time |
    |---|---|---|---|
    | 1. Read baseline | dev | Read `backend/routes.py` and `backend/store.py` at the baseline commit. Confirm current filter logic, parameter names, pagination shape. | 10 min |
    | 2. Implement store change | dev | Add the AND condition to the books-query method in `backend/store.py`. Ensure single-filter paths are byte-identical in behaviour. | 20 min |
    | 3. Implement route change | dev | Confirm `backend/routes.py` passes both `status` and `tag` to the store in one call. Keep handler ≤ 30 lines. | 10 min |
    | 4. Write tests | qa | Author `tests/test_criterion_ST1.py` with cases ST1-a through ST1-f. Use the product's test client pattern. Seed data inline (fixture or API calls). | 30 min |
    | 5. Review | lead | Review all three files for scope compliance (footprint only), CONTRIBUTING.md compliance, and correctness. | 15 min |
    | 6. Verify | lead | Run `boots`, `backend_tests`, `frontend_tests`. Confirm all `must_not_break` tests pass. Confirm ST1 tests pass. | 15 min |

    **Total estimated effort: ~100 minutes** (well within the 3-hour budget).

    ---

    ### 8. Readiness Recommendation

    **`go`**

    The plan is complete, well-scoped, technically feasible, and carries no blocker unknowns. The change is a single AND condition in the data-access layer with a corresponding test file. All five sufficiency criteria are met. The squad can proceed to implementation immediately upon receiving this plan.
