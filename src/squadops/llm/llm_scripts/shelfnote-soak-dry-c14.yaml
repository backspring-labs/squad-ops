- task_type: strategy.propose_plan_guidance
  occurrence: 1
  call: 1
  content: |
    ```yaml:plan_guidance.yaml
    version: 1
    guidance_id: guid-b7ee0302
    source_brief_id: brief-prop_7106ff925d89-001
    proposing_role: strategy
    priority_guidance:
      - area: backend_api
        priority: high
        rationale: |
          The store and route changes are the integration anchor. The store method
          must implement the combined filter (status AND tag) with correct pagination
          total, and the route must stay under 30 lines. These two files together
          carry the entire functional risk of the cycle; getting the filter semantics
          wrong here cascades into every test.
      - area: tests
        priority: high
        rationale: |
          The brief allocates 50% of time budget to tests. The new ST1 test file is
          the primary verification mechanism for the AND-semantics, multi-tag
          membership, empty-result, and backward-compatibility requirements. It
          must exercise the running app through TestClient and cover the combined
          filter, tag-only, status-only, and no-filter paths.
      - area: verification
        priority: medium
        rationale: |
          The product's own checks (boots, backend_tests, frontend_tests) serve as
          the verification gate. The must-not-break requirement (existing T1–T3,
          C1–C2, X1, N1, RD1–RD2 all pass) is enforced by the full pytest run, not
          by a separate authored task. A light confirmation pass is sufficient.
    ordering_guidance:
      - before: "dev:store"
        after: "dev:routes"
        rationale: |
          The route handler in routes.py calls store.get_books() with the new tag
          parameter. The store method must exist with the updated signature before
          the route can be wired to pass the tag through. Building the route first
          risks a dangling call or a signature mismatch that is harder to debug in
          isolation.
      - before: "dev:routes"
        after: "qa:st1"
        rationale: |
          The ST1 test file exercises the running app via TestClient. Both the store
          filter and the route parameter must be in place before the test can
          meaningfully assert on response content. Writing tests before the handler
          is functional produces tests that fail for infrastructure reasons rather
          than logic reasons, muddying the first correction cycle.
    risk_guidance:
      - target: "dev:store"
        risk: |
          AND-vs-OR is the single most probable fault. When both status and tag are
          supplied, the implementation must return the intersection (books matching
          BOTH), not the union. A natural mistake is to apply two independent
          filters sequentially without intersecting, or to use `or` in a
          conditional. The store method should apply both predicates to each book
          and only include it when both pass.
      - target: "dev:store"
        risk: |
          Pagination total under combined filter. The `total` field in the response
          must equal the count of books surviving BOTH filters, not len(all_books)
          or the count after only one filter. If the filter is applied but the
          total is computed from the pre-filter list, the pagination metadata is
          wrong. Filter first, then compute total from the filtered list, then
          slice for the requested page.
      - target: "dev:store"
        risk: |
          Backward compatibility of get_books() signature. The new tag parameter
          must be optional (default None) and must be added in a position that does
          not shift existing positional arguments. Every existing call site in
          routes.py and in test fixtures that passes status, page, per_page
          positionally or by keyword must produce identical results when tag is
          omitted. A positional parameter inserted before status breaks all
          existing call sites.
      - target: "dev:routes"
        risk: |
          The 30-line handler limit (CONTRIBUTING.md). The route handler should
          only parse the query parameters and delegate to store.get_books(). If the
          developer inlines filter logic in the handler to "keep it simple," the
          handler exceeds 30 lines and the change is rejected on style grounds.
          All filtering logic belongs in store.py.
      - target: "dev:store"
        risk: |
          Status filter path must be byte-for-byte unchanged when tag is None.
          If the developer restructures or refactors the existing status filter
          code to share logic with the tag filter, a subtle behavioural change
          (e.g., different iteration order, different handling of None status) can
          regress T1/T2/T3. The safest approach: keep the existing status-filter
          code path untouched and add the tag filter as an independent,
          composable predicate applied after (or alongside) it.
      - target: "qa:st1"
        risk: |
          Empty-result path. A tag value that no book possesses must yield a
          successful response with books=[], total=0, and valid page/per_page
          fields. If the test only covers the happy path (tag matches some books),
          the empty-result requirement is unverified. The test file should include
          a case with a tag that no book has and assert the response shape.
    time_budget_guidance:
      - area: backend_api
        budget_pct: 30
      - area: tests
        budget_pct: 50
      - area: verification
        budget_pct: 20
    scope_cut_guidance: []
    must_not_skip:
      - "Backward compatibility: store.get_books() existing call sites (status, page, per_page only) produce identical results when tag is omitted"
      - "AND semantics: combined status+tag filter returns intersection, not union"
      - "Existing criteria T1, T2, T3, C1, C2, X1, N1, RD1, RD2 all continue to pass unchanged"
    defer_if_time_constrained: []
    confidence: high
    ```
