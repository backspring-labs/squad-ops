  content: |
    ```yaml:plan_authoring_brief.yaml
    version: 1
    brief_id: brief-prop_7106ff925d89-001
    objective_summary: |
      This cycle adds a single optional `tag` query parameter to the existing GET /books
      endpoint on Shelfnote. When supplied alone or alongside the existing `status` parameter,
      the tag filter narrows the result to books whose `tags` list contains the given tag
      (exact, case-sensitive membership). When both parameters are present, a book must
      satisfy both (logical AND). Pagination metadata (page, per_page, total) reflects the
      result set after filtering. The change is confined to backend/routes.py and
      backend/store.py (both modified in place) and a new test file
      tests/test_criterion_ST1.py. No frontend, model, or other backend file is touched.
    accepted_stack:
      backend: "FastAPI (Python 3)"
      frontend: "React + Vite (unchanged this cycle)"
      storage: "In-memory list (no database dependency)"
      backend_testing: "pytest + fastapi.testclient.TestClient or httpx.AsyncClient"
      frontend_testing: "vitest (unchanged this cycle)"
      api_convention: "Relative API base via VITE_API_BASE; CORS origins from config"
    must_cover_requirements:
      - "ST1: GET /books accepts an optional `tag` query parameter in addition to the existing `status`, `page`, and `per_page` parameters"
      - "When both `status` and `tag` are supplied, the returned books array contains only books whose status equals the status value AND whose tags list includes the tag value (logical AND)"
      - "When only `tag` is supplied (no `status`), the returned books array contains only books whose tags list includes the tag value, across all statuses"
      - "When only `status` is supplied (no `tag`), behaviour is identical to the pre-change implementation (existing T1/T2/T3 contract)"
      - "When neither filter is supplied, behaviour is identical to the pre-change implementation (full shelf paginated)"
      - "Tag matching is exact, case-sensitive string membership: `tag in book.tags` (list contains), not equality on the full list and not substring on any other field"
      - "A book with multiple tags (e.g. tags=[\"fiction\",\"sci-fi\"]) is returned when the query tag matches any one of them"
      - "Pagination metadata (page, per_page, total) in the response reflects the filtered result set, not the unfiltered collection; total equals the count of books matching the combined filter"
      - "The response JSON shape is unchanged: an object with keys books (array), page (int), per_page (int), total (int); no new top-level keys"
      - "A filter combination matching zero books returns an empty books array with total=0 and valid pagination fields; the endpoint does not error"
      - "The route handler in backend/routes.py remains under thirty lines (CONTRIBUTING.md)"
      - "The store method in backend/store.py remains backward-compatible: existing call sites that pass only status, page, per_page (or nothing) produce identical results when tag is omitted"
      - "The new test file exercises the running app through the test client and asserts on response content (status code, JSON body), not on imports of the change"
      - "Must-not-break: existing criteria T1, T2, T3, C1, C2, X1, N1, RD1, RD2 all continue to pass unchanged"
    scope_cuts:
      - "Frontend changes (api.js, BooksListView.jsx, any React component): not in the approved footprint; the tag parameter is consumable by the existing frontend without modification"
      - "Tag CRUD endpoints (add/remove tags on a book): pre-existing and untouched"
      - "Search endpoint and search query parameter: orthogonal to the tag filter on GET /books"
      - "Sorting, ratings, reading-duration, reading-status endpoints: orthogonal, untouched"
      - "Case-insensitive or fuzzy tag matching: not requested; exact match only"
      - "Multiple tag values in one request (e.g. tag=fiction&tag=sci-fi): not in the approved scope; single tag value only"
      - "New endpoints or new response fields beyond the existing {books, page, per_page, total} shape"
      - "Docker, nginx, startup script, or any non-Python infrastructure change"
    risk_areas:
      - "AND vs OR semantics in the combined filter: the most probable fault is implementing OR (union) instead of AND (intersection) when both status and tag are supplied"
      - "Pagination total under combined filter: total must equal the count after both filters are applied, not len(all_books) or the count after only one filter"
      - "Multi-tag membership: a book with tags=[\"fiction\",\"sci-fi\"] must match tag=fiction; the check is `tag in book.tags` (membership), not `book.tags == [tag]` (list equality)"
      - "Backward compatibility of store.get_books() signature: adding the tag parameter must not break existing positional or keyword call sites in routes.py or in other test fixtures"
      - "Empty-result path: a tag value that no book has must yield 200 with books=[] and total=0, not a 404 or 500"
      - "Route handler line count: inlining complex filter logic in routes.py could exceed the 30-line limit; filter logic belongs in store.py"
      - "Interaction with existing status filter: the status filter path must be byte-for-byte unchanged when tag is None; a refactor that restructures the status filter could regress T1/T2/T3"
    source_artifact_refs:
