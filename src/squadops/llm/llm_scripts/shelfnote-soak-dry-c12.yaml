- task_type: governance.review_plan
  occurrence: 1
  call: 1
  content: |-
    ---
    readiness: go
    sufficiency_score: 5
    blocker_unknowns: 0
    ---

    ## Consolidated Plan

    ### 1. Change Objective

    Add a single new endpoint `GET /books/duplicates` to the Shelfnote application. The endpoint returns a JSON array of every book whose title (case-insensitive) matches at least one other book on the shelf. Books with unique titles are excluded. When no duplicates exist, the response is an empty JSON array.

    This is a self-contained feature increment. No existing endpoint, model, or behaviour is modified. The `prd_delta` and `manifest_delta` are both empty, confirming no requirement or interface renegotiation is in scope.

    ### 2. Scope & Footprint

    | File | Action | Purpose |
    |---|---|---|
    | `backend/store.py` | Modify (append) | Add `find_duplicate_titles()` query function |
    | `backend/routes.py` | Modify (append) | Add `GET /books/duplicates` route handler |
    | `tests/test_criterion_D1.py` | Create | Test all observable behaviours of D1 |

    No other file in the repository is touched. All accepted code outside these three paths is unchanged.

    ### 3. Technical Design

    #### 3.1 Store Layer (`backend/store.py`)

    Append a new function:

    ```python
    def find_duplicate_titles():
        """Return all books whose title (case-insensitive) appears more than once."""
        # Use LOWER(title) for case-insensitive grouping in SQLite.
        # Query: SELECT * FROM books
        #        WHERE id IN (
        #          SELECT id FROM books
        #          WHERE LOWER(title) IN (
        #            SELECT LOWER(title) FROM books
        #            GROUP BY LOWER(title)
        #            HAVING COUNT(*) > 1
        #          )
        #        )
        # Order by id for deterministic output.
    ```

    - Uses the existing connection/session pattern already established in `store.py`.
    - SQLite's `LOWER()` provides case-insensitive comparison without requiring a separate collation clause.
    - Returns a list of rows (or dicts) consistent with how other store functions return data.
    - The query is a single read; no write lock is taken.

    #### 3.2 Route Layer (`backend/routes.py`)

    Append a new route handler:

    ```python
    @router.get("/books/duplicates")
    def get_duplicate_books():
        books = store.find_duplicate_titles()
        return [
            {"id": b["id"], "title": b["title"]}
            for b in books
        ]
    ```

    - Decorated on the existing books router (or the app router, matching the pattern used by other `/books/*` routes already in `routes.py`).
    - Returns `200` with a JSON array. Each object carries at least `id` and `title`.
    - Handler body is well under the 30-line limit mandated by `CONTRIBUTING.md`.
    - No query parameters, no request body — pure read of current shelf state.
    - No authentication or special middleware needed; follows the same access pattern as existing `/books` routes.

    #### 3.3 Test File (`tests/test_criterion_D1.py`)

    New pytest file following the product's existing test conventions (TestClient, fixture-based seeding, assertions on response body and status code).

    Test cases to include:

    | # | Scenario | Expected |
    |---|---|---|
    | 1 | Seed two books titled "Dune" (ids 1, 2) and one titled "Neuromancer" (id 3) | 200; array of exactly 2 objects; ids ∈ {1,2}; title "Dune"; id 3 absent |
    | 2 | Seed only books with unique titles | 200; empty JSON array `[]` |
    | 3 | Case-insensitive match: seed "Dune" and "dune" | 200; both books appear in the array |
    | 4 | Three books share the same title | 200; all three appear |
    | 5 | Verify response shape: each object has `id` (int) and `title` (str) keys | 200; keys present and typed correctly |

    - Uses the existing `conftest.py` fixtures (app/client factory, shelf seeding helpers) already in the product.
    - Imports only packages declared in `backend/requirements.txt` and `conftest.py`.
