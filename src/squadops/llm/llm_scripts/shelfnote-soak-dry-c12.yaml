    ```yaml:plan_guidance.yaml
    version: 1
    guidance_id: guid-ed6153ca
    source_brief_id: brief-sn14-d1-001
    proposing_role: strategy
    priority_guidance:
      - area: store_method
        priority: high
        rationale: |
          The "at least one OTHER book" deduplication logic is the single most
          error-prone unit in this increment. A one-line off-by-one (comparing a
          book to itself) silently produces wrong results on every edge case.
          Give the store-layer task the highest generation-quality attention.
      - area: route_handler
        priority: high
        rationale: |
          Two independent failure modes live here: (a) route ordering — the
          literal /books/duplicates must be registered before any parameterized
          /books/{id} route or FastAPI will swallow the request; (b) response
          shape — the handler must return a bare JSON array, not a wrapping
          object. Both are one-line mistakes that break the criterion's
          observable contract.
      - area: criterion_test
        priority: medium
        rationale: |
          The test file verifies behaviour but does not carry novel logic.
          The brief already allocates 35% of budget here, which is generous
          for a single-file suite against a 30-line endpoint. The risk is
          over-engineering the test (parametrize storms, fixture gymnastics)
          rather than under-testing.
      - area: regression_verification
        priority: high
        rationale: |
          Nine existing criteria (T1, T2, T3, C1, C2, X1, N1, RD1, RD2) must
          pass unmodified. The new method is added to the shared BookStore
          class; any accidental signature change, import, or helper refactor
          in store.py or routes.py cascades across all nine suites. Treat
          regression as a gate, not an afterthought.
    ordering_guidance:
      - before: "dev:store_method"
        after: "dev:route_handler"
        rationale: |
          The route handler calls BookStore.find_duplicate_books(). The store
          method must exist and be callable before the route can reference it.
          Reversing the order produces an import or attribute error at test
          time.
      - before: "dev:route_handler"
        after: "qa:criterion_test"
        rationale: |
          The criterion test exercises GET /books/duplicates through
          TestClient. The route must be registered on the router before the
          test can hit the endpoint. Without the route, every assertion in
          the test file fails on a 404.
    risk_guidance:
      - target: "dev:route_handler"
        risk: |
          Route ordering: if the existing router already has a /books/{id}
          parameterized route (string-typed or int-typed), the literal
          /books/duplicates must appear BEFORE it in the router's route list.
          FastAPI matches in registration order; a parameterized route
          registered first will capture "duplicates" as the id value and
          return a 404 or type-error. The developer must check the existing
          route order in routes.py and insert the new route accordingly.
      - target: "dev:store_method"
        risk: |
          "At least one OTHER" semantics: the implementation must exclude
          the book itself from the duplicate count. A naive
          `group_by(title).filter(count > 1)` that includes the book's own
          row will return a single book whose title appears exactly once.
          Correct logic: count of books with the same lowercased title, minus
          1 (self), must be >= 1.
      - target: "dev:route_handler"
        risk: |
          Response shape: the handler must return the list directly (bare
          JSON array). Returning {"duplicates": [...]} or wrapping in any
          object breaks the criterion's observable contract. FastAPI
          serialises a list to a bare array; wrapping it in a dict or
          Response(status_code=200, content=...) changes the shape.
      - target: "dev:store_method"
        risk: |
          Shared-code regression: the new find_duplicate_books() method is
          added to the existing BookStore class. The developer must not
          refactor, rename, or change signatures of existing methods
          (list_books, get_by_id, add_book, etc.) while inserting the new
          method. All nine existing test suites import and call those
          methods; any silent change cascades.
      - target: "qa:criterion_test"
        risk: |
          Test file location: the brief mandates tests/test_criterion_D1.py
          at the repository root, matching the product's existing convention
          (all 20+ existing test files live in root tests/, served by the
          root conftest.py). The product's pytest runner collects test_*.py
          under the repo root. Do NOT place the file under backend/tests/ —
          that directory does not exist in this product and the root
          conftest.py provides the client fixture for tests/.
    time_budget_guidance:
      - area: store_method
        budget_pct: 15
      - area: route_handler
        budget_pct: 10
      - area: criterion_test
        budget_pct: 35
      - area: regression_verification
        budget_pct: 20
      - area: buffer
        budget_pct: 20
    scope_cut_guidance:
      - "No refactoring or reformatting of existing methods in store.py or routes.py beyond the additive insertion of the new method/route. If the developer feels the need to clean up surrounding code, that is out of scope for this increment."
      - "No modification to conftest.py, backend/main.py, or any existing test file. The three-footprint constraint (store.py, routes.py, tests/test_criterion_D1.py) is absolute."
    must_not_skip:
      - "Nine existing criteria (T1, T2, T3, C1, C2, X1, N1, RD1, RD2) pass with zero test-file modification."
      - "Route registration order: literal /books/duplicates before any parameterized /books/{id}."
      - "Response is a bare JSON array at top level, not a wrapping object."
      - "Case-insensitive comparison uses .lower() on both sides, not str equality."
      - "Duplicate detection excludes the book itself from the count (single-book-with-unique-title is absent)."
    defer_if_time_constrained:
      - "Additional test parametrization beyond the core cases (empty shelf, unique-only shelf, mixed-case duplicates, single-book edge). The brief's must_cover_requirements define the minimum; extra parametrize rows are nice-to-have under the 35% test budget but not load-bearing."
      - "Logging or docstring additions on the new store method or route handler beyond what CONTRIBUTING.md requires."
    confidence: high
    ```
