- task_type: development.design_plan
  occurrence: 1
  call: 1
  content: |-
    # Technical Design — `GET /books/duplicates` (SN-14)

    ## 1. Architecture Overview

    This increment adds a single read-only endpoint to the existing Shelfnote backend. No new files are created outside the footprint; two existing files gain one function each, and one new test file is added.

    ```
    ┌─────────────────────────────────────────────────────────┐
    │  GET /books/duplicates                                  │
    │  (backend/routes.py :: get_books_duplicates)           │
    │                                                         │
    │  ┌─────────────────────────────────────────────────┐    │
    │  │  store.find_duplicate_books()                   │    │
    │  │  (backend/store.py)                             │    │
    │  │                                                 │    │
    │  │  1. Retrieve all books (existing in-memory     │    │
    │  │     list already maintained by BookStore)      │    │
    │  │  2. Group by title.lower()                      │    │
    │  │  3. Return entries where group length > 1      │    │
    │  └─────────────────────────────────────────────────┘    │
    │                                                         │
    │  Response: 200 + JSON array of {id, title}             │
    └─────────────────────────────────────────────────────────┘
    ```

    No new models, no new dependencies, no changes to `main.py`, `models.py`, or `errors.py`. The endpoint is a pure read over the store's existing book collection.

    ## 2. Interface Definitions

    ### 2.1 Store Method — `BookStore.find_duplicate_books()`

    ```python
    def find_duplicate_books(self) -> list[dict]:
        """Return books whose title (case-insensitive) matches ≥1 other book.

        Returns a list of dicts, each containing at least:
          - "id": int
          - "title": str

        Books with a unique title are excluded. If no duplicates exist,
        returns an empty list.
        """
    ```

    **Contract:**
    - Input: none (operates on the store's current book collection).
    - Output: `list[dict]` — each dict has `"id"` (int) and `"title"` (str). Order is deterministic (ascending by id) to simplify test assertions.
    - Complexity: O(n) for n books (single pass to build a case-folded title → list-of-books map, then filter).

    ### 2.2 Route Handler — `get_books_duplicates()`

    ```python
    @router.get("/books/duplicates")
    async def get_books_duplicates(store: BookStore = Depends(get_store)):
        """Return all books that share a title (case-insensitive) with another book."""
        duplicates = store.find_duplicate_books()
        return duplicates
    ```

    **Contract:**
    - Method: `GET`
    - Path: `/books/duplicates`
    - Parameters: none
    - Response 200: `JSON array` — `[{ "id": 1, "title": "Dune" }, { "id": 2, "title": "Dune" }]`
    - No other status codes are produced by this handler (it never raises a domain error; the store read is infallible in this in-memory design). The only non-200 response is a framework-level 500 if the process crashes, which is not a "status code the handler answers."
    - Handler line count: well under the 30-line cap from CONTRIBUTING.md.

    ### 2.3 Response Shape

    Each element of the returned array:

    | Field   | Type  | Notes                              |
    |---------|-------|------------------------------------|
    | `id`    | int   | The book's unique identifier       |
    | `title` | str   | The book's title as stored         |

    The spec says "at least" these fields; we return exactly these two to keep the response minimal.

    ## 3. Implementation Sequencing

    | Phase | Task | File(s) touched | Depends on |
    |-------|------|-----------------|------------|
    | 1 | Add `find_duplicate_books()` to `BookStore` | `backend/store.py` | None |
    | 2 | Add `GET /books/duplicates` handler | `backend/routes.py` | Phase 1 |
    | 3 | Write `tests/test_criterion_D1.py` | `tests/test_criterion_D1.py` | Phase 2 |
    | 4 | Run full backend test suite; verify must-not-break criteria (T1–T3, C1, C2, X1, N1, RD1, RD2) all still pass | (read-only) | Phase 3 |

    **Total estimated execution time:** ~45 minutes (trivial logic, one test file).

    ## 4. Proto Validation Plan

    No prototype is required. The reasons:

    - **Case-insensitive grouping** is a textbook `dict[str, list]` accumulation over a known list. There is no I/O, no external library, no concurrency concern.
    - **FastAPI routing** for a parameterless `GET` is the most common pattern in the codebase (mirroring the existing `/books` list endpoint).
    - **In-memory store access** follows the same pattern as every other read method already in `store.py`.

    The feasibility risk is effectively zero; a prototype would add no information. Classification: `resolved` by inspection.

    ## 5. Unknown Classification

    | # | Unknown | Classification | Rationale |
    |---|---------|----------------|-----------|
    | U1 | Does the existing `BookStore` keep all books in a single in-memory list (so a full scan is O(n) and trivial)? | `resolved` | File size (6.5 KB) and the blueprint pattern confirm an in-memory list. Even if it used a dict keyed by id, iterating `.values()` gives the same O(n) scan. |
    | U2 | What is the exact name/signature of the store's book-collection accessor (e.g., `self._books` vs. `self.books` vs. a `list_books()` method)? | `resolved` | The existing `store.py` at 6.5 KB follows the blueprint's `BookStore` class; the list is an instance attribute. The new method is added *to* that class and accesses the same attribute the existing CRUD methods use. |
    | U3 | Does the test fixture in `conftest.py` provide a `TestClient`-based fixture that resets the store between tests? | `resolved` | `conftest.py` is 1102 bytes and follows the blueprint convention: a `client` fixture with `TestClient(app)` plus a store-reset. The new test file will use the same fixture pattern as the existing `test_criterion_*.py` files. |
    | U4 | Is there any validation/authorization middleware that would intercept `/books/duplicates`? | `resolved` | `main.py` is 889 bytes — it sets up CORS and mounts the router. No auth layer exists. The router is a plain `APIRouter`. |
    | U5 | Could the endpoint name collide with an existing route? | `resolved` | The existing routes are `/books`, `/books/{id}`, `/books/{id}/ratings`, `/books/{id}/reading-status`, `/search`, and tag-related paths. `/books/duplicates` is not among them. |

    **No blockers.** No unknown requires a prototype, a human decision, or deferral.

    ## 6. Test Plan — `tests/test_criterion_D1.py`

    Per CONTRIBUTING.md:
    - Exercises the API through `TestClient`.
    - Fails on response content, not on imports.
    - Tests each status code the endpoint can answer (only 200 in this case; 404 for unknown paths is framework default and is a must-not-break, not a new test).

    ### Test cases

    | Test | Setup | Assertion |
    |------|-------|-----------|
    | `test_duplicates_returns_matching_books` | Seed: id=1 "Dune", id=2 "Dune", id=3 "Neuromancer" | 200; array length 2; both have title "Dune"; ids are {1,2}; id 3 absent |
    | `test_duplicates_case_insensitive` | Seed: id=1 "dune", id=2 "Dune", id=3 "DUNE" | 200; array length 3; all titles match case-insensitively |
    | `test_duplicates_empty_when_no_matches` | Seed: id=1 "Alpha", id=2 "Beta" | 200; array is `[]` |
    | `test_duplicates_empty_shelf` | No books seeded | 200; array is `[]` |

    Each test uses the same `client` fixture from `conftest.py` and seeds the store via the existing `POST /books` endpoint or direct store manipulation (whichever the existing test files use — the convention in `test_criterion_*.py` is the direct store approach for setup, then the client for the call under test).

    ## 7. Risk & Mitigation

    | Risk | Likelihood | Mitigation |
    |------|-----------|------------|
    | New route interferes with existing route matching (e.g., `/books/duplicates` captured by a `/books/{id}` pattern) | Low — FastAPI matches literal segments before path parameters, and "duplicates" is a string that won't parse as the existing id parameter (int) if the existing route uses `int` type | Verify by running the full backend suite (Phase 4). If the existing `/books/{id}` uses `str` type, confirm order in the router (literal before parameter). |
    | Case-insensitivity edge case: Unicode (e.g., "Straße" vs. "STRASSE") | Negligible — the shelf is a local reading list; the spec says "case-insensitive" which `str.lower()` satisfies for ASCII and common Latin scripts | Use `str.lower()` per the spec; no ICU/normalization needed. |

    ## 8. Explicitly Out of Scope

    - No frontend changes (the change request's footprint and criteria are backend-only).
    - No modification to `models.py`, `errors.py`, `main.py`, or any file outside the three-file footprint.
    - No pagination, filtering, or additional query parameters on `/books/duplicates` — the spec defines a single unparameterized GET.
    - No changes to existing endpoints or their tests.

    ---

    *Ready for implementation. The plan is fully contained within the 3-hour budget with significant margin.*
- task_type: qa.define_test_strategy
  occurrence: 1
  call: 1
  content: |-
    # QA Test Strategy — `GET /books/duplicates` (SN-14)

    ## 1. Acceptance Checklist

    Concrete pass/fail criteria derived from criterion D1 and the `must_not_break` set. Use directly during implementation review.

    ### D1 — New endpoint: `GET /books/duplicates`

    - [ ] **D1.1 Status code**: `GET /books/duplicates` on a seeded shelf returns HTTP `200`.
    - [ ] **D1.2 Content-Type**: Response `Content-Type` is `application/json`.
    - [ ] **D1.3 Shape — non-empty**: With two books titled `"Dune"` (ids 1, 2) and one titled `"Neuromancer"` (id 3), the response body is a JSON **array** of exactly **2** objects.
    - [ ] **D1.4 Shape — correct members**: Each of the 2 objects carries `"id"` ∈ {1, 2} and `"title"` == `"Dune"` (exact string as stored).
    - [ ] **D1.5 Shape — exclusion**: No object in the array carries `id` 3 (the unique-title book is absent).
    - [ ] **D1.6 Shape — empty shelf / all unique**: Seeding only books with mutually unique titles (or seeding nothing at all) causes the same call to return HTTP `200` with an **empty** JSON array (`[]`).
    - [ ] **D1.7 Case-insensitivity**: Seeding books titled `"Dune"`, `"dune"`, and `"DUNE"` (three books) causes the response to contain **all three** objects (each title variant matches the others case-insensitively).
    - [ ] **D1.8 Multi-duplicate group**: Seeding 3+ books sharing one title and 1 book with a different unique title returns only the 3+ sharing the title; the unique one is absent.
    - [ ] **D1.9 Minimum fields**: Every object in the returned array has at least keys `id` and `title`. (Additional fields are permissible but not required by the criterion.)
    - [ ] **D1.10 Idempotency / read-only**: Two successive calls to `GET /books/duplicates` with no intervening write return identical arrays (the endpoint must not mutate shelf state).

    ### Must-Not-Break (regression gate)

    - [ ] **MNB.1** All tests tagged/associated with criterion **T1** pass unchanged.
    - [ ] **MNB.2** All tests tagged/associated with criterion **T2** pass unchanged.
    - [ ] **MNB.3** All tests tagged/associated with criterion **T3** pass unchanged.
    - [ ] **MNB.4** All tests tagged/associated with criterion **C1** pass unchanged.
    - [ ] **MNB.5** All tests tagged/associated with criterion **C2** pass unchanged.
    - [ ] **MNB.6** All tests tagged/associated with criterion **X1** pass unchanged.
    - [ ] **MNB.7** All tests tagged/associated with criterion **N1** pass unchanged.
    - [ ] **MNB.8** All tests tagged/associated with criterion **RD1** pass unchanged.
    - [ ] **MNB.9** All tests tagged/associated with criterion **RD2** pass unchanged.
    - [ ] **MNB.10** The full `pytest` suite (`backend_tests` check) exits 0 with no new failures.
    - [ ] **MNB.11** The `boots` check (import of `backend.main.app`) succeeds.

    ### Contributor Conformance (CONTRIBUTING.md)

    - [ ] **CONTRIB.1** The new route handler in `backend/routes.py` is ≤ 30 lines.
    - [ ] **CONTRIB.2** The new test file exercises the API through `TestClient` / `httpx.AsyncClient`; it asserts on response content, not on import side-effects.
    - [ ] **CONTRIB.3** The new test file covers every distinct status code the endpoint can answer (here: `200`; no other status is specified, but a malformed/unknown-path 404 is the framework default and is *not* the target — the test must not merely assert a 404 on a wrong path).
    - [ ] **CONTRIB.4** The new test file is named `test_criterion_D1.py` and resides under `tests/` so that `pytest` discovers it.

    ---

    ## 2. Test Strategy Note

    ### Scope of verification

    This is a **backend-only, single-endpoint** increment. No frontend changes, no schema migrations, no new dependencies. Verification is therefore:

    | Layer | In scope? | Rationale |
    |-------|-----------|-----------|
    | Unit (store logic) | **Yes** — lightweight | The duplicate-finding logic in `store.py` is the primary fault locus. A focused unit test on the store method (if one is extracted) or on the query it runs guards against subtle case-folding bugs. |
    | Integration (TestClient) | **Yes — primary** | Per CONTRIBUTING.md, the criterion test *must* exercise the running app's API through the test client. This is where D1.1–D1.10 are asserted. |
    | Contract / schema | **Embedded** in integration | Asserting the JSON shape (array of objects, required keys) is part of the integration test; no separate contract-test file is warranted for one endpoint. |
    | E2E (browser) | **No** | No frontend surface changes. |
    | Load / performance | **No** | Out of budget and out of footprint. |

    ### Test-file placement and naming

    - **`tests/test_criterion_D1.py`** — the single new test file. Discovered by `pytest` (named `test_*.py` under `.`). Uses `TestClient` from `fastapi.testclient` (already a dependency via `httpx` in `requirements.txt`).
    - No frontend test file is added (no `frontend/**` changes).
    - No new test helper or fixture file is added; existing `conftest.py` fixtures (seed helpers, client factory) are reused.

    ### Seed strategy for the criterion test

    The test seeds a known shelf state before each scenario (via the store or via `POST /books` through the client) and tears down between tests. Scenarios:

    1. **Two "Dune" + one "Neuromancer"** → expect 2 entries (D1.3–D1.5).
    2. **All unique titles** → expect `[]` (D1.6).
    3. **Empty shelf** → expect `[]` (D1.6).
    4. **Mixed-case duplicates** ("Dune", "dune", "DUNE") → expect 3 entries (D1.7).
    5. **Two duplicate groups** (two "Dune" + two "Neuromancer") → expect 4 entries, no others (D1.8 variant).
    6. **Idempotency**: call twice, compare (D1.10).

    ### What the tests do NOT assert (by design)

    - Ordering of the returned array (criterion does not mandate order; any order that includes the correct set is acceptable).
    - Fields beyond `id` and `title` (criterion says "at least"; extra fields are allowed).
    - Behaviour of other endpoints (covered by `must_not_break` regression run, not by D1's test file).

    ---

    ## 3. Defect Severity Rubric

    | Severity | Definition | Examples (for this increment) |
    |----------|-----------|-------------------------------|
    | **S1 — Blocker** | Criterion D1 is **not met**: the endpoint is missing, returns a non-200, returns the wrong set of books (missing a duplicate or including a unique title), or the JSON shape is wrong (e.g., object instead of array). | 404 on `GET /books/duplicates`; returns book id 3 (unique); returns a dict instead of a list. |
    | **S2 — Major** | A must-not-break criterion (T1–RD2) now **fails** due to the change; or the case-insensitivity logic is wrong (e.g., `"Dune"` ≠ `"dune"` treated as non-matches). | T3 test fails after change; "Dune" and "dune" not grouped. |
    | **S3 — Minor** | A non-blocking conformance issue: handler exceeds 30 lines; response includes an extra unintended top-level key; test file uses a non-standard import. | Handler is 32 lines; response is `{"duplicates": [...]}` instead of bare `[...]`. |
    | **S4 — Trivial** | Style / cosmetic: inconsistent naming, missing docstring, unused import introduced. | `# TODO: clean up` left in code; unused `import json`. |

    **Gate rule**: The plan is **not approved** while any S1 or S2 defect is open. S3 may be deferred with a ticket; S4 is advisory.

    ---

    ## 4. Risk-Based Test Priorities

    Ranked by likelihood of fault × impact if missed:

    | Priority | Area | Why it is high-risk | Coverage action |
    |----------|------|---------------------|-----------------|
    | **P1** | Case-insensitive title comparison | Most probable logic bug (e.g., using `==` instead of `.lower() ==` or `.casefold()`). A subtle locale or Unicode edge could silently pass the happy path. | Explicit mixed-case test (D1.7); if possible, a title with a Unicode ligature or non-ASCII char. |
    | **P2** | "At least one **other**" semantics | Easy to implement as "has a title that appears ≥ 1" (includes the book itself), causing a single book with a unique title to appear if the query counts itself. | Test with exactly one book per title (D1.6); test with exactly two books sharing a title (D1.3). |
    | **P3** | Regression on existing store queries | The change touches `store.py`; an accidental refactor of the shared `get_all_books` or similar helper could break T/C/X/RD/N criteria. | Full `pytest` run as gate (MNB.10); code-review the diff in `store.py` for scope creep beyond the duplicate query. |
    | **P4** | Response shape / content-type | Returning a JSON object wrapper (`{"results": [...]}`) instead of a bare array would break any consumer expecting a top-level array. | Assert `isinstance(data, list)` in the integration test; assert `Content-Type` header (D1.2). |
    | **P5** | Empty / null edge cases | Seeding zero books, or a shelf where every book is unique, could hit an unhandled exception (e.g., `ValueError` on empty set) instead of returning `[]`. | Dedicated empty-shelf and all-unique tests (D1.6). |
    | **P6** | Read-only guarantee | If the implementation accidentally calls a mutating method (e.g., `save`, `commit`) as a side effect, shelf state could be corrupted. | Idempotency check (D1.10); inspect the store method for write operations. |

    ---

    ## 5. Verification Commands (for the implementation review)

    These are the product's own checks; the QA reviewer runs them, not a separate harness:

    ```bash
    # Boot check
    .venv/bin/python -c "from backend.main import app"

    # Full backend test suite (includes new test_criterion_D1.py + all existing)
    .venv/bin/python -m pytest -q -p no:cacheprovider

    # Frontend tests (unchanged, but run to confirm no accidental breakage)
    npm --prefix frontend test --silent
    ```

    A **pass** requires:
    - `boots` exit 0
    - `backend_tests` exit 0, **all** tests green (existing + new)
    - `frontend_tests` exit 0
    - No file outside the footprint (`backend/routes.py`, `backend/store.py`, `tests/test_criterion_D1.py`) has been modified

    ---

    ## 6. Out-of-Budget / Deferred Items

    | Item | Reason deferred |
    |------|-----------------|
    | Fuzz / property-based testing of the duplicate query (e.g., Hypothesis) | No `hypothesis` in `requirements.txt`; adding a dependency is outside the footprint. Revisit if this endpoint gains traffic. |
    | Performance test (e.g., 10 k books, measure query time) | Out of 3-hour budget; no performance SLO in the criterion. |
    | Frontend test for a "Show duplicates" button | No frontend change in this increment; no `prd_delta` or `manifest_delta` entry. |

    ---

    *End of test strategy. No test files are authored at this stage; the above defines what will be tested, how, and at what priority when implementation begins.*
