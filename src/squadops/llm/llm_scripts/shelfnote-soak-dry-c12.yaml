    ```python:tests/test_criterion_D1.py
    """Criterion D1: GET /books/duplicates — case-insensitive title matching,
    self-exclusion, bare-array shape, route non-shadowing, idempotency,
    empty-shelf and all-unique-titles boundary."""


    def _seed(client, title, author="Auth", added_by="U"):
        """POST a book and return its JSON dict."""
        res = client.post("/books", json={"title": title, "author": author, "added_by": added_by})
        assert res.status_code == 201
        return res.json()


    def test_response_is_bare_array_not_wrapped_object(client):
        """GET /books/duplicates returns a bare JSON array, not {"duplicates": [...]}.

        Fault caught: the handler wraps the list in an object, so the body is a dict.
        Also asserts every element carries 'id' (int) and 'title' (str).
        """
        b1 = _seed(client, "Dune", "Herbert1")
        b2 = _seed(client, "Dune", "Herbert2")
        _seed(client, "Neuromancer", "Gibson")

        res = client.get("/books/duplicates")
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()

        # Fault 3: must be a bare list, not a wrapping dict
        assert isinstance(body, list), (
            f"Expected bare JSON array, got {type(body).__name__}: {body}"
        )

        # Exactly the two Dune books; Neuromancer absent
        ids = {b["id"] for b in body}
        assert ids == {b1["id"], b2["id"]}, (
            f"Expected ids {{'{b1['id']}', '{b2['id']}'}}, got {ids}"
        )

        # Every element carries id (int) and title (str)
        for entry in body:
            assert isinstance(entry["id"], int), (
                f"'id' is {type(entry['id']).__name__}, expected int: {entry}"
            )
            assert isinstance(entry["title"], str), (
                f"'title' is {type(entry['title']).__name__}, expected str: {entry}"
            )
            assert entry["title"] == "Dune"


    def test_mixed_case_titles_all_grouped(client):
        """'Dune', 'dune', 'DUNE' are all the same title case-insensitively.

        Fault caught: case-sensitive comparison (==) groups them separately,
        so each appears exactly once and none qualifies as "at least one other".
        """
        b1 = _seed(client, "Dune", "A1")
        b2 = _seed(client, "dune", "A2")
        b3 = _seed(client, "DUNE", "A3")
        b4 = _seed(client, "Neuromancer", "A4")

        res = client.get("/books/duplicates")
        assert res.status_code == 200
        body = res.json()
        assert isinstance(body, list)

        dup_ids = {b["id"] for b in body}
        # All three case-variants must be grouped
        assert b1["id"] in dup_ids, f"'Dune' (id {b1['id']}) missing from duplicates"
        assert b2["id"] in dup_ids, f"'dune' (id {b2['id']}) missing from duplicates"
        assert b3["id"] in dup_ids, f"'DUNE' (id {b3['id']}) missing from duplicates"
        # Unique title must be absent
        assert b4["id"] not in dup_ids, f"'Neuromancer' (id {b4['id']}) should not be a duplicate"
        assert len(body) == 3, f"Expected 3 duplicates, got {len(body)}"


    def test_all_unique_titles_returns_empty(client):
        """Every book has a unique title → empty array.

        Fault caught: self-counting — the implementation counts the book itself,
        so a title appearing once is reported as "at least one other".
        """
        _seed(client, "Alpha", "A")
        _seed(client, "Beta", "B")
        _seed(client, "Gamma", "C")

        res = client.get("/books/duplicates")
        assert res.status_code == 200
        body = res.json()
        assert isinstance(body, list)
        assert body == [], f"Expected empty list for all-unique titles, got {body}"


    def test_empty_shelf_returns_empty_array(client):
        """No books at all → 200 with [].

        Fault caught: division by zero, unguarded loop, or error response on empty store.
        """
        res = client.get("/books/duplicates")
        assert res.status_code == 200, f"Expected 200 on empty shelf, got {res.status_code}"
        body = res.json()
        assert isinstance(body, list)
        assert body == []


    def test_idempotent_repeated_gets(client):
        """Two successive GETs with no intervening write return identical arrays.

        Fault caught: the handler mutates shelf state (e.g. pops or deletes
        entries), so the second call sees a different shelf.
        """
        _seed(client, "Dune", "A")
        _seed(client, "Dune", "B")
        _seed(client, "Unique", "C")

        res1 = client.get("/books/duplicates")
        assert res1.status_code == 200
        body1 = res1.json()

        res2 = client.get("/books/duplicates")
        assert res2.status_code == 200
        body2 = res2.json()

        assert body1 == body2, (
            f"Second GET differs from first: {body1} != {body2} — handler mutated state"
        )


    def test_not_shadowed_by_param_route(client):
        """GET /books/duplicates is not captured by the /books/{id} parameterized route.

        Fault caught: route ordering — the parameterized route matches "duplicates"
        as an id, returning 404 book_not_found instead of the duplicate list.
        """
        b1 = _seed(client, "Match", "A")
        b2 = _seed(client, "Match", "B")

        res = client.get("/books/duplicates")

        # If shadowed by /books/{id}, this would be 404 with book_not_found
        assert res.status_code == 200, (
            f"Expected 200 from /books/duplicates, got {res.status_code} "
            f"(possibly shadowed by /books/{{id}}): {res.json() if res.status_code == 404 else res.text}"
        )
        body = res.json()
        assert isinstance(body, list), f"Expected array, got {type(body).__name__}"
        assert len(body) == 2, f"Expected 2 duplicates, got {len(body)}"
        dup_ids = {b["id"] for b in body}
        assert dup_ids == {b1["id"], b2["id"]}
    ```
