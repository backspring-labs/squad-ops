    ```yaml:plan_authoring_brief.yaml
    version: 1
    brief_id: brief-sn14-d1-001
    objective_summary: |
      Add a single read-only endpoint (GET /books/duplicates) to Shelfnote's existing
      books API. The endpoint returns a bare JSON array of every book whose title,
      compared case-insensitively, matches the title of at least one other book on
      the shelf. Each array element carries at least the book's id and title. Books
      whose title is unique are absent from the array. When no duplicates exist the
      array is empty. No other endpoints, models, dependencies, or frontend surfaces
      change. The existing application's nine accepted criteria (T1, T2, T3, C1, C2,
      X1, N1, RD1, RD2) must continue to pass unmodified.
    accepted_stack:
      backend: "FastAPI + in-memory BookStore (Python 3, no new packages)"
      frontend: "React + Vite (untouched this cycle)"
      backend_test: "pytest + fastapi.testclient.TestClient"
      frontend_test: "vitest (untouched this cycle)"
    must_cover_requirements:
      - "GET /books/duplicates returns a bare JSON array (not a wrapping object); each element has at least keys 'id' (int) and 'title' (str)."
      - "Duplicate detection is case-insensitive: titles 'Dune', 'dune', 'DUNE' are all considered the same title."
      - "A book is included only if at least one OTHER book shares its title; a single book with a unique title is never in the result."
      - "When the shelf is empty or every book's title is unique, the array is empty."
      - "The endpoint is parameterless (no query params, no path params) and is a pure read; it must not mutate shelf state."
      - "The route handler in backend/routes.py is at most 30 lines (CONTRIBUTING.md)."
      - "The new test file exercises the API through TestClient and asserts on response content, not on import side-effects."
      - "All nine must-not-break criteria (T1, T2, T3, C1, C2, X1, N1, RD1, RD2) pass after the change with no test modification."
      - "Only the three footprint files change: backend/store.py, backend/routes.py, tests/test_criterion_D1.py."
    scope_cuts:
      - "Frontend changes (no new view, no API-client change): deferred; no prd_delta or manifest_delta entry."
      - "Pagination, sorting, or filtering parameters on /books/duplicates: not in the criterion."
      - "Additional response fields beyond id and title: criterion says 'at least'; returning exactly id and title is sufficient."
      - "Performance / load testing of the duplicate query: out of 3-hour budget, no SLO in the criterion."
      - "Property-based or fuzz testing (Hypothesis): dependency not in requirements.txt; adding one is outside the footprint."
      - "Unicode/locale-aware case folding beyond str.lower(): the criterion specifies case-insensitive matching; str.lower() satisfies this for the product's use-case."
    risk_areas:
      - "Route ordering: /books/duplicates must not be captured by an existing /books/{id} parameterized route. FastAPI resolves literal segments before parameterized ones, but if the existing route uses a string-typed {id}, ordering in the router matters."
      - "Case-insensitive comparison correctness: using str equality instead of .lower() comparison silently fails mixed-case titles."
      - "'At least one OTHER' semantics: the implementation must count other books, not the book itself. A single book whose title appears exactly once must not appear in the result."
      - "Regression on shared store code: the new method is added to the existing BookStore class; an accidental refactor of an existing helper (list_books, get_by_id, etc.) breaks the nine must-not-break criteria."
      - "Response shape: returning a JSON object wrapper (e.g., {\"duplicates\": [...]}) instead of a bare array breaks the criterion's observable contract."
    source_artifact_refs:
      - "change_request.yaml"
      - "ruling_notes.md"
      - "CONTRIBUTING.md"
    major_components:
      - "BookStore.find_duplicate_books() — store-layer query (backend/store.py)"
      - "get_books_duplicates() — route handler (backend/routes.py)"
      - "Criterion D1 test suite (tests/test_criterion_D1.py)"
    dependency_assumptions:
      - "The in-memory BookStore already maintains the full book collection; no database migration or schema change is needed."
      - "No new Python package is introduced; TestClient and httpx are already in requirements.txt."
      - "The existing conftest.py provides a client fixture and store-reset mechanism usable by the new test file."
    time_budget_guidance:
      backend_store_method: 15
      backend_route_handler: 10
      test_authoring: 35
      verification_and_regression: 20
      buffer: 20
