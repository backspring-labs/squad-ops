    """Criterion D1: GET /books/duplicates — case-insensitive title matching,
    bare-array shape, self-exclusion, empty-shelf boundary, idempotency,
    and route-shadowing guard."""


    def _seed(client, title, author="A", added_by="U"):
        """POST a book and return its JSON dict."""
        res = client.post("/books", json={"title": title, "author": author, "added_by": added_by})
        assert res.status_code == 201
        return res.json()


    def test_mixed_case_titles_all_grouped(client):
        """Titles differing only in case ('Dune', 'dune', 'DUNE') are all returned.

        Faults caught:
          1. Case-sensitive == instead of .lower() comparison.
          2. Self-counting: a book whose title appears exactly once is included
             because the implementation counts itself as 'at least one other'.
        """
        _seed(client, "Dune")
        _seed(client, "dune", author="B")
        _seed(client, "DUNE", author="C")

        res = client.get("/books/duplicates")
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()
        assert isinstance(body, list), f"Expected JSON array, got {type(body).__name__}"
        assert len(body) == 3, f"Expected 3 entries, got {len(body)}: {body}"

        titles = {entry["title"].lower() for entry in body}
        assert titles == {"dune"}, f"Expected all 'dune' (case-insensitive), got {titles}"

        # Every element carries 'id' (int) and 'title' (str)
        for entry in body:
            assert isinstance(entry["id"], int), f"id is {type(entry['id']).__name__}"
            assert isinstance(entry["title"], str), f"title is {type(entry['title']).__name__}"


    def test_unique_titles_yield_empty_list(client):
        """A shelf where every book has a unique title → empty array.

        Fault caught: self-counting — a title appearing exactly once is included
        because the book counts itself as 'at least one other'.
        """
        _seed(client, "Alpha")
        _seed(client, "Beta", author="B")
        _seed(client, "Gamma", author="C")

        res = client.get("/books/duplicates")
        assert res.status_code == 200
        body = res.json()
        assert isinstance(body, list)
        assert body == [], f"Expected empty list, got {body}"


    def test_empty_shelf_yields_empty_list(client):
        """No books on the shelf → GET /books/duplicates returns 200 with [].

        Fault caught: the handler errors or returns a non-empty default on an
        empty collection.
        """
        res = client.get("/books/duplicates")
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()
        assert isinstance(body, list), f"Expected JSON array, got {type(body).__name__}"
        assert body == []


    def test_response_is_bare_array_not_wrapped_object(client):
        """The response body is a JSON array, not {"duplicates": [...]}.

        Fault caught: wrong response shape — a wrapping object is returned
        instead of the bare array.
        """
        _seed(client, "Dune")
        _seed(client, "Dune", author="B")

        res = client.get("/books/duplicates")
        assert res.status_code == 200
        body = res.json()
        assert isinstance(body, list), (
            f"Expected bare JSON array, got {type(body).__name__}: {list(body.keys()) if isinstance(body, dict) else body}"
        )
        assert len(body) == 2


    def test_idempotent_repeated_gets(client):
        """Two successive GET /books/duplicates with no intervening write return
        identical arrays.

        Fault caught: mutation side-effect — the handler mutates shelf state on
        each call, so the second response differs.
        """
        _seed(client, "Dune")
        _seed(client, "Dune", author="B")
        _seed(client, "Neuromancer", author="C")

        res1 = client.get("/books/duplicates")
        res2 = client.get("/books/duplicates")

        assert res1.status_code == 200
        assert res2.status_code == 200
        body1 = res1.json()
        body2 = res2.json()
        assert body1 == body2, (
            f"Two GETs returned different bodies: {body1} vs {body2}"
        )
        assert isinstance(body1, list)
        assert len(body1) == 2
