- task_type: governance.review_plan
  occurrence: 1
  call: 1
  content: |-
    ---
    readiness: go
    sufficiency_score: 4
    blocker_unknowns: 0
    ---

    ## Consolidated Plan

    ### 1. Change Summary

    Add a single `GET /export` endpoint to Shelfnote that serializes the current shelf as a CSV document. The endpoint returns HTTP 200 with `Content-Type: text/csv`. The body is a CSV with a header row (`title,status,tags,rating`) and one data row per book on the shelf, in the order the store returns them.

    This is an **increment** to an accepted application. No existing endpoint, model, or frontend component changes. The only files modified are:

    | File | Action |
    |---|---|
    | `backend/routes.py` | Add one route handler (~20 lines) |
    | `tests/test_criterion_X1.py` | New test file for criterion X1 |

    All other files remain at their accepted state (commit `995eebf9…`).

    ### 2. Technical Design

    #### 2.1 Route Handler — `backend/routes.py`

    Append a new handler to the existing `APIRouter` (the router already defined in `routes.py`). The handler:

    1. Calls the existing store to fetch all books (the same call `GET /books` uses to list the shelf). No new store method is needed; the store already exposes the full list.
    2. Builds a CSV string in memory:
       - **Header line**: `title,status,tags,rating`
       - **Data rows**: one per book. Field values:
         - `title` — the book's title string.
         - `status` — the book's reading-status string (e.g. `"unstarted"`, `"reading"`, `"finished"`).
         - `tags` — the book's tag list joined by a semicolon (`;`) to avoid collision with the CSV delimiter. An empty tag list yields an empty string.
         - `rating` — the book's rating as an integer (or empty string if unrated, depending on the existing model's default).
       - Each row is written with Python's `csv.writer` targeting a `io.StringIO` buffer, which handles quoting/escaping of titles that contain commas or quotes.
    3. Returns `fastapi.responses.Response(content=csv_text, media_type="text/csv", status_code=200)`.

    The handler is expected to be **≤ 25 lines**, satisfying the CONTRIBUTING.md 30-line cap.

    No new imports beyond `csv`, `io`, and the existing `fastapi` / store references already present in `routes.py`.

    #### 2.2 Edge Cases

    | Case | Behaviour |
    |---|---|
    | Shelf is empty (0 books) | Response is 200, `text/csv`, body is the header row only. |
    | Title contains a comma or double-quote | `csv.writer` emits the field wrapped in double-quotes with internal quotes doubled. |
    | Tag list is empty | The `tags` column is an empty string (no trailing semicolons). |
    | Rating is `None` / unset | The `rating` column is an empty string. |

    These behaviours are implied by the criterion (header always present, one row per book) and by standard CSV semantics. No additional criteria are needed because the criterion's `observable` clause fully specifies the happy-path shape.

    #### 2.3 What Does **Not** Change

    - `backend/models.py`, `backend/store.py`, `backend/main.py`, `backend/errors.py` — untouched.
    - All frontend files — untouched.
    - All existing test files — untouched.
    - `conftest.py`, `Dockerfile`, `nginx.conf`, `start.sh` — untouched.

    ### 3. Test Strategy

    #### 3.1 New Test File — `tests/test_criterion_X1.py`

    Follows the product's existing test conventions (pytest, `TestClient` via `httpx` or `starlette`, seed-then-assert pattern visible in `test_books_api.py` and the `test_criterion_T*.py` files).

    **Test cases (single file, multiple test functions):**

    | Test | What it proves | Maps to |
    |---|---|---|
    | `test_export_returns_200_csv` | `GET /export` → status 200, `Content-Type` header starts with `text/csv` | X1 observable (status & content-type) |
    | `test_export_header_row` | First line of body is exactly `title,status,tags,rating` | X1 observable (header fields) |
    | `test_export_one_row_per_book` | Seed *n* books via `POST /books`, then `GET /export`; body has exactly *n*+1 lines (header + *n* data rows) | X1 observable (one row per book) |
    | `test_export_field_order_and_values` | Seed a book with known title, status, tags, rating; verify the corresponding data row has those values in the correct column positions | X1 observable (field order, values) |
    | `test_export_empty_shelf` | With no books, body is just the header row | X1 (implicit: zero books → zero data rows) |

    Each test uses the existing `conftest.py` fixture (the `client` / `app` fixture that creates a `TestClient` over the FastAPI app with a fresh in-memory store). No new fixtures, no new imports beyond what `conftest.py` and `backend.main` already provide.

    Per CONTRIBUTING.md: tests exercise the running app's API through the test client, assert on response content (status, headers, body), and do **not** import from the new code.

    #### 3.2 Must-Not-Break Verification

    The existing tests `T1`, `T2`, `T3`, `C1`, `C2` are not modified. They are re-run as part of the standard `backend_tests` check (`pytest -q -p no:cacheprovider`). Because `routes.py` only gains a new handler and does not alter any existing route, model, or store function, these tests are expected to pass unchanged.

    #### 3.3 Verification Commands

    | Check | Command | Expected |
    |---|---|---|
    | Boots | `.venv/bin/python -c "from backend.main import app"` | exit 0 |
    | Backend tests | `.venv/bin/python -m pytest -q -p no:cacheprovider` | all pass, including new `test_criterion_X1.py` and all must-not-break tests |
    | Frontend tests | `npm --prefix frontend test --silent` | all pass (unchanged) |

    ### 4. Sufficiency Assessment

    | Criterion | Rating | Notes |
    |---|---|---|
    | **Scope clarity** | ✅ Strong | Footprint is exactly 2 files. Endpoint, response shape, and field order are fully specified by the criterion. Must-not-break list is explicit. No ambiguity about in-scope vs. out-of-scope. |
    | **Technical feasibility** | ✅ Strong | Purely additive. Uses existing store, existing router, Python stdlib `csv` module. No new dependencies, no schema changes. Implementable in well under an hour. |
    | **Risk coverage** | ✅ Adequate | The only non-trivial risk is CSV field escaping (titles with commas/quotes), mitigated by using `csv.writer` rather than manual string concatenation. Empty-shelf and empty-tags edge cases are identified and specified. No unknowns classified as blocker. |
    | **Test strategy alignment** | ✅ Adequate | Five test functions cover status code, content type, header content, row count, field values/order, and the empty-shelf boundary. Must-not-break tests are re-run automatically by the standard pytest invocation. Coverage matches the risk surface. |
    | **Resource fit** | ✅ Strong | Two files, one ~20-line handler, one test file with ~5 short test functions. No new dependencies. Well within the 3-hour budget with ample margin for review and iteration. |

    **Sufficiency score: 4 / 5.** The plan is complete and unambiguous for every aspect the criterion requires. The one point withheld is a minor gap in explicitly specifying the tag-serialization delimiter (`;` chosen here) and the unrated-`rating` representation — both are implementation details the developer can settle without architectural risk, but a fifth-level plan would pin them in the criterion's observable language.

    ### 5. Blocker Unknowns

    **None.** No unknowns are classified as blocker. All required data (books, their fields) is available in the existing store. The endpoint is self-contained. The test file follows an established pattern in the repository.

    ### 6. Readiness Recommendation

    **`go`**

    The change is small, fully specified, and additive. The footprint is tight (2 files), the design is implementable with no new dependencies or schema changes, the test plan covers every observable in criterion X1 plus the must-not-break regression net, and the 3-hour budget has large headroom. There are no blockers, no architectural ambiguities, and no reviewer notes that impose additional constraints beyond what the criterion already states. The squad can proceed to implementation.
