- task_type: development.design_plan
  occurrence: 1
  call: 1
  content: |-
    # Technical Design: GET /export CSV Endpoint

    ## 1. Architecture Overview

    This change adds a single read-only endpoint, `GET /export`, to the existing FastAPI backend. It serialises the current shelf state into a CSV document and returns it as a `Response` with `Content-Type: text/csv`.

    **Component interaction:**

    ```
    Client ──► FastAPI Router (routes.py)
                    │
                    ├── store.get_all_books()   (existing, unchanged)
                    │
                    ├── csv.writer (stdlib)     (no new dependency)
                    │
                    └── Response(media_type="text/csv")  (FastAPI starlette)
    ```

    No new components, no new dependencies, no changes to `models.py`, `store.py`, `main.py`, or any frontend file. The only files touched are `backend/routes.py` (additive route handler) and the new `tests/test_criterion_X1.py`.

    ## 2. Interface Definition

    ### Endpoint Contract

    | Aspect | Value |
    |--------|-------|
    | Method | `GET` |
    | Path | `/export` |
    | Auth | None (matches existing public book endpoints) |
    | Request body | None |
    | Response status | `200` |
    | Response Content-Type | `text/csv` |
    | Response body | RFC-4180 CSV; first line is the header row; remaining lines are one per book |

    ### CSV Schema

    | Column index | Header | Source field | Serialisation |
    |---|---|---|---|
    | 0 | `title` | `book.title` (str) | raw |
    | 1 | `status` | `book.status` (str) | raw |
    | 2 | `tags` | `book.tags` (list[str]) | semicolon-joined, e.g. `fiction;sci-fi`; empty string if no tags |
    | 3 | `rating` | `book.rating` (int \| None) | `str(rating)` or empty string if `None` |

    **Rationale for semicolon-join on tags:** The CSV delimiter is a comma. Using a comma inside the tags field would force the `csv` module to quote the field, producing `"fiction,sci-fi"`. Semicolon-join keeps every row to exactly four unquoted fields, making the output trivially parseable by any spreadsheet or line-splitting tool. This is the conventional choice for list-valued fields in CSV exports (cf. TSV-like convention).

    ### Route Handler (≤ 30 lines per CONTRIBUTING.md)

    ```python
    import csv
    import io

    # … existing imports and routes …

    @app.get("/export")
    def export_shelf():
        """Return the full shelf as a CSV file."""
        books = store.get_all_books()
        buf = io.StringIO()
        writer = csv.writer(buf, lineterminator="\n")
        writer.writerow(["title", "status", "tags", "rating"])
        for book in books:
            writer.writerow([
                book.title,
                book.status,
                ";".join(book.tags),
                str(book.rating) if book.rating is not None else "",
            ])
        return Response(content=buf.getvalue(), media_type="text/csv")
    ```

    That is 12 lines of handler body (excluding the blank separator). Well under the 30-line cap.

    ### Test File Contract (`tests/test_criterion_X1.py`)

    The test file exercises the endpoint through `TestClient` (matching the product's existing backend test convention). It must:

    1. Seed the shelf with a known set of books (≥ 2, covering: multiple tags, a single tag, no tags, a `None` rating).
    2. Issue `GET /export`.
    3. Assert `response.status_code == 200`.
    4. Assert `"text/csv" in response.headers["content-type"]`.
    5. Parse the body with `csv.reader(io.StringIO(response.text))`.
    6. Assert the first row equals `["title", "status", "tags", "rating"]`.
    7. Assert the number of remaining rows equals the number of seeded books.
    8. For each seeded book, assert a row exists whose fields match in order.

    The test **fails on response content**, not on an import of the new route. An unknown path returning 404 does not satisfy this criterion.

    ## 3. Implementation Sequencing

    | Phase | Task | Depends on | Est. time |
    |-------|------|-----------|-----------|
    | 1 | Add `import csv`, `import io` to `backend/routes.py` header; add `from fastapi import Response` if not already imported | — | 2 min |
    | 2 | Append the `export_shelf` handler to `backend/routes.py` | 1 | 5 min |
    | 3 | Write `tests/test_criterion_X1.py` | 2 (to know the exact path) | 10 min |
    | 4 | Run full backend test suite (`pytest -q`) to verify X1 passes and T1/T2/T3/C1/C2 still pass | 3 | 3 min |
    | 5 | Confirm `boots` check passes (import `app`) | 2 | 1 min |

    Total estimated effort: **~21 minutes** of implementation. Well within the 3-hour budget, leaving ample room for iteration if a `must_not_break` test surfaces a regression.

    ## 4. Proto Validation Plan

    Because the change is a small, single-handler addition to an existing, well-understood codebase, the feasibility risk is minimal. One lightweight prototype is warranted to confirm the only non-trivial assumption:

    **Proto P1 — Store access pattern**

    - **Goal:** Confirm that `store` (as used in `routes.py`) exposes a method or property that returns *all* books without a filter, and that the return type is iterable with `.title`, `.status`, `.tags`, `.rating` attributes.
    - **Method:** Read `backend/store.py` and `backend/routes.py` at the baseline commit. If the existing `GET /books` (or `GET /books/search`) handler already iterates all books, the pattern is confirmed. If the store only supports filtered queries, verify that an empty-filter call returns the full shelf.
    - **Disposal:** If the pattern differs (e.g., the store returns a `List[Book]` via `store.list_books()` rather than `store.get_all_books()`), adjust the handler's one call accordingly. No structural change needed.

    No other proto is required. CSV serialisation via the stdlib `csv` module is a solved, documented pattern.

    ## 5. Unknown Classification

    | # | Unknown | Classification | Resolution / Mitigation |
    |---|---------|---------------|------------------------|
    | U1 | Exact method name on `store` to retrieve all books | **resolved** | Inferred from the existing list endpoint in `routes.py`; confirmed during Proto P1. If the name differs, it is a one-line fix. |
    | U2 | Whether `book.rating` can be `None` | **resolved** | The criterion names `rating` as a field. The handler guards with `str(book.rating) if book.rating is not None else ""`. Either way the criterion is met (a value is present in the column). |
    | U3 | How to serialise a multi-element `tags` list into one CSV field | **resolved** | Semicolon-join. Chosen as the conventional, unambiguous choice. The criterion requires the field to be named `tags` and present in order; it does not mandate an internal delimiter. |
    | U4 | Whether an empty shelf (zero books) should still return 200 with only the header row | **resolved** | Yes. A CSV with only a header is valid; the criterion says "one row per book on the shelf" — if there are zero books, there are zero data rows. Status remains 200. |
    | U5 | Line terminator: `\n` vs `\r\n` | **resolved** | Use `\n` (Linux-native, matches test assertions reading the body as text). The `csv.writer` `lineterminator` parameter is set explicitly. |
    | U6 | Whether the `Response` import is already in `routes.py` | **acceptable_risk** | `fastapi` is a declared dependency. If `Response` is not yet imported, add it. One-line change. Mitigation: the import is part of Phase 1. |
    | U7 | Whether `TestClient` fixtures in `conftest.py` auto-seed or the test must seed explicitly | **resolved** | The test seeds explicitly via the existing `POST /books` endpoint through the same `TestClient`, guaranteeing a deterministic state regardless of fixture defaults. This also satisfies the CONTRIBUTING rule that tests fail on *response content*, not on fixture imports. |

    **No `blocker` or `requires_human_decision` unknowns.** All unknowns are resolved or carry trivial, low-cost mitigations.

    ## 6. Must-Not-Break Verification Strategy

    The existing criteria T1, T2, T3, C1, C2 correspond to test files that already exist under `tests/`. The change is purely additive (a new route + a new test file), so the existing handlers in `routes.py` are untouched. The verification is:

    1. Run `pytest -q` after the change. All pre-existing test files must pass.
    2. The new test file `test_criterion_X1.py` is discovered by pytest's default pattern (`test_*.py` under the repo root) and runs alongside the others.
    3. The `boots` check (`python -c "from backend.main import app"`) confirms no import-time breakage.
    4. Frontend tests are unaffected (no frontend files in the footprint).

    ## 7. Files Emitted

    | Path | Action |
    |------|--------|
    | `backend/routes.py` | **Replaced** — existing content + `import csv`, `import io`, (and `Response` if absent) in the import block, plus the `export_shelf` handler appended. All existing routes unchanged. |
    | `tests/test_criterion_X1.py` | **New** — criterion test as described in §2. |

    No other file is modified or created. The footprint is exactly two files, matching the change request.

    ## 8. Deferrals

    None. The entire scope fits comfortably within the 3-hour budget. No work is deferred.
- task_type: qa.define_test_strategy
  occurrence: 1
  call: 1
  content: |-
    # QA Test Strategy: GET /export CSV Endpoint

    ## Acceptance Checklist

    Derived from criterion X1 and the change request's `must_not_break` set. Each item is a concrete pass/fail check to be verified during implementation review and test execution.

    ### X1 — GET /export returns shelf as CSV

    - [ ] `GET /export` returns HTTP status **200**
    - [ ] Response header `Content-Type` is **`text/csv`** (charset suffix permitted, e.g. `text/csv; charset=utf-8`)
    - [ ] Response body's **first line** is a comma-separated header containing exactly the fields `title`, `status`, `tags`, `rating` in that order
    - [ ] Each subsequent line represents **exactly one book** currently on the shelf
    - [ ] The number of data rows equals the number of books on the shelf at the time of the request
    - [ ] Each data row has **four fields** corresponding to the header order
    - [ ] The CSV body is parseable by a standard CSV reader (no unescaped delimiters within fields, no unescaped quotes, no bare newlines inside fields)
    - [ ] An **empty shelf** (zero books) returns 200 with only the header row and no data rows
    - [ ] Books with **no tags** produce a well-formed row (empty or placeholder value in the `tags` column; no trailing comma mismatch)
    - [ ] Books whose `title` or `tags` contain **commas, double-quotes, or newlines** produce correctly-escaped CSV fields

    ### Must-Not-Break — Existing Criteria Still Pass

    - [ ] **T1** — existing criterion test passes unchanged
    - [ ] **T2** — existing criterion test passes unchanged
    - [ ] **T3** — existing criterion test passes unchanged
    - [ ] **C1** — existing criterion test passes unchanged
    - [ ] **C2** — existing criterion test passes unchanged
    - [ ] `boots` check (`.venv/bin/python -c "from backend.main import app"`) succeeds
    - [ ] Full `backend_tests` suite passes with zero regressions

    ### Structural / Contribution Compliance

    - [ ] `GET /export` handler in `backend/routes.py` is **under 30 lines** (CONTRIBUTING.md rule)
    - [ ] New test file is `tests/test_criterion_X1.py` (matches footprint and criterion_files)
    - [ ] Test uses the product's established test-client pattern (FastAPI `TestClient` or `httpx.AsyncClient`), not a live server
    - [ ] Test imports only packages declared in the product's manifests
    - [ ] No files outside the footprint (`backend/routes.py`, `tests/test_criterion_X1.py`) are modified

    ---

    ## Test Strategy Note

    ### Scope Decisions

    | Layer | In scope? | Rationale |
    |-------|-----------|-----------|
    | **Unit** (isolated function tests) | No | The change is a single HTTP endpoint; there is no internal helper function whose logic warrants isolated unit testing. The CSV serialisation is the behaviour under test and is exercised through the endpoint. |
    | **Integration** (endpoint via TestClient) | **Yes — primary** | The criterion is defined on an HTTP surface (`GET /export`). The test drives the running application through FastAPI's `TestClient`, populates the shelf via existing store/API, calls `/export`, and asserts on status, headers, and body content. This is the product's established pattern for endpoint criteria. |
    | **Contract** (external consumer schema) | No | No external consumer contract is defined in the PRD delta. The CSV format is specified by the criterion itself; there is no published schema to verify against. |
    | **E2E / Frontend** | No | The footprint touches no frontend file. The criterion's surface is a backend endpoint. No UI change means no vitest scope. |

    ### Test File: `tests/test_criterion_X1.py`

    The test file will contain the following test functions (grouped for clarity; final naming is the implementer's choice):

    1. **`test_export_returns_200_and_csv_content_type`** — Populates the shelf with a known set of books, calls `GET /export`, asserts status 200 and `Content-Type: text/csv`.
    2. **`test_export_header_row`** — Asserts the first line is `title,status,tags,rating` (or the equivalent with proper quoting if any field name needed it — it doesn't).
    3. **`test_export_one_row_per_book`** — Populates N books, asserts the body has exactly N+1 lines (header + N data rows), and each data row has 4 comma-separated fields.
    4. **`test_export_field_order_and_values`** — Populates a book with known title, status, tags, and rating; asserts the corresponding row's fields match in order.
    5. **`test_export_empty_shelf`** — With no books, asserts 200, header-only body (1 line).
    6. **`test_export_special_characters_in_title`** — Adds a book whose title contains commas and/or quotes; asserts the row is still parseable by `csv.reader` and the round-tripped value matches.
    7. **`test_export_book_with_no_tags`** — Adds a book with an empty tags list; asserts the row is well-formed (4 fields, no spurious empty columns).

    > **Note on tags serialisation:** The criterion specifies the column name `tags` but does not prescribe how a list of tags maps to a single CSV field (e.g. semicolon-delimited, JSON array string, etc.). The implementation must pick one consistent scheme. The test in item 7 above will lock in whatever scheme the implementation uses by asserting structural validity (4 fields, parseable). If the implementer's scheme is, say, `tag1;tag2`, the test asserts that. This is an implementation detail, not a criterion violation, so the test asserts *consistency and parseability* rather than a specific delimiter unless the dev design pins one.

    ### Regression Protection

    The `must_not_break` set (T1, T2, T3, C1, C2) is enforced by the product's own `backend_tests` check running the full pytest suite. No separate regression test file is needed or permitted (footprint constraint). The implementation must not alter any existing endpoint's behaviour.

    ### What Is NOT Tested Here

    - Frontend rendering of an export button or download action — no frontend change in this cycle.
    - Large-shelf performance (thousands of books) — out of scope for a feature-add; would be a separate performance criterion.
    - Concurrent export while another request mutates the shelf — the endpoint is a simple read; the existing store's thread-safety model is already covered by existing tests.

    ---

    ## Defect Severity Rubric

    | Severity | Label | Definition | Examples in this change |
    |----------|-------|------------|-------------------------|
    | **Blocker** | `S0` | Endpoint does not exist, returns 5xx, or the application fails to boot. Must-not-break criteria fail. | `GET /export` returns 500; importing `backend.routes` raises; T1–C2 tests regress. |
    | **Critical** | `S1` | Criterion X1 is not met: wrong status code, wrong Content-Type, missing/mis-ordered header fields, wrong number of rows. | Returns 200 but Content-Type is `text/plain`; header is `title,status,rating,tags` (wrong order); 3 books on shelf but only 2 data rows. |
    | **Major** | `S2` | CSV is structurally invalid or data is corrupted: unescaped delimiters, lost fields, wrong values in a field. | A title containing a comma splits the row into 5 fields; a book's rating appears in the status column. |
    | **Minor** | `S3` | Cosmetic or edge-case formatting issue that does not break parseability or data integrity. | Trailing newline at end of CSV body (acceptable in most parsers); tags column uses a delimiter different from what the test expects but is still consistent and parseable. |
    | **Trivial** | `S4` | Style, naming, or documentation nit. No functional impact. | Handler is 31 lines (one over the 30-line limit) but logic is correct; test variable naming is unclear. |

    **Gate rule:** Any S0 or S1 defect blocks acceptance. S2 defects block acceptance unless they are proven unreachable in the deployed product's data model (e.g. the store schema forbids commas in titles — verify before dismissing). S3 and S4 are recorded and may be deferred.

    ---

    ## Risk-Based Test Priorities

    Ranked by likelihood of defect × impact if missed:

    | Priority | Area | Risk Rationale | Coverage Emphasis |
    |----------|------|----------------|-------------------|
    | **P1** | **CSV structural correctness** (header fields, field order, row count) | The criterion is explicit about these. A mis-ordered header or off-by-one row count is an S1 defect. Easy to get wrong if the implementer builds the row in a different order than the header. | Test items 2, 3 above. Use `csv.reader` to parse the body and assert column count and values programmatically rather than string-matching. |
    | **P2** | **Content-Type and status code** | FastAPI's default `Response` sets `application/json`. If the implementer forgets to set `media_type="text/csv"` or uses a `FileResponse` with the wrong MIME, the criterion fails. | Test item 1. Assert the exact header value. |
    | **P3** | **Special characters in title/tags** | Python's `csv.writer` handles quoting, but a manual string-join approach (f-strings, `",".join`) will break on commas. This is the most likely source of S2 defects. | Test item 6. Use `csv.reader` round-trip: write via endpoint, read back, compare to source data. |
    | **P4** | **Empty shelf** | Edge case; easy to forget. Returning 200 with just a header is correct; returning 404 or an empty body is not. | Test item 5. |
    | **P5** | **Book with no tags / no rating** | Depends on how the store represents "absent" values (empty list vs None vs missing key). If the implementer does `book["tags"][0]` instead of handling an empty list, this 500s. | Test item 7. |
    | **P6** | **Regression on existing endpoints** | Low risk (additive change, no shared-state mutation), but a misplaced route decorator or import could shadow an existing path. | Covered by the full `backend_tests` run; no separate test needed within footprint. |
    | **P7** | **Handler length (< 30 lines)** | CONTRIBUTING.md rule. Low functional risk but a process gate. | Visual / linter check at review time. |

    ---

    ## Initialisation Status

    | Check | Result |
    |-------|--------|
    | Role configuration loaded | ✅ QA Agent, Stage A (planning) |
    | Change request parsed | ✅ `prop_39de98fc9676`, 1 criterion (X1), 5 must-not-break (T1–T3, C1–C2) |
    | Footprint identified | ✅ `backend/routes.py`, `tests/test_criterion_X1.py` |
    | Product conventions confirmed | ✅ pytest + TestClient, vitest, FastAPI + React/Vite |
    | Prior test files reviewed (names) | ✅ 5 criterion files (T1–T3, C1–C2) + feature tests present |
    | Reviewer notes processed | ✅ "unattended recording: approved as it stands" — no additional behavioural constraints beyond the criterion |
    | Pending tasks from prior cycles | None identified |

    **Ready for implementation workload.** The test strategy above defines *what* to test and *how*; test code is produced in the implementation cycle, not here.
