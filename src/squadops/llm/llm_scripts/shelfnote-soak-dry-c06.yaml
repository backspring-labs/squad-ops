            f"Tags field is {tagged_row[2]!r}, expected 'fiction;sci-fi'"
        )

        untagged_row = data["Untagged"]
        assert untagged_row[2] == "", (
            f"Empty tags field is {untagged_row[2]!r}, expected ''"
        )


    def test_none_rating_produces_empty_string(client):
        """A book with rating=None exports the rating field as '' (empty string).

        Fault caught: str(None) → "None" appears in the CSV cell.
        """
        client.post("/books", json={"title": "Unrated", "author": "A", "added_by": "U"})
        res = client.get("/export")
        assert res.status_code == 200
        rows = _parse_csv(res.text)
        assert len(rows) == 2, f"Expected 2 rows, got {len(rows)}"
        data_row = rows[1]
        assert data_row[3] == "", (
            f"None rating exported as {data_row[3]!r}, expected ''"
        )


    def test_integer_rating_serialised_as_decimal_string(client):
        """A book with rating=4 exports the rating field as '4', not '4.0'.

        Fault caught: float(rating) or json.dumps(4) produces '4.0' or a non-string.
        """
        b = client.post("/books", json={"title": "Rated", "author": "A", "added_by": "U"}).json()
        client.put(f"/books/{b['id']}/rating", json={"rating": 4})

        res = client.get("/export")
        assert res.status_code == 200
        rows = _parse_csv(res.text)
        assert len(rows) == 2
        data_row = rows[1]
        assert data_row[3] == "4", (
            f"Integer rating 4 exported as {data_row[3]!r}, expected '4'"
        )


    def test_empty_shelf_returns_header_only_single_row(client):
        """Zero books → 200, body is exactly one line: the header row.

        Faults caught: 500 on empty shelf, empty body, or missing header row.
        """
        res = client.get("/export")
        assert res.status_code == 200, f"Expected 200 on empty shelf, got {res.status_code}"
        rows = _parse_csv(res.text)
        assert len(rows) == 1, f"Expected 1 row (header only), got {len(rows)}: {rows}"
        assert rows[0] == ["title", "status", "tags", "rating"], (
            f"Sole row is {rows[0]!r}, expected the header"
        )


    def test_special_characters_in_title_round_trip(client):
        """A title containing a comma, a double-quote, and a newline round-trips
        through csv.reader to the original string exactly.

        Faults caught: raw f-string interpolation without quoting splits the row;
        csv.writer is not used so special characters corrupt column alignment.
        """
        nasty = 'He said, "hi"\nsecond line'
        client.post("/books", json={"title": nasty, "author": "Q", "added_by": "U"})

        res = client.get("/export")
        assert res.status_code == 200
        rows = _parse_csv(res.text)
        assert len(rows) == 2, f"Expected 2 rows, got {len(rows)}: {rows}"
        data_row = rows[1]
        assert len(data_row) == 4, (
            f"Data row has {len(data_row)} fields, expected 4: {data_row}"
        )
        assert data_row[0] == nasty, (
            f"Title round-trip failed: {data_row[0]!r} != {nasty!r}"
        )
