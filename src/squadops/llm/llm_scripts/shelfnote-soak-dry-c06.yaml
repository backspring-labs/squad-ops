    ```python:tests/test_criterion_X1.py
    """Criterion X1: GET /export — CSV export of the shelf with header row and one row per book.

    Faults distinguished from correct behaviour:
    - Wrong Content-Type (application/json instead of text/csv)
    - Wrong or missing header row (missing field, wrong order)
    - Wrong row count (off-by-one, extra blank row)
    - Tags not semicolon-joined (CSV-split or JSON array instead of "a;b")
    - Empty tags list not producing empty field
    - None rating serialised as "None" instead of ""
    - Integer rating serialised as "4.0" (float) instead of "4"
    - Empty shelf returning 500, empty body, or missing header
    - Special characters (comma, quote, newline) corrupting row structure
    """

    import csv
    import io


    def _parse_csv(text):
        """Parse a CSV body into a list of rows (lists of strings)."""
        return list(csv.reader(io.StringIO(text)))


    def test_content_type_is_text_csv(client):
        """GET /export carries Content-Type text/csv, not application/json.

        Fault caught: FastAPI's default JSON response type leaks through because
        the handler returns a plain string or dict instead of a StreamingResponse
        with media_type='text/csv'.
        """
        client.post("/books", json={"title": "Dune", "author": "Herbert", "added_by": "A"})
        res = client.get("/export")
        assert res.status_code == 200
        assert "text/csv" in res.headers["content-type"], (
            f"Expected text/csv in Content-Type, got {res.headers['content-type']!r}"
        )


    def test_header_row_lists_four_fields_in_order(client):
        """First line of the CSV is the header: title,status,tags,rating.

        Faults caught: header omits a field, lists them in a different order,
        or uses different names (e.g. 'name' instead of 'title').
        """
        client.post("/books", json={"title": "Dune", "author": "Herbert", "added_by": "A"})
        res = client.get("/export")
        assert res.status_code == 200
        rows = _parse_csv(res.text)
        assert len(rows) >= 1, "CSV body is empty"
        assert rows[0] == ["title", "status", "tags", "rating"], (
            f"Header row {rows[0]!r} != expected ['title', 'status', 'tags', 'rating']"
        )


    def test_one_data_row_per_seeded_book(client):
        """N seeded books produce exactly N data rows after the header.

        Faults caught: off-by-one in the loop (N+1 or N-1 rows), or an extra
        trailing blank line that csv.reader parses as an empty row.
        """
        for i in range(4):
            client.post("/books", json={"title": f"Book {i}", "author": "A", "added_by": "U"})
        res = client.get("/export")
        assert res.status_code == 200
        rows = _parse_csv(res.text)
        # 1 header + 4 data rows = 5 total
        assert len(rows) == 5, f"Expected 5 rows (1 header + 4 data), got {len(rows)}: {rows}"


    def test_tags_semicolon_joined_and_empty_tags_produce_empty_field(client):
        """Tags ["fiction","sci-fi"] round-trip as "fiction;sci-fi"; tags=[] → "".

        Faults caught:
          - comma-joined ("fiction,sci-fi") splits the CSV row into extra columns
          - JSON-serialised (["fiction","sci-fi"]) is not a plain string
          - empty list yields a placeholder like "[]" or "none" instead of ""
        """
        b1 = client.post("/books", json={"title": "Tagged", "author": "A", "added_by": "U"}).json()
        client.post(f"/books/{b1['id']}/tags", json={"tag": "fiction"})
        client.post(f"/books/{b1['id']}/tags", json={"tag": "sci-fi"})

        b2 = client.post("/books", json={"title": "Untagged", "author": "B", "added_by": "U"}).json()

        res = client.get("/export")
        assert res.status_code == 200
        rows = _parse_csv(res.text)
        # rows[0] is header; find the two data rows by title
        data = {r[0]: r for r in rows[1:]}
        assert "Tagged" in data, f"'Tagged' missing from CSV rows: {list(data.keys())}"
        assert "Untagged" in data, f"'Untagged' missing from CSV rows: {list(data.keys())}"

        tagged_row = data["Tagged"]
        assert tagged_row[2] == "fiction;sci-fi", (
            f"Tags field is {tagged_row[2]!r}, expected 'fiction;sci-fi'"
        )

        untagged_row = data["Untagged"]
        assert untagged_row[2] == "", (
            f"Empty tags field is {untagged_row[2]!r}, expected ''"
        )


    def test_none_rating_produces_empty_string(client):
        """A book with rating=None exports the rating field as '' (empty string).

        Fault caught: str(None) → "None" appears in the CSV cell.
        """
        client.post("/books", json={"title": "Unrated", "author": "A", "added_by": "U"})
        res = client.get("/export")
        assert res.status_code == 200
        rows = _parse_csv(res.text)
        assert len(rows) == 2, f"Expected 2 rows, got {len(rows)}"
        data_row = rows[1]
        assert data_row[3] == "", (
            f"None rating exported as {data_row[3]!r}, expected ''"
        )


    def test_integer_rating_serialised_as_decimal_string(client):
        """A book with rating=4 exports the rating field as '4', not '4.0'.

        Fault caught: float(rating) or json.dumps(4) produces '4.0' or a non-string.
        """
        b = client.post("/books", json={"title": "Rated", "author": "A", "added_by": "U"}).json()
        client.put(f"/books/{b['id']}/rating", json={"rating": 4})

        res = client.get("/export")
        assert res.status_code == 200
        rows = _parse_csv(res.text)
        assert len(rows) == 2
        data_row = rows[1]
        assert data_row[3] == "4", (
            f"Integer rating 4 exported as {data_row[3]!r}, expected '4'"
        )


    def test_empty_shelf_returns_header_only_single_row(client):
        """Zero books → 200, body is exactly one line: the header row.

        Faults caught: 500 on empty shelf, empty body, or missing header row.
        """
        res = client.get("/export")
        assert res.status_code == 200, f"Expected 200 on empty shelf, got {res.status_code}"
        rows = _parse_csv(res.text)
        assert len(rows) == 1, f"Expected 1 row (header only), got {len(rows)}: {rows}"
        assert rows[0] == ["title", "status", "tags", "rating"], (
            f"Sole row is {rows[0]!r}, expected the header"
        )


    def test_special_characters_in_title_round_trip(client):
        """A title containing a comma, a double-quote, and a newline round-trips
        through csv.reader to the original string exactly.

        Faults caught: raw f-string interpolation without quoting splits the row;
        csv.writer is not used so special characters corrupt column alignment.
        """
        nasty = 'He said, "hi"\nsecond line'
        client.post("/books", json={"title": nasty, "author": "Q", "added_by": "U"})

        res = client.get("/export")
        assert res.status_code == 200
        rows = _parse_csv(res.text)
        assert len(rows) == 2, f"Expected 2 rows, got {len(rows)}: {rows}"
        data_row = rows[1]
        assert len(data_row) == 4, (
            f"Data row has {len(data_row)} fields, expected 4: {data_row}"
        )
        assert data_row[0] == nasty, (
            f"Title round-trip failed: {data_row[0]!r} != {nasty!r}"
        )
    ```
