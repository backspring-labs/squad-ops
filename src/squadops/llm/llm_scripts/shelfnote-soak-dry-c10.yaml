    ## Consolidated Plan

    ### 1. Change Summary

    **Objective:** Add reading-date tracking to the existing Shelfnote book representation. A reader sets `start_date` and `finished_date` on a book via `PATCH /books/{id}`; the response reflects those values and, when both are present, a computed `duration_days` field (whole-day difference).

    **Nature of change:** Purely additive. Two optional fields on the Book model, one new (or extended) PATCH route, store persistence for the new fields, and two new criterion tests. No existing behaviour is modified or retired.

    **Time budget:** 3 hours. Estimated implementation: ~90 min. Ample margin for review and test iteration.

    ---

    ### 2. Footprint (Authoritative — Only These Files May Change)

    | File | Action | Rationale |
    |------|--------|-----------|
    | `backend/models.py` | Modify | Add `start_date`, `finished_date`, computed `duration_days` to Book model |
    | `backend/routes.py` | Modify | Add/extend `PATCH /books/{id}` handler |
    | `backend/store.py` | Modify | Persist and retrieve the two new date fields |
    | `tests/test_criterion_RD1.py` | Create | Criterion RD1 tests |
    | `tests/test_criterion_RD2.py` | Create | Criterion RD2 tests |

    All other files retain their accepted implementation at commit `bcecd1e8`.

    ---

    ### 3. Technical Design

    #### 3.1 Model Layer (`backend/models.py`)

    - Add to the Book model (Pydantic):
      - `start_date: Optional[date] = None`
      - `finished_date: Optional[date] = None`
    - Add a computed field or property:
      - `duration_days: Optional[int] = None`
      - Computed as `(finished_date - start_date).days` when both are non-None; otherwise `None`.
      - Use `@computed_field` (Pydantic v2) or a `@property` depending on what the existing model already uses (inspect at implementation time).
    - Define a `BookPatch` (or `BookUpdate`) Pydantic model accepting optional `start_date` and `finished_date` (both `Optional[date]`). This keeps the PATCH body schema explicit and separate from the full `Book` model.

    #### 3.2 Route Layer (`backend/routes.py`)

    - Add handler: `PATCH /books/{id}`
      - Accept `BookPatch` as JSON body.
      - Validate the book exists (return 404 if not — consistent with existing patterns in the file).
      - Call store update with the new date values.
      - Return the updated book representation (200) including `start_date`, `finished_date`, and `duration_days`.
    - Keep the handler under 30 lines per CONTRIBUTING.md.
    - If a PATCH route already exists for other fields, extend it; if not, add a new one. Either way, the footprint constraint is the same file.

    #### 3.3 Store Layer (`backend/store.py`)

    - Extend the book-update method to accept and persist `start_date` and `finished_date`.
    - If the store is in-memory (dict-based, as the blueprint suggests), this is a field addition to the stored record. If file-backed, ensure serialization handles `date` objects (ISO-8601 strings on disk).
    - The store's `get` method must return the full book including the new fields so the route can build the response.

    #### 3.4 Computed `duration_days` Logic

    ```
    duration_days = (finished_date - start_date).days  # when both present
    ```
    - Returns an integer (e.g., 17 for Jan 15 → Feb 1).
    - Is `None` when either date is absent.
    - Lives on the model (not the route) so any serialization path carries it.

    ---

    ### 4. Test Strategy

    Both test files use `TestClient` (FastAPI) per CONTRIBUTING.md. Each fails on response content, not on import.

    #### `tests/test_criterion_RD1.py`

    - **Test:** PATCH `/books/{id}` with body `{"start_date": "2024-01-15", "finished_date": "2024-02-01"}` on an existing book.
    - **Assert:** Response status is 200. Response JSON contains `"start_date": "2024-01-15"` and `"finished_date": "2024-02-01"`.
    - **Setup:** Create a book first via existing POST endpoint (or fixture), then PATCH it.

    #### `tests/test_criterion_RD2.py`

    - **Test:** Same PATCH as above; inspect the `duration_days` field.
    - **Assert:** Response JSON contains `"duration_days": 17`.
    - **Additional edge (optional, within the same file):** PATCH with only one date set → `duration_days` is absent or null. This guards against accidental computation with a missing operand.

    #### Must-Not-Break Guard

    The existing test suite (T1, T2, T3, C1, C2, X1, N1 and all other `test_*.py` files) must pass unchanged. The design is additive (new optional fields, new/extended route), so existing endpoints and responses are unaffected. No action needed beyond running the full suite.

    ---

    ### 5. Task Decomposition & Assignment

    | # | Task | Assignee | Est. Time |
    |---|------|----------|-----------|
    | 1 | Implement model changes (`models.py`) + store changes (`store.py`) + route changes (`routes.py`) | dev | 45 min |
    | 2 | Write `tests/test_criterion_RD1.py` | qa | 15 min |
    | 3 | Write `tests/test_criterion_RD2.py` | qa | 15 min |
    | 4 | Run full test suite (`pytest` + `npm test`); verify all pass including must-not-break | dev + qa | 15 min |
    | 5 | Lead review & sign-off | lead | 10 min |

    **Total estimated:** ~100 min of 180 min budget. Remaining time is buffer for iteration.

    ---

    ### 6. Sufficiency Assessment

    | Criterion | Assessment | Score |
    |-----------|-----------|-------|
    | Scope clarity | Footprint is 5 files; criteria are precise with exact observable strings; no ambiguity about what is in-scope vs. out. | ✓ |
    | Technical feasibility | Standard Pydantic field addition + one PATCH route + store update. No new dependencies, no architectural pattern shift. | ✓ |
    | Risk coverage | Only risks are: (a) PATCH route may or may not already exist — resolved by inspecting `routes.py` at implementation; (b) date serialization in store — resolved by using ISO strings. No blocker-classified unknowns. | ✓ |
    | Test strategy alignment | Two criteria → two test files. Observables map 1:1 to assertions. Must-not-break set is covered by running the full existing suite. | ✓ |
    | Resource fit | 3-hour budget; ~100 min estimated. Squad has dev + qa; no external tooling or infrastructure change needed. | ✓ |

    **Overall sufficiency: 5/5**

    ---

    ### 7. Unknowns Register

    | ID | Description | Class | Mitigation |
    |----|-------------|-------|------------|
    | U1 | Whether a PATCH `/books/{id}` route already exists in `routes.py` (for other fields) | Minor | Dev inspects file at implementation; add or extend accordingly. No design change either way. |
    | U2 | Whether the store uses in-memory dict or file-backed persistence | Minor | Dev inspects `store.py`; both cases are handled by the same pattern (add field to record). |

    No blocker-classified unknowns.

