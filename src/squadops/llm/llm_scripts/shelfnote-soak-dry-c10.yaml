    ```python:tests/test_criterion_RD2.py
    """Criterion RD2: duration_days is the whole-day difference between start_date and
    finished_date, computed at response time, present only when both dates are set.

    Faults distinguished from correct behaviour:
    - duration_days is the wrong value (off-by-one from subtraction order, or
      total_seconds() // 86400 instead of .days on a date-timedelta).
    - duration_days is present in the response when only one of the two dates is set.
    - duration_days is computed from string parsing rather than date objects
      (fails on a month-boundary pair like Jan 31 / Feb 1).
    - duration_days is stored on the book record rather than computed at response
      time (a PATCH that clears one date leaves a stale value).
    """


    def _create_book(client):
        """POST a book and return its JSON dict."""
        res = client.post("/books", json={"title": "RD2 Book", "author": "A", "added_by": "U"})
        assert res.status_code == 201
        return res.json()


    def test_duration_days_correct_value_for_stated_pair(client):
        """PATCH 2024-01-15 / 2024-02-01 → 200 with duration_days == 17.

        Faults caught:
          - Off-by-one from reversed subtraction (start - finished → -17, or abs missed).
          - total_seconds() // 86400 on a datetime (fractional-day drift) vs .days on
            a proper date-timedelta.
        """
        book = _create_book(client)
        res = client.patch(
            f"/books/{book['id']}",
            json={"start_date": "2024-01-15", "finished_date": "2024-02-01"},
        )
        assert res.status_code == 200
        body = res.json()
        assert body["start_date"] == "2024-01-15"
        assert body["finished_date"] == "2024-02-01"
        assert body["duration_days"] == 17, (
            f"Expected duration_days 17 (Jan 15 → Feb 1 is 17 days), "
            f"got {body.get('duration_days')!r}"
        )
        assert isinstance(body["duration_days"], int), (
            f"duration_days must be an int, got {type(body['duration_days']).__name__}"
        )


    def test_duration_days_month_boundary_one_day(client):
        """2024-01-31 → 2024-02-01 is exactly 1 day.

        Fault caught: string-based arithmetic (int('31') - int('01') == 30, or
        '31' - '01' string ops) instead of proper date-object subtraction.
        An off-by-one implementation gives 0 or 2 here.
        """
        book = _create_book(client)
        res = client.patch(
            f"/books/{book['id']}",
            json={"start_date": "2024-01-31", "finished_date": "2024-02-01"},
        )
        assert res.status_code == 200
        body = res.json()
        assert body["duration_days"] == 1, (
            f"Expected duration_days 1 (Jan 31 → Feb 1), got {body.get('duration_days')!r}"
        )


    def test_duration_days_absent_when_only_one_date_set(client):
        """PATCH only start_date (no finished_date) → duration_days is absent or null.

        Fault caught: conditional-visibility rule violated — the response includes
        duration_days even though only one of the two required dates is present.
        """
        book = _create_book(client)
        res = client.patch(
            f"/books/{book['id']}",
            json={"start_date": "2024-01-15"},
        )
        assert res.status_code == 200
        body = res.json()
        assert body["start_date"] == "2024-01-15"
        assert body.get("duration_days") is None, (
            f"duration_days must be absent/null when only start_date is set, "
            f"got {body.get('duration_days')!r}"
        )


    def test_duration_days_not_stale_after_clearing_one_date(client):
        """Set both dates → duration_days present; clear one date → duration_days gone.

        Fault caught: duration_days is persisted on the book record. After a PATCH
        removes one date, the stale stored value still appears in the response.
        Correct behaviour: duration_days is derived at response time from the two
        dates, so with only one present it vanishes.
        """
        book = _create_book(client)

        # Set both dates; confirm duration_days is correct
        res1 = client.patch(
            f"/books/{book['id']}",
            json={"start_date": "2024-01-15", "finished_date": "2024-02-01"},
        )
        assert res1.status_code == 200
        assert res1.json()["duration_days"] == 17

        # Clear finished_date explicitly
        res2 = client.patch(
            f"/books/{book['id']}",
            json={"finished_date": None},
        )
        assert res2.status_code == 200
        body = res2.json()
        assert body["finished_date"] is None, (
            f"Expected finished_date null after clear, got {body['finished_date']!r}"
        )
        assert body.get("duration_days") is None, (
            f"duration_days should be absent after clearing one date, "
            f"got {body.get('duration_days')!r} — value is stored, not computed"
        )
