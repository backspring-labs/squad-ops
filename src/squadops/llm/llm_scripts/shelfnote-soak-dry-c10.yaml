- task_type: development.design_plan
  occurrence: 1
  call: 1
  content: |-
    # Technical Design — Increment: Book Reading Dates (SN-13)

    ## 1. Architecture Overview

    This increment adds two optional date fields (`start_date`, `finished_date`) to the existing Book entity and a derived integer field (`duration_days`) that appears in the book's API representation whenever both dates are set. The change is confined to the three backend files the footprint allows plus two new test files.

    ```
    ┌─────────────────────────────────────────────────────────────────┐
    │  PATCH /books/{id}  (existing endpoint, extended)              │
    │                                                                 │
    │  Request body: { start_date?, finished_date?, ...existing }    │
    │  Response body: { ..., start_date?, finished_date?,            │
    │                   duration_days? }                              │
    └──────────────┬──────────────────────────────────────────────────┘
                   │
                   ▼
    ┌─────────────────────────────────────────────────────────────────┐
    │  routes.py — PATCH handler (≤ 30 lines)                        │
    │  • Parses optional date fields from patch body                  │
    │  • Delegates to store.update(...)                               │
    │  • Builds response: adds duration_days = (fin − start).days    │
    │    when both are non-None                                       │
    └──────────────┬──────────────────────────────────────────────────┘
                   │
                   ▼
    ┌─────────────────────────────────────────────────────────────────┐
    │  store.py — in-memory update                                   │
    │  • Accepts start_date, finished_date as optional kwargs        │
    │  • Writes them onto the stored book record                     │
    └──────────────┬──────────────────────────────────────────────────┘
                   │
                   ▼
    ┌─────────────────────────────────────────────────────────────────┐
    │  models.py — Pydantic schemas                                  │
    │  • Book model gains: start_date: Optional[date] = None         │
    │                      finished_date: Optional[date] = None       │
    │  • Patch/Update schema gains the same two optional fields      │
    │  • duration_days is NOT stored; it is a response-time scalar   │
    └─────────────────────────────────────────────────────────────────┘
    ```

    **Why compute `duration_days` at response time rather than store it:**
    The criteria state it is a *representation* value derived from two stored dates. Computing it in the route handler means it is always consistent regardless of which subset of fields a PATCH touches (e.g., a future PATCH that sets only `start_date` when `finished_date` was already present). Storing it would require an update trigger on every date mutation and adds a field that must be kept in sync — more failure surface for no benefit at this scale.

    ---

    ## 2. Interface Definitions

    ### 2.1 Model additions (`backend/models.py`)

    | Field | Type | Default | Notes |
    |-------|------|---------|-------|
    | `start_date` | `Optional[date]` | `None` | ISO-8601 parsed by Pydantic |
    | `finished_date` | `Optional[date]` | `None` | ISO-8601 parsed by Pydantic |

    These are added to:
    - The **Book** representation model (the one the store holds and the routes serialize).
    - The **update/patch** input schema (the Pydantic model used as the `PATCH /books/{id}` body parameter).

    `duration_days: Optional[int]` is **not** added to the stored model. It is assembled into the response dict in `routes.py`.

    ### 2.2 Route contract (`backend/routes.py`)

    **PATCH `/books/{id}`** — extended body:

    ```json
    {
      "start_date": "2024-01-15",      // optional, ISO date string
      "finished_date": "2024-02-01"    // optional, ISO date string
    }
    ```

    Extended response (200):

    ```json
    {
      "id": "...",
      "title": "...",
      "...existing fields...",
      "start_date": "2024-01-15",
      "finished_date": "2024-02-01",
      "duration_days": 17
    }
    ```

    Rules:
    - If only one of the two dates is present, the other is `null` (or omitted if the existing serialization pattern omits nulls) and `duration_days` is **absent** from the response.
    - If neither is present, both are `null`/omitted and `duration_days` is absent.
    - `duration_days` is a non-negative integer = `(finished_date - start_date).days`. If it would be negative (finished before start), the value is still computed (negative int); the criteria do not specify a guard, and the pre-registration's written rule gives no additional constraint. The reviewer notes contain no extra requirement here.

    ### 2.3 Store contract (`backend/store.py`)

    The `update` (or equivalent mutation) method gains two optional keyword arguments:

    ```python
    def update_book(self, book_id: str, ..., start_date: date | None = None,
                    finished_date: date | None = None, ...) -> dict:
    ```

    They are written onto the stored record exactly like existing optional fields (e.g., `reading_status`, `rating`). No validation logic lives in the store — that is the model's job.

    ### 2.4 Test contract

    | File | Proves | Method |
    |------|--------|--------|
    | `tests/test_criterion_RD1.py` | PATCH with both dates → 200, response contains both date strings | `TestClient` (or `httpx.AsyncClient`) → assert on response JSON |
    | `tests/test_criterion_RD2.py` | PATCH with both dates → 200, response contains `"duration_days": 17` | Same pattern |

    Both tests follow CONTRIBUTING.md: exercise the running app through the test client, fail on response content, do not import framework internals.

    ---

    ## 3. Implementation Sequencing

    | Phase | File(s) | Work | Dependency |
    |-------|---------|------|------------|
    | **1** | `backend/models.py` | Add `start_date`, `finished_date` to Book and patch schemas | None |
    | **2** | `backend/store.py` | Accept and persist the two new fields in the update path | Phase 1 |
    | **3** | `backend/routes.py` | Extend PATCH handler: pass dates to store, build response with `duration_days` | Phases 1–2 |
    | **4** | `tests/test_criterion_RD1.py` | New file: RD1 test | Phase 3 |
    | **5** | `tests/test_criterion_RD2.py` | New file: RD2 test | Phase 3 |
    | **6** | (all) | Run `pytest -q` to confirm RD1, RD2 pass **and** T1–T3, C1, C2, X1, N1 still pass | Phases 4–5 |

    Total estimated effort: **~45 min** (well within the 3-hour budget).

    No frontend changes are needed or permitted (no file in `frontend/**` is in the footprint).

    ---

    ## 4. Proto Validation Plan

    This change is low-risk: adding two optional fields to an existing Pydantic model, threading them through an in-memory dict, and returning them in a JSON response. No new external dependency, no concurrency concern, no schema migration.

    **Prototype (throwaway, single scratch file):**

    ```python
    # scratch_proto.py — NOT shipped, NOT in footprint
    from datetime import date

    def duration(start: date, finish: date) -> int:
        return (finish - start).days

    assert duration(date(2024,1,15), date(2024,2,1)) == 17
    print("OK")
    ```

    Run once to confirm the date arithmetic matches the criterion's expected value of 17. This is a 3-line sanity check, not a feature implementation. No further prototyping is warranted.

    ---

    ## 5. Unknown Classification

    | # | Unknown | Classification | Rationale |
    |---|---------|---------------|-----------|
    | U1 | Exact structure of existing Pydantic models in `models.py` (field names, whether a separate `BookPatch` schema exists) | **resolved** | Read at Phase 1 start; the file is 2.8 KB and fully visible at implementation time. No ambiguity remains. |
    | U2 | Exact signature of the store's update method | **resolved** | Read at Phase 2 start; 6.3 KB, single in-memory dict pattern. |
    | U3 | How the existing PATCH handler serialises the response (model `.model_dump()`? manual dict?) | **resolved** | Read at Phase 3 start. Determines whether `duration_days` is injected pre- or post-serialisation. |
    | U4 | Whether the response serialises `None` dates as `"null"` or omits them | **resolved** | Determined by reading existing PATCH responses in `must_not_break` tests (e.g., T2 patches `reading_status`). Follow whatever the existing pattern does. |
    | U5 | Negative `duration_days` (finished < start) | **acceptable_risk** | Criteria do not specify a guard. The arithmetic `(f - s).days` yields a negative int; the test only exercises the positive case. No criterion or reviewer note demands clamping. Documented; no code guard added. |
    | U6 | Leap-year / month-boundary date arithmetic | **resolved** | Python's `date` subtraction handles this natively. The proto in §4 confirms the specific value in the criteria. |

    **No blockers.** No unknowns require human decision or will prevent implementation.

    ---

    ## 6. Risks & Mitigations

    | Risk | Likelihood | Mitigation |
    |------|-----------|------------|
    | Adding fields to the Book model changes the shape that `must_not_break` tests assert on (e.g., a test doing `assert set(book.keys()) == {...}`) | Low — most existing tests assert specific fields, not exhaustive key sets | Read all `must_not_break` tests at Phase 1 before touching models. If any do exhaustive key-set assertions, the new fields must be added in a way that keeps them passing (they will, since the fields default to `None` and are simply extra keys). If a test truly enumerates keys, flag and adjust. |
    | PATCH handler exceeds 30 lines (CONTRIBUTING.md constraint) | Low — adding two fields and a 3-line duration computation to an existing handler is ~5 lines | Count lines during Phase 3. If over, extract the response-building into a small helper in `routes.py` (same file, within footprint). |
    | `duration_days` leaks into the stored model and gets persisted as `null` when only one date is set, confusing future PATCHes | Low — design decision is to NOT store it | Explicitly keep `duration_days` out of the Book model. It exists only in the response dict. |

    ---

    ## 7. Verification Gate

    At the end of Phase 6, the following must all pass:

    ```bash
    .venv/bin/python -c "from backend.main import app"          # boots
    .venv/bin/python -m pytest -q -p no:cacheprovider           # all backend tests
    ```

    Specifically:
    - `tests/test_criterion_RD1.py` → PASS
    - `tests/test_criterion_RD2.py` → PASS
    - `tests/test_criterion_T1.py` → PASS (must_not_break)
    - `tests/test_criterion_T2.py` → PASS (must_not_break)
    - `tests/test_criterion_T3.py` → PASS (must_not_break)
    - `tests/test_criterion_C1.py` → PASS (must_not_break)
    - `tests/test_criterion_C2.py` → PASS (must_not_break)
    - `tests/test_criterion_X1.py` → PASS (must_not_break)
    - `tests/test_criterion_N1.py` → PASS (must_not_break)
    - All other pre-existing test files → PASS (regression)

    Frontend tests are unaffected (no frontend files in footprint) but will still run and pass:
    ```bash
    npm --prefix frontend test --silent
    ```

    ---

    *End of technical design. Ready for implementation.*
- task_type: qa.define_test_strategy
  occurrence: 1
  call: 1
  content: |-
    # QA Test Strategy — Increment: Book Reading Dates (SN-13)

    **Cycle:** prop_342b8f0450fc (feature)
    **Footprint:** `backend/models.py`, `backend/routes.py`, `backend/store.py`, `tests/test_criterion_RD1.py`, `tests/test_criterion_RD2.py`
    **Maturity:** Stage A (planning) — defines *what* and *how*, not executable test code.

    ---

    ## 1. Acceptance Checklist

    Derived from the change request's `criteria` and `must_not_break` lists. Each item is a concrete pass/fail gate checked during implementation review.

    ### New Behaviour (RD1 — Set and Read Dates)

    - [ ] `PATCH /books/{id}` with JSON body `{"start_date": "2024-01-15", "finished_date": "2024-02-01"}` returns HTTP **200**.
    - [ ] The 200 response JSON body includes `"start_date": "2024-01-15"` verbatim.
    - [ ] The 200 response JSON body includes `"finished_date": "2024-02-01"` verbatim.
    - [ ] A `GET /books/{id}` (or equivalent read) after the PATCH reflects the same stored dates.
    - [ ] When `start_date` is absent from the PATCH body, the book's existing `start_date` (or null) is unchanged.
    - [ ] When `finished_date` is absent from the PATCH body, the book's existing `finished_date` (or null) is unchanged.

    ### New Behaviour (RD2 — Duration Calculation)

    - [ ] After `PATCH /books/{id}` with `{"start_date": "2024-01-15", "finished_date": "2024-02-01"}`, the 200 response JSON includes `"duration_days": 17`.
    - [ ] `duration_days` is present **only** when both `start_date` and `finished_date` are non-null on the book.
    - [ ] When only one date is set, `duration_days` is absent from the response (or `null`, per implementation choice) and does **not** raise an error.
    - [ ] `duration_days` is computed as `(finished_date - start_date).days` — a whole-calendar-day subtraction, not a timediff-in-seconds/86400 that drifts on DST boundaries.

    ### Must-Not-Break (Regression Gates)

    - [ ] `tests/test_criterion_T1.py` passes unchanged.
    - [ ] `tests/test_criterion_T2.py` passes unchanged.
    - [ ] `tests/test_criterion_T3.py` passes unchanged.
    - [ ] `tests/test_criterion_C1.py` passes unchanged.
    - [ ] `tests/test_criterion_C2.py` passes unchanged.
    - [ ] `tests/test_criterion_X1.py` passes unchanged.
    - [ ] `tests/test_criterion_N1.py` passes unchanged.
    - [ ] Full `pytest` run (all existing `test_*.py` files) passes with zero new failures.
    - [ ] `boots` check (`.venv/bin/python -c "from backend.main import app"`) succeeds.
    - [ ] `frontend_tests` (`npm --prefix frontend test --silent`) passes (no frontend file is in footprint, but confirms no accidental import breakage).

    ### Code Hygiene

    - [ ] No file outside the declared footprint is modified.
    - [ ] The PATCH handler in `routes.py` remains under 30 lines (CONTRIBUTING.md).
    - [ ] Tests use `TestClient`/`httpx.AsyncClient` against the FastAPI app — no live server, no direct model instantiation.
    - [ ] No new third-party package is imported that is absent from `backend/requirements.txt`.

    ---

    ## 2. Test Strategy Note

    ### Scope Decisions

    | Layer | In scope? | Rationale |
    |-------|-----------|-----------|
    | Unit (pure function) | **No separate unit tests** | The product convention is API-level testing via `TestClient`. Duration math is trivially exercised through the endpoint response. A separate unit test file would fall outside the footprint. |
    | Integration (API) | **Yes — primary** | RD1 and RD2 are endpoint-surface criteria. Tests hit `PATCH /books/{id}` and inspect the JSON response. This is the product's native test style. |
    | Contract (schema) | **Embedded in integration** | Field presence, type (string date, integer days), and null-omission are asserted in the same test functions as the happy path. No separate contract test file; the footprint allows only the two criterion files. |
    | E2E (frontend) | **No** | No frontend file is in the footprint. The PATCH is backend-surface. Frontend tests are unaffected and must simply continue to pass. |

    ### Test File Placement

    - `tests/test_criterion_RD1.py` — exercises RD1 (set + read dates).
    - `tests/test_criterion_RD2.py` — exercises RD2 (duration calculation).
    - Both follow the product's existing naming convention (`test_criterion_*.py`) and are discovered by `pytest` under `.`.
    - `conftest.py` (already present) provides the shared `TestClient` fixture; new test files use it without modification.

    ### Verification Commands (run by the product's own checks)

    ```bash
    # Boot check
    .venv/bin/python -c "from backend.main import app"

    # Backend tests (all, including new and existing)
    .venv/bin/python -m pytest -q -p no:cacheprovider

    # Frontend tests (regression only)
    npm --prefix frontend test --silent
    ```

    All three must pass. A test in `tests/test_criterion_RD*.py` that imports a package not in `backend/requirements.txt` will fail at collection — this is a **build failure**, not a test failure.

    ---

    ## 3. Defect Severity Rubric

    | Severity | Definition | Examples in this increment | Gate |
    |----------|-----------|----------------------------|------|
    | **S0 – Critical** | A `must_not_break` test fails, or the app fails to boot, or data is corrupted/lost on write. | T1 regression; a book row loses its title after PATCH; `import backend.main` raises. | **Blocks merge immediately.** |
    | **S1 – High** | An RD criterion fails on its stated observable (the exact request/response pair in the change request). | PATCH returns 404 instead of 200; response omits `start_date`; `duration_days` is 16 instead of 17. | **Blocks merge.** Must be fixed before approval. |
    | **S2 – Medium** | An edge-case or adjacent-behaviour defect that the criteria imply but do not explicitly state. | Invalid date string `"2024-13-45"` returns 200 instead of 422; `finished_date` before `start_date` produces a negative `duration_days` without any guard; PATCHing a non-existent book id returns 500 instead of 404. | **Should fix before merge.** May be deferred to a follow-up increment with explicit justification. |
    | **S3 – Low** | Cosmetic, style, or documentation deviation that does not affect observable behaviour. | Field ordering in response JSON differs from a "natural" order; a comment in `models.py` is stale. | **Track, do not block.** |

    ### Classification Procedure

    1. Run the full `pytest` suite. Any failure in a `must_not_break` file → **S0**.
    2. Run the RD1/RD2 criterion tests against the stated observables. Any mismatch → **S1**.
    3. Manually probe edge cases (invalid dates, partial bodies, missing book). Defect → **S2**.
    4. Review code for style/convention violations (handler length, import hygiene). → **S3**.

    ---

    ## 4. Risk-Based Test Priorities

    Ranked by likelihood of defect × blast radius. Highest first.

    | # | Risk Area | Why It's Risky | Coverage Required |
    |---|-----------|---------------|-------------------|
    | **1** | **Duration arithmetic (RD2)** | Day subtraction is off-by-one-prone. The spec says "whole-day difference"; implementation must use date objects, not string parsing with a fixed 24-hour assumption. DST is irrelevant for date-only types, but a naive `(finished - start).total_seconds() // 86400` would still be correct here — the real risk is mixing up start/finished order or forgetting to `.days`. | RD2 test must assert the exact value **17** for the stated pair. Add a second pair (e.g., same-day → 0; 2024-01-31 → 2024-02-01 → 1) to catch off-by-one. |
    | **2** | **Partial / absent date handling** | PATCH with only `start_date` (or only `finished_date`) must not set the other to a default or raise. `duration_days` must be absent. This is the most common "forgot the null case" bug. | RD1 test should include a sub-test: PATCH with only `start_date`, assert `finished_date` is null/absent and `duration_days` is null/absent. |
    | **3** | **Date format validation** | The model likely uses `datetime.date` (Pydantic `date` type). An invalid string like `"2024-01-15"` is fine, but `"15/01/2024"` or `"not-a-date"` should return **422**, not 500. A missing validation layer (e.g., accepting a raw string) is a silent data-corruption path. | Test: PATCH with `{"start_date": "garbage"}` → expect 422. PATCH with `{"start_date": null}` → expect 200, date cleared. |
    | **4** | **Regression on existing PATCH /books/{id} behaviour** | The endpoint already handles other fields (title, author, status, rating, tags, etc.). Adding date fields to the same handler risks: (a) the response model now always includes `start_date: null` and breaks a test that asserts on exact response shape; (b) the handler's logic for "update only provided fields" breaks when dates are `null` in the body vs. absent. | The `must_not_break` suite (T1–T3, C1–C2, X1, N1) covers existing PATCH behaviour. **Do not skip them.** Review whether any existing test asserts on the full response body and would now see extra null fields. |
    | **5** | **Store-layer persistence** | `store.py` is in the footprint. If the store uses a JSON file or SQLite, the schema for a book record changes. An existing book loaded without `start_date` keys must not crash. A round-trip (load → serialize → save → reload) must preserve or default the new fields. | Implicitly covered by `must_not_break` tests that create books (which now load from the store). If the store is in-memory, risk is lower; if file-backed, add a quick check that a pre-existing book file without date fields loads cleanly. |
    | **6** | **Handler line count / code smell** | CONTRIBUTING.md caps handlers at 30 lines. Adding date-parsing + duration-calc to an existing PATCH handler may push it over. | Code review check, not a test. If the handler exceeds 30 lines, extract date logic into a helper in `models.py` or `store.py`. |

    ### Explicitly Out of Scope / Deferred

    - **Frontend display of dates**: No frontend file is in the footprint. The React `BookDetailView` does not render `start_date`/`finished_date` this cycle. No frontend test needed.
    - **Filtering/sorting by date**: No criterion or prd_delta addresses this. Do not test it.
    - **Timezone or timestamp handling**: The spec uses calendar dates (`YYYY-MM-DD`), not timestamps. Do not test timezone behaviour.
    - **Duration for finished-before-start**: The spec does not state whether `duration_days` should be negative, zero, or null in this case. Flag as S2 if unhandled, but do not treat as a criterion failure.

    ---

    ## 5. Review Checklist for Implementation (Stage B)

    When the implementation workload produces the five footprint files, verify:

    1. **Footprint compliance**: `git diff --name-only` shows exactly the five files. No more, no less.
    2. **RD1 test passes**: `pytest tests/test_criterion_RD1.py -v` → all green.
    3. **RD2 test passes**: `pytest tests/test_criterion_RD2.py -v` → all green.
    4. **Full suite passes**: `pytest -q` → zero failures, zero errors, zero new skips.
    5. **Boot check**: `python -c "from backend.main import app"` → exit 0.
    6. **Frontend suite passes**: `npm --prefix frontend test --silent` → exit 0.
    7. **Handler length**: Count lines in the modified PATCH handler. ≤ 30.
    8. **No new imports** outside `requirements.txt` in any backend file.

    All eight must be green for the increment to be approvable.

    ---

    *Strategy author: QA Agent. No test code is produced at this stage. The test files listed in the footprint are authored during the implementation workload, guided by the checklist and priorities above.*
- task_type: governance.prepare_plan_authoring_brief
  occurrence: 1
  call: 1
  content: |
    ```yaml:plan_authoring_brief.yaml
    version: 1
    brief_id: brief-prop_342b8f0450fc-001
    objective_summary: |
      This cycle extends the accepted Shelfnote books API so a reader can set
      start_date and finished_date on a book via PATCH /books/{id} and see
      those values in the book's JSON representation. When both dates are
      present, the representation additionally includes a computed
      duration_days field equal to the whole-calendar-day difference
      (finished_date minus start_date). The change is confined to the three
      existing backend files (models, routes, store) and two new criterion
      test files. No frontend change, no new dependency, no schema migration,
      no new endpoint. The rest of the accepted application is untouched.
    accepted_stack:
      backend: "FastAPI + Pydantic v2, in-memory dict store"
      frontend: "React 18 + Vite 5 (unchanged this cycle)"
      backend_tests: "pytest, TestClient against backend.main.app"
      frontend_tests: "vitest + Testing Library (unchanged this cycle)"
      package_manager_backend: "pip via backend/requirements.txt"
      package_manager_frontend: "npm via frontend/package.json"
    must_cover_requirements:
      - "RD1: PATCH /books/{id} with JSON body {\"start_date\": \"2024-01-15\", \"finished_date\": \"2024-02-01\"} returns the book's representation including \"start_date\": \"2024-01-15\" and \"finished_date\": \"2024-02-01\"."
      - "RD2: After the same PATCH, the representation includes \"duration_days\": 17 (the whole-day difference between 2024-02-01 and 2024-01-15)."
      - "duration_days is present in the response only when BOTH start_date and finished_date are non-null on the stored book; it is absent (or null, per existing serialization pattern) when either is missing."
      - "duration_days is computed as (finished_date - start_date).days using Python date objects; it is not stored on the book record."
      - "Existing PATCH /books/{id} behaviour for all other fields (title, author, reading_status, rating, tags, etc.) is unchanged."
      - "must_not_break criteria T1, T2, T3, C1, C2, X1, N1 all pass without modification."
      - "The PATCH handler in routes.py remains under 30 lines per CONTRIBUTING.md."
      - "New tests exercise the running app through TestClient and assert on response JSON content; they do not import framework internals or direct model instantiation."
      - "No file outside the declared footprint is modified."
    scope_cuts:
      - "Frontend rendering of start_date, finished_date, or duration_days: deferred; no frontend file is in the footprint."
      - "Filtering or sorting the book list by date: not in scope, no criterion addresses it."
      - "Timezone-aware timestamps: out of scope; the spec uses calendar dates (YYYY-MM-DD) via Python date, not datetime."
      - "Validation or clamping of negative duration_days (finished_date before start_date): not specified by criteria or reviewer notes; no guard is required this cycle."
      - "Any feature, endpoint, or file outside the five-file footprint: out of scope."
    risk_areas:
      - "Duration arithmetic off-by-one: (finished - start).days must yield exactly 17 for the stated pair; using total_seconds()//86400 or mixing start/finished order is the primary defect vector."
      - "Partial-date handling: a PATCH that sets only start_date (or only finished_date) must not nullify the other, must not raise, and must omit duration_days."
      - "Regression on existing PATCH response shape: adding start_date/finished_date keys (defaulting to null) to the Book model may alter the JSON response that must_not_break tests assert on."
      - "Date format validation: an invalid date string in the PATCH body should produce a 422 from Pydantic, not a 500 or silent acceptance."
      - "Store round-trip: existing in-memory book records that lack start_date/finished_date keys must load and respond without error after the model change."
    source_artifact_refs:
      - "change_request.yaml"
      - "technical_design.md"
      - "test_strategy.md"
      - "ruling_notes.md"
    major_components:
      - "backend/models.py — Pydantic Book and BookPatch schemas gain start_date, finished_date (Optional[date])"
      - "backend/routes.py — PATCH /books/{id} handler threads the two dates to the store and injects duration_days into the response"
      - "backend/store.py — in-memory update method accepts and persists the two optional date fields"
      - "tests/test_criterion_RD1.py — new criterion test for RD1"
      - "tests/test_criterion_RD2.py — new criterion test for RD2"
    dependency_assumptions:
      - "The store is in-memory (dict); no database migration or schema file exists to update."
      - "conftest.py at the repository root already provides a TestClient fixture usable by the new criterion test files."
      - "No new third-party package is required; datetime.date and Pydantic's date type are in the standard library and already available."
      - "The frontend package.json and vite.config.js are unchanged; frontend tests are unaffected."
    time_budget_guidance:
      backend_models: 10
      backend_store: 10
      backend_routes: 25
      criterion_tests: 35
      verification_and_regression: 20
    task_granularity_guidance: |
      Aim for 2–5 minute LLM generations per task. The backend changes
      (models, store, routes) are small and interdependent; a single
      implementation task covering all three backend files is appropriate.
      Each criterion test file is its own task. A final verification task
      runs the full pytest suite and the boot check.
    artifact_naming_conventions:
      - "Pydantic response and input models live in backend/models.py."
      - "Route handlers and router registration live in backend/routes.py."
      - "In-memory data access methods live in backend/store.py."
      - "Criterion test files are named tests/test_criterion_RD{N}.py, matching the existing pattern (test_criterion_T1.py, test_criterion_C1.py, etc.)."
      - "Tests import the app via the conftest.py fixture; they do not import backend.models or backend.store directly."
    open_questions:
      - "When only one of start_date / finished_date is set, does the existing serialization pattern include the other as null or omit it entirely? The developer should follow whatever pattern the current PATCH responses use for other optional fields (e.g., reading_status, rating). This determines whether the RD1 test asserts \"finished_date\": null or asserts 'finished_date' not in response."
