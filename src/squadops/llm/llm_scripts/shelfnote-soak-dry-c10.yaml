    ```python:backend/models.py
    """Pydantic models — scaffold-owned interface (entities + request shapes).

    Field bodies (validators, computed defaults) are fill-only; the class
    surface here is fixed by the interface manifest.
    """

    from __future__ import annotations

    from datetime import date
    from typing import Annotated

    from pydantic import BaseModel, Field, StringConstraints, field_validator

    # #593: required request fields reject blank/whitespace-only input at the
    # model layer — the contract pins validation_error → 422 for it, and the
    # blank-input probe enforces it against the running app. Whitespace is
    # stripped before the length check, so '  ' is as blank as ''.
    NonBlankStr = Annotated[str, StringConstraints(strip_whitespace=True, min_length=1)]

    VALID_STATUSES: frozenset[str] = frozenset({"wanted", "being read", "read"})


    class Note(BaseModel):
        id: str
        author: str
        text: str


    class Book(BaseModel):
        id: str
        title: str
        author: str
        added_by: str
        status: str = "wanted"
        #: A readable, URL-safe name: the title and author, slugified.
        slug: str = ""
        notes: list[Note] = Field(default_factory=list)
        tags: list[str] = Field(default_factory=list)
        rating: int | None = None
        note: str | None = None
        start_date: date | None = None
        finished_date: date | None = None

        @field_validator("status")
        @classmethod
        def _validate_status(cls, value: str) -> str:
            if value not in VALID_STATUSES:
                raise ValueError(
                    f"status must be one of {sorted(VALID_STATUSES)!r}, got {value!r}"
                )
            return value


    class BookCreate(BaseModel):
        title: NonBlankStr
        author: NonBlankStr
        added_by: NonBlankStr


    class NoteCreate(BaseModel):
        author: NonBlankStr
        text: NonBlankStr


    class NoteUpdate(BaseModel):
        note: str


    class BookPatch(BaseModel):
        title: str | None = None
        author: str | None = None
        status: str | None = None
        start_date: date | None = None
        finished_date: date | None = None


    class AddTagRequest(BaseModel):
        tag: NonBlankStr


    class RatingRequest(BaseModel):
        rating: int = Field(ge=1, le=5)

        @field_validator("rating", mode="before")
        @classmethod
        def _reject_non_integer(cls, v: object) -> object:
            # bool is a subclass of int in Python; must reject it before
            # any int-based check or type coercion would let it through.
            if isinstance(v, bool):
                raise ValueError("rating must be an integer 1-5, not a boolean")
            if v is None:
                raise ValueError("rating must be an integer 1-5, not null")
            if isinstance(v, float):
                raise ValueError("rating must be an integer 1-5, not a float")
            if isinstance(v, str):
                raise ValueError("rating must be an integer 1-5, not a string")
            return v


    class Pagination(BaseModel):
        total: int
        page: int
        per_page: int
        total_pages: int


    class PaginatedBooksResponse(BaseModel):
        items: list[Book]
        pagination: Pagination
    ```

    ```python:backend/routes.py
    """API route stubs — scaffold-owned signatures, fill-only bodies.

    Every endpoint the interface manifest declares is wired here with its
    correct path, method, and response model. Bodies raise 501 until filled;
    the app imports and boots regardless.

    The router takes NO prefix. The frontend calls /api/... and the proxy strips
    that prefix before the request reaches this app, so these paths are already
    the full backend paths. Adding prefix= to APIRouter puts every route behind a
    second /api and the app answers 404 to its own contract (pf-41).

    On failure raise ApiError(code, message) from .errors — codes: validation_error, book_not_found.
    """

    import csv
    import io
    import math
    from typing import Literal
    from typing import Optional
    from uuid import uuid4

    from fastapi import APIRouter, HTTPException, Query
    from fastapi import Response
    from slugify import slugify

    from backend.models import VALID_STATUSES, Book, BookCreate, Note, NoteCreate, BookPatch
    from backend.models import AddTagRequest
    from backend.models import RatingRequest
    from backend.models import NoteUpdate
    from backend.models import Pagination
    from backend.models import PaginatedBooksResponse
    from backend.errors import ApiError
    from backend.store import book_store, list_books, update_book, add_tag, get_books as store_get_books, set_rating
    from backend.store import get_status_counts, get_average_rating
    from backend.store import get_related_books
    from backend.store import set_note

    SortField = Literal["title", "author", "rating"]

    router = APIRouter()


    @router.get("/books")
    def get_books(
        search: Optional[str] = Query(None),
        status: str | None = Query(None),
        tag: str | None = Query(None),
        sort_by: Optional[SortField] = None,
        page: Optional[int] = Query(None, ge=1),
        per_page: Optional[int] = Query(None, ge=1, le=100),
    ):
        """list books — newest first."""
        if status and status not in VALID_STATUSES:
            raise HTTPException(status_code=400, detail=f"Invalid status: {status!r}")
        if tag:
            results = store_get_books(tag=tag)
            if search:
                needle = search.lower()
                results = [b for b in results if needle in b.title.lower() or needle in b.author.lower()]
            if status:
                results = [b for b in results if b.status == status]
        else:
            results = list_books(search=search, status=status or None)
        if sort_by == "title":
            results = sorted(results, key=lambda b: b.title.lower())
        elif sort_by == "author":
            results = sorted(results, key=lambda b: b.author.lower())
        elif sort_by == "rating":
            results = sorted(results, key=lambda b: b.rating or 0)
        else:
            results = list(reversed(results))
        if page is None and per_page is None:
            return results
        p = page if page is not None else 1
        pp = per_page if per_page is not None else 10
        total = len(results)
        start = (p - 1) * pp
        end = start + pp
        items = results[start:end]
        total_pages = math.ceil(total / pp) if total > 0 else 0
        return PaginatedBooksResponse(
            items=items,
            pagination=Pagination(total=total, page=p, per_page=pp, total_pages=total_pages),
        )


    @router.post("/books", response_model=Book, status_code=201)
    def post_books(payload: BookCreate):
        """add a book."""
        book = Book(
            id=str(uuid4()),
            title=payload.title,
            author=payload.author,
            added_by=payload.added_by,
            slug=slugify(f"{payload.title} {payload.author}"),
            notes=[],
        )
        book_store[book.id] = book
        return book


    @router.get("/books/{book_id}", response_model=Book)
    def get_books_book_id(book_id: str):
        """a book and its notes."""
        book = book_store.get(book_id)
        if book is None:
            raise ApiError("book_not_found", f"Book '{book_id}' not found.")
        return book


    @router.patch("/books/{book_id}")
    def patch_books_book_id(book_id: str, body: BookPatch):
        """update a book's fields."""
        if body.status and body.status not in VALID_STATUSES:
            raise HTTPException(status_code=400, detail=f"Invalid status: {body.status!r}")
        result = update_book(
            book_id,
            title=body.title,
            author=body.author,
            status=body.status or None,
            start_date=body.start_date,
            finished_date=body.finished_date,
        )
        if result is None:
            raise ApiError("book_not_found", f"Book '{book_id}' not found.")
        resp = result.model_dump()
        if result.start_date is not None and result.finished_date is not None:
            resp["duration_days"] = (result.finished_date - result.start_date).days
        return resp


    @router.post("/books/{book_id}/notes", response_model=Book, status_code=200)
    def post_books_book_id_notes(book_id: str, payload: NoteCreate):
        """leave a note."""
        book = book_store.get(book_id)
        if book is None:
            raise ApiError("book_not_found", f"Book '{book_id}' not found.")
        if len(payload.text) > 500:
            raise ApiError("validation_error", "Note text must not exceed 500 characters.")
        note = Note(
            id=str(uuid4()),
            author=payload.author,
            text=payload.text,
        )
        book.notes.append(note)
        return book


    @router.post("/books/{book_id}/tags", response_model=Book)
    def post_books_book_id_tags(book_id: str, payload: AddTagRequest):
        """add a tag to a book."""
        result = add_tag(book_id, payload.tag)
        if result is None:
            raise ApiError("book_not_found", f"Book '{book_id}' not found.")
        return result


    @router.put("/books/{book_id}/rating", response_model=Book)
    def put_books_book_id_rating(book_id: str, body: RatingRequest):
        """set a book's rating."""
        book = book_store.get(book_id)
        if book is None:
            raise ApiError("book_not_found", f"Book '{book_id}' not found.")
        return set_rating(book_id, body.rating)


    @router.put("/books/{id}/note", response_model=Book)
    def put_books_id_note(id: str, body: NoteUpdate):
        """set a book's note."""
        result = set_note(id, body.note)
        if result is None:
            raise ApiError("book_not_found", f"Book '{id}' not found.")
        return result


    @router.get("/books/{book_id}/related")
    def get_books_book_id_related(book_id: str):
        """Return books related to the given book by tag overlap."""
        result = get_related_books(book_id)
        if result is None:
            raise ApiError("book_not_found", f"Book '{book_id}' not found.")
        return result


    @router.get("/stats")
    def get_stats():
        """Aggregated shelf statistics."""
        return {
            "status_counts": get_status_counts(),
            "average_rating": get_average_rating(),
        }


    @router.get("/export")
    def export_shelf():
        """Export all books as a CSV document."""
        buf = io.StringIO()
        writer = csv.writer(buf)
        writer.writerow(["title", "status", "tags", "rating"])
        for book in list_books():
            tags_field = ";".join(book.tags) if book.tags else ""
            rating_field = str(book.rating) if book.rating is not None else ""
            writer.writerow([book.title, book.status, tags_field, rating_field])
        return Response(content=buf.getvalue(), media_type="text/csv")
    ```

    ```python:backend/store.py
    """In-memory state — scaffold-owned (frozen).

    The manifest declares in-memory persistence, so this module owns it: one store
    per root-persisted entity, keyed by the entity's id. Fill route bodies against
    these names; do not define a second store elsewhere and do not edit this file.

    Not stored on their own — shapes embedded in or projected from the rows
    above, never rows themselves: Note. Build them from a
    stored entity when a response needs them; do not keep a parallel store.
    """

    from __future__ import annotations

    from datetime import date

    from backend.models import VALID_STATUSES, Book

    book_store: dict[str, Book] = {}


    def reset() -> None:
        """Clear every store — for test isolation between cases."""
        book_store.clear()


    def list_books(search: str | None = None, *, status: str | None = None) -> list[Book]:
        """Return books matching *search* and/or *status*, in shelf order.

        Both filters are conjunctive (AND).  An empty-string or *None* value
        disables that filter, so the full ordered shelf is returned.
        """
        results: list[Book] = []
        for book in book_store.values():
            if status is not None and status != "" and book.status != status:
                continue
            if search is not None and search != "":
                needle = search.lower()
                if needle not in book.title.lower() and needle not in book.author.lower():
                    continue
            results.append(book)
        return results


    def get_books(tag: str | None = None) -> list[Book]:
        """Return all books, optionally filtered by *tag*.

        When *tag* is *None* or an empty string the full unfiltered list is
        returned, preserving existing GET /books behaviour.  When a non-empty
        tag string is provided, only books whose ``tags`` array includes that
        tag are returned.  An empty list is returned when no book carries the
        tag.
        """
        if tag is None or tag == "":
            return list(book_store.values())
        return [book for book in book_store.values() if tag in book.tags]


    def get_books_paginated(page: int, per_page: int) -> tuple[list[Book], int]:
        """Return a single page of books and the total count.

        *page* is 1-based.  The slice is computed as
        ``[(page - 1) * per_page : page * per_page]`` over the full shelf.
        A page beyond the list bounds yields an empty list (Python slicing
        is safe past the end).
        """
        all_books: list[Book] = list(book_store.values())
        start = (page - 1) * per_page
        end = start + per_page
        return all_books[start:end], len(all_books)


    def add_tag(book_id: str, tag: str) -> Book | None:
        """Add *tag* to the book identified by *book_id*.

        The tag is appended to the book's ``tags`` array only if not already
        present (idempotency guarantee).  Returns the updated book, or *None*
        if no book with the given id exists in the store.
        """
        book = book_store.get(book_id)
        if book is None:
            return None
        if tag not in book.tags:
            book.tags.append(tag)
        return book


    def update_book(
        book_id: str,
        *,
        title: str | None = None,
        author: str | None = None,
        status: str | None = None,
        start_date: date | None = None,
        finished_date: date | None = None,
    ) -> Book | None:
        """Update a book in place; return the book or *None* if not found.

        When *status* is provided (non-empty) it is validated against
        :data:`~backend.models.VALID_STATUSES` **before** any field is written.
        On an invalid status no mutation occurs and the book is returned
        unchanged (atomicity guarantee).
        """
        book = book_store.get(book_id)
        if book is None:
            return None

        # Validate status BEFORE any field is written.
        if status is not None and status != "" and status not in VALID_STATUSES:
            return book

        if title is not None:
            book.title = title
        if author is not None:
            book.author = author
        if status is not None and status != "":
            book.status = status
        if start_date is not None:
            book.start_date = start_date
        if finished_date is not None:
            book.finished_date = finished_date

        return book


    def set_rating(book_id: str, rating: int) -> Book:
        """Set the rating for the book identified by *book_id*.

        Mutates the book in place with replacement semantics: a second call
        overwrites the first rating value (no accumulation or history).

        The caller is responsible for verifying that the book exists before
        invoking this function; a *KeyError* is raised for an unknown id.
        """
        book = book_store[book_id]
        book.rating = rating
        return book


    def set_note(book_id: str, note: str) -> Book | None:
        """Set the note for the book identified by *book_id*.

        Mutates the book in place with replacement semantics: a second call
        overwrites the first note value.

        Returns the updated book, or *None* if no book with the given id
        exists in the store.
        """
        book = book_store.get(book_id)
        if book is None:
            return None
        book.note = note
        return book


    def get_status_counts() -> dict[str, int]:
        """Return the count of books per canonical status.

        Every status in :data:`~backend.models.VALID_STATUSES` appears as a key,
        initialised to 0, so statuses with no books are still present.
        """
        counts: dict[str, int] = {s: 0 for s in VALID_STATUSES}
        for book in book_store.values():
            counts[book.status] += 1
        return counts


    def get_average_rating() -> float | None:
        """Return the arithmetic mean of non-null ratings, or *None* if none exist."""
        rated = [book.rating for book in book_store.values() if book.rating is not None]
        if not rated:
            return None
        return sum(rated) / len(rated)


    def get_related_books(book_id: str) -> list[Book] | None:
        """Return books related to *book_id* by tag overlap.

        Returns *None* if no book with the given id exists in the store.
        Returns an empty list if the book has zero tags.
        Otherwise returns a list of Book objects for every other book whose
        tag set has non-empty intersection with the queried book's tag set.
        The queried book is always excluded.  Order is store insertion order.
        """
        target = book_store.get(book_id)
        if target is None:
            return None
        target_tags = set(target.tags)
        if not target_tags:
            return []
        related: list[Book] = []
        for book in book_store.values():
            if book.id == book_id:
                continue
            if target_tags & set(book.tags):
                related.append(book)
        return related
    ```
