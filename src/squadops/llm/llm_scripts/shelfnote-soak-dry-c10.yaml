  content: |
    ```yaml:proposed_plan_tasks.yaml
    version: 1
    proposal_id: prop-46dc010f
    source_brief_id: brief-prop_342b8f0450fc-001
    proposing_role: development
    scope_statement: |
      This proposal covers the single backend implementation task for the Shelfnote
      reading-dates increment: extending the existing Book Pydantic model, the
      in-memory store's update path, and the PATCH /books/{id} route handler to
      accept, persist, and surface start_date and finished_date, and to compute
      duration_days at response time when both are present. All three files are
      small and tightly interdependent; per the brief's task-granularity guidance
      they form one focused task. No test files, frontend files, or packaging
      artifacts are claimed here.
    tasks:
      - task_type: development.develop
        role: dev
        focus: "Book reading date fields (models, store, routes)"
        description: |
          Extend the three backend files so a reader can set start_date and
          finished_date on a book via PATCH /books/{id} and see those values (plus
          a derived duration_days) in the book's JSON representation.

          backend/models.py:
            - Add start_date: Optional[date] = None and finished_date:
              Optional[date] = None to the Book representation model.
            - Add the same two optional fields to the patch/update input schema
              (BookPatch).
            - Do NOT add duration_days to any stored model; it is a
              response-time scalar only.
            - Ensure existing fields (id, title, author, reading_status, rating,
              tags, note, etc.) are untouched.

          backend/store.py:
            - The in-memory update method accepts start_date and finished_date as
              optional keyword arguments (date | None).
            - They are written onto the stored book dict record exactly like
              existing optional fields (e.g., reading_status, rating).
            - No validation logic in the store; that is Pydantic's job upstream.
            - Existing records lacking the new keys load and respond without error.

          backend/routes.py:
            - The PATCH /books/{id} handler passes start_date and finished_date
              from the validated request body to the store's update method.
            - After the store returns the updated record, the handler computes
              duration_days = (finished_date - start_date).days when BOTH dates
              are non-None, and includes it in the response JSON.
            - When either date is None, duration_days is omitted from the response
              (following the existing null-serialization pattern for optional
              fields like reading_status, rating).
            - All other existing PATCH fields (title, author, reading_status,
              rating, tags, note) retain their current behaviour unchanged.
            - The handler remains under 30 lines per CONTRIBUTING.md.
            - Invalid date strings are rejected by Pydantic with a 422 response;
              the handler does not catch or suppress them.
        expected_artifacts:
          - "backend/models.py"
          - "backend/routes.py"
          - "backend/store.py"
        acceptance_criteria:
          - check: field_present
            file: backend/models.py
            class_name: Book
            fields: [start_date, finished_date]
            severity: error
          - check: field_present
            file: backend/models.py
            class_name: BookPatch
            fields: [start_date, finished_date]
            severity: error
          - check: import_present
            file: backend/models.py
            module: datetime
            symbol: date
            severity: error
          - check: command_exit_zero
            argv: [python, -m, py_compile, backend/models.py]
            severity: error
          - check: command_exit_zero
            argv: [python, -m, py_compile, backend/store.py]
            severity: error
          - check: command_exit_zero
            argv: [python, -m, py_compile, backend/routes.py]
            severity: error
          - check: module_imports
            file: backend/models.py
            severity: error
          - check: module_imports
            file: backend/store.py
            severity: error
          - check: module_imports
            file: backend/routes.py
            severity: error
          - "duration_days is computed as (finished_date - start_date).days using Python date objects at response time; it is never persisted on the stored book record."
          - "duration_days appears in the PATCH response only when both start_date and finished_date are non-None on the stored book; when either is missing it is absent from the response JSON."
          - "A PATCH that sets only start_date (or only finished_date) preserves the other field's existing value, does not raise, and omits duration_days."
          - "Existing PATCH /books/{id} behaviour for all other fields (title, author, reading_status, rating, tags, note) is unchanged."
          - "An invalid date string in the PATCH body produces a 422 from Pydantic validation, not a 500 or silent acceptance."
          - "The PATCH handler in routes.py remains under 30 lines."
          - "Existing in-memory book records that lack start_date/finished_date keys load and respond without error after the model change."
        depends_on_focus: []
    brief_conflicts: []
    assumptions:
      - "The Book representation class is named Book and the patch input class is named BookPatch, per the brief's major_components description. If the actual class names differ, the field_present checks will need adjustment; the developer should verify against the file at implementation time."
      - "The existing PATCH response serialises optional None fields as null (not omitted), consistent with how reading_status and rating are currently rendered. The duration_days field follows the same pattern: present with a value when computable, absent when not."
    risks:
      - "Off-by-one in duration arithmetic: the criteria pin the expected value to exactly 17 for the 2024-01-15 / 2024-02-01 pair. Using total_seconds() // 86400 or reversing the subtraction order is the primary defect vector."
      - "Adding start_date/finished_date to the Book model with default None may change the JSON key set that frozen must_not_break tests assert on (e.g., an exhaustive key-set assertion). The developer must read all frozen tests before modifying the model."
    gaps_not_covered:
      - "Frontend rendering of the new fields is explicitly out of scope per the brief's scope_cuts."
      - "Negative duration_days (finished before start) is not guarded; the criteria do not require a guard and the scope_cuts explicitly defer it."
    confidence: high
    ```
- task_type: qa.propose_plan_tasks
  occurrence: 1
  call: 1
  content: |
    ```yaml:proposed_plan_tasks.yaml
    version: 1
    proposal_id: prop-c63d3ba0
    source_brief_id: brief-prop_342b8f0450fc-001
    proposing_role: qa
    scope_statement: |
      This proposal covers the two new criterion test files that prove the
      reading-dates increment: RD1 (set and read start_date / finished_date via
      PATCH) and RD2 (duration_days computation and conditional presence). Each
      file is its own qa.test task, exercising the running app through the
      conftest TestClient fixture. Edge cases the brief's risk_areas flag
      (partial-date handling, invalid-date 422, off-by-one arithmetic) are
      sub-tests within the criterion files, following the product's convention
      of one criterion per file. Regression on frozen criteria (T1–T3, C1–C2,
      X1, N1) is covered by the framework's automatic suite re-run; no
      additional qa task is proposed for it.
    tasks:
      - task_type: qa.test
        role: qa
        focus: "RD1 criterion test: set and read reading dates"
        description: |
          Prove criterion RD1 and distinguish the faults the brief's risk_areas
          flag in the date-setting path.

          Faults this file's tests tell from correct behaviour:
          - PATCH with both start_date and finished_date does not return them in
            the response JSON (missing or mangled date strings).
          - A PATCH that sets only start_date nullifies or overwrites an
            existing finished_date (the other date's stored value is lost).
          - A PATCH that sets only finished_date nullifies an existing
            start_date.
          - An invalid date string (e.g. "not-a-date") is silently accepted
            instead of being rejected by Pydantic validation with a 422.
          - A PATCH with both dates also surfaces duration_days when it should
            be absent (this is RD2's fault but the RD1 test asserts its absence
            in the partial-date sub-tests to pin the conditional-visibility rule
            that spans both criteria).

          All tests exercise the running app through the conftest TestClient
          fixture; no direct model instantiation, no framework-internal imports.
        expected_artifacts:
          - "tests/test_criterion_RD1.py"
        acceptance_criteria:
          - check: function_defined
            file: tests/test_criterion_RD1.py
            name_prefix: "test_"
            min_count: 3
            severity: error
          - check: module_imports
            file: tests/test_criterion_RD1.py
            severity: error
          - "Every test function in this file creates its book via the TestClient (or a fixture that wraps it) and asserts on the HTTP response JSON; none import backend.models, backend.store, or backend.routes directly."
          - "The test for the stated RD1 observable asserts the response JSON contains the exact strings \"2024-01-15\" and \"2024-02-01\" for start_date and finished_date respectively."
          - "A partial-date sub-test patches only start_date (or only finished_date) and asserts the other field retains its prior value or is null, and that no error is raised."
          - "An invalid-date sub-test PATCHes a non-date string and asserts the response is a validation error (422), not a 500 or silent 200."
        depends_on_focus:
          - "dev:Book reading date fields (models, store, routes)"

      - task_type: qa.test
        role: qa
        focus: "RD2 criterion test: duration_days calculation"
        description: |
          Prove criterion RD2 and distinguish the faults the brief's risk_areas
          flag in the duration computation path.

          Faults this file's tests tell from correct behaviour:
          - duration_days is the wrong value for the stated pair (off-by-one
            from mixing subtraction order, or from using total_seconds()
            // 86400 instead of .days on a date-timedelta).
          - duration_days is present in the response when only one of the two
            dates is set (the conditional-visibility rule is violated).
          - duration_days is computed from string parsing rather than from
            Python date objects (would fail on a month-boundary pair).
          - duration_days is stored on the book record rather than computed at
            response time (a subsequent PATCH that changes only one date would
            leave a stale duration_days; a test that re-PATCHes one date and
            checks duration_days is now absent catches this).

          All tests exercise the running app through the conftest TestClient
          fixture; no direct model instantiation, no framework-internal imports.
        expected_artifacts:
          - "tests/test_criterion_RD2.py"
        acceptance_criteria:
          - check: function_defined
            file: tests/test_criterion_RD2.py
            name_prefix: "test_"
            min_count: 3
            severity: error
          - check: module_imports
            file: tests/test_criterion_RD2.py
            severity: error
          - "The primary test asserts the response JSON contains the integer value 17 for duration_days after the stated PATCH (2024-01-15 / 2024-02-01)."
          - "A second date-pair test (e.g. 2024-01-31 / 2024-02-01 → 1, or 2024-03-01 / 2024-03-01 → 0) catches off-by-one and month-boundary arithmetic errors."
          - "A partial-date test patches only one date and asserts duration_days is absent (or null per the existing serialization pattern) from the response."
          - "A re-patch test sets both dates, confirms duration_days, then patches only one date and asserts duration_days is absent, proving the value is computed at response time and not persisted."
        depends_on_focus:
          - "dev:Book reading date fields (models, store, routes)"
    brief_conflicts: []
    assumptions:
      - "The conftest.py at the repository root provides a TestClient fixture (likely named `client` or `app`) that the criterion test files consume directly; the tests do not construct their own client."
      - "The existing serialization pattern for optional fields (reading_status, rating) renders None values as JSON null in the response. The partial-date tests will assert accordingly: the unset field is null, not absent. If the actual pattern omits nulls, the tests will assert key-absence instead. The developer resolves this at implementation time per the brief's open_questions."
      - "The book to be PATCHed is created within each test (or via a fixture) so that tests are independent and do not depend on store state from other tests."
    risks:
      - "Off-by-one in duration arithmetic: the primary defect vector. The RD2 test asserts the exact integer 17 and a second pair to distinguish correct .days arithmetic from a reversed subtraction or a seconds-based calculation."
      - "Partial-date handling: a PATCH that sets only start_date (or only finished_date) must preserve the other field's stored value. Both RD1 and RD2 tests include partial-date sub-tests; a bug that nulls the other field fails both."
      - "Regression on existing PATCH response shape: adding start_date/finished_date (defaulting to null) to the Book model may add keys to every book's JSON. The frozen must_not_break tests (T1–T3, C1–C2, X1, N1) are re-run by the framework's suite check; no additional qa task is needed for them, but a failure there would be S0 per the severity rubric."
    gaps_not_covered:
      - "Frontend rendering of the new fields: explicitly out of scope per the brief's scope_cuts; no frontend file is in the footprint."
      - "Filtering or sorting by date: out of scope, no criterion addresses it."
      - "Negative duration_days guard (finished before start): the brief's scope_cuts explicitly defer this; the criteria do not require a guard. A test for it would assert behaviour nothing accepted requires."
      - "Timezone-aware timestamps: out of scope; the spec uses calendar dates via Python date."
    confidence: high
    ```
- task_type: strategy.propose_plan_guidance
  occurrence: 1
  call: 1
  content: |
    ```yaml:plan_guidance.yaml
    version: 1
    guidance_id: guid-f2aaf591
    source_brief_id: brief-prop_342b8f0450fc-001
    proposing_role: strategy
    priority_guidance:
      - area: backend_implementation
        priority: high
        rationale: |
          The three backend files (models, store, routes) form one
          interdependent unit per the brief's task-granularity guidance.
          They are the critical path: no test can pass until all three
          are correct and consistent. This area must complete before any
          qa task can produce a green result.
      - area: criterion_tests
        priority: high
        rationale: |
          RD1 and RD2 are the acceptance criteria and the sole evidence
          that the feature works. Tests must assert on response JSON
          content (per CONTRIBUTING.md), not merely status codes.
          Underestimating the test work (e.g., a single assertion per
          file) leaves partial-date handling and the duration_days
          omission contract unverified.
      - area: regression_verification
        priority: high
        rationale: |
          Seven must_not_break criteria (T1–T3, C1–C2, X1, N1) guard
          existing behaviour. The model change (adding Optional[date]
          fields to Book) is the most likely source of silent regression
          in response shape. Verification must confirm all seven pass
          unmodified and that the full pytest suite is green.
    ordering_guidance:
      - before: "qa:criterion_RD1"
        after: "dev:backend_implementation"
        rationale: |
          Criterion tests assert on response JSON produced by the
          running app via TestClient. They cannot pass until the
          backend files are correct. Backend implementation is the
          strict prerequisite for both criterion test tasks.
      - before: "qa:criterion_RD2"
        after: "dev:backend_implementation"
        rationale: |
          Same dependency: RD2 asserts the computed duration_days
          value in the response, which requires the routes handler
          to be wired and the model to serialise correctly.
    risk_guidance:
      - target: "dev:backend_implementation"
        risk: |
          Response-shape regression on existing optional fields.
          Adding start_date and finished_date as Optional[date] to
          the Book model changes which JSON keys appear in every
          PATCH response. The developer must inspect how the current
          PATCH response handles an existing optional field (e.g.,
          rating, reading_status) and replicate that exact pattern
          (include-as-null vs. omit-entirely). A mismatch breaks
          must_not_break tests that assert exact response structure.
      - target: "dev:backend_implementation"
        risk: |
          Duration arithmetic direction. (finished_date - start_date).days
          must yield 17 for the stated pair. The primary defect vector is
          reversing the operands (yielding -17) or using
          total_seconds() // 86400 (DST-sensitive in some locales).
          The value is computed at response time; it must not be
          stored on the book record.
      - target: "qa:criterion_RD1"
        risk: |
          Partial-date update contract. A PATCH that sets only
          start_date must not nullify a pre-existing finished_date,
          must not raise, and must omit duration_days. A test that
          only exercises the both-dates-present path misses this
          contract. The test should cover at least one
          single-date-update scenario.
      - target: "dev:backend_implementation"
        risk: |
          Store round-trip with pre-existing records. In-memory book
          dicts created before this change lack start_date /
          finished_date keys. After the model change, loading such
          a record must not raise KeyError or TypeError. The store
          update method must tolerate the absence of these keys.
    time_budget_guidance:
      - area: backend_implementation
        budget_pct: 45
      - area: criterion_tests
        budget_pct: 35
      - area: regression_verification
        budget_pct: 20
    scope_cut_guidance:
      - "Negative duration_days guard (finished before start): explicitly cut by the brief; no validation logic or test for this case is in scope."
      - "Any file under frontend/: the brief defers all frontend work; no frontend file is in this cycle's footprint."
    must_not_skip:
      - "must_not_break criteria T1, T2, T3, C1, C2, X1, N1 all pass without modification"
      - "duration_days is computed as (finished_date - start_date).days at response time and is not stored on the book record"
      - "Existing PATCH /books/{id} behaviour for all other fields (title, author, reading_status, rating, tags) is unchanged"
    defer_if_time_constrained:
      - "Explicit assertion that an invalid date string in the PATCH body produces a 422: Pydantic v2 handles this natively via its date type; the criterion tests focus on the happy path and the partial-update contract."
    confidence: high
    ```
