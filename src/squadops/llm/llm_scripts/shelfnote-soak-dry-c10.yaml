    """RD2: duration_days — whole-day difference between start_date and finished_date,
    computed at response time, absent when either date is missing."""

    from datetime import date


    def _create_book(client):
        """POST a book and return its JSON dict."""
        res = client.post("/books", json={"title": "T", "author": "A", "added_by": "U"})
        assert res.status_code == 201
        return res.json()


    def test_duration_days_primary_pair(client):
        """PATCH start_date=2024-01-15, finished_date=2024-02-01 → duration_days == 17.

        Faults caught:
          - off-by-one from reversed subtraction order (finished - start vs start - finished)
          - total_seconds() // 86400 instead of .days on the timedelta (same result here,
            but the intent is pinned to the integer day count)
          - duration_days key missing entirely
        """
        book = _create_book(client)
        res = client.patch(
            f"/books/{book['id']}",
            json={"start_date": "2024-01-15", "finished_date": "2024-02-01"},
        )
        assert res.status_code == 200
        body = res.json()
        assert body["start_date"] == "2024-01-15"
        assert body["finished_date"] == "2024-02-01"
        assert "duration_days" in body, f"duration_days missing from response: {body}"
        expected = (date(2024, 2, 1) - date(2024, 1, 15)).days
        assert body["duration_days"] == expected == 17, (
            f"duration_days={body['duration_days']!r}, expected {expected}"
        )
        assert isinstance(body["duration_days"], int), (
            f"duration_days is {type(body['duration_days']).__name__}, expected int"
        )


    def test_duration_days_month_boundary_pair(client):
        """Jan 31 → Feb 1 is exactly 1 day.

        Faults caught:
          - string-arithmetic (e.g. parsing month/day and subtracting without
            accounting for variable month lengths) yields 0 or 2
          - off-by-one: (31 - 31) + (1 - 1) = 0 instead of 1
          - using a fixed 30-day month assumption
        """
        book = _create_book(client)
        res = client.patch(
            f"/books/{book['id']}",
            json={"start_date": "2024-01-31", "finished_date": "2024-02-01"},
        )
        assert res.status_code == 200
        body = res.json()
        expected = (date(2024, 2, 1) - date(2024, 1, 31)).days
        assert expected == 1, "sanity: Jan 31 to Feb 1 is 1 day"
        assert body["duration_days"] == 1, (
            f"duration_days={body.get('duration_days')!r}, expected 1 for month-boundary pair"
        )


    def test_duration_days_absent_when_only_one_date_set(client):
        """Only start_date set → duration_days is absent or null.

        Fault caught: conditional-visibility rule violated — duration_days appears
        in the response even though finished_date is missing, producing a bogus
        value or a crash-avoidance default.
        """
        book = _create_book(client)
        res = client.patch(
            f"/books/{book['id']}",
            json={"start_date": "2024-01-15"},
        )
        assert res.status_code == 200
        body = res.json()
        assert body["start_date"] == "2024-01-15"
        dd = body.get("duration_days")
        assert dd is None, (
            f"duration_days={dd!r} present with only start_date set; expected absent or null"
        )


    def test_duration_days_not_stale_after_clearing_one_date(client):
        """Set both dates (duration_days visible), then clear one → duration_days absent.

        Fault caught: duration_days stored/persisted on the book record rather than
        computed at response time. After a PATCH that leaves only one date set, a
        stale duration_days from the prior both-dates state survives in the response.

        Previously failed against the application — the defect is real.
        """
        book = _create_book(client)

        # Set both dates; confirm duration_days is visible
        res = client.patch(
            f"/books/{book['id']}",
            json={"start_date": "2024-01-15", "finished_date": "2024-02-01"},
        )
        assert res.status_code == 200
        assert res.json()["duration_days"] == 17, (
            f"Precondition failed: duration_days={res.json().get('duration_days')!r}, expected 17"
        )

        # Clear finished_date (set to null), leaving only start_date
        res2 = client.patch(
            f"/books/{book['id']}",
            json={"finished_date": None},
        )
        assert res2.status_code == 200, f"Expected 200, got {res2.status_code}"
        body = res2.json()

        # finished_date should now be null/absent
        assert body.get("finished_date") is None, (
