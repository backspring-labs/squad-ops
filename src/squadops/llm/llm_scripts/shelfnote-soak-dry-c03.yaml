- task_type: strategy.propose_plan_guidance
  occurrence: 1
  call: 1
  content: |
    ```yaml:plan_guidance.yaml
    version: 1
    guidance_id: guid-c29a3b84
    source_brief_id: brief-prop_704137dc1a38-001
    proposing_role: strategy
    priority_guidance:
      - area: backend_implementation
        priority: high
        rationale: >
          The store query method and route handler form the integration anchor for the
          entire change. Every acceptance criterion depends on them being correct. The
          brief allocates 35% of the time budget here; treat it as the critical path.
      - area: test_authoring
        priority: high
        rationale: >
          The two criterion test files (tests/test_criterion_C1.py,
          tests/test_criterion_C2.py) are the sole evidence the criteria are met. They
          live in the product's root tests/ directory, which is outside the QA
          namespace (backend/tests/), so they are dev-owned. The QA proposer should
          not claim these files. Per CONTRIBUTING.md they must exercise the app
          through TestClient and must not import store or route internals.
      - area: verification_and_regression
        priority: high
        rationale: >
          All pre-existing tests (test_books_api, test_criterion_T1-T3,
          test_tags_t1-t2, test_search_t1-t3, test_sorting_t1, test_ratings_t3-t4,
          test_reading_status_t4-t8) must pass unmodified. A new route pattern or
          store method that shadows an existing path or mutates shared fixture state
          is a silent regression. The 30% allocation is appropriate and should not be
          compressed under schedule pressure.
    ordering_guidance:
      - before: "dev:store_related_query"
        after: "dev:route_related_handler"
        rationale: >
          The route handler delegates to store.get_related_books(book_id); the store
          method must be complete and correct (set-intersection semantics,
          self-exclusion, empty-tag short-circuit) before the handler wires it to
          the HTTP layer.
      - before: "dev:route_related_handler"
        after: "dev:criterion_test_files"
        rationale: >
          The criterion tests exercise the running app through TestClient. Authoring
          them after the handler exists lets the dev run them immediately and confirm
          behaviour, rather than writing tests against an unimplemented surface.
    risk_guidance:
      - target: "dev:store_related_query"
        risk: >
          Tag matching must use set intersection (set(tags_a) & set(tags_b)), not
          list equality (tags_a == tags_b). A book tagged ['fiction','romance'] must
          match a book tagged ['fiction']. The brief flags this as the primary
          correctness risk; the store method is where the bug would live. A
          list-equality implementation will pass the happy-path test if the fixture
          books happen to carry identical tag lists, but will fail on any book with
          a superset or subset tag list.
      - target: "dev:store_related_query"
        risk: >
          The query "find books whose tags overlap X" naturally returns the book
          whose tags define X. An explicit self-exclusion filter (skip entries
          where book_id equals the queried id) is required. Without it the
          happy-path result includes the queried book itself and the criterion
          fails.
      - target: "dev:store_related_query"
        risk: >
          A book with an empty or absent tag list must produce an empty result, not
          an exception or the full shelf. The store method should short-circuit
          before the intersection loop when the queried book has no tags, rather
          than iterating over an empty set and accidentally matching every book.
      - target: "dev:route_related_handler"
        risk: >
          The not-found response must originate from the handler's own store lookup
          (book id not found in the store dict), not from FastAPI's default
          unknown-path routing. The JSON body must carry an 'error' key. If the
          route path pattern accidentally shadows or conflicts with an existing
          path, the framework's default response fires instead and the body shape
          is wrong. Verify the path /books/{book_id}/related does not collide with
          any existing /books/{...} pattern already registered in routes.py.
      - target: "verification_and_regression"
        risk: >
          Adding a new route path and a new store method must not alter any shared
          fixture, change import order, or shadow an existing path pattern. Run the
          full pre-existing backend test suite and confirm zero failures before
          declaring the change complete. A single import-order shift in
          backend/store.py or backend/routes.py can break fixture isolation in
          conftest.py without any visible code change.
    time_budget_guidance:
      - area: backend_implementation
        budget_pct: 35
      - area: test_authoring
        budget_pct: 35
      - area: verification_and_regression
        budget_pct: 30
    scope_cut_guidance: []
    must_not_skip:
      - "All pre-existing backend tests pass unmodified (regression gate)"
      - "Tag intersection uses set overlap, not list equality"
      - "Not-found path returns a handler-generated response with an 'error' key, not a framework default"
      - "Empty-tag book yields an empty list, not an error or the full shelf"
    defer_if_time_constrained: []
    confidence: high
    ```
