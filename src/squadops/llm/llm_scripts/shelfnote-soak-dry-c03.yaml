          task whose expected_artifacts include each of these files." The product's
          pytest runner discovers test_*.py under the repository root, so these
          files are collected by backend_tests. This proposal follows the
          increment instructions, which take precedence over the brief's
          granularity guidance for this build.
    source_artifact_refs:
      - "change_request.yaml (prop_704137dc1a38)"
      - "technical_design.md"
      - "test_strategy.md"
    assumptions:
      - "The root conftest.py provides a fixture that creates a fresh TestClient(app) per test, isolating store state between tests."
      - "POST /books accepts a JSON body with 'title' and 'tags' keys and returns the created book's id, as exercised by existing tests (test_tags_t1.py, test_books_api.py)."
      - "backend/requirements.txt already declares fastapi, httpx, and pytest; the test files import only from fastapi.testclient and backend.main."
    risks:
