    ---
    readiness: go
    sufficiency_score: 5
    blocker_unknowns: 0
    ---

    ## Consolidated Plan

    ### 1. Change Summary

    This cycle adds a single new endpoint to the existing Shelfnote books API:

    - **`GET /books/{id}/related`** — returns other books that share at least one tag with the specified book.

    The change is purely additive. No existing endpoints, models, or files outside the footprint are modified. The accepted application's behaviour is preserved; this increment introduces one new surface.

    ### 2. Scope & Footprint

    | File | Action | Purpose |
    |------|--------|---------|
    | `backend/store.py` | Modify | Add `find_related_books(book_id)` method |
    | `backend/routes.py` | Modify | Add `GET /books/{id}/related` handler |
    | `tests/test_criterion_C1.py` | Create | Test C1: tag-based related books + empty-tag case |
    | `tests/test_criterion_C2.py` | Create | Test C2: 404 for non-existent book id |

    All other files retain their accepted implementation at the baseline commit.

    ### 3. Technical Design

    #### 3.1 `backend/store.py` — `find_related_books(book_id: int) -> list[Book] | None`

    New method on the existing store class:

    1. Look up the target book by `book_id`. Return `None` if not found (signals 404 to the route layer).
    2. Retrieve the target book's tag set. If the set is empty, return `[]`.
    3. Query for all books whose tag set intersects the target's tag set (i.e., share **at least one** tag — OR semantics across tags).
    4. Exclude the target book itself from the result.
    5. Return the resulting list of book objects.

    **Design notes:**
    - The tag association mechanism (join table or list column) is already established by the existing tag infrastructure (`test_tags_t1.py`, `test_tags_t2.py`). The method reuses whatever storage pattern `store.py` already uses for tags; it does not introduce a new schema.
    - The query is a simple filter: for each book, check if `set(book.tags) & set(target.tags) != set()`. For the in-memory store pattern this product uses, this is a linear scan with set intersection — trivially performant at the scale of a Shelfnote instance.
    - Return type is the same book representation the existing `get_book` and list endpoints return, so the route handler serialises it identically.

    #### 3.2 `backend/routes.py` — `GET /books/{id}/related`

    New route handler:

    ```
    @router.get("/books/{book_id}/related")
    async def get_related_books(book_id: int):
        book = store.find_related_books(book_id)
        if book is None:
            raise HTTPException(status_code=404, detail={"error": "Book not found"})
        return book
    ```

    **Design notes:**
    - The handler stays well under the 30-line limit in CONTRIBUTING.md.
    - 404 response follows the product's existing error convention (JSON body with an `"error"` key), consistent with `backend/errors.py` patterns used by other book endpoints.
    - On success, returns a JSON list of book objects (same shape as `GET /books` items). When the list is empty, returns `[]`.
    - No new Pydantic response model is needed if the existing book model is reused (and the model already exists in `backend/models.py` — which is **not** in the footprint, confirming we reuse it).

    #### 3.3 Error Semantics

    | Condition | Status | Body |
    |-----------|--------|------|
    | Book id not found | 404 | `{"error": "Book not found"}` (or equivalent existing error shape) |
    | Book exists, no tags | 200 | `[]` |
    | Book exists, has tags, related books exist | 200 | `[<book>, <book>, ...]` |
    | Book exists, has tags, no related books | 200 | `[]` |

    ### 4. Test Strategy

    #### 4.1 `tests/test_criterion_C1.py`

    Tests the happy-path and empty-tag behaviour:

    - **Setup**: Use the product's existing test fixtures (`conftest.py`) to create books via the API test client.
    - **Test C1a (shared tag)**:
      - Create book A with tag `"fiction"`, book B with tag `"fiction"`, book C with tag `"science"`.
      - `GET /books/{A_id}/related` → expect 200, response is a list.
      - Assert B's id **is** in the response.
      - Assert A's id is **not** in the response.
      - Assert C's id is **not** in the response.
    - **Test C1b (no tags)**:
      - Create book D with no tags.
      - `GET /books/{D_id}/related` → expect 200, response is `[]`.

    Tests use `TestClient` (per blueprint convention) and assert on response status + JSON body content. No import of the new function directly — tests exercise the running app's API surface only.

    #### 4.2 `tests/test_criterion_C2.py`

    Tests the not-found path:

    - `GET /books/99999/related` → expect HTTP 404.
    - Assert response JSON body contains an `"error"` key.

    Uses `TestClient`. No setup needed (the id simply doesn't exist).

    #### 4.3 Must-Not-Break Verification

    T1, T2, T3 (existing criterion tests) and all other existing test files in the repository run as part of the `backend_tests` check. The new code is purely additive (new method, new route), so existing behaviour is untouched. The plan does not modify any existing function signature, route, or model.

    ### 5. Execution Sequence

    | Step | Task | Agent | Est. Time |
    |------|------|-------|-----------|
    | 1 | Implement `find_related_books` in `backend/store.py` | dev | 15 min |
    | 2 | Implement `GET /books/{id}/related` handler in `backend/routes.py` | dev | 10 min |
    | 3 | Write `tests/test_criterion_C1.py` | qa | 15 min |
    | 4 | Write `tests/test_criterion_C2.py` | qa | 10 min |
    | 5 | Run full backend test suite; verify all pass including T1/T2/T3 | lead | 5 min |
    | 6 | Run `boots` check; verify import succeeds | lead | 2 min |

    Total estimated execution: **~57 minutes** (well within the 3-hour budget).

    ### 6. Sufficiency Assessment

    | Criterion | Rating | Rationale |
    |-----------|--------|-----------|
    | Scope clarity | 5/5 | Footprint is 4 files. One new endpoint. Two criteria with exact observables. No ambiguity in what changes and what doesn't. |
    | Technical feasibility | 5/5 | Tag storage and book lookup patterns are already proven in the codebase. The new method is a filter+intersection over existing data. No new dependencies, no schema changes, no frontend work. |
    | Risk coverage | 4/5 | The only mild risk is the OR-semantics of "share at least one tag" — but this is explicitly stated in C1 and is a one-line set intersection. No architectural or integration risk. No new external systems touched. |
    | Test strategy alignment | 5/5 | C1 tests both the positive (shared tag → included) and negative (different tag → excluded, self → excluded) cases plus the empty-tag edge. C2 tests the 404 path. Must-not-break is covered by the full-suite run. Every risk area (404, empty list, exclusion, inclusion) has a test assertion. |
    | Resource fit | 5/5 | Backend-only, two files modified, two test files created. Matches the FastAPI/blueprint conventions exactly. No frontend, no infra, no new deps. Squad has all required capabilities. |

    **Overall sufficiency score: 5**

    ### 7. Blocker Unknowns

    None. All inputs to the design are determined:
    - Tag storage mechanism exists and is proven by existing tests.
    - Book model and serialization pattern exist.
    - Error response shape exists (404 with `"error"` key).
    - Test fixture patterns exist in `conftest.py`.
    - The ruling note is procedural (approval confirmation) and imposes no additional design constraints beyond the change request itself.

    ### 8. Readiness Recommendation

    **`go`**

    The plan is fully specified, technically feasible, testable, and fits comfortably within the time budget. No unknowns block implementation. The change is additive, low-risk, and bounded to four files. The squad can execute it in a single focused session.
