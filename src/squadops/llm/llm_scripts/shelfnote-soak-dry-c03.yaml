      GET /books/{id}/related endpoint. Task 1 (C1) exercises the 200-path:
      tag-intersection correctness (set overlap, not equality), self-exclusion,
      non-matching book exclusion, empty-tag boundary, and the no-other-match
      edge. Task 2 (C2) exercises the 404-path: unknown book id produces the
      endpoint's own error response with an 'error' key, distinguishable from
      FastAPI's default unknown-route 404. Both suites use TestClient against
      backend.main, assert on HTTP response shape, and import no store or route
      internals. Regression on T1–T3 is covered by the framework's frozen-criterion
      re-run, not by a separate qa task.
    tasks:
      - task_type: qa.test
        role: qa
        focus: "Criterion C1 related-books integration tests"
        description: |
          Faults this suite distinguishes from correct behaviour:

          1. Tag-intersection implemented as list equality instead of set overlap —
             a book tagged [fiction, romance] would fail to match a book tagged
             [fiction]. Caught by creating two books that share one tag out of
             different-sized tag lists and asserting the match appears.

          2. Self-exclusion omitted — the queried book appears in its own related
             list because its tags trivially intersect itself. Caught by asserting
             the queried book's id is absent from the response list.

          3. False-positive inclusion — a book sharing no tag with the queried
             book appears in the list. Caught by asserting a non-overlapping book's
             id is absent.

          4. Empty-tag boundary mishandled — a book with zero tags returns an
             error, the full shelf, or a non-empty list instead of an empty list.
             Caught by querying a tagless book and asserting the body is [].

          5. Multi-tag duplication — a book sharing two tags with the queried book
             appears twice in the list. Caught by creating books with two shared
             tags and asserting each book's id appears at most once.

          6. No-other-match edge — a book has tags but no other book shares any of
             them; the list should be empty. Caught by a singleton-tagged book
             with no peer.

          All tests are self-contained: they create their fixture books via the
          POST /books endpoint within the test, then call GET /books/{id}/related.
        expected_artifacts:
          - "tests/test_criterion_C1.py"
        acceptance_criteria:
          - check: function_defined
            file: tests/test_criterion_C1.py
            name_prefix: "test_"
            min_count: 4
            severity: error
          - "Tests exercise the app exclusively through FastAPI TestClient; no import of backend.store or backend.routes internals."
          - "Each test asserts on the HTTP response: status code, JSON body structure (list of dicts with id fields), membership, and length."
          - "Tag-intersection test uses books with different-length tag lists sharing one common tag (set overlap, not equality)."
          - "Self-exclusion is asserted in the same test that asserts a matching book IS present."
          - "Empty-tag test creates a book with an explicit empty tag list and asserts the response body is an empty JSON list."
          - "Multi-tag test creates books sharing two tags and asserts each related book's id appears exactly once in the list."
        depends_on_focus:
          - "dev:Related books endpoint (store + route)"

      - task_type: qa.test
        role: qa
        focus: "Criterion C2 404 semantic-error test"
        description: |
          Faults this suite distinguishes from correct behaviour:

          1. Missing route — if the handler is absent, FastAPI returns its default
             unknown-path 404 whose body is a bare string ({"detail":
             "Not Found"}), not a dict with an 'error' key. The test asserts the
             body is a JSON object containing the key 'error', which fails on the
             default 404 and passes only when the endpoint's own logic produces
             the response.

          2. Wrong error shape — the 404 body uses a different key (e.g.
             'detail' only) or returns a non-JSON body. Caught by asserting
             response.json() is a dict and 'error' is a key in it.

          3. Store lookup returns the book instead of None for an unknown id —
             the 404 is never raised. Caught by querying an id guaranteed not to
             exist (a large number no prior test creates) and asserting the
             response is not a 200.

          The test is minimal: one request to a non-existent id, assertions on
          status and body shape.
        expected_artifacts:
