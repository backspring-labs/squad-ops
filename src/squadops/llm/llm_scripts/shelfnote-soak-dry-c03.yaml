    ```python:tests/test_criterion_C1.py
    """Criterion C1/C2: GET /books/{id}/related — tag-intersection matching,
    self-exclusion, empty-tag boundary, multi-tag dedup, no-match edge, and 404."""


    def _create_book(client, title="T", author="A", added_by="U"):
        """POST a book and return its JSON dict."""
        res = client.post("/books", json={"title": title, "author": author, "added_by": added_by})
        assert res.status_code == 201
        return res.json()


    def _add_tags(client, book_id, tags):
        """Add one or more tags to a book via POST /books/{id}/tags."""
        for tag in tags:
            res = client.post(f"/books/{book_id}/tags", json={"tag": tag})
            assert res.status_code == 200


    def test_tag_intersection_set_overlap_not_equality(client):
        """Books with different-length tag lists that share one tag must match.

        Faults caught:
          1. Tag-intersection implemented as list equality (not set overlap).
          2. Self-exclusion omitted (queried book appears in its own list).
          3. False-positive inclusion (non-overlapping book appears).

        C1 observable: A tagged [fiction, romance], B tagged [fiction], C tagged [science].
        GET /books/{A}/related → 200, list contains B, NOT A, NOT C.
        """
        book_a = _create_book(client, title="Book A", author="AuthA")
        book_b = _create_book(client, title="Book B", author="AuthB")
        book_c = _create_book(client, title="Book C", author="AuthC")

        _add_tags(client, book_a["id"], ["fiction", "romance"])
        _add_tags(client, book_b["id"], ["fiction"])
        _add_tags(client, book_c["id"], ["science"])

        res = client.get(f"/books/{book_a['id']}/related")
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()
        assert isinstance(body, list), f"Expected JSON list, got {type(body).__name__}"

        related_ids = [b["id"] for b in body]

        # Fault 1: B shares 'fiction' with A despite different list lengths → must be present
        assert book_b["id"] in related_ids, (
            f"Book B (tags ['fiction']) should match Book A (tags ['fiction','romance']) "
            f"via set overlap, but is absent from {related_ids}"
        )

        # Fault 2: self-exclusion
        assert book_a["id"] not in related_ids, (
            f"Queried book A must not appear in its own related list: {related_ids}"
        )

        # Fault 3: false-positive — C shares no tag with A
        assert book_c["id"] not in related_ids, (
            f"Book C (tags ['science']) shares no tag with Book A; must be absent: {related_ids}"
        )


    def test_empty_tags_returns_empty_list(client):
        """A book with zero tags → GET /books/{id}/related returns 200 with body [].

        Fault caught: empty-tag boundary mishandled — returns error, full shelf,
        or a non-empty list instead of [].
        """
        book_d = _create_book(client, title="Untagged Book", author="NoTags")

        # Verify the book truly has no tags
        detail = client.get(f"/books/{book_d['id']}")
        assert detail.status_code == 200
        assert detail.json()["tags"] == [], "Precondition: book should have no tags"

        res = client.get(f"/books/{book_d['id']}/related")
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()
        assert isinstance(body, list), f"Expected JSON list, got {type(body).__name__}"
        assert body == [], f"Expected empty list for tagless book, got {body}"


    def test_multi_tag_sharing_no_duplication(client):
        """Books sharing two tags appear at most once in the related list.

        Fault caught: multi-tag duplication — a book matching on two tags is
        listed twice.
        """
        book_x = _create_book(client, title="Book X", author="X")
        book_y = _create_book(client, title="Book Y", author="Y")

        _add_tags(client, book_x["id"], ["fantasy", "adventure"])
        _add_tags(client, book_y["id"], ["fantasy", "adventure"])

        res = client.get(f"/books/{book_x['id']}/related")
        assert res.status_code == 200
        body = res.json()
        assert isinstance(body, list)

