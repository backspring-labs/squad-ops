- task_type: development.design_plan
  occurrence: 1
  call: 1
  content: |-
    # Technical Design: GET /books/{id}/related

    ## 1. Architecture Overview

    This change adds a single read-only endpoint to the existing Shelfnote books API. The existing product already has a tag system (exercised by `tests/test_tags_t1.py` and `tests/test_tags_t2.py`). The new endpoint queries the tag relationship between books at the store layer and exposes it through a thin route handler.

    **Component interaction (unchanged layers shown for context):**

    ```
    TestClient (tests/test_criterion_C1.py, C2.py)
        │
        ▼
    backend/routes.py  ── new handler: get_related_books(book_id: int)
        │
        ▼
    backend/store.py   ── new method: get_related_books(book_id: int) -> list[Book] | None
        │
        ▼
    In-memory / persistence store (existing tag and book collections)
    ```

    No new models, no new files outside the footprint, no changes to the frontend, no changes to `main.py`, `errors.py`, or `models.py`.

    ---

    ## 2. Interface Definitions

    ### 2.1 Store Method — `store.py`

    ```python
    def get_related_books(self, book_id: int) -> list[dict] | None:
        """
        Return books that share at least one tag with the given book,
        excluding the book itself.

        Returns:
            - None            → book_id does not exist (caller maps to 404)
            - []              → book exists but has no tags
            - list[dict]      → list of book dicts (same shape as list endpoint items)
        """
    ```

    **Contract details:**
    - "Share at least one tag" is an OR-union: if book A has tags `{fiction, mystery}` and book B has tags `{mystery, sci-fi}`, they are related (share `mystery`).
    - The book itself is always excluded, even if it would match its own tags.
    - Order of results: unspecified by the criteria. Use insertion order / creation order (stable, deterministic for tests).
    - No deduplication needed beyond the self-exclusion (a book appears at most once in the store).

    ### 2.2 Route Handler — `routes.py`

    ```python
    @router.get("/books/{book_id}/related")
    async def get_related_books(book_id: int):
        related = store.get_related_books(book_id)
        if related is None:
            raise HTTPException(status_code=404, detail={"error": "Book not found"})
        return related
    ```

    **Response shapes:**

    | Condition | Status | Body |
    |-----------|--------|------|
    | Book exists, has tags, related books exist | 200 | `[{ "id": 2, "title": "...", "tags": [...], ... }, ...]` |
    | Book exists, has tags, no other books share them | 200 | `[]` |
    | Book exists, has no tags | 200 | `[]` |
    | Book does not exist | 404 | `{ "error": "Book not found" }` |

    The 404 body contains an `error` key as required by criterion C2. The exact error string follows the product's existing error convention (the handler in `routes.py` already raises `HTTPException` with a `detail` dict for other 404s; this stays consistent).

    **Handler is 5 lines** — well under the 30-line limit in CONTRIBUTING.md.

    ### 2.3 What the response list contains

    Each item in the 200 response is the same book dict the existing `GET /books` list endpoint returns (id, title, tags, etc.). This is the conventional choice for a "related items" endpoint: the client receives enough to render without an additional round-trip. The criteria's observable ("a list containing B's id") is satisfied because each item carries its `id`.

    ---

    ## 3. Implementation Sequencing

    | Phase | Action | Files | Depends on |
    |-------|--------|-------|------------|
    | 1 | Add `get_related_books` method to the store class | `backend/store.py` | — |
    | 2 | Add `GET /books/{book_id}/related` route handler | `backend/routes.py` | Phase 1 |
    | 3 | Write `tests/test_criterion_C1.py` (shared-tag + no-tag cases) | `tests/test_criterion_C1.py` | Phase 2 |
    | 4 | Write `tests/test_criterion_C2.py` (404 case) | `tests/test_criterion_C2.py` | Phase 2 |
    | 5 | Run full test suite; confirm T1–T3 still pass | (all) | Phase 4 |

    Phase 1 and 2 are small and tightly coupled; they can be done in one sitting. Phases 3–4 are independent of each other and can be written in parallel. Total estimated implementation time: **~40 minutes** (well within the 3-hour budget).

    ---

    ## 4. Proto Validation Plan

    This change is low-risk: it adds a read-only query over existing data structures. No new dependencies, no schema migration, no concurrency concern (in-memory store, read-only). A throwaway prototype is **not warranted** — the feasibility question ("can I iterate over tags and find other books?") is trivially yes and will be proven by the first test run in Phase 5.

    If, during implementation, the store's tag representation turns out to be non-trivial (e.g., tags stored as a joined string rather than a list), a 10-minute spike to confirm the access pattern would be the only proto work. I classify this as a **resolved** unknown (see below) because the existing tag tests (`test_tags_t1.py`, `test_tags_t2.py`) already exercise tag add/list, confirming the representation.

    **No proto phase is scheduled.** Implementation proceeds directly to Phase 1.

    ---

    ## 5. Test Design

    ### `tests/test_criterion_C1.py`

    ```python
    """Criterion C1: GET /books/{id}/related returns books sharing ≥1 tag."""
    import pytest
    from fastapi.testclient import TestClient
    from backend.main import app

    client = TestClient(app)

    def _create_book(title, tags=None):
        r = client.post("/books", json={"title": title, "tags": tags or []})
        assert r.status_code in (200, 201)
        return r.json()["id"]

    def test_related_books_share_tag():
        a = _create_book("A", ["fiction"])
        b = _create_book("B", ["fiction"])
        c = _create_book("C", ["science"])

        r = client.get(f"/books/{a}/related")
        assert r.status_code == 200
        ids = [item["id"] for item in r.json()]
        assert b in ids
        assert a not in ids
        assert c not in ids

    def test_no_tags_returns_empty_list():
        d = _create_book("D", [])
        _create_book("E", ["fiction"])

        r = client.get(f"/books/{d}/related")
        assert r.status_code == 200
        assert r.json() == []
    ```

    ### `tests/test_criterion_C2.py`

    ```python
    """Criterion C2: GET /books/{id}/related returns 404 for unknown book."""
    from fastapi.testclient import TestClient
    from backend.main import app

    client = TestClient(app)

    def test_nonexistent_book_returns_404():
        r = client.get("/books/99999/related")
        assert r.status_code == 404
        body = r.json()
        assert "error" in body
    ```

    Both files follow the product's convention: pytest, `TestClient`, no running server, fail on response content, import only `backend.main` (declared in `requirements.txt`).

    ---

    ## 6. Unknown Classification

    | # | Unknown | Classification | Rationale |
    |---|---------|---------------|-----------|
    | 1 | How are tags stored per book (list vs. string vs. junction)? | **resolved** | Existing tag tests (`test_tags_t1.py`, `test_tags_t2.py`) create books with tag lists and list them back. The store exposes tags as a list on each book dict. |
    | 2 | Does the store use in-memory dicts or a DB? | **resolved** | `store.py` is 5 KB, no external DB in `requirements.txt`. In-memory dict/list. No concurrency concerns for a read-only query. |
    | 3 | What is the exact book dict shape returned by `GET /books`? | **resolved** | Existing tests reference `id`, `title`, `tags` fields. The related endpoint returns the same shape — no new model needed. |
    | 4 | How does the existing 404 error body look (exact key name)? | **resolved** | Criterion C2 specifies "a JSON body containing an 'error' key." The existing `errors.py` module (1.9 KB) handles error responses. The handler will use `HTTPException(detail={"error": ...})` or the product's existing pattern — either way the key is `error`. |
    | 5 | Should related books be deduplicated if they share multiple tags? | **resolved** | "Share at least one tag" is a set-membership test. Each book appears once in the store; no duplicates are possible. |
    | 6 | Ordering of the related list | **acceptable_risk** | Criteria do not specify order. Tests assert membership, not order. Implementation returns in store iteration order (deterministic for a given seed). If a future criterion requires sorting, it will be a separate change. |
    | 7 | Performance with many tags / many books | **acceptable_risk** | In-memory store, small dataset. O(n) scan over books is fine. No index needed at this scale. If the product migrates to a DB, the store method's signature stays the same. |

    **No `blocker`, `requires_human_decision`, or `proto_validated` items.**

    ---

    ## 7. Risk & Mitigation Summary

    | Risk | Likelihood | Mitigation |
    |------|-----------|------------|
    | Breaking T1–T3 by modifying `store.py` | Low | Add method only; do not alter existing method signatures or behavior. Run full suite in Phase 5. |
    | Route path collision with existing `/books/{id}` routes | Low | `/books/{id}/related` is a distinct path segment. FastAPI matches on full path. No wildcard conflict expected. |
    | Test isolation (tests mutating shared store state) | Low | Existing `conftest.py` (1102 bytes) likely provides fixture-based state reset or a fresh app per test. New tests follow the same pattern. |

    ---

    ## 8. Explicit Deferral (Out of Budget / Out of Scope)

    - **Frontend view for related books**: The footprint does not include any `frontend/` files. A UI for displaying related books is a future change request.
    - **Pagination / sorting on the related list**: Not in the criteria. Defer.
    - **Tag-based search vs. related**: The existing search endpoint (`/books?tag=...`) already handles tag filtering. No overlap to resolve.
    - **Caching or indexing**: In-memory store, trivial dataset. Defer until performance becomes a concern.

    ---

    ## 9. Checklist for Execution

    - [ ] `backend/store.py` — emit full file with new `get_related_books` method added
    - [ ] `backend/routes.py` — emit full file with new `@router.get("/books/{book_id}/related")` handler added
    - [ ] `tests/test_criterion_C1.py` — new file, two test functions
    - [ ] `tests/test_criterion_C2.py` — new file, one test function
    - [ ] Run `pytest -q -p no:cacheprovider` — all pass including T1, T2, T3
    - [ ] Confirm handler is ≤ 30 lines
    - [ ] Confirm no imports outside `backend.main` in test files
    - [ ] Confirm no file outside footprint is modified
- task_type: qa.define_test_strategy
  occurrence: 1
  call: 1
  content: |-
    # QA Test Strategy: `GET /books/{id}/related`

    **Change:** `prop_704137dc1a38` · **Backlog item:** SN-8 · **Goals revision:** 3
    **Footprint:** `backend/routes.py`, `backend/store.py`, `tests/test_criterion_C1.py`, `tests/test_criterion_C2.py`
    **Time budget:** 3 h

    ---

    ## 1. Acceptance Checklist

    Each item is a concrete pass/fail gate for implementation review. All must hold before the cycle is approved.

    ### Criterion C1 — Related books by shared tag

    - [ ] **AC-1.1** `GET /books/{A_id}/related` returns **HTTP 200** when book A exists and has at least one tag.
    - [ ] **AC-1.2** The response body is a JSON **list**.
    - [ ] **AC-1.3** The list **contains** the id of every other book that shares ≥ 1 tag with book A. In the canonical scenario (A:fiction, B:fiction, C:science), B's id is present.
    - [ ] **AC-1.4** The list does **not** contain book A's own id (self-exclusion).
    - [ ] **AC-1.5** The list does **not** contain book C's id (C shares no tag with A).
    - [ ] **AC-1.6** When book D has **no tags**, `GET /books/{D_id}/related` returns **HTTP 200** with an **empty list** (`[]`).
    - [ ] **AC-1.7** (Edge) If two books share **multiple** tags, the book appears in the list **once**, not once per shared tag.
    - [ ] **AC-1.8** (Edge) If the book has tags but no *other* book shares any of them, the list is **empty**.

    ### Criterion C2 — Unknown book id

    - [ ] **AC-2.1** `GET /books/99999/related` (id that does not exist) returns **HTTP 404**.
    - [ ] **AC-2.2** The 404 response body is JSON and contains a key named **`error`**.
    - [ ] **AC-2.3** The 404 is produced by the endpoint's own logic (store lookup returns nothing → explicit 404), **not** by FastAPI's default path-not-found. Verify by confirming the response `Content-Type` is `application/json` and the body is a dict, not a bare string.

    ### Must-not-break regression

    - [ ] **AC-3.1** `tests/test_criterion_T1.py` passes unmodified.
    - [ ] **AC-3.2** `tests/test_criterion_T2.py` passes unmodified.
    - [ ] **AC-3.3** `tests/test_criterion_T3.py` passes unmodified.
    - [ ] **AC-3.4** All other existing backend tests (`tests/test_*.py`) pass unmodified.

    ### Build & style gates

    - [ ] **AC-4.1** `boots` check passes: `.venv/bin/python -c "from backend.main import app"` succeeds.
    - [ ] **AC-4.2** The new route handler in `backend/routes.py` is **≤ 30 lines** (per CONTRIBUTING.md).
    - [ ] **AC-4.3** New test files import only packages declared in `backend/requirements.txt` (pytest, httpx/FastAPI TestClient, etc.). No undeclared imports.
    - [ ] **AC-4.4** Tests exercise the running app's API through the test client (`TestClient` or `httpx.AsyncClient`); they assert on response status and body, not on internal function imports.

    ---

    ## 2. Test Strategy Note

    ### Scope of verification

    This is a **backend-only** change. Two files are touched (`routes.py`, `store.py`) and two test files are added. No frontend file is in the footprint.

    | Layer | In scope? | Rationale |
    |---|---|---|
    | Unit (store logic) | **Yes** | Tag-intersection and self-exclusion logic lives in `store.py`. Verified indirectly through the endpoint; no separate unit harness needed given the product's convention of testing through `TestClient`. |
    | Integration (route → store → response) | **Yes** | The two criterion tests are integration tests: they set up books via the API, call the new endpoint, and assert on the response. This is the primary verification layer. |
    | Contract (response shape) | **Yes** | AC-1.2, AC-2.2 pin the response as a JSON list / JSON object with `error` key. Enforced inside the same integration tests. |
    | E2E / frontend | **No** | No frontend files changed. `frontend_tests` runner is not affected. |
    | Regression | **Yes** | `must_not_break` names T1–T3. The full `backend_tests` run covers all existing tests. |

    ### Test file layout (already fixed by the change request)

    ```
    tests/test_criterion_C1.py   ← criterion C1 (200 + related-list behaviour)
    tests/test_criterion_C2.py   ← criterion C2 (404 + error body)
    ```

    Both files live under `tests/`, are named `test_*.py`, and will be discovered by the `pytest` runner (`backend_tests` check). They follow the product's existing pattern (see `tests/test_tags_t1.py` for the fixture/setup idiom).

    ### What the tests must and must not do

    - **Must:** create their own fixture data (books + tags) through the API so the tests are self-contained and do not depend on execution order.
    - **Must:** assert on **status code** and **response body** (ids present/absent, list empty, `error` key present).
    - **Must not:** import `store.py` or `routes.py` internals. The test asserts the observable HTTP contract.
    - **Must not:** depend on a pre-seeded database state. Use the product's existing `conftest.py` fixtures (or a local fixture) to create and clean up data.
    - **Must not:** test the generic "unknown path → 404" FastAPI behaviour as if it were the endpoint's 404. The 404 here is a *semantic* 404 (book not found), distinguishable from a *routing* 404.

    ### Execution order for verification

    1. `boots` — app imports cleanly.
    2. `backend_tests` — full pytest run including the two new files and all pre-existing tests.
    3. `frontend_tests` — vitest run (expected unchanged; confirms no accidental frontend breakage).

    No separate contract or E2E run is required.

    ---

    ## 3. Defect Severity Rubric

    Use this rubric to classify any defect found during implementation or review.

    | Severity | Label | Definition | Example (this change) |
    |---|---|---|---|
    | **S0** | Blocker | The endpoint does not exist, returns the wrong status code for its primary path, or the app fails to boot. Cycle cannot ship. | `GET /books/{id}/related` returns 500; `boots` check fails; handler references an undefined store method. |
    | **S1** | Critical | Correct status code, but the returned data is wrong in a way that violates the criterion's core statement. | Related list **includes** the book's own id; list includes a book that shares **no** tag; list is empty when it should contain a match. |
    | **S2** | Major | Response shape or format deviates from the observable, but the semantic content is recoverable. | 404 body is `{"detail": "Not Found"}` instead of `{"error": "..."}` (missing the `error` key the criterion names). Response is a JSON object instead of a list. Duplicate entries for a book sharing multiple tags. |
    | **S3** | Minor | Cosmetic or low-impact deviation that does not affect the criterion's observable. | Related books returned in non-deterministic order (criterion does not mandate order). Trailing whitespace in error message. |
    | **S4** | Informational | Style, naming, or documentation nit. No functional impact. | Handler exceeds 30 lines by one. Variable named `related` instead of `related_books`. |

    **Gate rule:** The cycle passes only with **zero** S0 and S1 defects. S2 defects are blocking for the specific criterion they touch but do not block unrelated criteria. S3/S4 are advisory.

    ---

    ## 4. Risk-Based Test Priorities

    Ranked by likelihood of defect × impact if missed.

    | Priority | Area | Why it is risky | What to verify (checklist ref) |
    |---|---|---|---|
    | **P1** | **Self-exclusion** in tag intersection | Most common off-by-one: the query "find books with tags in X" naturally includes the book whose tags *define* X. The criterion explicitly requires exclusion. | AC-1.4 — A's id absent from its own related list. |
    | **P2** | **Tag-intersection correctness** (no false positives / no false negatives) | The store must match on *set overlap*, not equality. A book tagged `['fiction','romance']` must match a book tagged `['fiction']`. A book tagged `['science']` must **not** match. | AC-1.3 (B present), AC-1.5 (C absent), AC-1.7 (multi-tag no duplication). |
    | **P3** | **Empty-tag boundary** | Book with zero tags: the "find books sharing a tag" query could error, return all books, or return empty depending on implementation. Criterion says empty list. | AC-1.6. |
    | **P4** | **Semantic 404 vs routing 404** | FastAPI returns 404 for unknown paths by default. The criterion requires the endpoint to *exist* and return 404 from its own logic. A test that only checks "status == 404" passes even if the route is missing. The test must also verify the body shape (`error` key, JSON content-type). | AC-2.1, AC-2.2, AC-2.3. |
    | **P5** | **Regression on existing endpoints** | Adding a route and store method could shadow an existing path, alter a shared fixture, or change import order. The `must_not_break` list names T1–T3, but *all* existing tests are in scope. | AC-3.1 – AC-3.4. Full `backend_tests` run. |
    | **P6** | **Handler line count / style** | CONTRIBUTING.md caps the handler at 30 lines. If the handler inlines logic that belongs in `store.py`, it may exceed the cap. | AC-4.2. |

    ---

    ## 5. Notes & Constraints

    - **No frontend work.** The footprint contains no `frontend/` path. The `frontend_tests` check runs to confirm no accidental breakage, but no new vitest file is expected or required.
    - **No prd_delta / manifest_delta.** The requirements and interface are unchanged except for the two criteria. Do not re-derive or re-test behaviour outside C1/C2.
    - **Reviewer notes.** The ruling note ("unattended recording: approved as it stands") imposes no additional behavioural requirement beyond the change request. No extra criteria are introduced.
    - **Time budget.** 3 hours is sufficient for two integration test files (~40–80 lines each) and one endpoint + store method. No out-of-budget work is identified. If the store method for tag lookup does not yet exist, it is within the footprint (`store.py`) and is part of this cycle's implementation, not a deferred item.

    ---

    *End of test strategy. This document defines what to verify and how; the actual test code is produced during the implementation workload in `tests/test_criterion_C1.py` and `tests/test_criterion_C2.py`.*
