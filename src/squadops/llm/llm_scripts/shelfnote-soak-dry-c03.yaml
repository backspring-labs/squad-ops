          - "Test exercises the app through FastAPI TestClient; no import of backend.store or backend.routes internals."
          - "Asserts the response status indicates 'not found' (404) for a book id that does not exist in the store."
          - "Asserts the response body, parsed as JSON, is a dict containing the key 'error'."
          - "The 404 is verified as the endpoint's own semantic error (JSON dict with 'error' key), not FastAPI's default unknown-route response (bare string or 'detail'-only body)."
        depends_on_focus:
          - "dev:Related books endpoint (store + route)"
    brief_conflicts:
      - field: task_granularity_guidance
        brief_says: "No separate qa task is needed because the test files live at root tests/ (the product's convention), which is outside the qa namespace (backend/tests/) that the plan-shape rules assign to the qa role."
