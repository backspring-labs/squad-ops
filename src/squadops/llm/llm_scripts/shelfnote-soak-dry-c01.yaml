      - "GET /stats route handler in backend/routes.py"
      - "T1 test suite (status_counts) in backend/tests/test_criterion_T1.py"
      - "T2 test suite (average_rating) in backend/tests/test_criterion_T2.py"
    dependency_assumptions:
      - "The existing in-memory collection in store.py holds all book records and is iterable (confirmed by existing routes that list, search, and sort books)"
      - "The canonical set of book status values is defined as a constant or enum in backend/models.py (exercised by the seven existing test_reading_status_* files)"
      - "Books carry an optional rating field (exercised by test_ratings_t3.py and test_ratings_t4.py); the field is null/absent when a book is unrated"
