    """T1: GET /stats — status_counts has every canonical status as an integer key-value,
    zero-count statuses present as 0, no extra keys."""

    CANONICAL_STATUSES = {"wanted", "being read", "read"}


    def _make_book(client, title="T", author="A", added_by="U"):
        """POST a book and return its JSON dict."""
        res = client.post("/books", json={"title": title, "author": author, "added_by": added_by})
        assert res.status_code == 201
        return res.json()


    def _set_status(client, book_id, status):
        """PATCH a book's status and assert 200."""
        res = client.patch(f"/books/{book_id}", json={"status": status})
        assert res.status_code == 200


    def test_empty_shelf_returns_all_zero_counts(client):
        """A fresh, unseeded shelf: GET /stats → 200, status_counts has all canonical
        statuses with value 0.

        Faults caught: endpoint missing (404/405), empty object {}, error response,
        or zero-count statuses omitted.
        """
        res = client.get("/stats")
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()
        assert "status_counts" in body, f"Missing status_counts: {body}"
        sc = body["status_counts"]
        assert isinstance(sc, dict), f"status_counts is not a dict: {type(sc)}"
        assert set(sc.keys()) == CANONICAL_STATUSES, (
            f"Keys {set(sc.keys())} != canonical {CANONICAL_STATUSES}"
        )
        for status in CANONICAL_STATUSES:
            assert sc[status] == 0, f"Expected 0 for '{status}', got {sc[status]!r}"


    def test_exact_counts_for_known_mix(client):
        """Seed 3 'wanted', 2 'being read', 1 'read' → status_counts matches exactly.

        Faults caught: off-by-one, wrong status tallied, or count swapped between keys.
        """
        for _ in range(3):
            b = _make_book(client)
            _set_status(client, b["id"], "wanted")
        for _ in range(2):
            b = _make_book(client)
            _set_status(client, b["id"], "being read")
        b = _make_book(client)
        _set_status(client, b["id"], "read")

        res = client.get("/stats")
        assert res.status_code == 200
        sc = res.json()["status_counts"]
        assert sc["wanted"] == 3, f"Expected 3 wanted, got {sc['wanted']}"
        assert sc["being read"] == 2, f"Expected 2 being read, got {sc['being read']}"
        assert sc["read"] == 1, f"Expected 1 read, got {sc['read']}"


    def test_all_keys_present_when_only_subset_seeded(client):
        """Seed books in only 'read'; 'wanted' and 'being read' must still appear as 0.

        Fault caught: zero-count statuses omitted from the response (missing key
        instead of value 0).
        """
        for _ in range(2):
            b = _make_book(client)
            _set_status(client, b["id"], "read")

        res = client.get("/stats")
        assert res.status_code == 200
        sc = res.json()["status_counts"]

        # Every canonical key must be present, even if no book holds it
        for status in CANONICAL_STATUSES:
            assert status in sc, f"Key '{status}' missing from status_counts: {sc}"

        assert sc["wanted"] == 0
        assert sc["being read"] == 0
        assert sc["read"] == 2


    def test_counts_are_integers_and_no_extra_keys(client):
        """Every value is an int (not float, not string); key set equals canonical set exactly.

        Faults caught: counts returned as 3.0 or "3"; extra keys like "archived"
        leaking into status_counts.
        """
        b = _make_book(client)
        _set_status(client, b["id"], "wanted")

        res = client.get("/stats")
        assert res.status_code == 200
        sc = res.json()["status_counts"]

        # Values are integers, not floats or strings
        for key, val in sc.items():
            assert isinstance(val, int), (
                f"status_counts['{key}'] is {type(val).__name__} ({val!r}), expected int"
            )
            assert not isinstance(val, bool), f"status_counts['{key}'] is a bool"

        # No extra keys beyond the canonical set
        assert set(sc.keys()) == CANONICAL_STATUSES, (
            f"status_counts keys {set(sc.keys())} != canonical {CANONICAL_STATUSES}"
        )
    ```
