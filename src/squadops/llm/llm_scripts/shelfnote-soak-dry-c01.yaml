      tests: 50
      verification_and_fixup: 20
    task_granularity_guidance: "Aim for 2-5 minute LLM generations per task: one task for the store functions plus route handler, one task per test file, with each test file containing 3-6 focused test functions."
    artifact_naming_conventions:
