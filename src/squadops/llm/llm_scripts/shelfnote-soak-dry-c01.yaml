- task_type: strategy.propose_plan_guidance
  occurrence: 1
  call: 1
  content: |
    ```yaml:plan_guidance.yaml
    version: 1
    guidance_id: guid-26f8dd8c
    source_brief_id: brief-sn6-stats-001
    proposing_role: strategy
    priority_guidance:
      - area: store_aggregation
        priority: high
        rationale: |
          The two store functions carry the entire correctness burden: counting
          by exact model status strings, seeding zero-count statuses, and
          computing the mean over rated-only books. Every downstream consumer
          (route handler, both test suites) is correct only if these functions
          are correct. Prioritize careful implementation and review here.
      - area: test_suites
        priority: high
        rationale: |
          The brief allocates 50% of budget to tests and CONTRIBUTING.md
          mandates TestClient-exercised tests that fail on response content,
          not on imports. The T1 and T2 suites are the primary verification
          mechanism for type fidelity (int vs float, null vs 0), zero-count
          presence, and empty-shelf edge cases. They must be thorough, not
          merely present.
      - area: route_handler
        priority: medium
        rationale: |
          The handler is a thin pass-through (under 30 lines per
          CONTRIBUTING.md) that calls the two store functions and returns the
          result. Low intrinsic complexity, but it is the seam where type
          fidelity of the JSON response is established, so it should still
          receive explicit attention to JSON encoding (int not float, null
          not 0).
    ordering_guidance:
      - before: "dev:route_handler"
        after: "dev:store_aggregation"
        rationale: |
          The route handler calls get_status_counts and get_average_rating.
          The store functions must exist (with correct signatures and return
          types) before the handler can be written and verified.
      - before: "qa:test_t1_status_counts"
        after: "dev:route_handler"
        rationale: |
          T1 tests exercise the running app via TestClient against GET /stats.
          The route must be registered and the store functions wired in before
          the test file can be authored and run.
      - before: "qa:test_t2_average_rating"
        after: "dev:route_handler"
        rationale: |
          Same dependency as T1: the route and store functions must be in
          place before T2 tests can exercise the average_rating field through
          the TestClient.
    risk_guidance:
      - target: "dev:store_aggregation"
        risk: |
          The get_status_counts function must seed every status value defined
          in models.py at 0 before incrementing. If the implementer iterates
          only over the in-memory collection, zero-count statuses will be
          missing from the response. The function must import or reference
          the canonical status set from models.py, not derive it from the
          current collection contents.
      - target: "dev:store_aggregation"
        risk: |
          The get_average_rating function must exclude unrated books (rating
          is null/absent) from both numerator and denominator. A common
          failure is including a 0 or None in the mean calculation, which
          shifts the arithmetic mean and violates T2.
      - target: "qa:test_t1_status_counts"
        risk: |
          Type fidelity: the test must assert that counts are JSON integers,
          not floats. Python's json module will serialize a float like 3.0 as
          3.0, not 3. If the store function returns a float, the test must
          catch it. Use explicit isinstance or value-equality checks that
          distinguish 3 from 3.0.
      - target: "qa:test_t2_average_rating"
        risk: |
          The null-vs-0 distinction: when no book has a rating, the response
          must contain "average_rating": null (JSON null), not 0, not a
          missing key. Tests must assert the key is present AND the value is
          None (Python) / null (JSON), not merely that the key is absent or
          that the value is 0.
      - target: "dev:store_aggregation"
        risk: |
          Regression on existing store methods: store.py is a shared module.
          The new functions must be purely additive — no modification to
          existing function signatures, no import that shadows an existing
          name, no mutation of the in-memory collection. A careless import
          or a modified helper could break the nine existing test files.
      - target: "qa:test_t2_average_rating"
        risk: |
          Floating-point brittleness: if tests use a fixed mean like 3.5
          from books rated 2 and 5, floating-point is fine. But if tests
          use means like 1/3 or 2/3, strict equality will fail. Use
          pytest.approx or choose ratings that yield exact binary fractions.
    time_budget_guidance:
      - area: store_aggregation
        budget_pct: 15
      - area: route_handler
        budget_pct: 15
      - area: test_suites
        budget_pct: 50
      - area: verification_and_fixup
        budget_pct: 20
    scope_cut_guidance: []
    must_not_skip:
      - "Zero-count statuses must be present in the response with value 0 (T1 load-bearing edge case)"
      - "average_rating must be JSON null (not 0, not missing) when no book has a rating (T2 load-bearing edge case)"
      - "Tests must exercise the running app through TestClient and assert on response content per CONTRIBUTING.md"
      - "No modification to existing store.py function signatures or models.py"
    defer_if_time_constrained:
      - "Additional edge-case test functions beyond the core 3-6 per test file (e.g., stress with 100+ books)"
    confidence: high
    ```
