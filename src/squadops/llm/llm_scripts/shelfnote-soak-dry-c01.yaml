- task_type: governance.review_plan
  occurrence: 1
  call: 1
  content: |-
    ---
    readiness: go
    sufficiency_score: 5
    blocker_unknowns: 0
    ---

    ## Consolidated Plan

    ### 1. Objective Frame (Change Request Scope)

    This increment adds a single read-only endpoint, `GET /stats`, to the existing Shelfnote application. It exposes two aggregate fields:

    - **`status_counts`** — an object mapping every book status value to the integer count of books currently in that status. Statuses with zero books are present with value `0`.
    - **`average_rating`** — the arithmetic mean of ratings on books that have a rating, as a number. `null` when no book carries a rating.

    Nothing else in the application changes. No `prd_delta`, no `manifest_delta`, no retired or replaced verifiers. The ruling notes impose no additional behavioural constraints beyond the change request.

    ### 2. Footprint & File Contracts

    | File | Role |
    |---|---|
    | `backend/routes.py` | Add a `GET /stats` handler (≤ 30 lines per CONTRIBUTING.md). |
    | `backend/store.py` | Add (or extend) store-level queries that compute per-status counts and the mean rating. |
    | `tests/test_criterion_T1.py` | pytest tests exercising `GET /stats` → `status_counts` contract. |
    | `tests/test_criterion_T2.py` | pytest tests exercising `GET /stats` → `average_rating` contract. |

    All other files retain their accepted implementation at the baseline commit.

    ### 3. Technical Design

    #### 3.1 Data availability (assumed from accepted models)

    The accepted `backend/models.py` already defines a Book with a `status` field and an optional `rating` field (the existing T3/T4/T5/T6/T7/T8 tests for reading status and ratings confirm this). The accepted `backend/store.py` already persists and retrieves books. No schema migration is needed.

    #### 3.2 `backend/store.py` — new query helpers

    Two small functions (or one composite, at the developer's discretion) that operate on the existing in-memory (or SQLite) book collection:

    ```
    status_counts() -> dict[str, int]
    ```
    - Iterate all books, tally by `status`.
    - Ensure **every** status value that the model recognises appears as a key, defaulting to `0`. The set of valid statuses is the one already enumerated in `models.py` (e.g. `want_to_read`, `reading`, `finished` — the developer reads the accepted model to confirm the exact set).

    ```
    average_rating() -> float | None
    ```
    - Filter books where `rating` is not `None`.
    - If the filtered set is empty → return `None`.
    - Otherwise → return `sum(ratings) / len(ratings)`.

    Both are O(n) single-pass over the books list. No new dependencies.

    #### 3.3 `backend/routes.py` — new handler

    ```python
    @router.get("/stats")
    def get_stats():
        counts = store.status_counts()
        avg = store.average_rating()
        return {"status_counts": counts, "average_rating": avg}
    ```

    - Returns HTTP 200 with a JSON body.
    - Handler body is well under the 30-line limit.
    - No new imports beyond what `routes.py` already has (`store` is already imported; the router decorator pattern is already in use).
    - No error branches needed: this is a pure read over the in-process collection; it cannot 404 or 500 under normal operation. The only status code is 200.

    #### 3.4 No changes to `main.py`, `models.py`, `errors.py`, or any frontend file

    The route is registered on the existing router; the app wiring in `main.py` already includes the router. No CORS, model, or error-handling changes are required.

    ### 4. Test Strategy

    Both test files follow the product's pytest convention: import the FastAPI `app` from `backend.main`, use `TestClient` (or `httpx.AsyncClient` per the product's existing test pattern in `tests/test_books_api.py`), and assert on response body fields.

    #### `tests/test_criterion_T1.py` — `status_counts`

    | Test | Setup | Assert |
    |---|---|---|
    | All statuses present with correct counts | Seed 2 `want_to_read`, 1 `reading`, 0 `finished` (or the product's exact status names) | 200; `status_counts["want_to_read"] == 2`; `status_counts["reading"] == 1`; `status_counts["finished"] == 0` |
    | Zero-book edge | Empty collection (or no books in any status) | Every status key present with value `0` |
    | Mixed multi-book | Seed a larger varied set | Counts match expected integers |

    Each test fails on the **response body content**, not on import side-effects. The endpoint is new, so a 200 is not a framework default — the tests are not vacuous.

    #### `tests/test_criterion_T2.py` — `average_rating`

    | Test | Setup | Assert |
    |---|---|---|
    | Mean of rated books | Seed books with ratings 4, 5, 3 | `average_rating == 4.0` (arithmetic mean) |
    | Null when no ratings | Seed books, all with `rating = None` | `average_rating is None` |
    | Partial ratings | 2 rated (4, 5), 1 unrated | `average_rating == 4.5` (mean of rated only) |
    | Single rating | One book rated 3.5 | `average_rating == 3.5` |

    #### `must_not_break`

    The change request lists no `must_not_break` criteria and no `retires`. The existing test suite (`test_books_api.py`, `test_ratings_t3.py`, `test_ratings_t4.py`, `test_reading_status_t4.py`–`t8.py`, `test_search_t1.py`–`t3.py`, `test_sorting_t1.py`, `test_tags_t1.py`–`t2.py`) must continue to pass unchanged. The backend test runner (`pytest -q -p no:cacheprovider`) picks up all `test_*.py` under the project root, including the two new files, and the full suite is the acceptance gate.

    ### 5. Sufficiency Assessment

    | Criterion | Rating (1-5) | Rationale |
    |---|---|---|
    | Scope clarity | 5 | Two JSON fields, one endpoint, four files. No ambiguity in observable behaviour. |
    | Technical feasibility | 5 | Two O(n) aggregate queries over an existing collection. No new dependencies, no schema change, no frontend work. Trivially implementable. |
    | Risk coverage | 4 | The only edge cases (zero books, no rated books) are explicitly called out in the criteria. No integration or concurrency risk for an in-process read. Minor residual: developer must confirm the exact status enumeration from the accepted `models.py` — low effort, no structural risk. |
    | Test strategy alignment | 5 | Each criterion maps to a dedicated test file. Edge cases (zero counts, null average, partial ratings) are covered. Tests assert on response content per CONTRIBUTING.md. |
