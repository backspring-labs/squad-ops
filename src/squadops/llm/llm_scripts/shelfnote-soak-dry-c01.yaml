- task_type: development.design_plan
  occurrence: 1
  call: 1
  content: |-
    # Technical Design: `GET /stats` Endpoint (SN-6)

    ## Architecture Overview

    This increment adds a single read-only aggregation endpoint to the existing Shelfnote backend. No new dependencies, no schema changes, no frontend work. The change is contained to two backend files and two new test files.

    ```
    ┌─────────────────────────────────────────────────┐
    │  GET /stats                                     │
    │  (routes.py — handler, < 30 lines)              │
    │                                                 │
    │  ┌───────────────────────────────────────────┐  │
    │  │ store.get_status_counts() -> dict         │  │
    │  │ store.get_average_rating() -> float|None  │  │
    │  └───────────────────────────────────────────┘  │
    │                                                 │
    │  Response:                                      │
    │  { "status_counts": {"unread":3,...},           │
    │    "average_rating": 4.2 }                      │
    └─────────────────────────────────────────────────┘
    ```

    The handler is a thin composition: it calls two store-level aggregation functions and returns the combined JSON. No business logic in the route layer.

    ---

    ## Interface Definitions

    ### Endpoint Contract

    | Field | Type | Description |
    |-------|------|-------------|
    | `status_counts` | `object` | Keys are every book-status value (canonical set), values are integer counts. Zero-count statuses are present with value `0`. |
    | `average_rating` | `number \| null` | Arithmetic mean of ratings on books where a rating is set. `null` when no book carries a rating. |

    HTTP status: `200` on success. No error cases are expected (the endpoint reads from the same in-memory store the app already serves; an empty shelf returns `{"status_counts": {...all zeros}, "average_rating": null}`).

    ### Store Functions (new, in `store.py`)

    ```python
    def get_status_counts() -> dict[str, int]:
        """Return a dict mapping every known status to the number of books in it.
        Statuses with no books appear with value 0."""
        ...

    def get_average_rating() -> float | None:
        """Return the arithmetic mean of all non-null book ratings,
        or None if no book has a rating."""
        ...
    ```

    Both operate on the existing in-memory collection (whatever structure `store.py` already uses — a list of book dicts or model instances). They are pure reads with no mutation.

    ### Route Handler (new, in `routes.py`)

    ```python
    @router.get("/stats")
    def get_stats():
        status_counts = store.get_status_counts()
        avg_rating = store.get_average_rating()
        return {"status_counts": status_counts, "average_rating": avg_rating}
    ```

    ~5 lines of body. Well under the 30-line handler limit.

    ### Status Canonical Set

    The set of keys in `status_counts` is the **full** set of statuses the model recognises (e.g. `"unread"`, `"reading"`, `"finished"` — exact values read from `models.py`). The store function initialises the dict with every status at `0`, then increments. This guarantees zero-count statuses are present per the T1 observable.

    ---

    ## Implementation Sequencing

    | Phase | Work | Depends on | Time est. |
    |-------|------|-----------|-----------|
    | 1 | Add `get_status_counts()` and `get_average_rating()` to `store.py` | — | 15 min |
    | 2 | Add `GET /stats` handler to `routes.py` | Phase 1 | 10 min |
    | 3 | Write `tests/test_criterion_T1.py` | Phase 2 | 20 min |
    | 4 | Write `tests/test_criterion_T2.py` | Phase 2 | 20 min |
    | 5 | Run full test suite (`pytest -q`), fix any regression | Phase 3-4 | 15 min |

    Total planned: **~80 min** of a 3-hour budget. Remaining budget is slack for debugging or edge-case fixes.

    ---

    ## Proto Validation Plan

    This change is a straightforward read-only aggregation over an existing in-memory collection. The risk surface is minimal. I identify **no prototype required** to validate feasibility, for these reasons:

    1. **Status enumeration** — the canonical statuses are already defined in `models.py` (used by existing status-update endpoints and validated by the seven `test_reading_status_*` files). The store function simply iterates a known constant. No new mechanism.

    2. **Rating arithmetic** — books already carry an optional rating (validated by `test_ratings_t3.py` / `t4.py`). Computing a mean over a filtered list is a one-liner. No new data structure.

    3. **In-memory iteration** — the store already holds all books in a single collection that other routes (search, sort, list) iterate. Aggregation is the same pattern.

    If during implementation I discover the store is keyed differently than expected (e.g. sharded by user), that would surface immediately in Phase 1 and require at most a 5-minute adjustment. No throwaway proto is warranted.

    ---

    ## Test Design

    Both test files follow the product's conventions:
    - Import `TestClient` (or `httpx.AsyncClient`) from the existing test setup in `conftest.py`.
    - Seed the store via the existing API endpoints (POST books, set status, set rating) so the test exercises the running app's API.
    - Assert on response JSON content, not on internal imports.
    - Each test file is self-contained and idempotent.

    ### `tests/test_criterion_T1.py`

    | Test | Setup | Assertion |
    |------|-------|-----------|
    | `test_status_counts_reflects_current_state` | Create books in mixed statuses via API | `response.json()["status_counts"]` has correct per-status integers |
    | `test_zero_count_status_present` | Create books in only 2 of N statuses | All N status keys present; absent ones are `0` |
    | `test_empty_shelf_all_zero` | No books created | All counts are `0` |

    ### `tests/test_criterion_T2.py`

    | Test | Setup | Assertion |
    |------|-------|-----------|
    | `test_average_rating_computed` | Assign ratings 3, 4, 5 to three books | `average_rating == 4.0` |
    | `test_unrated_books_excluded` | Mix rated and unrated books | Mean computed over rated books only |
    | `test_null_when_no_rated_books` | Books exist but none have ratings | `average_rating is None` (JSON `null`) |
    | `test_null_when_no_books` | Empty shelf | `average_rating is None` |

    ---

    ## Unknowns Classification

    | # | Unknown | Classification | Rationale |
    |---|---------|---------------|-----------|
    | U1 | Exact status string values in the model | `resolved` | Readable from `models.py` at the baseline commit; already exercised by 7 existing test files. Will be confirmed during Phase 1 implementation. |
    | U2 | Store collection structure (list vs dict vs other) | `resolved` | Readable from `store.py` at baseline; other routes already iterate it. Confirmed during Phase 1. |
    | U3 | Rating field name and type (int? float? optional?) | `resolved` | Readable from `models.py`; existing rating tests (T3, T4) exercise it. Confirmed during Phase 1. |
    | U4 | Whether `conftest.py` fixture provides a pre-seeded or empty client | `resolved` | Readable from `conftest.py` at baseline. Test setup follows whatever fixture pattern it exposes. |
    | U5 | Floating-point precision of the mean (e.g. 1/3 recurring) | `acceptable_risk` | Python's `sum/len` gives IEEE-754 double precision. Tests will use `pytest.approx` or choose integer-friendly means (e.g. 3+4+5=4.0). No spec mandates a specific precision. |

    **No `blocker` unknowns. No `requires_human_decision` items.**

    ---

    ## Files to Emit

    | Path | Action |
    |------|--------|
    | `backend/routes.py` | Replace (full file, adding `GET /stats` handler) |
    | `backend/store.py` | Replace (full file, adding two aggregation functions) |
    | `tests/test_criterion_T1.py` | New file |
    | `tests/test_criterion_T2.py` | New file |

    All other files at the baseline commit remain untouched.

    ---

    ## Risk Notes

    - **Regression risk:** Very low. The change is purely additive (new functions, new route). No existing function signature or route path is modified. The existing 17 test files should pass unchanged.
    - **Concurrency:** The store is in-memory and the app is single-process (per blueprint). No locking needed for a read.
    - **Empty state:** Both aggregations handle the empty collection gracefully (all-zero counts, `None` rating). No division-by-zero guard needed beyond checking the rated list is non-empty before dividing.

    ---

    ## Summary

    A 4-file, read-only increment that adds a `/stats` endpoint returning pre-computed shelf statistics. No proto required, no blockers, ~80 minutes of implementation within the 3-hour budget. Ready for implementation.
- task_type: qa.define_test_strategy
  occurrence: 1
  call: 1
  content: |-
    # Test Strategy: `GET /stats` Endpoint (SN-6)

    ## 1. Acceptance Checklist

    Derived from criteria T1 and T2 in the approved change request. Use this checklist during implementation review to confirm each criterion is met before approval.

    ### T1 — `status_counts` correctness

    - [ ] `GET /stats` responds with HTTP status **200**.
    - [ ] Response body is valid JSON (Content-Type includes `application/json`).
    - [ ] JSON body contains a top-level key named exactly `status_counts`.
    - [ ] `status_counts` is a JSON object (not array, not string).
    - [ ] Every key in `status_counts` is a valid book status value defined by the product's model (e.g., `to_read`, `reading`, `finished`, etc. — as enumerated in `backend/models.py`).
    - [ ] Each value in `status_counts` is a JSON **integer** (not float, not string).
    - [ ] For each status, the value equals the actual count of books currently in that status.
    - [ ] **Zero-count statuses are present.** If a status has no books, it appears with value `0` (it is not omitted).
    - [ ] No extra keys appear in `status_counts` that are not valid book statuses.

    ### T2 — `average_rating` correctness

    - [ ] JSON body contains a top-level key named exactly `average_rating`.
    - [ ] When at least one book has a rating, `average_rating` is a JSON **number** (not string, not null).
    - [ ] The number equals the arithmetic mean of all ratings on books that carry a rating (unrated books are excluded from both numerator and denominator).
    - [ ] When **no** book in the store carries a rating, `average_rating` is JSON `null`.
    - [ ] When the store is completely empty (no books at all), `average_rating` is JSON `null`.

    ### Cross-cutting / structural

    - [ ] The response does not require authentication or special headers beyond what the app already expects.
    - [ ] The endpoint does not mutate state: a second identical `GET /stats` call returns identical JSON.
    - [ ] The handler in `backend/routes.py` is ≤ 30 lines (CONTRIBUTING.md constraint).
    - [ ] No new third-party dependencies are added (blueprint convention: only what `requirements.txt` already declares).
    - [ ] `backend/store.py` changes are additive only; existing store methods are unchanged in signature and behaviour.

    ### Must-not-break (regression guard)

    - [ ] All existing backend tests pass unchanged: `pytest -q -p no:cacheprovider` exits 0.
    - [ ] `boots` check passes: `python -c "from backend.main import app"` exits 0.
    - [ ] Frontend tests pass unchanged: `npm --prefix frontend test --silent` exits 0.

    ---

    ## 2. Test Strategy Note

    ### Scope Decision

    | Layer | Included? | Rationale |
    |-------|-----------|-----------|
    | Unit (store methods) | **Indirect** | Aggregation logic lives in `store.py`; verified through the endpoint, not in isolation. Keeps tests to the product's API-surface convention. |
    | Integration (endpoint) | **Yes — primary** | Both criteria are endpoint-surface. Tests call `GET /stats` via FastAPI `TestClient` and assert on the JSON response. |
    | Contract | N/A | No external consumer contract; single-service app. |
    | E2E / Frontend | **No** | No frontend file is in the footprint. The endpoint is backend-only. |

    ### Test File Placement & Conventions

    - **`tests/test_criterion_T1.py`** — tests for `status_counts`.
    - **`tests/test_criterion_T2.py`** — tests for `average_rating`.
    - Both use `TestClient` (or `httpx.AsyncClient` if the existing tests in `tests/` already use async — check `conftest.py` and existing test files for the established pattern).
    - Each test function exercises the **running app through the test client** and **asserts on response content** (status code, JSON fields, values). No test may pass merely because a module imports cleanly.
    - Tests must **not** be satisfied by FastAPI's default behaviour (e.g., a 404 on an unregistered path does not satisfy T1/T2).
    - Setup: each test (or a fixture) seeds the in-memory store with a known set of books and ratings, then calls `GET /stats`. Teardown resets state (the existing `conftest.py` likely provides a fixture for this — reuse it).

    ### Test Matrix

    #### `test_criterion_T1.py`

    | # | Scenario | Setup | Assert |
    |---|----------|-------|--------|
    | T1-1 | Mixed statuses | Books in ≥2 different statuses | `status_counts` has correct integer for each; zero-count statuses present as 0 |
    | T1-2 | Single status only | All books in one status | That status has correct count; all other statuses = 0 |
    | T1-3 | Empty store | No books | All statuses = 0 |
    | T1-4 | All statuses represented | Books in every possible status | Each count ≥ 1; no extra keys |
    | T1-5 | Response shape | Any store state | Status 200; body is JSON; `status_counts` is a dict |

    #### `test_criterion_T2.py`

    | # | Scenario | Setup | Assert |
    |---|----------|-------|--------|
    | T2-1 | Multiple rated books | ≥3 books with distinct ratings | `average_rating` = mean (± floating-point tolerance) |
    | T2-2 | Single rated book | 1 rated, several unrated | `average_rating` = that single rating |
    | T2-3 | No ratings | Books exist but none rated | `average_rating` is `null` |
    | T2-4 | Empty store | No books at all | `average_rating` is `null` |
    | T2-5 | Mixed rated/unrated | 2 rated (4.0, 5.0), 3 unrated | `average_rating` = 4.5 (only rated in mean) |
    | T2-6 | Type check | Any rated book | `average_rating` is a JSON number, not a string |

    ### Assertion Style

    - Use `resp.status_code == 200` for status.
    - Use `resp.json()` to parse and assert on fields.
    - For floating-point comparison: `abs(actual - expected) < 1e-9` or `pytest.approx`.
    - For null: `assert data["average_rating"] is None` (Python `None` maps from JSON `null`).
    - For integer counts: `assert isinstance(val, int)` and `val == expected`.

    ---

    ## 3. Defect Severity Rubric

    | Severity | Definition | Examples (this change) |
    |----------|------------|------------------------|
    | **Critical (P0)** | Endpoint is unreachable, returns 5xx on any valid request, or the app fails to boot. | `GET /stats` returns 500; `from backend.main import app` fails. |
    | **Major (P1)** | A criterion's observable is violated in a way a consumer would notice. | `status_counts` omits a zero-count status; `average_rating` includes unrated books; `average_rating` is a string instead of number; response is 404. |
    | **Minor (P2)** | A criterion's observable is violated but impact is limited or edge-case. | Float precision off by >1e-6 but <1e-3; an extra top-level JSON key not in spec (e.g., `"total_books"`). |
    | **Cosmetic (P3)** | No observable behaviour is wrong; style or maintainability concern. | Handler exceeds 30 lines; variable naming inconsistent with `store.py` conventions; missing docstring. |

    **Release gate:** No P0 or P1 defects may be open at approval. P2 may be deferred with a documented rationale. P3 is advisory.

    ---

    ## 4. Risk-Based Test Priorities

    | Priority | Area | Why | Mitigation |
    |----------|------|-----|------------|
    | **1 (Highest)** | Aggregation correctness in `store.py` | The core logic (counting by status, computing mean) is new. A bug here silently returns wrong data. | T1-1, T1-4, T2-1, T2-5 exercise the happy path with multiple books. |
    | **2** | Zero / empty edge cases | "Statuses with zero books appear with value 0" and "null when no rating" are explicitly called out in the criteria. Easy to miss (e.g., iterating only over books present). | T1-2, T1-3, T2-3, T2-4. |
    | **3** | Type fidelity | JSON `null` vs `0` vs missing key; integer vs float for counts. A consumer parsing the response could break. | T1-5, T2-6, explicit `isinstance` / `is None` assertions. |
    | **4** | Regression on existing endpoints | Changes to `store.py` or `routes.py` could alter existing route behaviour. | Full `pytest` run (all existing test files) + `boots` check. No `must_not_break` items in this CR, but the existing suite is the guard. |
    | **5** | Handler size / dependency scope | CONTRIBUTING.md cap (30 lines) and "no new deps" rule. | Code review at plan/impl gate; quick line-count check. |

    ---

    ## 5. Out-of-Scope / Deferred

    - **Performance / load testing** — dataset is in-memory and small; not justified within the 3-hour budget.
    - **Frontend integration** — no frontend file in the footprint; the endpoint is consumed by the frontend only in a future cycle.
    - **Caching or concurrent-write correctness** — single-process in-memory store; no concurrency scenario in scope.
    - **Authentication / authorization on `/stats`** — the product has no auth layer; not in the criteria.

    ---

    *Document produced at Stage A (planning). Actual test files (`tests/test_criterion_T1.py`, `tests/test_criterion_T2.py`) will be authored during the implementation workload, guided by the test matrix above.*
