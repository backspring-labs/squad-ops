    ```yaml:plan_authoring_brief.yaml
    version: 1
    brief_id: brief-sn6-stats-001
    objective_summary: |
      Add a single read-only aggregation endpoint, GET /stats, to the existing
      Shelfnote backend. The endpoint returns a JSON body with two fields:
      (1) status_counts — an object whose keys are every book-status value
      recognised by the product's model and whose values are the integer count
      of books currently in that status, with zero-count statuses present at 0;
      and (2) average_rating — the arithmetic mean of the ratings on books that
      carry a rating, expressed as a JSON number, or null when no book has a
      rating. The change is purely additive: two new store-level aggregation
      functions, one new route handler, and two new test files. No existing
      route, model, or store method is modified. No frontend work is in scope
      for this cycle.
    accepted_stack:
      backend: "FastAPI (Python 3)"
      frontend: "React + Vite (unchanged this cycle)"
      storage: "In-memory collection in backend/store.py (no external database)"
      test_backend: "pytest + FastAPI TestClient (via root conftest.py)"
      test_frontend: "vitest + Testing Library (unchanged this cycle)"
    must_cover_requirements:
      - "T1: GET /stats returns a JSON body containing a status_counts object whose keys are all book status values defined in the model and whose values are the integer count of books currently in that status; statuses with zero books appear with value 0"
      - "T2: GET /stats returns a JSON body containing an average_rating field equal to the arithmetic mean of ratings on books that have a rating; when no book carries a rating the value is null"
      - "The new route handler in routes.py is at most 30 lines (CONTRIBUTING.md constraint)"
      - "No new third-party dependencies are added to backend/requirements.txt"
      - "Changes to store.py are additive only: existing function signatures and behaviour are unchanged"
      - "Tests exercise the running app through the TestClient and assert on response content; they must not pass by virtue of a clean import or a framework default (e.g. an unknown path's 404)"
      - "All existing backend and frontend test files continue to pass unchanged"
    scope_cuts:
      - "Frontend consumption of /stats: deferred to a future cycle (no frontend file is in the footprint)"
      - "Authentication or authorization on /stats: the product has no auth layer; not in the criteria"
      - "Performance, load, or caching: in-memory store, single-process; not justified within budget"
      - "Concurrent-write correctness on /stats: read-only endpoint; no locking needed"
      - "Any modification to models.py, main.py, errors.py, or any other file outside the four footprint paths"
    risk_areas:
      - "Aggregation correctness: the new store functions must count by the exact status strings the model defines and compute the mean over rated books only (exclude unrated)"
      - "Zero and empty edge cases: all-zero status_counts on an empty shelf; null average_rating when no book has a rating; no division-by-zero"
      - "Type fidelity in the JSON response: integer (not float) for counts; number (not string) for average_rating; JSON null (not 0, not missing key) when no rated books exist"
      - "Regression on existing endpoints: additive changes to store.py and routes.py must not alter any existing route's behaviour or any existing store method's contract"
      - "Floating-point precision of the mean: tests should use pytest.approx or choose integer-friendly means to avoid brittleness"
    source_artifact_refs:
      - change_request.yaml
      - technical_design.md
      - test_strategy.md
    major_components:
