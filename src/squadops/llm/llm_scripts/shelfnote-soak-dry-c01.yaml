    """T2: GET /stats — average_rating is the arithmetic mean of rated books, or null if none."""


    def test_average_rating_uses_only_rated_books(client):
        """Mean is over rated books only, not the full shelf.

        Fault caught: dividing by total book count instead of rated count.
        Three books; two rated 3 and 5, one unrated.
        Correct mean: (3+5)/2 = 4.0.
        Faulty mean: (3+5+0)/3 = 2.67 or (3+5)/3 = 2.67.
        """
        b1 = client.post("/books", json={"title": "A", "author": "X", "added_by": "U"}).json()
        b2 = client.post("/books", json={"title": "B", "author": "Y", "added_by": "U"}).json()
        b3 = client.post("/books", json={"title": "C", "author": "Z", "added_by": "U"}).json()

        # Rate only b1 and b2; b3 stays unrated
        assert client.put(f"/books/{b1['id']}/rating", json={"rating": 3}).status_code == 200
        assert client.put(f"/books/{b2['id']}/rating", json={"rating": 5}).status_code == 200

        res = client.get("/stats")
        assert res.status_code == 200
        body = res.json()
        assert "average_rating" in body, f"average_rating key missing: {list(body.keys())}"

        val = body["average_rating"]
        # Must be a number, not a string or None
        assert isinstance(val, (int, float)), f"Expected a number, got {type(val).__name__}: {val!r}"
        assert not isinstance(val, bool)
        # Integer-friendly mean: (3 + 5) / 2 = 4.0 exactly
        assert val == 4.0, f"Expected 4.0 (mean of rated only), got {val}"


    def test_average_rating_null_when_books_exist_but_unrated(client):
        """Books on the shelf, none rated → average_rating is JSON null, not 0 or absent.

        Fault caught: returning 0, an empty string, or omitting the key.
        """
        client.post("/books", json={"title": "Solo", "author": "A", "added_by": "U"})
        client.post("/books", json={"title": "Duo", "author": "B", "added_by": "U"})

        res = client.get("/stats")
        assert res.status_code == 200
        body = res.json()

        assert "average_rating" in body, f"average_rating key missing: {list(body.keys())}"
        assert body["average_rating"] is None, (
            f"Expected null when no ratings exist, got {body['average_rating']!r}"
        )


    def test_average_rating_null_on_empty_shelf_no_crash(client):
        """Zero books → 200 with average_rating null; no division-by-zero crash.

        Fault caught: unguarded division returns 500 or the key is absent.
        """
        res = client.get("/stats")
        assert res.status_code == 200, f"Expected 200 on empty shelf, got {res.status_code}"
        body = res.json()
        assert "average_rating" in body, f"average_rating key missing on empty shelf: {list(body.keys())}"
        assert body["average_rating"] is None, (
            f"Expected null on empty shelf, got {body['average_rating']!r}"
        )


    def test_average_rating_is_number_not_string(client):
        """average_rating is a JSON number (int/float), not a string.

        Fault caught: the handler serialises the mean as a string (e.g. "4.0").
        """
        b1 = client.post("/books", json={"title": "N1", "author": "A", "added_by": "U"}).json()
        b2 = client.post("/books", json={"title": "N2", "author": "B", "added_by": "U"}).json()
        assert client.put(f"/books/{b1['id']}/rating", json={"rating": 4}).status_code == 200
        assert client.put(f"/books/{b2['id']}/rating", json={"rating": 4}).status_code == 200

