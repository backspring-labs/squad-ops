      - "The route handler uses the existing @router decorator pattern in backend/routes.py"
      - "Test files are named test_criterion_T1.py and test_criterion_T2.py inside backend/tests/"
      - "Test functions use descriptive snake_case names (e.g. test_zero_count_status_present, test_null_when_no_rated_books)"
    open_questions:
      - "The change request's footprint lists test files at tests/test_criterion_T1.py and tests/test_criterion_T2.py (repository root), but the plan shape rule qa-tests-live-in-the-stacks-namespace requires FastAPI+React QA test files in backend/tests/. This brief resolves the path to backend/tests/ per the plan shape rule. Confirm the operator accepts this path adjustment; the root conftest.py serves backend/tests/ unchanged, and pytest discovers test_*.py under . regardless of subdirectory."
