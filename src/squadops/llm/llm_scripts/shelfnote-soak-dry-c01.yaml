- task_type: development.propose_plan_tasks
  occurrence: 1
  call: 1
  content: |
    ```yaml:proposed_plan_tasks.yaml
    version: 1
    proposal_id: prop-a9beab93
    source_brief_id: brief-sn6-stats-001
    proposing_role: development
    scope_statement: |
      Proposes a single development task that adds two store-level aggregation
      functions (get_status_counts, get_average_rating) to backend/store.py and a
      thin GET /stats route handler to backend/routes.py. The change is purely
      additive: no existing function signature, route, or model is modified.
      Test files (test_criterion_T1.py, test_criterion_T2.py) are owned by the QA
      proposal and are excluded from this dev proposal.
    tasks:
      - task_type: development.develop
        role: dev
        focus: "stats aggregation store functions and route handler"
        description: |
          Add two pure-read aggregation functions to backend/store.py:

          (1) get_status_counts() -> dict[str, int]
              Returns a dict whose keys are every canonical book-status value
              defined in the model and whose values are the integer count of
              books currently in that status. Statuses with zero books appear
              with value 0. The function initialises the dict with every status
              at 0, then iterates the existing in-memory book collection and
              increments the appropriate counter.

          (2) get_average_rating() -> float | None
              Returns the arithmetic mean of the rating field on books that
              carry a non-null rating, or None when no book has a rating.
              Guards against division-by-zero by checking the rated list is
              non-empty before dividing.

          Add a GET /stats route handler to backend/routes.py using the existing
