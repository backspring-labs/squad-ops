  content: |-
    # QA Test Strategy — SN-12: Book Note Feature

    **Proposal:** `prop_bf6f3fdc4ff0` · **Cycle budget:** 3 h · **Stage:** A (planning)

    ---

    ## 1. Acceptance Checklist

    Derived from criterion **N1** and the `must_not_break` set. Use this checklist during implementation review to confirm the change is complete and correct before sign-off.

    ### N1 — `PUT /books/{id}/note` behaviour

    - [ ] **N1.1** `PUT /books/{id}/note` with body `{"note": "a note"}` for an existing book returns **200**.
    - [ ] **N1.2** The 200 response body is JSON and contains a `"note"` field whose value is exactly `"a note"`.
    - [ ] **N1.3** A subsequent `GET /books/{id}` returns **200** and its JSON body contains the same `"note"` field equal to `"a note"`.
    - [ ] **N1.4** `PUT /books/{id}/note` for a **non-existent** book id returns **404** (not 405, 400, or 200).
    - [ ] **N1.5** The endpoint handler in `routes.py` is ≤ 30 lines (CONTRIBUTING.md constraint).
    - [ ] **N1.6** The new test file is `tests/test_criterion_N1.py`, uses `pytest` + `TestClient` (or `httpx.AsyncClient`), and asserts on response status codes and JSON content — never on imports of the new model fields.

    ### Must-not-break — existing criteria still pass

    - [ ] **MNB-T1** `tests/test_criterion_T1.py` passes unchanged.
    - [ ] **MNB-T2** `tests/test_criterion_T2.py` passes unchanged.
    - [ ] **MNB-T3** `tests/test_criterion_T3.py` passes unchanged.
    - [ ] **MNB-C1** `tests/test_criterion_C1.py` passes unchanged.
    - [ ] **MNB-C2** `tests/test_criterion_C2.py` passes unchanged.
    - [ ] **MNB-X1** `tests/test_criterion_X1.py` passes unchanged.
    - [ ] **MNB-ALL** The full `pytest` suite (all `test_*.py` under `tests/`) passes with zero failures.
    - [ ] **MNB-BOOT** `.venv/bin/python -c "from backend.main import app"` succeeds (app boots).
    - [ ] **MNB-FE** `npm --prefix frontend test --silent` passes (no frontend regression from the backend-only change).

    ### Footprint compliance

    - [ ] **FP.1** Only `backend/models.py`, `backend/store.py`, `backend/routes.py`, and `tests/test_criterion_N1.py` are modified or created. No other file in the repository is changed.
    - [ ] **FP.2** No new dependency is added to `backend/requirements.txt`.

    ---

    ## 2. Test Strategy Note

    ### Scope decision

    This is a **single-endpoint, single-field** increment to an already-accepted API. There is no frontend change, no new data migration, and no new service. The verification effort is therefore concentrated in one integration-test file. No separate unit-test layer is warranted at this scope: the "unit" here is the route handler, and exercising it through `TestClient` is both the unit and the integration test, per the blueprint's convention that backend tests call the app through `TestClient` or `httpx.AsyncClient`, never a running server.

    ### Test file: `tests/test_criterion_N1.py`

    | Aspect | Decision | Rationale |
    |---|---|---|
    | Runner | `pytest` | Blueprint convention; file lives under `tests/` and is discovered by `pytest -q`. |
    | Client | `TestClient` or `httpx.AsyncClient` (whichever the product's `conftest.py` already provides) | Reuse the existing fixture; do not introduce a new dependency. |
    | Test isolation | Create a book via `POST /books/…` in a `setup`/`autouse` fixture, or seed through the store, so each test starts from a known book id. | Avoids coupling to test execution order. |
    | Assertions | Status code **and** JSON body content. Never assert on imported objects or internal store state. | CONTRIBUTING.md: "fails on what the response says, not on importing something the change adds." |
    | 404 case | Use a UUID or id guaranteed absent (e.g., `00000000-0000-0000-0000-000000000000`). | Deterministic; no race with fixture cleanup. |

    ### Test cases the implementation must cover (minimum)

    | # | Method & path | Body / Params | Expected status | Expected body assertion |
    |---|---|---|---|---|
    | 1 | `PUT /books/{valid_id}/note` | `{"note": "a note"}` | 200 | `resp.json()["note"] == "a note"` |
    | 2 | `GET /books/{valid_id}` (after test 1) | — | 200 | `resp.json()["note"] == "a note"` |
    | 3 | `PUT /books/{missing_id}/note` | `{"note": "x"}` | 404 | Body is the standard error envelope (product convention in `errors.py`) |

    **Recommended additional cases** (defend against regressions the criterion doesn't name but the code change could introduce):

    | # | Method & path | Body | Expected status | Why |
    |---|---|---|---|---|
    | 4 | `GET /books/{valid_id}` (before any PUT) | — | 200 | `"note"` key is present (null/empty) or absent — pin the initial state so a later change doesn't silently alter it. |
    | 5 | `PUT /books/{valid_id}/note` | `{"note": "overwritten"}` after a prior PUT | 200 | `resp.json()["note"] == "overwritten"` — confirms idempotent overwrite, not append. |
    | 6 | `PUT /books/{valid_id}/note` | `{}` (no "note" key) | 422 | Pydantic validation; ensures the schema requires the field. |
    | 7 | `PUT /books/{valid_id}/note` | `{"note": 42}` (wrong type) | 422 | Type validation on the field. |

    Cases 4–7 are **recommended**, not required by N1. Include them if they fit within the 3-hour budget and the test file stays focused. If time is tight, cases 1–3 are the hard floor.

    ### What is NOT in scope for testing this cycle

    - Frontend tests: no frontend file is in the footprint; the existing vitest suite must pass but is not extended.
    - E2E / browser tests: no UI change.
    - Performance / load tests: out of proportion for a single-field endpoint.
    - Security / auth tests: the existing app has no auth layer per the file map; adding one is outside this cycle's footprint.

    ### Verification commands (run at the end of implementation)

    ```bash
    # Boot check
    .venv/bin/python -c "from backend.main import app"

    # Full backend suite (includes the new test file)
    .venv/bin/python -m pytest -q -p no:cacheprovider

    # Frontend suite (must be unaffected)
    npm --prefix frontend test --silent
    ```

    All three must be green. A red in any of them blocks sign-off regardless of whether the failing test is "new" or "old."

    ---

    ## 3. Defect Severity Rubric

    Use this rubric when triaging issues found during implementation. It is scoped to this cycle's footprint.

    | Severity | Definition | Examples in this cycle | Action |
    |---|---|---|---|
    | **S1 — Blocker** | The change breaks a `must_not_break` criterion, or the app fails to boot. | `GET /books/{id}` stops returning 200; `pytest` collection error in an existing test file; `from backend.main import app` raises. | **Halt.** Fix before any further work. Re-run the full suite. |
    | **S2 — Major** | The new endpoint fails its primary acceptance criterion (N1.1–N1.4). | PUT returns 500; response JSON lacks `"note"`; GET does not reflect the note; 404 case returns 200. | **Fix before sign-off.** No release without these passing. |
    | **S3 — Minor** | The endpoint works but a recommended edge case (N1 cases 4–7) reveals wrong behaviour. | Empty-string note silently accepted where 422 was expected; response includes an unintended extra key. | Fix if within budget; otherwise document as a known gap and defer. |
    | **S4 — Cosmetic / Advisory** | Style, naming, or documentation nit that does not affect behaviour. | Handler is 31 lines (1 over the 30-line cap); test variable name is unclear. | Note in review; fix opportunistically. |

    **Escalation rule:** Any S1 found after a `must_not_break` test was green at the start of implementation is a regression introduced by this cycle and must be reported to the orchestrator immediately.

    ---

    ## 4. Risk-Based Test Priorities

    Ranked by likelihood of causing a defect and blast radius. Spend testing effort here first.

    ### Priority 1 — High risk / High blast

    | Risk | Why it matters | Mitigation in tests |
    |---|---|---|
    | **`GET /books/{id}` response shape changes.** Adding `"note"` to the book model changes every GET response. Existing tests (T1, T2, T3, C1, C2, X1) may do exact-dict comparisons or assert on the set of keys. | If any existing test does `assert resp.json() == {"title": …, "author": …, …}` without `"note"`, it breaks. This is the **most likely** source of a `must_not_break` failure. | Run the full existing suite immediately after the model change. The 6 `must_not_break` files are the first things to re-run. If they do exact-match, the implementation must ensure the note is serialized in a way that doesn't break them (e.g., `exclude_unset` in Pydantic, or the existing tests already use subset assertions). |
    | **Route collision.** `PUT /books/{id}/note` must not shadow or be shadowed by `PUT /books/{id}` or any other existing route. | FastAPI matches routes by order; a mis-ordered or mis-typed path could cause 405s on existing PUT/PATCH endpoints. | The must-not-break tests (T1–T3, C1–C2, X1) cover existing book CRUD. A regression here would show as a 405 or 404 on an existing endpoint. |

    ### Priority 2 — Medium risk / Medium blast

    | Risk | Why it matters | Mitigation |
    |---|---|---|
    | **Store layer persistence.** The note must survive between the PUT and the subsequent GET. If `store.py` uses an in-memory dict and the note is stored on a different object than the one GET reads, the note vanishes. | Criterion N1.3 explicitly requires the GET to return the note set by the PUT. | Test case #2 (GET after PUT) directly verifies this. |
    | **Pydantic model validation.** If the note field is typed as `str` but the request body sends `null`, `42`, or `[]`, the behaviour depends on the model definition. N1 doesn't specify these, but a `500` (unhandled exception) instead of `422` would be a defect. | Recommended test cases 6–7. If the model is too loose, malformed input could propagate into the store. |

    ### Priority 3 — Low risk / Low blast

    | Risk | Why it matters | Mitigation |
    |---|---|---|
    | **Frontend regression.** No frontend file is in the footprint, so `npm test` should be unaffected. A false positive here (e.g., a build artifact) would waste time. | Low. | Run `npm test` as a final gate; expect zero changes. |
    | **Handler line count.** CONTRIBUTING.md caps handlers at 30 lines. A note handler that does validation, store call, and response construction in one function could creep past 30. | S4 cosmetic; doesn't affect behaviour. | Code-review check; not a runtime test. |

    ### Explicit non-risks (do not test)

    - CORS configuration: no change, no new origin.
    - Docker / nginx / Vite config: no file in footprint touches these.
    - Existing frontend views (`BookDetailView.jsx`, etc.): not in footprint; the note field simply won't render until a future cycle adds it. No test needed.

    ---

    ## 5. Summary for the Orchestrator

    | Item | Status |
    |---|---|
    | Acceptance checklist | 15 items (6 for N1, 9 for must-not-break + boot + footprint) |
    | Test strategy | One integration-test file, 3 mandatory + 4 recommended cases, pytest + TestClient |
    | Defect rubric | 4 tiers (S1–S4), escalation rule for `must_not_break` regressions |
    | Top risk | `GET /books/{id}` response shape change breaking existing exact-match tests |
    | Budget fit | Well within 3 h. The feature is one endpoint, one field, one test file. The main time sink is verifying the 6 must-not-break suites still pass, which is a single `pytest` run. |
    | Deferrals | No work deferred. All in-budget. |

    *End of test strategy. Test files are produced during the implementation workload, not this planning cycle.*
