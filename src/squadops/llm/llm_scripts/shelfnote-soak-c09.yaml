    ## Consolidated Plan

    ### 1. Objective Frame

    This cycle implements a single additive feature on the existing Shelfnote application: a **per-book note** that a reader can set via a dedicated endpoint and read back on the book's detail view.

    The change request (`prop_bf6f3fdc4ff0`, v1) is the sole objective. There is no `prd_delta` or `manifest_delta`; the accepted requirements and interface stand as-is except for the new behavioural surface defined by criterion **N1**. The reviewer's ruling note is administrative only (unattended recording approval) and introduces no additional design directives.

    **Framed objective:** Add `PUT /books/{id}/note` so a reader can store a short text note on a book; the note is returned in both the PUT response and the subsequent `GET /books/{id}` response. An unknown book id yields a 404.

    ---

    ### 2. Context Research (Product State)

    The product is a FastAPI + React (Vite) app at commit `01b92774a23cbf2bc5d4db770e26e7d759b383d7`. Relevant existing state:

    - **`backend/models.py`** (2 788 B): Pydantic models for Book, including fields for title, author, rating, reading-status, tags, etc. The Book model is the target for a new `note` field.
    - **`backend/store.py`** (5 900 B): In-memory (or file-backed) store with CRUD helpers for books, ratings, reading status, tags, search, sorting. The store is where the note will be persisted alongside the book record.
    - **`backend/routes.py`** (6 545 B): FastAPI router with existing endpoints for books (GET list, GET detail, POST create, PATCH rating/status/tags), search, sort. The new `PUT /{id}/note` handler is added here.
    - **`tests/`**: 18+ test files covering all accepted criteria (T1–T3, C1–C2, X1) plus search, sorting, tags, reading-status, and ratings tests. The new test file `tests/test_criterion_N1.py` is created here.

    Conventions from `CONTRIBUTING.md`:
    - Each new endpoint handler ≤ 30 lines.
    - Each status code the endpoint can answer gets a test.
    - Tests exercise the API through `TestClient`, fail on response content, not on imports.
    - Must-not-break behaviours are not re-tested as new tests.

    ---

    ### 3. Technical Design

    #### 3.1 Model change — `backend/models.py`

    Add an optional `note` field to the `Book` model:

    ```python
    note: str | None = None
    ```

    - Type: `str | None` (optional, defaults to `None`).
    - No validator needed beyond Pydantic's type coercion; the field is free-form short text.
    - The `BookResponse` (or equivalent GET response model) must include `note` so it appears in `GET /books/{id}` responses.

    No other models are modified. The `BookCreate` / `BookUpdate` models are untouched (note is set exclusively via the dedicated endpoint, not via create/patch).

    #### 3.2 Store change — `backend/store.py`

    Add a method (or extend the existing book-update path) to set a note on a book:

    ```python
    def set_note(self, book_id: str, note: str) -> Book | None:
        """Set the note on a book. Returns the updated Book, or None if not found."""
        book = self.get(book_id)
        if book is None:
            return None
        book.note = note
        # persist (match existing store pattern)
        return book
    ```

    - Returns `None` for unknown ids so the route layer can emit a 404.
    - Follows the existing store pattern (in-memory dict / file-backed store) exactly as the other mutation helpers do.
    - No changes to existing store methods; this is purely additive.

    #### 3.3 Route change — `backend/routes.py`

    Add one new endpoint handler:

    ```python
    @router.put("/books/{book_id}/note")
    async def set_book_note(book_id: str, body: NoteIn, db: ... = Depends(...)):
        book = db.set_note(book_id, body.note)
        if book is None:
            raise HTTPException(status_code=404, detail="Book not found")
        return {"id": book.id, "note": book.note}
    ```

    - **Handler body ≤ 30 lines** (it is ~5 lines, well within the limit).
    - `NoteIn` is a small Pydantic model: `class NoteIn(BaseModel): note: str`.
    - Response shape: JSON object with at least `"note"` field (the criterion requires the response JSON to have a `"note"` field equal to the submitted value). Including `"id"` is natural and consistent with other endpoints.
    - The existing `GET /books/{book_id}` handler already serialises the full `Book` model; adding `note` to the model automatically includes it in the GET response. No change to the GET handler is needed.
    - 404 for non-existent book id: raised via the existing `errors.py` helper or a standard `HTTPException`, matching the pattern used by other book endpoints.

    No other route is modified.

    #### 3.4 Test file — `tests/test_criterion_N1.py`

    New file exercising criterion N1 through `TestClient`:

    | Test case | What it proves |
    |---|---|
    | `test_put_note_returns_200_with_note` | `PUT /books/{id}/note` with `{"note":"a note"}` → 200, response JSON has `"note" == "a note"` |
    | `test_get_after_put_returns_note` | Subsequent `GET /books/{id}` → 200, response JSON has the same `"note"` |
    | `test_put_note_unknown_book_404` | `PUT /books/nonexistent-id/note` → 404 |

    Each test:
    - Creates a book via `POST /books` (fixture or inline) to have a valid id.
    - Uses `TestClient` from `fastapi.testclient` (product convention).
    - Asserts on status code and response JSON content, not on imports.
    - Is self-contained and does not depend on test execution order.

    No existing test file is modified.

    ---

    ### 4. Test Strategy Alignment

    | Risk area | Coverage |
    |---|---|
    | New endpoint happy path (200 + note in body) | N1 test case 1 |
    | Note persistence visible in GET | N1 test case 2 |
    | 404 for unknown id | N1 test case 3 |
    | No regression in existing book CRUD | must_not_break: T1, T2, T3, C1, C2, X1 |
    | No regression in search / sort / tags / ratings | Existing test files (unmodified, in footprint) |

    The must-not-break set (T1–T3, C1–C2, X1) exercises the full accepted surface. Because the change is purely additive (new field on model, new method on store, new handler on router), these tests should pass unmodified. If any regression appears, it signals an unintended mutation of existing logic.

    ---

    ### 5. Resource Fit

    | Resource | Demand |
    |---|---|
    | Files to emit | 4 (`models.py`, `store.py`, `routes.py`, `test_criterion_N1.py`) |
    | New code volume | ~15 lines model, ~15 lines store, ~20 lines route, ~60 lines test |
    | Test cases | 3 (criterion N1) + 6 must-not-break (regression) |
    | Time budget | 3 h (10 800 s) |
    | Squad capability | dev (implementation), qa (test authoring + verification), lead (review + gate) |

    This is a small, well-bounded increment. Well within the 3-hour budget with ample margin for review and iteration.

    ---

    ### 6. Design Sufficiency Check

    | Criterion | Score | Rationale |
    |---|---|---|
    | Scope clarity | 5/5 | Single endpoint, single field, four files. Footprint is explicit. No `prd_delta` or `manifest_delta` ambiguity. |
    | Technical feasibility | 5/5 | Pattern-matches existing code (ratings, tags, reading-status all follow the same model→store→route→test shape). No novel infrastructure. |
    | Risk coverage | 4/5 | Additive change; primary risk is accidental mutation of shared store/model code. Mitigated by must-not-break suite. Minor: concurrent-write semantics not specified, but the product is single-user by design (in-memory store), so this is a non-issue. No unknowns classified as blocker. |
    | Test strategy alignment | 5/5 | Three N1 test cases map 1:1 to the criterion's observable statement. Must-not-break set covers all existing surfaces. |
    | Resource fit | 5/5 | Four files, ~110 lines of new code, 3 test cases. Trivially within budget and squad capability. |

    **Overall sufficiency score: 5** (one point of conservatism on risk coverage due to the shared-store mutation surface, but no blocker unknowns).

    ---

    ### 7. Readiness Recommendation

    **`go`**

    No blocker unknowns. The change is additive, the footprint is four files, the test strategy directly mirrors the criterion, and the must-not-break suite guards against regression. The squad can proceed to implementation immediately.

    **Suggested task breakdown:**

    1. **dev**: Emit `backend/models.py`, `backend/store.py`, `backend/routes.py` with the note field, store method, and route handler.
    2. **qa**: Emit `tests/test_criterion_N1.py` with the three test cases.
