- task_type: governance.prepare_plan_authoring_brief
  occurrence: 1
  call: 1
  content: |
    ```yaml:plan_authoring_brief.yaml
    version: 1
    brief_id: brief-prop_bf6f3fdc4ff0-001
    objective_summary: |
      Add a single-field sub-resource endpoint PUT /books/{id}/note to the existing
      Shelfnote book API. A reader sets a short note on a book; the note persists on
      the book and is returned by the existing GET /books/{id}. A request for a
      non-existent book id returns a not-found response. This is the entire change:
      one new endpoint, one additive optional field on the book response model, one
      store method, and one new test file. No frontend work, no new dependencies,
      no modifications to any existing endpoint's behaviour beyond the additive
      note field appearing in book JSON responses.
    accepted_stack:
      backend: "FastAPI + Pydantic v2 (in-memory dict store)"
      frontend: "React + Vite (unchanged this cycle)"
      backend_tests: "pytest + TestClient (or httpx.AsyncClient per conftest.py)"
      frontend_tests: "vitest (unchanged this cycle)"
      config: "VITE_API_BASE relative base; CORS from environment"
    must_cover_requirements:
      - "N1-PUT: PUT /books/{id}/note with JSON body {\"note\": \"a note\"} on an existing book returns a success response whose JSON body has a \"note\" field equal to \"a note\""
      - "N1-GET: A subsequent GET /books/{id} returns a success response whose JSON body contains the same \"note\" field equal to \"a note\""
      - "N1-404: PUT /books/{id}/note for a non-existent book id returns a not-found response"
      - "HANDLER-LINES: The new endpoint handler in routes.py is under 30 lines (CONTRIBUTING.md)"
