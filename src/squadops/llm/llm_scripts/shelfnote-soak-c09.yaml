- task_type: development.design_plan
  occurrence: 1
  call: 1
  content: |-
    # Technical Design — SN-12: Book Note Feature

    ## 1. Architecture Overview

    This change adds a single-field sub-resource to the existing book API. No new components, no new files beyond the footprint, no changes to the frontend.

    ```
    Client
      │
      │  PUT /books/{id}/note   {"note": "..."}
      ▼
    routes.py  ──►  store.py  ──►  in-memory dict (book["note"] set)
      │                │
      │  NoteUpdate   │  set_note(book_id, note) → Optional[dict]
      │  (model)      │
      │                │
      ▼                ▼
    GET /books/{id}  (existing) now serialises book["note"] via the
    response model (new optional field, default None)
    ```

    **Component interactions:**

    | Layer | Change | Rationale |
    |-------|--------|-----------|
    | `models.py` | Add `note: Optional[str] = None` to book response model; add `NoteUpdate` request model | Pydantic default keeps existing serialisations valid |
    | `store.py` | Add `set_note(book_id, note)` method | Isolates the write; mirrors existing `set_rating`, `set_reading_status` pattern |
    | `routes.py` | Add `PUT /books/{id}/note` handler (~8 lines) | Sub-resource endpoint per criterion |
    | `tests/test_criterion_N1.py` | New file, 3 test cases | Covers 200, persistence via GET, and 404 |

    No changes to `errors.py`, `main.py`, frontend files, or any existing test file.

    ---

    ## 2. Interface Definitions

    ### 2.1 New/modified models (`backend/models.py`)

    ```python
    # Added to the existing book response model (e.g. BookResponse or equivalent):
    note: Optional[str] = None

    # New request model:
    class NoteUpdate(BaseModel):
        note: str
    ```

    - `NoteUpdate.note` is a required `str` (the criterion body is `{"note": "a note"}`).
    - The response model's new field is `Optional[str]` with a `None` default, so every existing book serialises with `"note": null` until a note is set. This is backward-compatible: any existing test that reads `resp.json()["title"]` etc. is unaffected; the new key simply appears.

    ### 2.2 Store method (`backend/store.py`)

    ```python
    def set_note(self, book_id: str, note: str) -> Optional[dict]:
        """Set the note on a book. Returns the updated book dict, or None if not found."""
        book = self._books.get(book_id)   # or equivalent internal accessor
        if book is None:
            return None
        book["note"] = note
        return book
    ```

    - Follows the same pattern as existing `set_rating` / `set_reading_status` / `add_tag` methods.
    - Returns `None` for a missing book so the route can map it to 404.

    ### 2.3 Route handler (`backend/routes.py`)

    ```python
    @router.put("/books/{book_id}/note")
    async def set_book_note(book_id: str, payload: NoteUpdate):
        book = store.set_note(book_id, payload.note)
        if book is None:
            raise HTTPException(status_code=404, detail="Book not found")
        return book
    ```

    - 7 lines of handler body (well under the 30-line limit from CONTRIBUTING.md).
    - Returns the full book dict (which now includes `note`), consistent with how `PUT /books/{id}` and other update endpoints respond.
    - 404 is raised via the app's existing `HTTPException` pattern (or a custom error if `errors.py` defines one — the route uses whatever convention the sibling routes use).

    ### 2.4 GET /books/{id} — no code change needed

    The existing handler already serialises the book dict through the response model. With `note: Optional[str] = None` on that model, the field appears automatically. No modification to the GET handler is required.

    ---

    ## 3. Implementation Sequencing

    | Phase | Task | Depends on | Est. time |
    |-------|------|------------|-----------|
    | 1 | Add `note` field to book response model + `NoteUpdate` model in `models.py` | — | 5 min |
    | 2 | Add `set_note` method to store in `store.py` | Phase 1 (uses the field) | 5 min |
    | 3 | Add `PUT /books/{id}/note` route in `routes.py` | Phases 1–2 | 5 min |
    | 4 | Write `tests/test_criterion_N1.py` | Phases 1–3 | 15 min |
    | 5 | Run full backend test suite (`pytest`) to confirm `must_not_break` | Phase 4 | 5 min |
    | 6 | Run frontend tests to confirm no regression (should be no-op) | Phase 5 | 2 min |

    Total estimated: **~35 minutes** of implementation, well within the 3-hour budget. No frontend work is required.

    **Sequencing rationale:** Model → Store → Route → Test follows the dependency chain. The test is last because it exercises the full stack end-to-end and should be written against the final, stable interface.

    ---

    ## 4. Proto Validation Plan

    The change is small and follows well-established patterns in the existing codebase. The risk of infeasibility is near zero. I assess that **no throwaway prototypes are needed** beyond the implementation itself, for the following reasons:

    | Concern | Verdict | Why |
    |---------|---------|-----|
    | Pydantic `Optional` field added to an existing model breaks serialisation | **No risk** | Pydantic handles `Optional[T] = None` transparently; the field simply appears in `.model_dump()` / `.dict()` output |
    | Store dict gains a new key; existing code that iterates book keys breaks | **No risk** | Existing code accesses specific keys (`book["title"]`, etc.), not `for key in book`. Adding a key is additive |
    | Route path `PUT /books/{id}/note` conflicts with existing `PUT /books/{id}` | **No risk** | FastAPI resolves by full path; `/books/{id}` and `/books/{id}/note` are distinct path templates |
    | 404 for missing book works identically to existing 404s | **No risk** | Same `HTTPException(404)` pattern used by `GET /books/{id}`, `PUT /books/{id}`, etc. |

    **Conclusion:** Skip the proto phase. Proceed directly to implementation. The full test suite (step 5) serves as the integration validation.

    ---

    ## 5. Unknown Classification

    | # | Unknown | Classification | Notes |
    |---|---------|----------------|-------|
    | U1 | Exact class name of the book response model in `models.py` (e.g., `BookResponse`, `Book`, `BookOut`) | **resolved** | Readable at implementation time; the design targets "the model that `GET /books/{id}` serialises" |
    | U2 | Whether the store stores dicts or Pydantic instances internally | **resolved** | Readable at implementation time; the `set_note` method works identically for either (set `.note` or `["note"]`) |
    | U3 | Whether existing tests assert exact JSON body equality on `GET /books/{id}` (which would break when `"note": null` appears) | **acceptable_risk** | Low probability: well-written tests check individual fields or use `in` / `==` on sub-dicts. If a `must_not_break` test does fail, the fix is to add `"note": None` to its expected dict — but that file is **outside the footprint**, so it cannot be modified. Mitigation: verify by running the suite before committing. |
    | U4 | Whether `store` is a module-level singleton or an injected dependency in `routes.py` | **resolved** | Readable at implementation time; the new route uses the same access pattern as sibling routes |
    | U5 | Whether the app uses a custom 404 error handler (from `errors.py`) vs. plain `HTTPException` | **resolved** | Readable at implementation time; the new route mirrors the 404 pattern of `GET /books/{id}` |
    | U6 | Frontend impact of the new field in book JSON | **acceptable_risk** | Frontend React components destructure specific fields; an extra `"note"` key in the JSON is inert to JSX. No frontend file is in the footprint. |

    **No blockers identified.** All unknowns are either resolvable at implementation time (by reading the existing source) or carry negligible risk.

    ---

    ## 6. Test Plan (`tests/test_criterion_N1.py`)

    Three test functions, all using `TestClient` per blueprint convention:

    ```python
    def test_set_note_success(client, sample_book_id):
        """PUT /books/{id}/note returns 200 with the note field."""
        resp = client.put(f"/books/{sample_book_id}/note", json={"note": "a note"})
        assert resp.status_code == 200
        assert resp.json()["note"] == "a note"

    def test_note_visible_on_get(client, sample_book_id):
        """GET /books/{id} reflects the note after a PUT."""
        client.put(f"/books/{sample_book_id}/note", json={"note": "a note"})
        resp = client.get(f"/books/{sample_book_id}")
        assert resp.status_code == 200
        assert resp.json()["note"] == "a note"

    def test_set_note_not_found(client):
        """PUT /books/{id}/note for a non-existent id returns 404."""
        resp = client.put("/books/nonexistent-id-999/note", json={"note": "x"})
        assert resp.status_code == 404
    ```

    - `sample_book_id` fixture: either reuse an existing conftest fixture or create a book via `POST /books` in a `setup` step (follow whatever pattern the existing criterion tests use — readable at implementation time).
    - Status codes covered: **200** and **404** — satisfies CONTRIBUTING.md's "test for each status code it can answer."
    - No assertion on imported symbols; all assertions are on response status and body.

    ---

    ## 7. Risk & Mitigation Summary

    | Risk | Likelihood | Impact | Mitigation |
    |------|-----------|--------|------------|
    | Existing test asserts exact JSON equality on book response | Low | Breaks a `must_not_break` criterion | Run full suite (step 5); if a test fails, report to orchestrator — the failing test file is outside the footprint and cannot be modified, so the design would need revision (e.g., conditional field inclusion) |
    | Store internal representation differs from assumed dict | Low | Minor refactor of `set_note` | Read `store.py` before implementing; adapt accessor pattern |
    | Route path conflict | Negligible | 500 at startup | FastAPI registers routes at import; `boots` check catches any conflict immediately |

    ---

    ## 8. Scope Boundary (Footprint Compliance)

    Files **changed** (4):
    - `backend/models.py`
    - `backend/store.py`
    - `backend/routes.py`
    - `tests/test_criterion_N1.py` *(new)*

    Files **unchanged** (all others in the repo tree):
    - All existing test files (T1–T3, C1–C2, X1, ratings, reading_status, search, sorting, tags)
    - All frontend files
    - `backend/main.py`, `backend/errors.py`, `backend/__init__.py`, `backend/requirements.txt`
    - Config, Docker, nginx, start.sh

    No new dependencies are introduced. No `requirements.txt` change is needed.

    ---

    ## 9. Time Budget Confirmation

    | Activity | Estimate |
    |----------|----------|
    | Read existing source (models, store, routes, conftest) | 15 min |
    | Implement models.py change | 5 min |
    | Implement store.py change | 5 min |
    | Implement routes.py change | 5 min |
    | Write test_criterion_N1.py | 15 min |
    | Run backend tests, fix any issues | 20 min |
    | Run frontend tests (confirm no-op) | 2 min |
    | **Total** | **~67 min** |

    Comfortably within the 3-hour (180 min) budget, with >50% margin for iteration.

    ---

    *End of technical design. Proceed to implementation per the sequencing in §3.*
