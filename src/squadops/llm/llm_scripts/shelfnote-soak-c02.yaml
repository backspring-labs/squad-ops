    ```yaml:plan_authoring_brief.yaml
    version: 1
    brief_id: brief-prop_9eaac178521b-001
    objective_summary: |
      Add opt-in offset pagination to the existing GET /books endpoint on the
      Shelfnote product. When page and/or per_page query parameters are supplied,
      the response becomes a JSON object containing an items array (the requested
      page of books) and a pagination metadata object (total, page, per_page,
      total_pages). When neither parameter is supplied the response shape is
