    brief_conflicts: []
    assumptions:
      - "The product's root conftest.py provides a TestClient fixture (or the test file constructs one from backend.main.app) that is usable by tests/test_criterion_T3.py."
      - "Books can be seeded via POST /books to build a known 12-book shelf for the pagination tests, or the conftest fixture already seeds a known set."
      - "The product's pytest runner (invoked as `pytest -q -p no:cacheprovider` from the repo root) collects tests/test_criterion_T3.py by its test_*.py name pattern."
