        assert pag["total"] == 12, f"total={pag['total']}, expected 12"
        assert pag["page"] == 2, f"page={pag['page']}, expected 2"
        assert pag["per_page"] == 3, f"per_page={pag['per_page']}, expected 3"
        assert pag["total_pages"] == 4, f"total_pages={pag['total_pages']}, expected 4"


    def test_total_pages_uses_ceil_division(client):
        """10 books, per_page=4 → total_pages=3 (ceil), not 2 (floor).

        Fault caught: total // per_page instead of ceil(total / per_page).
        """
        _seed_shelf(client, 10)
