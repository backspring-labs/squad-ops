  content: |-
    # Technical Design — T3: Pagination for GET /books

    ## Architecture Overview

    This increment adds opt-in pagination to the existing `GET /books` endpoint. Three files change, each with a single, focused responsibility:

    ```
    ┌──────────────────────────────────────────────────────────────────┐
    │  routes.py  (HTTP layer)                                         │
    │  • Accepts optional page / per_page query params                │
    │  • Validates ranges (ge=1, le=100)                              │
    │  • Delegates to store, shapes response                          │
    │  • Handler stays < 30 lines                                     │
    └──────────────────────────┬───────────────────────────────────────┘
                               │  (page, per_page) or (None, None)
    ┌──────────────────────────▼───────────────────────────────────────┐
    │  store.py  (data access)                                         │
    │  • get_books_paginated(page, per_page) → (items, total)          │
    │  • count_books() → int                                          │
    │  • Slices the in-memory list; no SQL / DB involved               │
    └──────────────────────────────────────────────────────────────────┘
    ┌──────────────────────────────────────────────────────────────────┐
    │  models.py  (schemas)                                            │
    │  • Pagination (total, page, per_page, total_pages)              │
    │  • PaginatedBooksResponse (items, pagination)                   │
    │  • Reuses existing Book model                                   │
    └──────────────────────────────────────────────────────────────────┘
    ```

    **Key decision — opt-in pagination.** When neither `page` nor `per_page` is supplied the endpoint returns the same response shape it does today (a plain list of books). This preserves T1 and T2 without modification. When at least one parameter is present the response becomes `{"items": [...], "pagination": {...}}`.

    ---

    ## Interface Definitions

    ### models.py — additions

    ```python
    class Pagination(BaseModel):
        total: int
        page: int
        per_page: int
        total_pages: int

    class PaginatedBooksResponse(BaseModel):
        items: list[Book]
        pagination: Pagination
    ```

    Both are additive. The existing `Book` model is untouched.

    ### store.py — additions

    ```python
    def get_books_paginated(self, page: int, per_page: int) -> tuple[list[Book], int]:
        """Return (page_of_books, total_count) for the given 1-based page."""
        all_books = self._books          # existing private list, default ordering
        total = len(all_books)
        start = (page - 1) * per_page
        end = start + per_page
        return all_books[start:end], total
    ```

    The existing `get_all_books()` (or equivalent) is left intact for the non-paginated path.

    ### routes.py — modified handler

    ```python
    @router.get("/books")
    async def list_books(
        page: Optional[int] = Query(None, ge=1, description="1-based page number"),
        per_page: Optional[int] = Query(None, ge=1, le=100, description="Books per page"),
    ):
        if page is None and per_page is None:
            return store.get_all_books()          # existing shape, no change
        p = page if page is not None else 1
        pp = per_page if per_page is not None else 10
        items, total = store.get_books_paginated(p, pp)
        return PaginatedBooksResponse(
            items=items,
            pagination=Pagination(total=total, page=p, per_page=pp,
                                  total_pages=math.ceil(total / pp)),
        )
    ```

    **Line count:** 12 lines of logic (well under the 30-line ceiling in CONTRIBUTING.md).

    ### Response contract (paginated path)

    | Field | Type | Notes |
    |---|---|---|
    | `items` | `Book[]` | Books for this page, default ordering (insertion / ID order) |
    | `pagination.total` | `int` | Total books on the shelf |
    | `pagination.page` | `int` | The page requested |
    | `pagination.per_page` | `int` | The per-page size used |
    | `pagination.total_pages` | `int` | `ceil(total / per_page)` |

    ### Validation / error behaviour

    | Condition | Response |
    |---|---|
    | `page < 1` or `per_page < 1` | `422` (FastAPI `Query(ge=1)`) |
    | `per_page > 100` | `422` (FastAPI `Query(le=100)`) |
    | `page > total_pages` | `200`, `items: []`, correct pagination metadata |
    | Shelf empty, pagination requested | `200`, `items: []`, `total: 0`, `total_pages: 0` |

    ---

    ## Implementation Sequencing

    | Phase | Work | Depends on | Est. time |
    |---|---|---|---|
    | 1 | Add `Pagination` + `PaginatedBooksResponse` to `models.py` | — | 5 min |
    | 2 | Add `get_books_paginated` to `store.py` | 1 | 5 min |
    | 3 | Modify `list_books` handler in `routes.py` | 1, 2 | 10 min |
    | 4 | Write `tests/test_criterion_T3.py` | 1, 2, 3 | 15 min |
    | 5 | Run full `pytest -q` (T1, T2, T3, all existing suites) + `boots` check | 4 | 5 min |
    | 6 | Run `npm --prefix frontend test --silent` (regression only) | 5 | 2 min |

    **Total: ~42 min.** Well inside the 3-hour budget. No frontend files are touched; the frontend test run is a regression gate only.

    No parallelism is needed — the dependency chain is linear and short.

    ---

    ## Proto Validation Plan

    The risk surface here is small and well-understood (in-memory list slicing + optional query params). I identify **one** prototype worth spending 10 minutes on before committing to the full implementation:

    **Proto P1 — response-shape compatibility with T1/T2.**

    *Question:* Do existing T1 or T2 tests call `GET /books` without pagination params and assert on the response body shape (e.g., `assert data == [...]` expecting a bare list)?

    *Approach:* Read `tests/test_criterion_T1.py` and `tests/test_criterion_T2.py` at the baseline commit. If either asserts on the GET /books list shape, confirm that the opt-in design (no params → same list) keeps them green. If a test *does* pass `page` or `per_page` (unlikely, since the params don't exist yet), flag it.

    *Disposal:* If the answer is "T1/T2 don't touch GET /books response shape" or "they only check status code + a subset of fields," the opt-in design is confirmed and the proto is discarded. If a conflict is found, escalate as a `blocker`.

    No other prototype is warranted. List slicing, `math.ceil`, and FastAPI `Query` validation are all standard library / framework behaviour with no feasibility risk.

    ---

    ## Unknown Classification

    | # | Unknown | Classification | Rationale |
    |---|---|---|---|
    | U1 | Exact response shape T1 and T2 assert on for GET /books | `proto_validated` | Resolved by Proto P1 (reading the two test files). If they expect a bare list, opt-in design is confirmed. |
    | U2 | What "default ordering" means for the book list | `resolved` | The store holds an in-memory list. Default ordering is insertion order (list order). The existing `test_sorting_t1.py` tests an explicit `sort` param; absence of that param means list order. Pagination slices the same ordered list. |
    | U3 | Default `per_page` when only `page` is given (or vice-versa) | `acceptable_risk` | Set to 10. The criterion tests only explicit `per_page=3`. If a future test expects a different default, the constant is a one-line change. Mitigation: document the default in the Query description string. |
    | U4 | Whether `total_pages` should be 0 when total is 0 | `resolved` | `math.ceil(0 / pp)` = 0. The criterion's arithmetic (`12/3 → 4`) confirms `ceil` semantics. Zero-books case yields `total_pages=0`. |
    | U5 | Max value for `per_page` | `acceptable_risk` | Capped at 100 (conventional). No criterion tests beyond that. If the product later needs a different cap it's a constant change. |
    | U6 | Whether the frontend `BooksListView.jsx` will break if the response shape changes | `resolved` | The frontend is **not** in the footprint. It keeps its accepted implementation. Since pagination is opt-in (no params → same list shape), the frontend's existing `fetch` call (which passes no params) is unaffected. The frontend test run (`npm --prefix frontend test`) is a regression gate, not a redesign. |

    **No `blocker` or `requires_human_decision` unknowns.** All unknowns are resolved, proto-validated, or acceptable risk with a clear mitigation.

    ---

    ## Files to Emit (full, replacing the path)

    | File | Action |
    |---|---|
    | `backend/models.py` | **Modify** — add `Pagination`, `PaginatedBooksResponse` |
    | `backend/store.py` | **Modify** — add `get_books_paginated` method |
    | `backend/routes.py` | **Modify** — add optional query params to `list_books`, branch on presence |
    | `tests/test_criterion_T3.py` | **Create** — new test file |

    No other file changes. The build starts from the accepted code at the baseline commit.

    ---

    ## Test Plan (tests/test_criterion_T3.py)

    The test file follows the product's convention: pytest, `TestClient`, no external imports beyond what `requirements.txt` declares.

    | Test | Setup | Request | Assert |
    |---|---|---|---|
    | `test_page_2_per_page_3_returns_correct_slice` | 12 books seeded (via existing fixture or `POST /books`) | `GET /books?page=2&per_page=3` | `items` length = 3; items are books[3:6] (0-indexed); `pagination == {total:12, page:2, per_page:3, total_pages:4}` |
    | `test_page_1_per_page_3_returns_first_page` | 12 books | `GET /books?page=1&per_page=3` | `items` = first 3 books; pagination correct |
    | `test_last_partial_page` | 10 books | `GET /books?page=3&per_page=4` | `items` length = 2; `total_pages = 3` |
    | `test_page_beyond_range_returns_empty` | 5 books | `GET /books?page=99&per_page=10` | `items == []`; `pagination.total = 5`; `total_pages = 1` |
    | `test_page_lt_1_returns_422` | any | `GET /books?page=0&per_page=10` | status 422 |
    | `test_per_page_gt_100_returns_422` | any | `GET /books?page=1&per_page=101` | status 422 |
    | `test_no_params_returns_list` (must-not-break) | 5 books | `GET /books` (no params) | response is a JSON **list** (not an object) — confirms T1/T2 compat |
    | `test_empty_shelf_paginated` | 0 books | `GET /books?page=1&per_page=5` | `items == []`; `pagination.total = 0`; `total_pages = 0` |

    Each test fails on the **response body** (per CONTRIBUTING.md), not on imports.

    ---

    ## Risks & Mitigations

    | Risk | Likelihood | Mitigation |
    |---|---|---|
    | T1 or T2 asserts a specific response structure for GET /books that the opt-in change breaks | Low (opt-in preserves no-param shape) | Proto P1 reads both files before implementation. If conflict found, escalate as blocker. |
    | `math.ceil` import not present in routes.py | Low | Add `import math` at top of routes.py. |
    | Existing store method name differs from `get_all_books` | Low | Read `store.py` at baseline before writing; use the actual method name. |
    | Per-page cap of 100 is too low for a test | Very low | No existing test uses > 100. Easy to adjust. |

    ---

    ## Out of Scope (explicitly deferred)

    - Cursor-based or keyset pagination (the criterion specifies offset-based: page + per_page).
    - Pagination on other endpoints (`/books/search`, `/books/{id}`, etc.) — not in footprint or criteria.
    - Frontend changes to display pagination controls — not in footprint.
    - Configurable default `per_page` via environment variable — not in criteria.
    - Adding a `page` param to the search endpoint — separate change request.

    All of the above would require their own change requests and footprints.

    ---

    **Summary.** This is a small, well-bounded feature: three additions to existing files and one new test file. The design is conventional (optional offset pagination, standard response envelope), the risk surface is minimal, and the implementation should complete in under an hour including full regression runs. No blockers, no human decisions required. Ready to proceed to implementation.
