    ```yaml:plan_guidance.yaml
    version: 1
    guidance_id: guid-5452b3d1
    source_brief_id: brief-prop_9eaac178521b-001
    proposing_role: strategy
    priority_guidance:
      - area: backend_routes
        priority: high
        rationale: |
          The list_books handler is the single integration point where the
          dual-shape response decision (bare array vs. paginated object) is made.
          A branch-inversion here silently breaks T1 and T2 with no runtime error —
          the response is valid JSON, just the wrong shape. This is the highest-
          failure-cost file in the change and deserves the tightest review.
      - area: tests
        priority: high
        rationale: |
          The test suite is the only automated gate for backward compatibility,
          off-by-one slicing, and ceil-division correctness. Without a no-params
          assertion that explicitly checks isinstance(response_json, list), the
          change can ship a wrapped response that no other check catches.
      - area: backend_store
        priority: medium
        rationale: |
          The slicing method contains the off-by-one risk (page is 1-based, list
          is 0-based) but is a small, isolated method. Lower structural risk than
          routes, but a single arithmetic error shifts every page by one book.
      - area: backend_models
        priority: low
        rationale: |
          Two Pydantic dataclass-style schemas (Pagination, PaginatedBooksResponse).
          Straightforward additive definitions with no branching logic. Minimal
          failure surface.
    ordering_guidance:
      - before: "dev:backend_store"
        after: "dev:backend_models"
        rationale: |
          The store method's return type may reference the Pagination schema or
          at minimum the typing conventions it establishes. Land the schema
          definitions first so the store task has a stable import target.
      - before: "dev:backend_routes"
        after: "dev:backend_store"
        rationale: |
          The modified list_books handler calls store.get_books_paginated(page,
          per_page). The handler cannot be authored or tested meaningfully before
          the store method exists and its signature is fixed.
      - before: "qa:pagination_tests"
        after: "dev:backend_routes"
        rationale: |
          The test suite exercises the endpoint through TestClient. The handler
          must be in its final form (including the branch on param presence)
          before tests can assert on response shapes. Writing tests against a
          stub or partial handler produces false-green or false-red signals.
    risk_guidance:
      - target: "dev:backend_routes"
        risk: |
          Backward-compat inversion: if the handler defaults to the paginated-object
          shape and only falls back to bare array in an explicit "no params" branch
          that is never hit due to a falsy-check on the query params, T1 and T2
          break silently. The safe pattern is: if neither param is supplied, return
          the bare array FIRST and return early; only then build the paginated
          object. The test suite must assert isinstance(body, list) for the
          no-params case to catch this.
      - target: "dev:backend_store"
        risk: |
          Off-by-one in slice indices: page=1 must map to start=0, not start=1.
          The formula is start = (page - 1) * per_page. A developer who writes
          start = page * per_page (forgetting the -1) will skip the first
          per_page books on every request. Pair this with a test that asserts
          page=1, per_page=3 returns books[0:3] in the default ordering.
      - target: "dev:backend_routes"
        risk: |
          Ceil vs. floor division for total_pages: 12 books at per_page=5 gives
          total_pages=3, not 2. Using total // per_page (floor) understates the
          page count whenever total % per_page != 0. Must use math.ceil(total /
          per_page) or the integer idiom (total + per_page - 1) // per_page.
          Also: when total is 0, total_pages must be 0, not 1 (some ceil
          implementations return 1 for 0/n).
      - target: "dev:backend_routes"
        risk: |
          Pagination must operate on the already-sorted/filtered list. GET /books
          currently supports sort and filter query params. If the handler fetches
          the raw book list for the total count but slices the filtered list (or
          vice-versa), total_pages and the items array disagree. The store method
          must receive the full filtered/sorted list and return both the slice
          and the total length of that list.
      - target: "dev:backend_routes"
        risk: |
          30-line handler ceiling (CONTRIBUTING.md). The branch logic (check param
          presence, compute total, slice, build pagination metadata, shape
          response) plus the existing filter/sort handling can exceed 30 lines of
          logic. If it does, extract a _paginate helper. The ceiling counts logic
          lines, not blank lines or imports, but the merger should flag a
          routes.py task that looks like it will need more than 30 lines of logic.
    time_budget_guidance:
      - area: backend_models
        budget_pct: 10
      - area: backend_store
        budget_pct: 15
      - area: backend_routes
        budget_pct: 25
      - area: tests
        budget_pct: 35
      - area: regression_validation
        budget_pct: 15
    scope_cut_guidance: []
    must_not_skip:
      - "No-params GET /books returns a bare JSON array (isinstance check on list, not dict) — the single most fragile backward-compat assertion"
      - "total_pages == 0 when total == 0 (empty-shelf edge case) — without this, an empty shelf returns total_pages=1 or crashes on division"
    defer_if_time_constrained: []
    confidence: "high"
