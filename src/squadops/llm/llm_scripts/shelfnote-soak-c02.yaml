    version: 1
    proposal_id: prop-da364832
    source_brief_id: brief-prop_9eaac178521b-001
    proposing_role: qa
    scope_statement: |
      Single qa.test task authoring tests/test_criterion_T3.py, the new criterion
      verifier for T3 (opt-in offset pagination on GET /books). The suite exercises
      the endpoint exclusively through FastAPI TestClient and asserts on HTTP
      response bodies, distinguishing the faults the brief's must_cover_requirements
      could be built with: backward-compat breakage (no-params response wrapped in
      an object instead of a bare array), off-by-one in 1-based page slicing,
      floor-vs-ceil in total_pages arithmetic, beyond-range page returning wrong
      metadata, and query-parameter range rejections. Regression of frozen T1/T2
      is covered by the framework's frozen-suite re-run plus an explicit
      no-params shape assertion in the new file. No separate regression task is
      proposed because the framework's tests_pass check already re-runs every
      collected suite on the candidate.
    tasks:
      - task_type: qa.test
        role: qa
        focus: "T3 pagination endpoint test suite"
        description: |
          Write tests/test_criterion_T3.py covering the T3 criterion and its
          derived boundary and edge cases. Each test function drives GET /books
          through FastAPI TestClient and asserts on the HTTP response status code
          and JSON body structure. No test imports backend.models, backend.store,
          or any other internal module to inspect state; all assertions are on
          what the endpoint returns.

          Faults distinguished by the suite:

          1. Backward-compat breakage (P0 risk): a GET /books with neither page
             nor per_page returns a JSON object ({"items":…, "pagination":…})
             instead of a bare JSON array. This silently breaks T1 and T2.
             Distinguished by an explicit check that the parsed body is a list,
             not a dict, and that it contains the expected books.

          2. Off-by-one in slice indexing (P1 risk): page is 1-based, the in-memory
             list is 0-based. A wrong start index (page * per_page instead of
             (page-1) * per_page) shifts the window. Distinguished by asserting
             the exact book IDs or titles in the items array for page=2,
             per_page=3 against a known 12-book shelf (expecting the 4th through
             6th books in default ordering).

          3. total_pages arithmetic (P2 risk): floor division (total // per_page)
             instead of ceil (math.ceil(total / per_page)) undercounts when the
             division is not exact. Distinguished by a non-divisible case (e.g.,
             10 books with per_page=4 expecting total_pages=3, not 2) and a
             zero-total case (0 books with per_page=5 expecting total_pages=0).

          4. Beyond-range page: a page value exceeding total_pages must yield a
             200 response with an empty items array and correct pagination
             metadata (total, the requested page number, per_page, total_pages).
             Distinguished from both a missing-pagination bug and an error-status
             bug.

          5. Query-parameter validation: page < 1, per_page < 1, and per_page > 100
             are rejected by FastAPI's Query(ge=, le=) constraints before handler
             logic runs. Distinguished by asserting a 422 status for each
             out-of-range value.

          6. Partial last page: when the final page holds fewer items than
             per_page (e.g., 10 books, per_page=4, page=3 → 2 items), the items
             array contains exactly that many entries.

          7. per_page exceeding total shelf size: per_page=50 against 12 books
             returns all 12 in a single items array with total_pages=1.

          Fixture strategy: seed exactly 12 books via POST /books (or use the
          product's existing conftest fixture if it provides a known shelf),
          record the default ordering from a no-params GET /books, and use that
          ordering to assert correct slice membership in the pagination tests.
          For the zero-shelf test, use a fresh client or clear state as the
          product's conftest permits.
