    # Test Strategy — T3: Pagination for GET /books

    **Proposition:** `prop_9eaac178521b` v1 · **Backlog:** SN-7 · **Budget:** 3 h

    ---

    ## 1. Acceptance Checklist

    These are the concrete pass/fail gates. All must be green before the change is approvable.

    ### 1.1 Criterion T3 (new behaviour)

    - [ ] **T3-core:** `GET /books?page=2&per_page=3` against a fixture of 12 books returns HTTP 200 with a JSON body whose top-level keys include `items` and `pagination`.
    - [ ] **T3-slice:** The `items` array contains exactly 3 book objects, corresponding to the 4th, 5th, and 6th books in the shelf's default ordering (i.e. the slice `[3:6]` zero-indexed).
    - [ ] **T3-meta:** The `pagination` object reports `total=12`, `page=2`, `per_page=3`, `total_pages=4` (integer division `ceil(12/3)`).
    - [ ] **T3-status:** The response status code is 200 (not 201, 204, or an error code).

    ### 1.2 Boundary & edge cases (derived from T3)

    - [ ] **T3-page-1:** `page=1&per_page=3` returns books 1–3 in `items`; `pagination.page=1`.
    - [ ] **T3-last-page:** `page=4&per_page=3` returns book 12 only (1 item); `pagination.total_pages=4`.
    - [ ] **T3-beyond-range:** `page=5&per_page=3` returns HTTP 404 (or 400) with a JSON error body — does **not** silently return an empty list as if it were valid.
    - [ ] **T3-page-zero:** `page=0` returns HTTP 422 (FastAPI validation) or 400; no items returned.
    - [ ] **T3-neg-page:** `page=-1` returns HTTP 422 or 400.
    - [ ] **T3-neg-perpage:** `per_page=-1` returns HTTP 422 or 400.
    - [ ] **T3-perpage-1:** `page=1&per_page=1` returns exactly 1 book; `pagination.total_pages=12`.
    - [ ] **T3-perpage-exceeds-total:** `page=1&per_page=50` returns all 12 books; `pagination.total_pages=1`.
    - [ ] **T3-perpage-0:** `per_page=0` returns HTTP 422 or 400 (division-by-zero guard).

    ### 1.3 Backward compatibility (must-not-break)

    - [ ] **T1-still-passes:** Running `pytest tests/test_criterion_T1.py` produces the same pass count as at baseline commit `2039e0da`.
    - [ ] **T2-still-passes:** Running `pytest tests/test_criterion_T2.py` produces the same pass count as at baseline commit `2039e0da`.
    - [ ] **T-implicit-default:** `GET /books` with **no** `page` or `per_page` query parameters returns the same response shape as before the change (no `pagination` key, or a `pagination` key that is `null`/absent — matching the pre-change contract that T1/T2 assert).

    ### 1.4 Structural / code-quality gates (from CONTRIBUTING.md)

    - [ ] **Handler-length:** The modified `GET /books` handler in `backend/routes.py` is ≤ 30 lines.
    - [ ] **No-external-import:** The new test file imports only packages declared in `backend/requirements.txt` (pytest, httpx/FastAPI TestClient). No undeclared package is imported.
    - [ ] **TestClient-only:** The new test exercises the API through FastAPI `TestClient` or `httpx.AsyncClient`, not a running server.
    - [ ] **Footprint-respect:** Only `backend/routes.py`, `backend/store.py`, `backend/models.py`, and `tests/test_criterion_T3.py` differ from baseline. No other file changes.
    - [ ] **Boots-check:** `.venv/bin/python -c "from backend.main import app"` exits 0.

    ---

    ## 2. Test Strategy Note

    ### 2.1 Scope decision

    | Layer | Decision | Rationale |
    |-------|----------|-----------|
    | Unit (function-level) | **Not written separately** | The pagination slicing lives in `store.py`; it is exercised end-to-end through the endpoint. A separate unit test would duplicate the same logic without adding fault-detection value in a 3-h window. |
    | Integration (endpoint via TestClient) | **Primary coverage** | `tests/test_criterion_T3.py` is the sole new test file. It drives `GET /books` through FastAPI's `TestClient` with various query-parameter combinations, asserting on status code, body shape, item count, item identity, and pagination metadata. |
    | Contract / schema | **Asserted inline** | Each test asserts the exact JSON keys and types in the response. No separate OpenAPI/Pydantic contract test is warranted at this scale. |
    | E2E / frontend | **Out of scope** | The footprint is backend-only. The frontend's `BooksListView.jsx` and `api.js` are not in the footprint and must remain unchanged. No vitest changes. |
    | Regression (existing suite) | **Full run** | The product's `backend_tests` runner (`pytest -q`) picks up every `test_*.py` under `.`. T1, T2, search, sorting, tags, ratings, reading-status tests all run. They must all pass. |

    ### 2.2 Fixture strategy

    The test file `tests/test_criterion_T3.py` should:

    1. Use the product's existing `conftest.py` fixture (which appears to seed a known set of books via `TestClient`).
    2. Ensure exactly **12 books** exist in the shelf before the pagination test runs (seed or assert). If the conftest seeds fewer, the test file creates the remaining books via `POST /books` within a `setup` scope.
    3. Record the **default ordering** (the order `GET /books` returns without pagination) so that the test can assert the correct 3 books appear at `page=2&per_page=3`.
    4. Use `TestClient` with the app from `backend.main` — no network, no running server.

    ### 2.3 What the tests must NOT do

    - They must not import `backend.models` or `backend.store` directly to inspect internal state — assertions are on the HTTP response only (per CONTRIBUTING.md: "fails on what the response says, not on importing something the change adds").
    - They must not monkey-patch the store; the running app is the system under test.
    - They must not be satisfied by FastAPI's default `404` for an unknown path.

    ### 2.4 Test count estimate

    Approximately **9–12 test functions** in `tests/test_criterion_T3.py`:

    | # | Test | Checks |
    |---|------|--------|
    | 1 | `test_pagination_core` | T3-core, T3-slice, T3-meta, T3-status |
    | 2 | `test_pagination_first_page` | T3-page-1 |
    | 3 | `test_pagination_last_page_partial` | T3-last-page |
    | 4 | `test_pagination_beyond_range` | T3-beyond-range |
    | 5 | `test_pagination_page_zero` | T3-page-zero |
    | 6 | `test_pagination_negative_values` | T3-neg-page, T3-neg-perpage, T3-perpage-0 |
    | 7 | `test_pagination_per_page_one` | T3-perpage-1 |
    | 8 | `test_pagination_per_page_exceeds_total` | T3-perpage-exceeds-total |
    | 9 | `test_no_params_backward_compat` | T-implicit-default |
    | 10 | `test_pagination_items_are_valid_books` | Every item in `items` is a dict with the expected book fields (id, title, etc.) |

    ---

    ## 3. Defect Severity Rubric

    | Severity | Definition | Examples in this change | Block approval? |
    |----------|-----------|------------------------|-----------------|
    | **S0 — Critical** | Data corruption, security exposure, app does not boot, or an accepted behaviour is permanently lost. | `GET /books` without params now returns 500; a book is lost or duplicated; a test in T1/T2 fails and cannot be recovered. | **Yes** — stop, fix, re-run full suite. |
    | **S1 — Major** | The API returns wrong data for a valid request, or violates the stated criterion. | `page=2&per_page=3` returns books 1–3 instead of 4–6; `total_pages` is 5 instead of 4; the `pagination` key is absent. | **Yes** — stop, fix, re-run T3 + T1 + T2. |
    | **S2 — Minor** | Edge-case handling is sub-optimal but does not return incorrect data for in-range requests. | `page=5&per_page=3` returns `200` with an empty `items` array instead of 404; error message body is empty `{}`. | **No** — file as follow-up, note in review. Does not block if T1/T2 pass. |
    | **S3 — Cosmetic** | Formatting, naming, or documentation nit. | Pagination metadata key is `totalPages` instead of `total_pages`; a docstring is missing. | **No** — note only. |

    **Escalation rule:** If two S2 defects are found in the same test run, escalate the second to S1 (pattern suggests a systemic misunderstanding of boundary semantics).

    ---

    ## 4. Risk-Based Test Priorities

    Ranked by probability of fault × impact if fault ships.

    | Priority | Area | Why it's risky | Coverage |
    |----------|------|---------------|----------|
    | **P0** | **Backward compatibility (no params)** | The pre-change `GET /books` returns a bare list (or a specific envelope) that T1 and T2 assert. If the refactor always wraps the response in `{"items":…, "pagination":…}`, T1/T2 break. This is the single most likely regression. | `test_no_params_backward_compat` + full T1/T2 run. |
    | **P1** | **Off-by-one in item slicing** | `page=2, per_page=3` → slice `[3:6]` vs `[2:5]`. The "4th through 6th" wording in the criterion is 1-indexed; the code is 0-indexed. A one-position shift is the most common pagination bug. | `test_pagination_core` asserts exact book IDs/titles, not just count. |
    | **P2** | **`total_pages` arithmetic** | `ceil(12/3)=4` is straightforward, but `ceil(12/5)=3`, `ceil(12/13)=1` need correct integer division. A `//` vs `math.ceil` mix-up produces off-by-one page counts. | `test_pagination_per_page_exceeds_total` and `test_pagination_per_page_one` exercise non-divisible cases. |
    | **P3** | **Boundary / invalid-input handling** | `page=0`, negative values, `per_page=0`. FastAPI's `Query(..., ge=1)` can handle some, but the store layer may still receive a zero and divide by it. | `test_pagination_beyond_range`, `test_pagination_negative_values`. |
    | **P4** | **Interaction with existing sort/filter** | If `GET /books` already supports a `sort` or `filter` param, pagination must apply *after* filtering, not before. The criterion says "default ordering" but the code must not silently break a combined query. | Not in the criterion's observable, but covered implicitly if the full suite (sorting tests, search tests) passes. Flag as S2 if a combined query misbehaves. |

    ---

    ## 5. Verification Run Plan (for implementation phase)

    When the implementation is ready, the QA agent runs:

    ```
    # 1. Boot check
    .venv/bin/python -c "from backend.main import app"
    # expect: exit 0, no output

    # 2. Full backend test suite (includes T1, T2, T3, and all existing tests)
    .venv/bin/python -m pytest -q -p no:cacheprovider
    # expect: all pass; count ≥ baseline + 9 (new T3 tests)

    # 3. Frontend tests (must be unchanged but confirmed green)
    npm --prefix frontend test --silent
    # expect: same pass count as baseline
    ```

    Any failure is triaged against the severity rubric in §3. S0/S1 defects halt the cycle.

    ---

    ## 6. Out-of-Scope / Deferred

    - **Frontend pagination UI** (page controls, "next/prev" buttons in `BooksListView.jsx`): The footprint does not include any frontend file. The API change is available to the frontend, but no frontend work is in this cycle.
    - **Caching of paginated results**: No requirement for caching; deferred to a future increment if performance demands it.
    - **Cursor-based pagination as an alternative**: The criterion specifies offset-based (`page`, `per_page`). Cursor pagination is a different design and out of scope.
    - **Pagination on other endpoints** (`GET /search`, `GET /books/{id}/ratings`, etc.): The footprint and criterion name only `GET /books`.

    ---

    *Document produced at Stage A (planning). No test files are written here; the concrete `tests/test_criterion_T3.py` is produced during the implementation workload within the 3-hour budget.*
