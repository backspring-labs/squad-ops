    ## Consolidated Plan

    ### 1. Context & Objective Frame

    This is an increment on an accepted application (Shelfnote, commit `2039e0da`). The approved change request (`prop_9eaac178521b`, basis `campaign_branch`, backlog item SN-7) adds pagination to the `GET /books` endpoint. No PRD delta or manifest delta is introduced; the existing requirements and interface contract stand. The reviewer's notes contain no additional design directives beyond the pre-registration approval rule.

    **Objective**: `GET /books` accepts optional `page` and `per_page` query parameters. When invoked with those parameters, the response is a JSON object containing an `items` array (the requested slice) and a `pagination` object with `total`, `page`, `per_page`, and `total_pages`.

    **Footprint (exclusive)**:
    | File | Role |
    |------|------|
    | `backend/routes.py` | Route handler: accept query params, delegate to store, shape response |
    | `backend/store.py` | Data layer: return a paginated slice + total count |
    | `backend/models.py` | Pydantic models: response envelope for paginated books |
    | `tests/test_criterion_T3.py` | Test file: verify T3 observable and must-not-break behaviour |

    All other files retain their accepted implementation.

    ---

    ### 2. Technical Design

    #### 2.1 Backward-compatibility rule

    `must_not_break: [T1, T2]` constrains the default (no-params) response shape. The design applies:

    - **With `page` and/or `per_page` present** → response is a paginated object:
      ```json
      { "items": [ … ], "pagination": { "total": N, "page": p, "per_page": pp, "total_pages": tp } }
      ```
    - **Without either parameter** → response retains the existing shape accepted by T1/T2 (a bare list of book objects, or whatever the current handler returns).

    This conditional branching keeps the accepted contract intact while introducing the new behaviour behind explicit query parameters.

    #### 2.2 `backend/models.py`

    Add a Pydantic model:

    ```python
    class PaginationMeta(BaseModel):
        total: int
        page: int
        per_page: int
        total_pages: int

    class PaginatedBooksResponse(BaseModel):
        items: List[BookResponse]   # reuse existing book model
        pagination: PaginationMeta
    ```

    No existing model is modified; the new models are additive.

    #### 2.3 `backend/store.py`

    Add a method (or extend the existing list method) that accepts `offset: int` and `limit: int` and returns a tuple:

    ```python
    def list_books_paginated(self, offset: int, limit: int) -> tuple[list[Book], int]:
        total = len(self._books)          # or count from whatever backing structure
        items = self._books[offset : offset + limit]
        return items, total
    ```

    The exact backing structure (in-memory list, dict, etc.) follows the file's existing convention at the accepted commit. The method is additive; existing methods are untouched.

    #### 2.4 `backend/routes.py`

    Modify the `GET /books` handler:

    ```python
    @router.get("/books")
    async def get_books(
        page: int | None = None,
        per_page: int | None = None,
        # …existing params (search, sort, tags, etc.) preserved…
    ):
        if page is None and per_page is None:
            return store.list_books()          # existing path, unchanged

        # pagination path
        p = max(1, page)
        pp = min(100, max(1, per_page))        # clamp to sane bounds
        offset = (p - 1) * pp
        items, total = store.list_books_paginated(offset, pp)
        total_pages = math.ceil(total / pp) if total else 0
        return PaginatedBooksResponse(
            items=items,
            pagination=PaginationMeta(total=total, page=p, per_page=pp, total_pages=total_pages),
        )
    ```

    The handler stays under the 30-line limit from CONTRIBUTING.md. Existing query parameters (search, sort, tags) are preserved in the signature; they interact with the paginated slice (filter first, then paginate) following the store's existing filter logic.

    #### 2.5 Edge-case decisions (design-level, not blocker)

    | Case | Behaviour |
    |------|-----------|
    | `page < 1` | Clamp to 1 |
    | `per_page < 1` | Clamp to 1 |
    | `per_page > 100` | Clamp to 100 |
    | `page > total_pages` | Return empty `items`, correct `pagination` metadata |
    | `total == 0` | `total_pages = 0`, `items = []` |
    | Existing filters (search, sort) combined with pagination | Filter/sort first, then paginate the filtered set |

    These are implementation details the dev agent resolves during coding; none change the observable contract in T3.

    ---

    ### 3. Test Strategy

    #### 3.1 New: `tests/test_criterion_T3.py`

    Test file discovered by pytest (name matches `test_*.py`, lives under `.`). Uses `FastAPI TestClient` per the product's convention. Imports only from `backend.main` (declared in `backend/requirements.txt`).

    Test cases:

    | # | Scenario | Assertion |
    |---|----------|-----------|
    | T3a | Seed 12 books; `GET /books?page=2&per_page=3` | `items` length == 3; items are books #4–#6 in default ordering; `pagination == {total:12, page:2, per_page:3, total_pages:4}` |
    | T3b | Seed 12 books; `GET /books?page=1&per_page=3` | `items` length == 3; items are books #1–#3 |
    | T3c | Seed 12 books; `GET /books?page=5&per_page=3` (beyond last page) | `items == []`; `pagination.total_pages == 4` |
    | T3d | `GET /books` (no pagination params) | Response shape matches the pre-change format (list of books), confirming T1/T2 contract preserved |
    | T3e | Seed 12 books; `GET /books?page=1&per_page=12` | `items` length == 12; `pagination.total_pages == 1` |

    Each test fails on the response body, not on import errors (per CONTRIBUTING.md).

    #### 3.2 Must-not-break: T1, T2

    No new test is written for T1 or T2. Their existing test files (`tests/test_criterion_T1.py`, `tests/test_criterion_T2.py`) remain in the tree and pass under the product's own pytest run. The design's backward-compatibility rule (§2.1) is the mechanism that preserves them.

    ---

    ### 4. Sufficiency Assessment

    | Criterion | Score | Rationale |
    |-----------|-------|-----------|
    | **Scope clarity** | 5 | Footprint is 4 files, explicitly enumerated. Observable in T3 is a single, unambiguous input→output mapping. `must_not_break` is named. No ambiguity about what is in or out. |
    | **Technical feasibility** | 5 | Pagination over an in-memory (or simple) collection in FastAPI is a well-trodden pattern. No new dependencies, no external service, no schema migration. The design fits within the existing file responsibilities. |
    | **Risk coverage** | 4 | Primary risks (backward compat, edge-case clamping, filter+pagination interaction) are identified and resolved at design level. Residual unknown: exact current return type of `GET /books` without params (list vs. dict). This is a one-line inspection of `routes.py` at the accepted commit and is not a blocker—dev resolves it in the first task. |
    | **Test strategy alignment** | 4 | T3 observable is directly tested (T3a). Edge cases are covered (T3b–T3e). Must-not-break is handled by preservation of existing tests rather than new ones, which is correct per CONTRIBUTING.md. Minor gap: no explicit test for filter+pagination interaction, but that combination is not in the T3 observable and adding it risks scope creep beyond the criterion. |
    | **Resource fit** | 5 | Four files changed, one test file added. Well within the 3-hour budget. Squad composition (dev + qa) is sufficient; no new tooling or specialist role needed. |

    **Overall sufficiency: 4 / 5**

    The one-point deduction reflects the minor residual on the exact current response shape (resolved by inspection, not a planning blocker) and the absence of an explicit filter+pagination test (deferred as out-of-criterion). Neither prevents execution.

