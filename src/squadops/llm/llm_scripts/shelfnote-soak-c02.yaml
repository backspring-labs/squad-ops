    """T3: GET /books pagination — page/per_page params, backward-compat bare array,
    correct slicing, ceiling total_pages, boundary and edge cases."""


    def _seed_shelf(client, n=12):
        """Seed n books via POST /books. Returns their IDs in POST order (oldest first)."""
        ids = []
        for i in range(n):
            res = client.post(
                "/books",
                json={"title": f"Book {i}", "author": f"Author {i}", "added_by": "U"},
            )
            assert res.status_code == 201
            ids.append(res.json()["id"])
        return ids


    def _default_order_ids(client):
        """Return book IDs in the shelf's default ordering (newest first)."""
        res = client.get("/books")
        assert res.status_code == 200
        body = res.json()
        assert isinstance(body, list), f"Expected bare array without pagination params, got {type(body).__name__}"
        return [b["id"] for b in body]


    def test_no_pagination_params_returns_bare_array(client):
        """GET /books with neither page nor per_page returns a JSON array, not an object.

        Fault caught: backward-compat breakage — the endpoint always returns
        {"items":…,"pagination":…}, silently breaking T1 and T2 consumers.
        """
        _seed_shelf(client, 3)
        res = client.get("/books")
        assert res.status_code == 200
        body = res.json()
        assert isinstance(body, list), (
            f"Expected bare JSON array, got {type(body).__name__}: {list(body.keys()) if isinstance(body, dict) else body}"
        )
        assert len(body) == 3


    def test_page_2_per_page_3_returns_books_4_through_6(client):
        """page=2, per_page=3 on 12 books → items are the 4th–6th in default order.

        Fault caught: off-by-one in slice start (page*per_page instead of (page-1)*per_page).
        """
        _seed_shelf(client, 12)
        default_order = _default_order_ids(client)  # newest first, 12 entries

        res = client.get("/books", params={"page": 2, "per_page": 3})
        assert res.status_code == 200
        body = res.json()
        assert isinstance(body, dict), f"Expected object with pagination, got {type(body).__name__}"

        items = body["items"]
        assert len(items) == 3, f"Expected 3 items, got {len(items)}"

        # 4th through 6th in default ordering (0-indexed: indices 3,4,5)
        expected_ids = default_order[3:6]
        actual_ids = [b["id"] for b in items]
        assert actual_ids == expected_ids, (
            f"Expected books {expected_ids} (4th–6th), got {actual_ids}"
        )


