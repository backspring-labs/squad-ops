    """Criterion A1: GET /stats — authors count aggregation.

    Faults distinguished:
      1. Zero-book author leakage (stale key or count-0 inclusion)
      2. Count aggregation overwrite (dict[author] = 1 instead of += 1)
      3. Empty-shelf edge case (iteration/index over empty collection)
      4. Response structure (wrong type, string/float values)
    """


    def test_zero_book_author_absent_from_authors(client):
        """Authors with zero books must not appear as keys in the authors object.

        Seeds two books by 'Author B' only (store is reset per-test by conftest).
        Asserts 'Author B' is present with count 2 and 'Author A' is absent.

        Fails if the store retains a stale key or the aggregation includes
        authors whose book count is 0.
        """
        client.post("/books", json={"title": "Book1", "author": "Author B", "added_by": "U"})
        client.post("/books", json={"title": "Book2", "author": "Author B", "added_by": "U"})

        res = client.get("/stats")
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        authors = res.json()["authors"]

        assert "Author B" in authors, f"Expected 'Author B' in authors, got {authors}"
        assert authors["Author B"] == 2, f"Expected count 2 for Author B, got {authors['Author B']}"
        assert "Author A" not in authors, (
            f"Zero-book author 'Author A' leaked into authors dict: {authors}"
        )


    def test_count_aggregation_increments_not_overwrites(client):
        """Three books by the same author yield count 3, not 1.

        Seeds 3 books by 'Same Author' and 1 by 'Other Author'.
        Fails if the aggregation loop uses dict[author] = 1 instead of += 1.
        """
        client.post("/books", json={"title": "T1", "author": "Same Author", "added_by": "U"})
        client.post("/books", json={"title": "T2", "author": "Same Author", "added_by": "U"})
        client.post("/books", json={"title": "T3", "author": "Same Author", "added_by": "U"})
        client.post("/books", json={"title": "T4", "author": "Other Author", "added_by": "U"})

        res = client.get("/stats")
        assert res.status_code == 200
        authors = res.json()["authors"]

        assert authors["Same Author"] == 3, (
            f"Expected 3 for 'Same Author' (3 books seeded), got {authors['Same Author']} — "
            f"overwrite instead of increment?"
        )
        assert authors["Other Author"] == 1, f"Expected 1 for 'Other Author', got {authors['Other Author']}"


    def test_empty_shelf_authors_is_empty_dict(client):
        """Fresh shelf (no books seeded): GET /stats → authors is exactly {}.

        Fails if iteration or index access over the empty collection raises,
        or if the key is missing, the value is null/a list, or the response
        is not a 200.
        """
        res = client.get("/stats")
        assert res.status_code == 200, f"Expected 200 on empty shelf, got {res.status_code}"
        body = res.json()

        assert "authors" in body, f"'authors' key missing from GET /stats body: {list(body.keys())}"
        assert isinstance(body["authors"], dict), (
            f"authors must be a dict (object), got {type(body['authors']).__name__}: {body['authors']!r}"
        )
        assert body["authors"] == {}, (
            f"Expected authors to be exactly {{}}, got {body['authors']!r}"
        )


    def test_authors_values_are_integers_not_strings_or_floats(client):
        """Every value in the authors object is a true int, not str/float/bool.

        Also asserts the top-level body is a dict with 'authors' mapping to a dict
        (no extra envelope, no list). Fails if the handler serialises counts as
        strings ("2") or floats (2.0).
        """
        client.post("/books", json={"title": "A1", "author": "AuthX", "added_by": "U"})
        client.post("/books", json={"title": "A2", "author": "AuthX", "added_by": "U"})
        client.post("/books", json={"title": "B1", "author": "AuthY", "added_by": "U"})

        res = client.get("/stats")
        assert res.status_code == 200
        body = res.json()

        assert isinstance(body, dict), f"Expected dict body, got {type(body).__name__}"
        assert "authors" in body, f"'authors' key missing: {list(body.keys())}"
        authors = body["authors"]
        assert isinstance(authors, dict), f"authors must be a dict, got {type(authors).__name__}"

        # Precondition: we seeded two distinct authors
        assert len(authors) == 2, f"Expected exactly 2 authors, got {len(authors)}: {authors}"

        for author, count in authors.items():
            assert isinstance(count, int), (
                f"authors['{author}'] is {type(count).__name__} ({count!r}), expected int"
            )
            assert not isinstance(count, bool), f"authors['{author}'] is a bool, not an int"
