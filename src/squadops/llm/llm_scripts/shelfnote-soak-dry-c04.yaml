    ```python:tests/test_criterion_A1.py
    """Criterion A1: GET /stats — 'authors' key maps each author to their integer book count.
    No zero-count authors; increment not overwrite; empty shelf yields {}; values are ints."""


    def _post_book(client, title="T", author="A", added_by="U"):
        """POST a book via the TestClient and assert 201; return the JSON dict."""
        res = client.post("/books", json={"title": title, "author": author, "added_by": added_by})
        assert res.status_code == 201
        return res.json()


    def test_zero_book_author_absent_from_authors(client):
        """Seed books only by author B; assert author A (zero books) has no key.

        Faults caught:
          1. Store retains a stale key for an author with no remaining books.
          2. Aggregation includes authors whose count is 0 instead of omitting them.
        """
        _post_book(client, title="B1", author="Author B", added_by="U")
        _post_book(client, title="B2", author="Author B", added_by="U")

        res = client.get("/stats")
        assert res.status_code == 200
        body = res.json()
        assert "authors" in body, f"Missing 'authors' key: {body}"
        authors = body["authors"]

        # B is present with correct count
        assert "Author B" in authors, f"'Author B' missing from authors: {authors}"
        assert authors["Author B"] == 2

        # A must NOT appear — zero-book author leakage
        assert "Author A" not in authors, (
            f"Author with zero books leaked into response: {authors}"
        )


    def test_count_aggregation_increments_not_overwrites(client):
        """Seed 3 books by same author, 1 by another → same-author count is 3, not 1.

        Fault caught: loop uses dict[author] = 1 instead of dict[author] += 1,
        so every author's count is always 1 regardless of actual book count.
        """
        for i in range(3):
            _post_book(client, title=f"Book {i}", author="Heavy Author", added_by="U")
        _post_book(client, title="Other", author="Light Author", added_by="U")

        res = client.get("/stats")
        assert res.status_code == 200
        authors = res.json()["authors"]

        assert authors["Heavy Author"] == 3, (
            f"Expected count 3, got {authors.get('Heavy Author')!r} — "
            f"indicates overwrite (assignment) rather than increment"
        )
        assert authors["Light Author"] == 1


    def test_empty_shelf_authors_is_empty_dict(client):
        """No books on shelf → 200, 'authors' key present with value exactly {}.

        Faults caught:
          1. Iteration or index access over the empty collection raises (500).
          2. Response omits the 'authors' key entirely.
          3. Value is null (None), a list, or a non-empty dict.
        """
        res = client.get("/stats")
        assert res.status_code == 200, f"Expected 200 on empty shelf, got {res.status_code}"
        body = res.json()
        assert "authors" in body, f"'authors' key missing on empty shelf: {list(body.keys())}"
        assert body["authors"] == {}, (
            f"Expected empty dict for authors on empty shelf, got {body['authors']!r}"
        )


    def test_authors_values_are_integers_not_strings_or_floats(client):
        """'authors' is a dict at the top level; every value is an int.

        Faults caught:
          1. Handler serialises counts as strings (e.g. "3") or floats (e.g. 3.0).
          2. Handler wraps the payload in an extra envelope or returns a list
             instead of an object.
          3. Top-level 'authors' key is missing or its value is not a dict.
        """
        _post_book(client, title="X", author="Int Author", added_by="U")
        _post_book(client, title="Y", author="Int Author", added_by="U")

        res = client.get("/stats")
        assert res.status_code == 200
        body = res.json()

        # Top-level structure: 'authors' is present and is a dict
        assert "authors" in body, f"Missing 'authors' key: {body}"
        authors = body["authors"]
        assert isinstance(authors, dict), (
            f"'authors' must be a dict (object), got {type(authors).__name__}"
        )

