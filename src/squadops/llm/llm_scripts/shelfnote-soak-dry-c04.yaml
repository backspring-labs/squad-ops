- task_type: development.design_plan
  occurrence: 1
  call: 1
  content: "# Technical Design: `GET /stats` Endpoint\n\n## 1. Architecture Overview\n\
    \nThis change adds a single read-only endpoint to the existing FastAPI backend.\
    \ The data flow is linear:\n\n```\nClient → GET /stats → route handler → store.get_author_counts()\
    \ → JSON response\n```\n\nTwo files are modified within the footprint; one test\
    \ file is added. No new dependencies, no new models, no frontend changes.\n\n\
    ```\nbackend/routes.py        # +1 route handler (~8 lines)\nbackend/store.py\
    \         # +1 method: get_author_counts()\ntests/test_criterion_A1.py  # new:\
    \ pytest via TestClient\n```\n\nThe endpoint is a pure aggregation over the existing\
    \ book collection. It introduces no state mutation, no new storage concept, and\
    \ no new HTTP method beyond the existing GET pattern.\n\n## 2. Interface Definitions\n\
    \n### 2.1 Store Layer — `backend/store.py`\n\n**New method:**\n\n```python\ndef\
    \ get_author_counts(self) -> dict[str, int]:\n    \"\"\"Return a mapping of author\
    \ name → number of books on the shelf.\n\n    Only authors with at least one book\
    \ appear as keys.\n    \"\"\"\n```\n\n- Iterates the store's existing book collection\
    \ (the same collection `list_books` reads from).\n- Returns an empty dict `{}`\
    \ when the shelf is empty.\n- Author identity is the exact string stored on the\
    \ book's `author` field (case-sensitive, per existing model conventions).\n- No\
    \ new attributes, no new data structure; the count is derived at call time.\n\n\
    ### 2.2 Route Layer — `backend/routes.py`\n\n**New handler:**\n\n```python\n@router.get(\"\
    /stats\")\ndef get_stats():\n    \"\"\"Return per-author book counts for the current\
    \ shelf.\"\"\"\n    counts = store.get_author_counts()\n    return {\"authors\"\
    : counts}\n```\n\n- Returns HTTP 200 with JSON body `{\"authors\": {...}}`.\n\
    - No query parameters, no path parameters, no auth.\n- Handler body is well under\
    \ the 30-line limit from CONTRIBUTING.md.\n- The only status code this endpoint\
    \ can answer is **200** (GET on existing data; no failure path in the observable).\n\
    \n### 2.3 Response Contract\n\n| Shelf state | Response body |\n|---|---|\n| Empty\
    \ shelf | `{\"authors\": {}}` |\n| Books by authors A, B (A has 3, B has 1) |\
    \ `{\"authors\": {\"A\": 3, \"B\": 1}}` |\n| Author X had a book that was deleted\
    \ (0 remaining) | No key for X |\n\n### 2.4 Data Model (unchanged)\n\nThe existing\
    \ `Book` model in `backend/models.py` already carries an `author` field. No schema\
    \ change is needed. The store's in-memory (or file-backed) book list is the sole\
    \ source.\n\n## 3. Implementation Sequencing\n\n| Phase | Work | Dependency |\
    \ Est. |\n|---|---|---|---|\n| **P1** | Add `get_author_counts()` to `backend/store.py`\
    \ | None | 5 min |\n| **P2** | Add `GET /stats` handler to `backend/routes.py`\
    \ | P1 | 5 min |\n| **P3** | Write `tests/test_criterion_A1.py` | P1, P2 | 15\
    \ min |\n| **P4** | Run full test suite (`backend_tests`) to confirm `must_not_break`\
    \ (T1–T3, C1–C2) all pass | P1–P3 | 5 min |\n| **P5** | Verify `boots` check (`from\
    \ backend.main import app`) | P1–P2 | 1 min |\n\nTotal estimated effort: **~30\
    \ minutes** of implementation, well within the 3-hour budget.\n\n## 4. Proto Validation\
    \ Plan\n\nNo prototypes are required. The feasibility concerns are trivially resolved:\n\
    \n| Question | Resolution |\n|---|---|\n| Can the store enumerate all books and\
    \ aggregate by a string field? | Yes — `list_books` already iterates the collection;\
    \ a `collections.Counter` or a simple dict loop suffices. No new I/O, no concurrency\
    \ concern (single-process FastAPI). |\n| Will adding a route to the existing `APIRouter`\
    \ conflict with any existing path? | No — `/stats` is a new path; no existing\
    \ route matches it. |\n| Will the new test file be discovered by pytest under\
    \ the product's runner? | Yes — file named `test_criterion_A1.py` under `tests/`,\
    \ matching the `test_*.py` pattern, and it imports `backend.main` (declared in\
    \ `backend/requirements.txt` via `fastapi`). |\n\n**Classification: all unknowns\
    \ resolved during planning. No proto needed.**\n\n## 5. Unknowns Table\n\n| #\
    \ | Unknown | Classification | Notes |\n|---|---|---|---|\n| U1 | Exact internal\
    \ structure of `store.py`'s book collection (list vs. dict vs. DB) | **resolved**\
    \ | The method iterates the same collection `list_books` uses; implementation\
    \ adapts to whatever that is (likely a `list[Book]` or `dict[str, Book]`). No\
    \ external dependency. |\n| U2 | Whether `author` field can be `None` or empty\
    \ string | **acceptable_risk** | The model likely enforces a non-empty string\
    \ at creation time (existing tests T1–T3 create books with authors). If a `None`\
    \ author ever appears, it would key as `\"None\"` — a degenerate case not covered\
    \ by the observable. Mitigation: skip entries where author is falsy in the counter\
    \ loop. |\n| U3 | Whether `GET /stats` path collides with any existing route |\
    \ **resolved** | No existing route in the product uses `/stats`. The existing\
    \ routes are under `/books`, `/search`, `/ratings`, `/reading-status`, `/tags`\
    \ (inferred from test filenames). |\n| U4 | Status codes the endpoint can return\
    \ | **resolved** | Only 200. No validation input, no auth, no resource-that-can-404.\
    \ CONTRIBUTING.md says \"a test for each status code it can answer\" → one test\
    \ block for 200. |\n| U5 | Whether the test needs to seed the shelf or reuse conftest\
    \ fixtures | **resolved** | `conftest.py` (1102 bytes) likely provides a `client`\
    \ fixture via `TestClient(app)`. The test will seed books via `POST /books` (or\
    \ the store directly if conftest exposes it) then call `GET /stats`. Follow existing\
    \ test patterns in `test_criterion_T1.py` etc. |\n\n**No blockers. No items requiring\
    \ human decision.**\n\n## 6. Test Design — `tests/test_criterion_A1.py`\n\nFollowing\
    \ the product's test conventions (pytest + TestClient, fail on response content):\n\
    \n```python\n# tests/test_criterion_A1.py\n\"\"\"Criterion A1: GET /stats returns\
    \ per-author book counts.\"\"\"\nimport pytest\n\ndef test_stats_returns_author_counts(client):\n\
    \    \"\"\"Authors with books appear with correct counts; empty shelf → empty\
    \ object.\"\"\"\n    # Seed: 2 books by 'Ada', 1 book by 'Linus'\n    # POST /books\
    \ {...} × 3\n\n    resp = client.get(\"/stats\")\n    assert resp.status_code\
    \ == 200\n    body = resp.json()\n    assert \"authors\" in body\n    assert body[\"\
    authors\"] == {\"Ada\": 2, \"Linus\": 1}\n\n\ndef test_stats_empty_shelf(client):\n\
    \    \"\"\"No books → authors is an empty object, no keys.\"\"\"\n    resp = client.get(\"\
    /stats\")\n    assert resp.status_code == 200\n    assert resp.json() == {\"authors\"\
    : {}}\n\n\ndef test_stats_author_with_zero_books_absent(client):\n    \"\"\"If\
    \ all books by an author are removed, that author's key vanishes.\"\"\"\n    #\
    \ Seed 1 book by 'Zed', then DELETE it (if delete exists) \n    # OR: seed a fresh\
    \ shelf with only 'Ada', verify 'Zed' absent\n    resp = client.get(\"/stats\"\
    )\n    body = resp.json()\n    assert \"Zed\" not in body[\"authors\"]\n```\n\n\
    Key points:\n- Uses the `client` fixture from `conftest.py` (product convention).\n\
    - Fails on response content (`resp.json()`), not on imports.\n- No new package\
    \ imports beyond `pytest` and what `conftest.py` provides.\n- Each test is independent\
    \ (fresh shelf via fixture teardown or in-test isolation, matching existing test\
    \ patterns).\n\n## 7. must-not-break Verification\n\n| Test | What it checks |\
    \ Risk from this change |\n|---|---|---|\n| T1, T2, T3 | Core book CRUD / list\
    \ behaviour | None — no existing route modified, no model changed |\n| C1, C2\
    \ | Rating / category behaviour (inferred from test names) | None — `/stats` is\
    \ additive; no shared mutable state touched |\n\nThe only shared file touched\
    \ is `store.py`, where a **new method** is appended. No existing method's signature\
    \ or behaviour changes. `routes.py` gains a **new handler** on the same router;\
    \ no existing handler is altered.\n\n## 8. What Is Explicitly Out of Scope\n\n\
    - No frontend change (no `manifest_delta`, no frontend file in footprint).\n-\
    \ No new model, no new dependency, no new configuration.\n- No pagination, filtering,\
    \ or sorting on the stats endpoint (the observable specifies a flat object only).\n\
    - No modification to any existing test file.\n- No `prd_delta` — the endpoint's\
    \ behaviour is fully specified by criterion A1's observable.\n\n## 9. Summary\n\
    \nA minimal, additive change: one store method, one route handler, one test file.\
    \ All within the 3-hour budget with large margin. No blockers, no prototypes required,\
    \ no human decisions pending. Ready for implementation."
- task_type: qa.define_test_strategy
  occurrence: 1
  call: 1
  content: |-
    # Test Strategy: `GET /stats` Endpoint (prop_95ba337d5303)

    ## 1. Acceptance Checklist

    Derived from criterion **A1** and the `must_not_break` set. Each item is a concrete pass/fail check usable during implementation review.

    ### A1 — New behaviour (`GET /stats`)

    - [ ] **A1.1** `GET /stats` responds with HTTP `200` when the shelf has at least one book.
    - [ ] **A1.2** The response body is valid JSON with `Content-Type: application/json`.
    - [ ] **A1.3** The JSON body contains a top-level key named `"authors"` whose value is a JSON object (dict).
    - [ ] **A1.4** Every key in `authors` is a string author name for which **at least one** book currently exists on the shelf.
    - [ ] **A1.5** Every value in `authors` is a JSON integer (not a string, not a float) equal to the number of books on the shelf attributed to that author.
    - [ ] **A1.6** No key appears in `authors` for an author whose book count is zero. (e.g., if a book previously authored by "X" is removed, "X" must not appear.)
    - [ ] **A1.7** Empty-shelf case: when no books exist on the shelf, `authors` is an empty object `{}` (not `null`, not omitted).
    - [ ] **A1.8** Multiple books by the same author are aggregated into a single count (e.g., 3 books by "Ursula K. Le Guin" → `"Ursula K. Le Guin": 3`).
    - [ ] **A1.9** The endpoint does not mutate shelf state (subsequent `GET /books` returns the same set).

    ### Regression — `must_not_break` (T1, T2, T3, C1, C2)

    - [ ] **R.1** `tests/test_criterion_T1.py` passes unchanged.
    - [ ] **R.2** `tests/test_criterion_T2.py` passes unchanged.
    - [ ] **R.3** `tests/test_criterion_T3.py` passes unchanged.
    - [ ] **R.4** `tests/test_criterion_C1.py` passes unchanged.
    - [ ] **R.5** `tests/test_criterion_C2.py` passes unchanged.
    - [ ] **R.6** All other existing test files under `tests/` pass unchanged (full `pytest` run is green).
    - [ ] **R.7** Frontend test suite (`npm --prefix frontend test --silent`) passes unchanged.
    - [ ] **R.8** Application boots: `.venv/bin/python -c "from backend.main import app"` succeeds with no error.

    ### Contributor-contract checks

    - [ ] **C.1** The new route handler in `backend/routes.py` is ≤ 30 lines.
    - [ ] **C.2** The test in `tests/test_criterion_A1.py` exercises the API via `TestClient` (or `httpx.AsyncClient`) and asserts on response content, not on internal imports.
    - [ ] **C.3** The test does not rely on a framework default (e.g., FastAPI's automatic 404 for unknown paths) to pass.

    ---

    ## 2. Test Strategy Note

    ### Scope & layering

    | Layer | What it verifies | Where it lives |
    |---|---|---|
    | **Criterion (integration)** | The full request→response contract of `GET /stats` through the FastAPI `TestClient` | `tests/test_criterion_A1.py` (footprint) |
    | **Regression (integration)** | Existing behaviour is undisturbed | All existing `tests/test_*.py` files (unchanged) |
    | **Frontend (regression)** | Frontend still builds and its tests pass | `frontend/src/__tests__/harness.test.jsx` (unchanged) |

    No unit-level tests are required for this change. The store method (`store.get_author_counts` or equivalent) is exercised exclusively through the endpoint, consistent with the product's testing convention ("each test of a new behaviour exercises the running app's API through the test client"). A unit test for the store function would be a duplication that the product's conventions do not call for and that falls outside the footprint (only `routes.py`, `store.py`, and `test_criterion_A1.py` may change).

    ### Test-client pattern

    The criterion test must follow the product's established pattern visible in `conftest.py` and existing criterion tests:

    1. Import `TestClient` from `fastapi.testclient` (already a declared dependency via `httpx`).
    2. Use the shared fixture (or construct a client against `backend.main.app`) to seed books via `POST /books` as needed.
    3. Issue `GET /stats`.
    4. Assert on status code, `Content-Type`, and the parsed JSON body.

    The test must **fail on response content** (wrong count, missing key, extra key, non-integer value), not on import errors or internal function signatures.

    ### Status-code coverage (CONTRIBUTING.md rule)

    The change adds a read-only `GET` endpoint. The only status code it answers is `200` on success. No error states (404, 422, 500) are introduced by this endpoint because:

    - It takes no path parameters or query parameters that could be malformed.
    - It performs no validation that can reject the request.
    - An empty shelf is a valid state (returns `{"authors": {}}`).

    Therefore one status-code test (200) satisfies the "test for each status code it can answer" rule. If implementation introduces an unexpected error path (e.g., an unhandled exception in the store layer), that is a defect, not a new status code to test.

    ### What is NOT tested in this cycle

    - Frontend changes (none are in the footprint).
    - Auth, CORS, or middleware (unchanged).
    - Concurrency / race conditions on the store (out of scope for a planning-stage note; would be an integration concern if the store were mutable during reads).
    - Performance or load characteristics.

    ---

    ## 3. Defect Severity Rubric

    | Severity | Label | Definition | Examples in this change |
    |---|---|---|---|
    | **S1 — Blocker** | Cycle cannot be accepted. A `must_not_break` criterion fails, or the new endpoint is absent / returns non-JSON / 500. | T1–T3 or C1–C2 regression fails; `GET /stats` returns 500; response body is not JSON | A key-error crash in `store.get_author_counts()` on an empty shelf |
    | **S2 — Major** | A1 acceptance criterion is violated. The endpoint exists and responds, but the data is wrong. | `authors` contains a key with count 0; a count is off by one; `authors` is a list instead of an object; an author with books is missing from the response | "Ursula K. Le Guin" has 3 books but `authors["Ursula K. Le Guin"]` is 2 |
    | **S3 — Minor** | The response is correct but a secondary attribute is off. No data is wrong. | `Content-Type` is `text/plain` instead of `application/json`; the `authors` key is nested under an extra wrapper object | Response is `{"data": {"authors": {...}}}` instead of `{"authors": {...}}` |
    | **S4 — Trivial** | Cosmetic or stylistic issue that does not affect the observable contract. | Handler exceeds 30 lines by 1–2 lines; test name is slightly inconsistent with naming convention; unused import in `routes.py` | Handler is 31 lines due to a trailing blank line |

    **Resolution policy:**
    - S1 and S2 must be resolved before the cycle is accepted.
    - S3 must be resolved unless the supervisor explicitly waives it.
    - S4 is advisory; it is noted in the report but does not block acceptance.

    ---

    ## 4. Risk-Based Test Priorities

    Ranked by the probability that a fault will be *missed* if the corresponding test is absent, multiplied by the cost of that fault reaching the accepted product.

    | Priority | Risk area | Why it matters | Mitigation in the criterion test |
    |---|---|---|---|
    | **P1 (highest)** | **Zero-book author leakage** | The most likely implementation bug: iterating a dict that retains authors after book removal, or counting from a cache that wasn't evicted. A leaked key violates A1.6 directly. | Seed 2 books by author A, 1 by author B. Delete all of A's books via `DELETE`. Assert `authors` has no key for A and still has B with count 1. |
    | **P2** | **Count aggregation correctness** | Multiple books by one author must sum, not overwrite. A `dict[author] = 1` loop instead of `dict[author] += 1` is a common mistake. | Seed 3 books by the same author, 1 by another. Assert counts are 3 and 1 respectively. |
    | **P3** | **Empty-shelf edge case** | No books at all. A `max()` or index-0 access in the aggregation can throw. Must return `{"authors": {}}`, not 500. | Call `GET /stats` on a freshly seeded (empty) app. Assert 200 and `{"authors": {}}`. |
    | **P4** | **Regression on existing endpoints** | Adding a route or a store method can accidentally shadow an existing path, change import order, or alter shared state. | The full `pytest` run (all existing `tests/test_*.py`) is the guard. No new test needed; the regression gate is the existing suite passing. |
    | **P5** | **Author names with special characters** | Unicode, apostrophes, or very long names in author fields. The store should treat them as opaque strings; JSON serialization should handle them. | Seed a book with author `"O'Brien, José de la"`. Assert the key in `authors` matches exactly. (Low probability of failure but cheap to include.) |
    | **P6 (lowest)** | **Response shape drift** | The handler accidentally wraps the payload (`{"data": ...}`) or omits the `authors` key. | Assert the top-level structure: `resp.json()` is a dict with exactly the `authors` key (or at least contains it). |

    ### Coverage allocation

    Within the 3-hour budget and the footprint constraint (one test file: `tests/test_criterion_A1.py`), the test file should include test functions covering **P1 through P4**. P5 is a one-line addition and should be included if natural. P6 is subsumed by the structural assertions in P1–P4 tests.

    A realistic test file contains **5–7 test functions**, each focused on one observable from the acceptance checklist, using the shared `TestClient` fixture and seeding books via `POST /books` before hitting `GET /stats`.

    ---

    ## 5. Verification Commands (for implementation-time execution)

    These are the exact commands the product's own check harness runs. The plan does not execute them at planning stage; they are listed so the implementer and reviewer know the gate:

    ```bash
    # Boots
    .venv/bin/python -c "from backend.main import app"

    # Backend tests (includes test_criterion_A1.py and all regression tests)
    .venv/bin/python -m pytest -q -p no:cacheprovider

    # Frontend tests (unchanged, but must still pass)
    npm --prefix frontend test --silent
    ```

    All three must be green for the cycle to pass its quality gate.

    ---

    ## 6. Out-of-Scope / Deferred Items

    The following are explicitly **not** in scope for this cycle and are noted to prevent scope creep during implementation:

    - Frontend display of author statistics (no frontend file is in the footprint).
    - Caching, pagination, or filtering of the `/stats` response.
    - Additional endpoints or query parameters on `/stats`.
    - Performance benchmarks.
    - Any change to `backend/models.py`, `backend/main.py`, or any other file outside the footprint.

    If implementation reveals a need to touch a file outside `{backend/routes.py, backend/store.py, tests/test_criterion_A1.py}`, the change request must be re-submitted for re-approval. Proceeding without re-approval is a gate violation.
