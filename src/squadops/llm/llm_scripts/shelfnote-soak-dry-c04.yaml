    ## Consolidated Plan

    ### 1. Objective Frame

    This cycle adds a single `GET /stats` endpoint to the existing Shelfnote application. The endpoint returns a JSON object mapping each author name (who has at least one book on the shelf) to the integer count of that author's books. No other behaviour is added, modified, or retired. The accepted application at commit `995eebf` remains the baseline; only the footprint files change.

    **Reviewer ruling:** Approved as it stands by pre-registration rule §2892 §3 step 1. No additional constraints beyond the change request.

    ### 2. Technical Design

    #### 2.1 `backend/store.py` — Data Access

    Add one new function:

    ```python
    def author_counts(self) -> dict[str, int]:
        """Return {author: count} for every author with at least one book on the shelf."""
        counts: dict[str, int] = {}
        for book in self._books.values():
            counts[book.author] = counts.get(book.author, 0) + 1
        return counts
    ```

    - Iterates the existing in-memory book collection (`self._books`, already present in the accepted `store.py`).
    - Builds a frequency map. Authors with zero books never appear because only existing books are iterated.
    - Returns a plain `dict[str, int]`; the route serialises it directly.
    - No new imports, no schema change, no mutation of existing state.

    #### 2.2 `backend/routes.py` — Route Handler

    Add one new endpoint handler:

    ```python
    @router.get("/stats")
    async def get_stats():
        """Return per-author book counts for the current shelf."""
        store = _get_store()          # existing helper pattern in the file
        authors = store.author_counts()
        return {"authors": authors}
    ```

    - Follows the existing route-registration pattern in `routes.py` (router instance, dependency-injection style store access already used by sibling handlers).
    - Handler body is well under the 30-line ceiling from CONTRIBUTING.md.
    - Returns `200` with `{"authors": {...}}`. No query parameters, no auth, no filtering — criterion A1 specifies the full observable.
    - If the shelf is empty the response is `{"authors": {}}` (empty object, no keys). This satisfies "no key exists for an author with zero books."

    #### 2.3 `tests/test_criterion_A1.py` — New Test File

    A single pytest file exercising `GET /stats` through `fastapi.testclient.TestClient`, following the product's existing test conventions (import from `backend.main`, use `TestClient(app)`, assert on JSON response).

    Planned test cases:

    | # | Scenario | Assertion |
    |---|----------|-----------|
    | A1-1 | Single book, single author | `authors == {"Alice": 1}` |
    | A1-2 | Multiple books, multiple authors, overlapping | Correct per-author counts; no zero-count author key |
    | A1-3 | Empty shelf (fresh client, no books added) | `authors == {}` — response is valid JSON with empty object |
    | A1-4 | Author with books removed (if a delete endpoint exists in baseline) | Author key disappears once all their books are gone |
    | A1-5 | Status code is 200 | `response.status_code == 200` |

    Each test:
    - Uses `TestClient(app)` — no running server, per blueprint convention.
    - Fails on the response body / status code, not on an import.
    - Is not already satisfied by framework default behaviour (a 404 for an unregistered path fails these tests, satisfying the "must not be met already" rule).
