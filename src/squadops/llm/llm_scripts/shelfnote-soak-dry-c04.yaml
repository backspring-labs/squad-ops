      - "A1-empty-shelf: when no books exist on the shelf, the response body is {\"authors\": {}}"
      - "A1-aggregation: multiple books by the same author are summed into a single count, not overwritten"
      - "must_not_break T1: existing book creation and retrieval behaviour is unchanged"
      - "must_not_break T2: existing book listing and search behaviour is unchanged"
      - "must_not_break T3: existing ratings behaviour is unchanged"
      - "must_not_break C1: existing category or tag behaviour is unchanged"
      - "must_not_break C2: existing reading-status behaviour is unchanged"
      - "CONTRIBUTING handler-size: the new route handler body is under 30 lines"
      - "CONTRIBUTING test-pattern: the new test exercises the API through the TestClient fixture and asserts on response content, not on internal imports"
      - "CONTRIBUTING no-default-pass: the test does not pass merely because of a framework default such as FastAPI's automatic 404"
    scope_cuts:
      - "Frontend display of author statistics: no frontend file is in the footprint; deferred to a follow-up cycle"
      - "Caching, pagination, sorting, or query parameters on /stats: not in the observable"
      - "New Pydantic models, new dependencies, new configuration entries: not in the footprint"
      - "Any file outside {backend/routes.py, backend/store.py, tests/test_criterion_A1.py}: frozen at baseline commit 995eebf"
      - "Modifications to any existing test file: not permitted; regression is verified by the existing suite passing"
      - "New endpoints, new HTTP methods, new middleware: not in scope"
    risk_areas:
