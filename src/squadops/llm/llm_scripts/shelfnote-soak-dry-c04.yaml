  content: |
    ```yaml:plan_authoring_brief.yaml
    version: 1
    brief_id: brief-prop_95ba337d5303-001
    objective_summary: |
      Add a single read-only GET /stats endpoint to the existing Shelfnote
      bookshelf API. The endpoint responds with a JSON body containing one
      top-level key, "authors", whose value is an object mapping each author
      name (the exact string stored on the Book model's author field) to the
      integer count of that author's books currently on the shelf. No key
      appears for an author whose book count is zero. An empty shelf yields
      {"authors": {}}. This is a purely additive increment: one new method
      in the store, one new route handler, one new test file. No existing
      endpoint, model, configuration, or frontend behaviour is modified.
      The build starts from the accepted baseline commit and changes only
      the three footprint files.
    accepted_stack:
      backend: "FastAPI + Pydantic, in-memory book store (no external database)"
      frontend: "React + Vite (unchanged this cycle; no frontend file in footprint)"
      test_backend: "pytest + FastAPI TestClient"
      test_frontend: "vitest + Testing Library (unchanged this cycle)"
    must_cover_requirements:
