- task_type: qa.propose_plan_tasks
  occurrence: 1
  call: 1
  content: |
    ```yaml:proposed_plan_tasks.yaml
    version: 1
    proposal_id: prop-1bf7dc8a
    source_brief_id: brief-prop_95ba337d5303-001
    proposing_role: qa
    scope_statement: |
      One qa.test task authoring tests/test_criterion_A1.py, the criterion-A1
      verifier that exercises GET /stats through the product's TestClient fixture.
      The tests distinguish the faults the brief's risk areas name: zero-book
      author leakage, count overwriting instead of incrementing, empty-shelf
      crash, and structural drift in the response envelope. Regression on
      T1–T3 and C1–C2 is verified by the existing frozen test suite running
      green under the backend_tests check; no new regression test file is
      authored here per the brief's scope_cuts.
    tasks:
      - task_type: qa.test
        role: qa
        focus: "GET /stats criterion A1 test suite"
        description: |
          Author tests/test_criterion_A1.py exercising the GET /stats endpoint
          through the shared TestClient fixture (conftest.py). The suite
          distinguishes the following faults from correct behaviour:

          1. Zero-book author leakage: seed books by author A and B, then remove
             all of A's books (via DELETE or by seeding a shelf that omits A).
             Assert no key for A appears in the response while B retains its count.
             Fails if the store retains a stale key or the aggregation includes
             authors with count 0.

          2. Count aggregation overwrite: seed three books by the same author and
             one by a different author. Assert the same-author count is 3, not 1.
             Fails if the loop uses dict[author] = 1 instead of dict[author] += 1.

          3. Empty-shelf edge case: on a fresh shelf with no books, assert the
             response body is exactly {"authors": {}}. Fails if iteration or
             index access over the empty collection raises, or if the response
             omits the key, uses null, or returns a list.

          4. Response structure: assert the top-level JSON body contains the key
             "authors" whose value is a dict (object), and that every value is an
             integer (not a string or float). Fails if the handler wraps the
             payload in an extra envelope or returns a list.

          Each test seeds its own shelf via POST /books (or the conftest fixture
          pattern) before calling GET /stats, ensuring independence from execution
          order. The suite must not import backend internals directly; it reaches
          the app exclusively through the TestClient.
        expected_artifacts:
          - "tests/test_criterion_A1.py"
        acceptance_criteria:
          - check: function_defined
            file: tests/test_criterion_A1.py
            name_prefix: "test_"
            min_count: 4
            severity: error
          - "The test exercises the API through the TestClient fixture from conftest.py and asserts on response status code and parsed JSON body, never on internal imports or store method return values directly."
          - "The test does not pass merely because of a framework default such as FastAPI's automatic 404 for an unknown path; each assertion is on the specific response body of GET /stats."
          - "The empty-shelf test (no books seeded) asserts the response body is exactly the dict {'authors': {}} — the key is present, the value is an empty dict, and the response is successful."
          - "The aggregation test seeds at least 3 books by one author and asserts the returned count equals 3, not 1, proving increment-not-overwrite."
          - "The zero-book test ensures no key exists in the authors object for an author whose books are all absent; it asserts the key is not present rather than asserting its value is 0."
          - "All values in the authors object are integers; the test asserts type or exact-equality against integer literals, catching a string or float return."
          - "Tests are order-independent: each test function seeds its own shelf state (or relies on the conftest fixture's per-test reset) and does not mutate shared state visible to sibling tests."
        depends_on_focus:
          - "dev:Store get_author_counts method"
          - "dev:GET /stats route handler"
    brief_conflicts:
      - rule: "qa-tests-live-in-the-stacks-namespace"
        observation: |
          The generic FastAPI + React stack default lists backend/tests/ as the
          qa namespace, but this product's established layout places all test
          files under tests/ at the repository root (see the product map: 20+
          test files at tests/test_*.py, conftest.py at root, pytest discovers
          test_*.py under .). The change request footprint and the criterion
          file directive both name tests/test_criterion_A1.py explicitly. The
          product's own runner config (pytest under .) confirms discoverability
          at that path. Requesting the merger confirm that the product's
          established test layout takes precedence over the generic stack
          default for this increment.
        resolution_requested: "Merger confirms tests/ at root is this product's qa namespace; the plan proceeds with tests/test_criterion_A1.py as stated."
    source_artifact_refs:
      - "test_strategy.md"
      - "technical_design.md"
    assumptions:
      - "conftest.py at the repository root provides a shared 'client' fixture (TestClient-backed) that yields a fresh, empty shelf per test, consistent with the existing criterion test files (test_criterion_T1.py, etc.)."
      - "The product's pytest runner discovers test_*.py under the repository root (.), so tests/test_criterion_A1.py is collected and executed by the backend_tests check."
      - "A DELETE /books/{id} endpoint or equivalent removal mechanism exists (or the conftest fixture resets the shelf per test) to enable the zero-book-author test; if neither exists, the test seeds a shelf that simply omits the target author."
      - "The frozen test files (test_criterion_T1.py through C2) and all other existing tests/ files are unmodified by this increment; their green execution under backend_tests verifies the must_not_break set."
    risks:
      - "If conftest.py does not provide a per-test shelf reset and no DELETE endpoint exists, the zero-book-author test (P1 risk) may require a workaround (seed a shelf with only the other author). The test still proves the observable: no key for an author with zero books."
    gaps_not_covered:
      - "Frontend display of author statistics is out of scope per brief scope_cuts; no frontend test is authored."
      - "Caching, pagination, sorting, or query-parameter behaviour on /stats is out of scope per brief scope_cuts."
      - "Performance or concurrency characteristics are not tested in this cycle per test_strategy.md §6."
    confidence: high
    ```
- task_type: strategy.propose_plan_guidance
  occurrence: 1
  call: 1
  content: |
    ```yaml:plan_guidance.yaml
    version: 1
    guidance_id: guid-898268ef
    source_brief_id: brief-prop_95ba337d5303-001
    proposing_role: strategy
    priority_guidance:
      - area: qa_test
        priority: high
        rationale: >
          The test file carries the largest budget allocation (45%) and is the
          sole verification vehicle for all three A1 acceptance criteria
          (A1-observable, A1-empty-shelf, A1-aggregation). Every CONTRIBUTING
          rule that constrains the test (test-pattern, no-default-pass) is
          enforced through this file. Under-scoping this task is the
          highest-impact scheduling risk in the increment: if the test is
          rushed, the A1 criteria go unverified and the regression gate loses
          its teeth.
      - area: regression_protection
        priority: high
        rationale: >
          Five must_not_break requirements (T1, T2, T3, C1, C2) protect
          existing endpoints. The 25% regression_verification budget is a
          gate-level constraint, not a separate task to be absorbed into the
          qa task's authoring time. The existing suite passing is the only
          safety net against side-effects from the new store method or route
          handler. If this budget is squeezed, a silent break in any of the
          five existing endpoints ships undetected.
      - area: backend_store
        priority: medium
        rationale: >
          First link in the dependency chain and the simplest task (15%
          budget). Low effort but load-bearing: aggregation-loop correctness
          and empty-collection handling here determine whether the route
          handler and test proceed without rework. The open question about the
          collection's internal representation (list vs dict vs other) is
          load-bearing for this task specifically.
      - area: backend_route
        priority: medium
        rationale: >
          Thin integration layer (15% budget) that composes the store method
          into an HTTP response. The CONTRIBUTING handler-size constraint
          (<30 lines) bounds the task tightly. Must sequence after the store
          method to avoid a dangling reference.
    ordering_guidance:
      - before: "dev:store_method"
        after: "dev:route_handler"
        rationale: >
          The route handler calls the store method. The store method must
          exist and be stable before the route handler is written; otherwise
          the handler has a dangling reference and the test has nothing to
          exercise end-to-end.
      - before: "dev:route_handler"
        after: "qa:criterion_test"
        rationale: >
          The test exercises the endpoint through TestClient. Both the store
          method and the route handler must be in place before the test can
          be authored against a working endpoint. Writing the test against a
          spec the implementation may not match produces rework on both
          sides.
    risk_guidance:
      - target: "qa:criterion_test"
        risk: >
          Test file location vs plan-shape namespace. The plan-shape rule
          qa-tests-live-in-the-stacks-namespace names backend/tests/ as the
          default qa namespace on the FastAPI stack, but the product's
          established layout places every test under tests/ at the repository
          root, served by the root conftest.py. The brief's footprint
          explicitly names tests/test_criterion_A1.py, and the product's
          pytest runner discovers test_*.py under . The merger must confirm
          the product's own layout takes precedence over the generic stack
          default before the plan is validated; otherwise the qa task's
          expected_artifacts will be rejected by the namespace check and the
          plan is re-rolled. The brief's open-question list flags this
          explicitly; the merger's resolution should be recorded in
          operator_notes at gate.
      - target: "dev:store_method"
        risk: >
          Aggregation correctness and zero-book author leakage. The
          get_author_counts() method must iterate whatever collection the
          baseline store.py uses (list, dict, or other) and build a count
          map. Two failure modes are flagged in the brief's risk_areas:
          (a) the loop must increment (+=) not overwrite (=) when the same
          author appears on multiple books, and (b) no key may be retained
          for an author whose book count is zero. The implementer must
          inspect the baseline store.py before writing the method; the open
          question about the collection's internal representation is
          load-bearing and cannot be resolved by assumption.
      - target: "dev:route_handler"
        risk: >
          Regression on existing endpoints via careless append. Appending a
          new handler to the existing APIRouter in routes.py must not alter
          existing method signatures, import order, or shared mutable state.
          The five must_not_break requirements (T1-T3, C1-C2) are verified
          solely by the existing suite passing. A careless append
          (reordering imports, modifying a shared dict, shadowing a variable
          name in the module scope) breaks up to five existing endpoints
          with no new test to catch the break.
      - target: "qa:criterion_test"
        risk: >
          Test isolation and fixture dependency. The new test must consume
          the conftest.py fixture consistently with existing criterion tests
          (test_criterion_T1.py and peers). The open question about whether
          the fixture yields a fresh empty shelf or a pre-seeded one
          determines how the A1-empty-shelf and A1-aggregation cases are
          constructed. Matching the existing isolation pattern is
          non-negotiable per the CONTRIBUTING test-pattern rule. A test that
          assumes a different fixture shape than the one conftest.py
          actually provides will fail on load or produce false positives.
      - target: "qa:criterion_test"
        risk: >
          Zero-book-author verification path. The A1-observable criterion
          requires that no key exists for an author with zero books.
          Testing this requires either (a) seeding a shelf that simply
          omits the author, or (b) adding a book and then deleting it via
          an existing DELETE endpoint. Option (b) couples the new test to
          existing endpoint behaviour and depends on whether
          DELETE /books/{id} exists in the baseline. Option (a) is
          simpler and avoids that coupling. The qa task should prefer
          option (a) unless the brief's open-question resolution indicates
          otherwise.
    time_budget_guidance:
      - area: backend_store
        budget_pct: 15
      - area: backend_route
        budget_pct: 15
      - area: qa_test
        budget_pct: 45
      - area: regression_protection
        budget_pct: 25
    scope_cut_guidance:
      - >
        Modifying the root conftest.py to add a new fixture, alter an
        existing fixture, or change the shelf-seeding behaviour: frozen at
        baseline commit 995eebf per the brief's footprint rule ("any file
        outside the three footprint paths: frozen"). The new test must work
        with the fixture as-is. If the fixture shape makes a particular A1
        case awkward, the test adapts to the fixture, not vice versa.
    must_not_skip:
      - >
        A1-observable: the response shape (top-level authors key, author-name
        keys, integer-count values, no zero-count keys) is the core
        observable of this increment and must be verified by the test.
      - >
        A1-empty-shelf: the empty-shelf edge case must return {"authors": {}}
        and must be tested explicitly, not only implied by the general
        aggregation test.
      - >
        must_not_break T1 through C2: the existing suite passing is the
        regression gate. It cannot be skipped, partially bypassed, or
        reduced to a subset under time pressure. All five existing
        endpoint families must be exercised.
      - >
        CONTRIBUTING test-pattern: the test must exercise the API through
        the TestClient fixture and assert on response content, not on
        internal imports. A test that imports the store method directly
        or the route handler function directly violates the pattern and
        would pass even if the HTTP layer were broken.
    defer_if_time_constrained: []
    confidence: high
    ```
