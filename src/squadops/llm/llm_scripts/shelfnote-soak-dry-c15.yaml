    """ST1: GET /books?status=…&tag=… — combined filter with pagination metadata.

    The combined-filter response (both status AND tag present) is a JSON object:
        {"books": [...], "page": int, "per_page": int, "total": int}
    Single-param requests (status-only, tag-only, no params) keep the pre-change
    bare-array shape per T3 and the frozen status/tag tests.
    """


    def _seed_books(client):
        """Seed a controlled book set with known status and tags.

        Returns a dict of name → book dict (with 'id' key).
        Books:
          A: status=read,  tags=["fiction"]            → matches BOTH
          B: status=read,  tags=["sci-fi"]             → matches status only
          C: status=wanting, tags=["fiction"]          → matches tag only
          D: status=read,  tags=["fiction","sci-fi"]   → multi-tag, matches BOTH
          E: status=being read, tags=["fiction"]       → different status, tag match
          F: status=read,  tags=[]                     → status match, no tags
        """
        books = {}

        a = client.post("/books", json={"title": "Book A", "author": "AA", "added_by": "U"}).json()
        client.patch(f"/books/{a['id']}", json={"status": "read"})
        client.post(f"/books/{a['id']}/tags", json={"tag": "fiction"})
        books["A"] = a

        b = client.post("/books", json={"title": "Book B", "author": "BB", "added_by": "U"}).json()
        client.patch(f"/books/{b['id']}", json={"status": "read"})
        client.post(f"/books/{b['id']}/tags", json={"tag": "sci-fi"})
        books["B"] = b

        c = client.post("/books", json={"title": "Book C", "author": "CC", "added_by": "U"}).json()
        # default status is "wanting"; no PATCH needed
        client.post(f"/books/{c['id']}/tags", json={"tag": "fiction"})
        books["C"] = c

        d = client.post("/books", json={"title": "Book D", "author": "DD", "added_by": "U"}).json()
        client.patch(f"/books/{d['id']}", json={"status": "read"})
        client.post(f"/books/{d['id']}/tags", json={"tag": "fiction"})
        client.post(f"/books/{d['id']}/tags", json={"tag": "sci-fi"})
        books["D"] = d

        e = client.post("/books", json={"title": "Book E", "author": "EE", "added_by": "U"}).json()
        client.patch(f"/books/{e['id']}", json={"status": "being read"})
        client.post(f"/books/{e['id']}/tags", json={"tag": "fiction"})
        books["E"] = e

        f = client.post("/books", json={"title": "Book F", "author": "FF", "added_by": "U"}).json()
        client.patch(f"/books/{f['id']}", json={"status": "read"})
        books["F"] = f

        return books


    def test_combined_filter_and_semantics_excludes_non_matching(client):
        """GET /books?status=read&tag=fiction returns ONLY books matching BOTH.

        Faults caught:
          - OR semantics: Book B (read, sci-fi) or Book C (wanting, fiction) leaks in.
          - Missing filter: all 6 books returned.
        """
        books = _seed_books(client)

        res = client.get("/books", params={"status": "read", "tag": "fiction"})
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()
        assert isinstance(body, dict), f"Expected dict, got {type(body).__name__}"

        book_ids = {b["id"] for b in body["books"]}

        # Book B: status=read but tags=["sci-fi"] — must be ABSENT (AND, not OR)
        assert books["B"]["id"] not in book_ids, (
            f"Book B (status=read, tags=[sci-fi]) should be excluded, got ids {book_ids}"
        )
        # Book C: status=wanting but tags=["fiction"] — must be ABSENT (AND, not OR)
        assert books["C"]["id"] not in book_ids, (
            f"Book C (status=wanting, tags=[fiction]) should be excluded, got ids {book_ids}"
        )
        # Book F: status=read but tags=[] — must be ABSENT
        assert books["F"]["id"] not in book_ids, (
            f"Book F (status=read, no tags) should be excluded, got ids {book_ids}"
        )
        # Book A and Book D match both — must be PRESENT
        assert books["A"]["id"] in book_ids, f"Book A missing from {book_ids}"
        assert books["D"]["id"] in book_ids, f"Book D missing from {book_ids}"


    def test_combined_filter_total_equals_filtered_count(client):
        """body['total'] equals the count of books matching BOTH filters, not len(all).

        Faults caught:
          - total = len(all_books) (6) instead of filtered (2)
          - total = count after only status filter (3: A, B, F) or only tag filter (3: A, C, D, E → 4)
        """
        books = _seed_books(client)

        res = client.get("/books", params={"status": "read", "tag": "fiction"})
        assert res.status_code == 200
        body = res.json()

        # Exactly A and D match both filters
        assert body["total"] == 2, (
            f"total={body['total']}, expected 2 (only A and D match both). "
            f"Books in response: {len(body['books'])}"
        )
        # Sanity: the books array length also matches
        assert len(body["books"]) == 2


    def test_multi_tag_membership_not_list_equality(client):
        """A book with tags ['fiction','sci-fi'] IS returned for tag=fiction.

        Fault caught: list-equality (book.tags == [tag]) instead of membership
        (tag in book.tags), so a multi-tag book is excluded.
        """
        books = _seed_books(client)

        res = client.get("/books", params={"status": "read", "tag": "fiction"})
        assert res.status_code == 200
        body = res.json()

        book_ids = {b["id"] for b in body["books"]}
        # Book D has tags ["fiction", "sci-fi"] — membership must find "fiction"
        assert books["D"]["id"] in book_ids, (
            f"Book D (tags=['fiction','sci-fi']) must appear for tag=fiction "
            f"(membership, not list-equality). Got ids: {book_ids}"
        )


    def test_tag_only_path_returns_cross_status_books(client):
        """GET /books?tag=fiction (no status) returns all books whose tags include
        'fiction', across all statuses. Response is a bare array (pre-change shape).

        Faults caught:
          - Status filter applied by default, excluding non-'read' books.
          - Response shape changed to an object (breaking frozen tag tests).
        """
        books = _seed_books(client)

        res = client.get("/books", params={"tag": "fiction"})
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        data = res.json()
        # Must be a bare array (frozen contract)
        assert isinstance(data, list), f"Expected list, got {type(data).__name__}"

        returned_ids = {b["id"] for b in data}

        # Books with 'fiction' in tags: A (read), C (wanting), D (read), E (being read)
        assert books["A"]["id"] in returned_ids
        assert books["C"]["id"] in returned_ids, (
            f"Book C (wanting, fiction) missing — tag-only must cross statuses"
        )
        assert books["D"]["id"] in returned_ids
        assert books["E"]["id"] in returned_ids, (
            f"Book E (being read, fiction) missing — tag-only must cross statuses"
        )

        # Books without 'fiction' tag must be absent
        assert books["B"]["id"] not in returned_ids  # tags=["sci-fi"]
        assert books["F"]["id"] not in returned_ids  # tags=[]

        # Count: exactly 4 books have 'fiction' in their tags
        assert len(data) == 4, f"Expected 4 books, got {len(data)}"


    def test_status_only_regression_bare_array(client):
        """GET /books?status=read (no tag) returns the same bare array as the
        pre-change status-filter contract.

        Faults caught:
          - Response shape changed to an object.
          - Tag filter applied by default.
        """
        books = _seed_books(client)

        res = client.get("/books", params={"status": "read"})
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        data = res.json()
        assert isinstance(data, list), f"Expected list, got {type(data).__name__}"

        returned_ids = {b["id"] for b in data}

        # Books with status=read: A, B, D, F
        assert books["A"]["id"] in returned_ids
        assert books["B"]["id"] in returned_ids
        assert books["D"]["id"] in returned_ids
        assert books["F"]["id"] in returned_ids

        # Non-read books excluded
        assert books["C"]["id"] not in returned_ids  # wanting
        assert books["E"]["id"] not in returned_ids  # being read

        assert len(data) == 4, f"Expected 4 read books, got {len(data)}"


    def test_no_filter_regression_full_shelf(client):
        """GET /books (no params) returns the full bare array; length equals total books.

        Fault caught: filter params default to non-None, reducing the result set.
        """
        books = _seed_books(client)

        res = client.get("/books")
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        data = res.json()
        assert isinstance(data, list), f"Expected list, got {type(data).__name__}"
        assert len(data) == 6, f"Expected 6 books (full shelf), got {len(data)}"

        returned_ids = {b["id"] for b in data}
        for name, book in books.items():
            assert book["id"] in returned_ids, f"Book {name} missing from unfiltered list"


    def test_empty_result_unknown_tag(client):
        """GET /books?status=read&tag=nonexistent returns books=[], total=0, 200.

        Faults caught:
          - 404/500 instead of 200.
          - books non-empty (filter ignored).
          - total non-zero.
        """
        books = _seed_books(client)

        res = client.get("/books", params={"status": "read", "tag": "nonexistent-tag"})
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()
        assert isinstance(body, dict), f"Expected dict, got {type(body).__name__}"
        assert body["books"] == [], f"Expected empty books, got {body['books']}"
        assert body["total"] == 0, f"Expected total=0, got {body['total']}"
        # page and per_page must be present and valid
        assert isinstance(body["page"], int) and body["page"] >= 1
        assert isinstance(body["per_page"], int) and body["per_page"] >= 1


    def test_pagination_composition_page_slice_total_unchanged(client):
        """GET /books?status=read&tag=fiction&page=1&per_page=1 returns one book;
        total still reflects the full filtered count (2), not the page size (1).

        Fault caught: total set to len(page_slice) instead of the full filtered count.
        """
        books = _seed_books(client)

        res = client.get("/books", params={
            "status": "read", "tag": "fiction", "page": 1, "per_page": 1,
        })
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()
        assert isinstance(body, dict)

        assert len(body["books"]) == 1, f"Expected 1 book on page, got {len(body['books'])}"
        # total must be the FULL filtered count, not the page size
        assert body["total"] == 2, (
            f"total={body['total']}, expected 2 (full filtered count), "
            f"got page size instead"
        )
        assert body["page"] == 1
        assert body["per_page"] == 1


    def test_response_shape_exact_keys(client):
        """Every combined-filter response has EXACTLY the keys
        {books, page, per_page, total} at the top level; no extras.

        Faults caught:
          - Extra keys (e.g. 'total_pages', 'items', 'pagination').
          - Missing required key.
        """
        books = _seed_books(client)

        res = client.get("/books", params={"status": "read", "tag": "fiction"})
        assert res.status_code == 200
        body = res.json()
        assert isinstance(body, dict)

        expected_keys = {"books", "page", "per_page", "total"}
        actual_keys = set(body.keys())
        assert actual_keys == expected_keys, (
            f"Top-level keys {actual_keys} != expected {expected_keys}. "
            f"Full body keys: {list(body.keys())}"
        )
