    """ST1: GET /books?status=…&tag=… — combined AND filter with pagination metadata.

    Seeds a controlled book set (Books A–F) with known status and multi-element tags,
    then asserts on response content for each fault the brief's risk_areas name:
    AND-vs-OR, pagination-total, multi-tag membership, tag-only path, status-only
    regression, no-filter regression, empty-result, pagination composition, response shape.
    """


    def _seed_books(client):
        """Seed six books (A–F) with controlled status and tags. Returns a dict
        mapping letter → book JSON dict."""
        specs = [
            # (letter, status, tags)
            ("A", "read", ["fiction"]),
            ("B", "read", ["sci-fi"]),
            ("C", "wanted", ["fiction"]),
            ("D", "read", ["fiction", "sci-fi"]),
            ("E", "being read", []),
            ("F", "read", ["nonfiction"]),
        ]
        books = {}
        for letter, status, tags in specs:
            res = client.post(
                "/books",
                json={"title": f"Book {letter}", "author": f"Auth{letter}", "added_by": "U"},
            )
            assert res.status_code == 201, f"Failed to create Book {letter}: {res.status_code}"
            book = res.json()
            # Set status (default is "wanted", so only patch if not already correct)
            if status != "wanted":
                pr = client.patch(f"/books/{book['id']}", json={"status": status})
                assert pr.status_code == 200, f"Failed to set status on Book {letter}"
            # Add tags
            for tag in tags:
                tr = client.post(f"/books/{book['id']}/tags", json={"tag": tag})
                assert tr.status_code == 200, f"Failed to add tag '{tag}' to Book {letter}"
            books[letter] = book
        return books


    def test_combined_filter_and_semantics_excludes_non_matching(client):
        """GET /books?status=read&tag=fiction returns ONLY books satisfying BOTH.

        Faults caught:
          - OR-semantics: a book with status='read' but tags=['sci-fi'] (Book B)
            would be included if the filter is OR instead of AND.
          - OR-semantics (reverse): a book with tags=['fiction'] but status='wanting'
            (Book C) would be included if the filter is OR instead of AND.
        """
        books = _seed_books(client)
        res = client.get("/books", params={"status": "read", "tag": "fiction"})
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()
        ids = {b["id"] for b in body["books"]}

        # Book B: status='read' but tags=['sci-fi'] → must be ABSENT (AND, not OR)
        assert books["B"]["id"] not in ids, (
            f"Book B (read, sci-fi) must be excluded from status=read&tag=fiction, "
            f"but is present in {ids}"
        )

        # Book C: status='wanting' but tags=['fiction'] → must be ABSENT (AND, not OR)
        assert books["C"]["id"] not in ids, (
            f"Book C (wanting, fiction) must be excluded from status=read&tag=fiction, "
            f"but is present in {ids}"
        )

        # Book A: status='read', tags=['fiction'] → must be PRESENT
        assert books["A"]["id"] in ids, (
            f"Book A (read, fiction) should match the combined filter, "
            f"but is absent from {ids}"
        )

        # Book D: status='read', tags=['fiction','sci-fi'] → must be PRESENT
        assert books["D"]["id"] in ids, (
            f"Book D (read, fiction+sci-fi) should match the combined filter, "
            f"but is absent from {ids}"
        )


    def test_combined_filter_total_equals_filtered_count(client):
        """body['total'] equals the count matching BOTH filters, not the unfiltered
        shelf size nor the count after only one filter.

        Faults caught:
          - total = len(all_books) (6) instead of filtered count (2)
          - total = count after status-only filter (4) instead of combined (2)
          - total = count after tag-only filter (3) instead of combined (2)
        """
        books = _seed_books(client)
        res = client.get("/books", params={"status": "read", "tag": "fiction"})
        assert res.status_code == 200
        body = res.json()

        # Only Book A and Book D match both filters
        assert body["total"] == 2, (
            f"total is {body['total']}, expected 2 (Books A and D match both filters). "
