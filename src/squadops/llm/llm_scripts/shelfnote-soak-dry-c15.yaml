  content: |
    ```python:tests/test_criterion_ST1.py
    """ST1: GET /books?status=X&tag=Y — combined status+tag filter (AND semantics)
    with pagination metadata {books, page, per_page, total}.

    Faults distinguished:
      1. AND-vs-OR: union returned instead of intersection
      2. Pagination-total: total reflects a single filter, not the combined set
      3. Multi-tag membership: list-equality instead of membership
      4. Tag-only: tag filter without status still returns cross-status results
      5. Status-only regression: existing bare-array status filter preserved
      6. No-filter regression: bare shelf preserved
      7. Empty-result: unknown tag → books=[], total=0, 200
      8. Pagination composition: page/per_page slice; total stays full
      9. Response shape: exactly {books, page, per_page, total}
    """


    def _create_book(client, title, author):
        res = client.post("/books", json={"title": title, "author": author, "added_by": "U"})
        assert res.status_code == 201
        return res.json()


    def _set_status(client, book_id, status):
        res = client.patch(f"/books/{book_id}", json={"status": status})
        assert res.status_code == 200


    def _add_tags(client, book_id, tags):
        for tag in tags:
            res = client.post(f"/books/{book_id}/tags", json={"tag": tag})
            assert res.status_code == 200


    def _seed(client):
        """Seed Books A–F. Returns name→book dict."""
        a = _create_book(client, "Book A", "AuthA")
        _set_status(client, a["id"], "read")
        _add_tags(client, a["id"], ["fiction"])

        b = _create_book(client, "Book B", "AuthB")
        _set_status(client, b["id"], "read")
        _add_tags(client, b["id"], ["sci-fi"])

        c = _create_book(client, "Book C", "AuthC")
        _set_status(client, c["id"], "wanting")
        _add_tags(client, c["id"], ["fiction"])

        d = _create_book(client, "Book D", "AuthD")
        _set_status(client, d["id"], "read")
        _add_tags(client, d["id"], ["fiction", "sci-fi"])

        e = _create_book(client, "Book E", "AuthE")
        _set_status(client, e["id"], "being read")
        _add_tags(client, e["id"], ["fiction"])

        f = _create_book(client, "Book F", "AuthF")
        _set_status(client, f["id"], "wanting")
        _add_tags(client, f["id"], ["sci-fi"])

        return {"A": a, "B": b, "C": c, "D": d, "E": e, "F": f}


    def test_combined_filter_and_semantics_excludes_non_matching(client):
        """GET /books?status=read&tag=fiction returns ONLY books matching BOTH.

        Faults: AND implemented as OR (union); one param ignored.
        Book B (read, [sci-fi]) must be absent. Book C (wanting, [fiction]) absent.
        """
        books = _seed(client)
        res = client.get("/books", params={"status": "read", "tag": "fiction"})
        assert res.status_code == 200
        body = res.json()
        ids = {b["id"] for b in body["books"]}

        # Book B: status=read but tags=[sci-fi] → must be ABSENT
        assert books["B"]["id"] not in ids, (
            f"Book B (read, sci-fi) leaked into combined result — AND violated: {ids}"
        )
        # Book C: tags=[fiction] but status=wanting → must be ABSENT
        assert books["C"]["id"] not in ids, (
            f"Book C (wanting, fiction) leaked into combined result — AND violated: {ids}"
        )
        # Book A and D satisfy both → must be PRESENT
        assert books["A"]["id"] in ids, f"Book A (read, fiction) missing: {ids}"
        assert books["D"]["id"] in ids, f"Book D (read, fiction+sci-fi) missing: {ids}"
        # Exactly two books
        assert len(ids) == 2, f"Expected 2 books, got {len(ids)}: {ids}"


    def test_combined_filter_total_equals_filtered_count(client):
        """body['total'] equals the count matching BOTH filters, not one filter alone.

        Faults: total = len(all_books)=6, total = status-only count=3,
        or total = tag-only count=4.
        """
        books = _seed(client)
        res = client.get("/books", params={"status": "read", "tag": "fiction"})
        assert res.status_code == 200
        body = res.json()
        assert body["total"] == 2, (
            f"total={body['total']}, expected 2 (intersection). "
            f"6=all, 3=status-only, 4=tag-only"
        )


    def test_multi_tag_membership_not_list_equality(client):
        """A book with tags ['fiction','sci-fi'] IS returned for tag=fiction.

        Fault: filter compares tags == [tag] (list equality) instead of
        tag in tags (membership).
        """
        books = _seed(client)
        res = client.get("/books", params={"tag": "fiction"})
        assert res.status_code == 200
        body = res.json()
        ids = {b["id"] for b in body["books"]}
        assert books["D"]["id"] in ids, (
            f"Book D (tags=['fiction','sci-fi']) absent for tag=fiction — "
            f"list-equality instead of membership: {ids}"
        )


    def test_tag_only_path_returns_cross_status_books(client):
        """GET /books?tag=fiction (no status) returns ALL books with 'fiction' in tags.

        Fault: tag filter implicitly defaults status, hiding books in other statuses.
        """
        books = _seed(client)
        res = client.get("/books", params={"tag": "fiction"})
        assert res.status_code == 200
        body = res.json()
        ids = {b["id"] for b in body["books"]}
        # A(read), C(wanting), D(read), E(being read) all have 'fiction'
        for name in ("A", "C", "D", "E"):
            assert books[name]["id"] in ids, f"Book {name} missing from tag-only result: {ids}"
        # B(read, sci-fi) and F(wanting, sci-fi) do NOT have 'fiction'
        assert books["B"]["id"] not in ids
        assert books["F"]["id"] not in ids
        assert body["total"] == 4, f"total={body['total']}, expected 4"


    def test_status_only_regression_bare_array(client):
        """GET /books?status=read (no tag) returns a bare JSON array (pre-change T2).

        Fault: adding the tag param changed the status-only response shape.
        """
        books = _seed(client)
        res = client.get("/books", params={"status": "read"})
        assert res.status_code == 200
        data = res.json()
        # Pre-change contract: bare array
        assert isinstance(data, list), (
            f"Expected bare array for status-only, got {type(data).__name__}"
        )
        ids = {b["id"] for b in data}
        # read books: A, B, D
        assert ids == {books["A"]["id"], books["B"]["id"], books["D"]["id"]}, (
            f"status=read returned {ids}, expected A,B,D"
        )
        assert len(data) == 3


    def test_no_filter_regression_full_shelf(client):
        """GET /books (no params) returns the full shelf as a bare array.

        Fault: new filter params changed the no-param response shape.
        """
        _seed(client)
        res = client.get("/books")
        assert res.status_code == 200
        data = res.json()
        assert isinstance(data, list), (
            f"Expected bare array for no-filter, got {type(data).__name__}"
        )
        assert len(data) == 6, f"Expected 6 books, got {len(data)}"


    def test_empty_result_unknown_tag(client):
        """GET /books?tag=nonexistent → 200, books=[], total=0, valid page/per_page.

        Fault: 404/500 on no-match, or non-empty books array.
        """
        _seed(client)
        res = client.get("/books", params={"tag": "nonexistent-tag"})
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()
        assert body["books"] == [], f"Expected empty books, got {body['books']}"
        assert body["total"] == 0, f"Expected total=0, got {body['total']}"
        assert isinstance(body["page"], int)
        assert isinstance(body["per_page"], int)


    def test_pagination_composition_page_slice_total_unchanged(client):
        """?status=read&tag=fiction&page=1&per_page=1 → 1 book; total=2 (full count).

        Fault: total equals page size (1) instead of full filtered count (2).
        """
        books = _seed(client)
        res = client.get("/books", params={
            "status": "read", "tag": "fiction", "page": 1, "per_page": 1,
        })
        assert res.status_code == 200
        body = res.json()
        assert len(body["books"]) == 1, f"Expected 1 book on page, got {len(body['books'])}"
        assert body["total"] == 2, (
            f"total={body['total']}, expected 2 (full filtered count, not page size)"
        )
        assert body["page"] == 1
        assert body["per_page"] == 1


    def test_response_shape_exact_keys(client):
        """Every tag-filter response has exactly {books, page, per_page, total}.

