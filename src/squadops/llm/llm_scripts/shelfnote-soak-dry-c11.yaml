    """Criterion RD2: duration_days in the book representation when both dates are present.

    Faults distinguished from correct behaviour:
    - Off-by-one from reversed subtraction order (start − finished instead of finished − start)
    - total_seconds() // 86400 instead of timedelta.days (differs across DST transitions)
    - duration_days present when only one of the two dates is set (conditional-visibility violated)
    - String-parsing arithmetic that fails on a month-boundary pair
    - duration_days persisted on the record rather than computed at response time
    """


    def _create_book(client, title="RD2 Book", author="Author", added_by="User"):
        """Create a book via POST /books and return its JSON dict."""
        res = client.post("/books", json={"title": title, "author": author, "added_by": added_by})
        assert res.status_code == 201
        return res.json()


    def test_duration_days_is_17_for_stated_pair(client):
        """After PATCH with start_date=2024-01-15 and finished_date=2024-02-01,
        the 200 response JSON includes duration_days == 17 (an int).

        Faults caught:
          - Off-by-one: reversed subtraction gives -17, or +1 gives 18
          - total_seconds() // 86400 instead of .days (can differ on DST boundaries)
          - Field absent or named differently
        """
        book = _create_book(client)

        res = client.patch(
            f"/books/{book['id']}",
            json={"start_date": "2024-01-15", "finished_date": "2024-02-01"},
        )
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()

        assert "duration_days" in body, f"duration_days key missing: {list(body.keys())}"
        val = body["duration_days"]
        assert isinstance(val, int), f"duration_days is {type(val).__name__}, expected int"
        assert not isinstance(val, bool), f"duration_days is a bool"
        assert val == 17, f"duration_days is {val!r}, expected 17"


    def test_duration_days_month_boundary(client):
        """start_date=2024-01-31, finished_date=2024-02-01 → duration_days == 1.

        Faults caught:
          - String-based date arithmetic that mishandles month boundaries
          - Off-by-one yielding 0 or 2
        """
        book = _create_book(client)

        res = client.patch(
            f"/books/{book['id']}",
            json={"start_date": "2024-01-31", "finished_date": "2024-02-01"},
        )
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()
        assert body["duration_days"] == 1, (
            f"duration_days is {body['duration_days']!r}, expected 1 for Jan 31 → Feb 1"
        )


    def test_duration_days_absent_when_only_one_date_set(client):
        """PATCH with only start_date on a book that has no finished_date →
        duration_days is absent from the response.

        Fault caught: conditional-visibility violated — duration_days present when
        only one of the two dates is set.
        """
        book = _create_book(client)

        res = client.patch(f"/books/{book['id']}", json={"start_date": "2024-01-15"})
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()
        assert body["start_date"] == "2024-01-15"
        assert "duration_days" not in body, (
            f"duration_days present ({body['duration_days']!r}) when only start_date is set"
        )


    def test_duration_days_absent_after_clearing_one_date(client):
        """Set both dates (duration_days appears), then clear finished_date via
        a null PATCH → duration_days is absent, proving the value is computed at
        response time rather than stored on the record.

        Fault caught: duration_days persisted on the book record — a subsequent
        PATCH that removes one date leaves a stale duration_days.
        """
        book = _create_book(client)

        # Both dates set → duration_days present and correct
        res = client.patch(
            f"/books/{book['id']}",
            json={"start_date": "2024-01-15", "finished_date": "2024-02-01"},
        )
        assert res.status_code == 200
        assert res.json()["duration_days"] == 17

        # Clear finished_date by patching it to null
        res2 = client.patch(f"/books/{book['id']}", json={"finished_date": None})
        assert res2.status_code == 200, f"Expected 200 on null PATCH, got {res2.status_code}"
        body2 = res2.json()

        # finished_date is now null
        assert body2.get("finished_date") is None, (
            f"finished_date not cleared, got {body2.get('finished_date')!r}"
        )
        # duration_days must be absent (only one date remains)
        assert "duration_days" not in body2, (
            f"duration_days still present ({body2['duration_days']!r}) after clearing "
            f"finished_date — value is stored, not computed at response time"
        )
