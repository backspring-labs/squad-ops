    ```python:tests/test_criterion_RD1.py
    """RD1: PATCH /books/{id} with start_date and finished_date — set and read reading dates.

    Faults distinguished from correct behaviour:
    - PATCH with both dates does not return them (missing or mangled strings).
    - A PATCH setting only start_date nullifies an existing finished_date.
    - A PATCH setting only finished_date nullifies an existing start_date.
    - An invalid date string is silently accepted (200) instead of 422.
    - duration_days appears in a partial-date response (conditional-visibility violation).
    """

    from fastapi.testclient import TestClient


    def _create_book(client: TestClient) -> dict:
        """POST a book via the TestClient and return its JSON dict."""
        res = client.post(
            "/books",
            json={"title": "Dune", "author": "Frank Herbert", "added_by": "Alice"},
        )
        assert res.status_code == 201
        return res.json()


    def test_patch_both_dates_returns_exact_strings(client: TestClient):
        """PATCH with start_date and finished_date → 200; response carries both exact strings.

        Faults caught:
          - Response omits start_date or finished_date entirely.
          - Date strings are mangled (timezone suffix, time component, wrong format).
        """
        book = _create_book(client)

        res = client.patch(
            f"/books/{book['id']}",
            json={"start_date": "2024-01-15", "finished_date": "2024-02-01"},
        )
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()
        assert body["start_date"] == "2024-01-15", (
            f"start_date is {body.get('start_date')!r}, expected '2024-01-15'"
        )
        assert body["finished_date"] == "2024-02-01", (
            f"finished_date is {body.get('finished_date')!r}, expected '2024-02-01'"
        )


    def test_patch_only_start_date_preserves_finished_no_duration(client: TestClient):
        """PATCH only start_date after both are set → finished_date retains its prior
        value; duration_days is absent from the response.

        Faults caught:
          - Setting only start_date nullifies or overwrites the existing finished_date.
          - duration_days surfaces when the patch body contained only one date
            (conditional-visibility rule spanning RD1/RD2).
        """
        book = _create_book(client)

        # Establish both dates first
        setup = client.patch(
            f"/books/{book['id']}",
            json={"start_date": "2024-01-01", "finished_date": "2024-03-15"},
        )
        assert setup.status_code == 200

        # Patch only start_date
        res = client.patch(
            f"/books/{book['id']}",
            json={"start_date": "2024-02-01"},
        )
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()

        # The patched date is updated
        assert body["start_date"] == "2024-02-01", (
            f"start_date is {body.get('start_date')!r}, expected '2024-02-01'"
        )
        # The un-patched date must survive
        assert body["finished_date"] == "2024-03-15", (
            f"finished_date lost after partial patch; got {body.get('finished_date')!r}, "
            f"expected '2024-03-15'"
        )
        # duration_days must NOT appear in a partial-date patch response
        assert "duration_days" not in body, (
            f"duration_days present in partial-date response: {body.get('duration_days')!r}"
        )


    def test_patch_only_finished_date_preserves_start_no_duration(client: TestClient):
        """PATCH only finished_date after both are set → start_date retains its prior
        value; duration_days is absent.

        Faults caught:
          - Setting only finished_date nullifies the existing start_date.
          - duration_days surfaces when the patch body contained only one date.
        """
        book = _create_book(client)

        # Establish both dates first
        setup = client.patch(
            f"/books/{book['id']}",
            json={"start_date": "2024-01-10", "finished_date": "2024-04-10"},
        )
        assert setup.status_code == 200

        # Patch only finished_date
        res = client.patch(
            f"/books/{book['id']}",
            json={"finished_date": "2024-05-20"},
        )
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()

        assert body["finished_date"] == "2024-05-20", (
            f"finished_date is {body.get('finished_date')!r}, expected '2024-05-20'"
        )
        assert body["start_date"] == "2024-01-10", (
            f"start_date lost after partial patch; got {body.get('start_date')!r}, "
            f"expected '2024-01-10'"
        )
        assert "duration_days" not in body, (
            f"duration_days present in partial-date response: {body.get('duration_days')!r}"
        )


    def test_patch_invalid_date_string_returns_422(client: TestClient):
        """PATCH with start_date='not-a-date' → 422 validation error, not 200 or 500.

        Faults caught:
          - Invalid date silently accepted (200 with mangled or empty value).
          - Invalid date causes an unhandled exception (500).
        """
        book = _create_book(client)

        res = client.patch(
            f"/books/{book['id']}",
            json={"start_date": "not-a-date"},
        )
        assert res.status_code == 422, (
            f"Expected 422 for invalid date string, got {res.status_code}"
        )
    ```
