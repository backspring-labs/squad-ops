    ```python:tests/test_criterion_A1.py
    """Criterion A1: GET /stats — authors object: present, correct counts, zero-book
    authors absent, values are integers."""


    def test_zero_book_author_not_in_response(client):
        """Seed books by 'Author B' only; 'Author A' must not appear as a key.

        Fault caught: stale key retention or aggregation including zero-count authors.
        """
        client.post("/books", json={"title": "Book One", "author": "Author B", "added_by": "U"})
        client.post("/books", json={"title": "Book Two", "author": "Author B", "added_by": "U"})

        res = client.get("/stats")
        assert res.status_code == 200
        body = res.json()
        assert "authors" in body, f"'authors' key missing: {list(body.keys())}"
        authors = body["authors"]
        assert "Author A" not in authors, f"Zero-book author leaked: {authors}"
        assert authors.get("Author B") == 2, f"Author B count wrong: {authors}"


    def test_same_author_count_is_3_not_1(client):
        """3 books by Alice, 1 by Bob → Alice's count is 3, not 1.

        Fault caught: dict[author] = 1 (overwrite) instead of dict[author] += 1.
        """
        for i in range(3):
            client.post("/books", json={"title": f"Book {i}", "author": "Alice", "added_by": "U"})
        client.post("/books", json={"title": "Other", "author": "Bob", "added_by": "U"})

        res = client.get("/stats")
        assert res.status_code == 200
        authors = res.json()["authors"]
        assert authors["Alice"] == 3, f"Expected 3, got {authors['Alice']} (overwrite fault)"
        assert authors["Bob"] == 1


    def test_empty_shelf_authors_is_empty_dict(client):
        """No books: 'authors' key present, value is exactly {}.

        Fault caught: key omitted, null, list, or iteration over empty collection raises.
        """
        res = client.get("/stats")
        assert res.status_code == 200
        body = res.json()
        assert "authors" in body, f"'authors' key missing: {list(body.keys())}"
        assert isinstance(body["authors"], dict), f"authors is {type(body['authors']).__name__}"
        assert body["authors"] == {}, f"Expected {{}}, got {body['authors']!r}"


    def test_authors_values_are_integers(client):
        """Every value in the authors object is an int, not a string or float.

        Fault caught: handler serialises counts as strings or floats.
        """
        client.post("/books", json={"title": "X", "author": "AuthorX", "added_by": "U"})
        client.post("/books", json={"title": "Y", "author": "AuthorY", "added_by": "U"})

        res = client.get("/stats")
        assert res.status_code == 200
        authors = res.json()["authors"]
        assert isinstance(authors, dict), f"authors is not a dict: {type(authors)}"
        assert len(authors) == 2, f"Expected 2 authors, got {len(authors)}: {authors}"
        for name, count in authors.items():
            assert isinstance(count, int), (
                f"authors['{name}'] is {type(count).__name__} ({count!r}), expected int"
            )
            assert not isinstance(count, bool), f"authors['{name}'] is a bool"
            assert count == 1, f"Expected 1, got {count}"
    ```
