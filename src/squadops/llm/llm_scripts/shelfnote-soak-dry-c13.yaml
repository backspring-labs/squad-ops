    ```python:tests/test_criterion_D1.py
    """Criterion D1: GET /books/duplicates — case-insensitive title matching,
    self-exclusion, bare-array shape, route shadowing, idempotency."""


    def _post_book(client, title, author="A", added_by="U"):
        """POST a book and return its JSON dict."""
        res = client.post("/books", json={"title": title, "author": author, "added_by": added_by})
        assert res.status_code == 201
        return res.json()


    def test_duplicate_titles_all_cases_returned(client):
        """Books titled 'Dune', 'dune', 'DUNE' are all duplicates (case-insensitive).

        Faults caught:
          (1) Case-sensitive comparison — mixed-case titles not grouped.
          (3) Wrong response shape — {"duplicates": [...]} instead of bare array.
          (4) Route shadowing — /books/{id} captures the path, returning 404.
        """
        _post_book(client, "Dune")
        _post_book(client, "dune")
        _post_book(client, "DUNE")
        _post_book(client, "Neuromancer")

        res = client.get("/books/duplicates")
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"

        body = res.json()
        # Fault (3): bare array, not a wrapping dict
        assert isinstance(body, list), f"Expected bare JSON array, got {type(body).__name__}"

        titles = [b["title"] for b in body]
        assert "Dune" in titles, f"'Dune' missing from duplicates: {titles}"
        assert "dune" in titles, f"'dune' missing from duplicates: {titles}"
        assert "DUNE" in titles, f"'DUNE' missing from duplicates: {titles}"

        # Neuromancer is unique and must be absent
        assert "Neuromancer" not in titles, f"Unique title 'Neuromancer' leaked: {titles}"

        # Every entry carries id (int) and title (str)
        for entry in body:
            assert isinstance(entry.get("id"), int), f"Entry id is not int: {entry}"
            assert isinstance(entry.get("title"), str), f"Entry title is not str: {entry}"


    def test_unique_titles_return_empty_array(client):
        """A shelf where every title is unique → GET /books/duplicates returns [].

        Fault caught: self-counting — a book whose title appears exactly once is
        included because the implementation counts itself as 'at least one other'.
        """
        _post_book(client, "Alpha")
        _post_book(client, "Beta")
        _post_book(client, "Gamma")

        res = client.get("/books/duplicates")
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()
        assert isinstance(body, list), f"Expected list, got {type(body).__name__}"
        assert body == [], f"Expected empty list for all-unique titles, got {body}"


    def test_empty_shelf_returns_empty_array(client):
        """Zero books on the shelf → GET /books/duplicates returns 200 with [].

        Faults caught: 500 on empty shelf, or /books/{id} route shadowing
        returning 404 for the literal path 'duplicates'.
        """
        res = client.get("/books/duplicates")
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()
        assert isinstance(body, list), f"Expected list, got {type(body).__name__}"
        assert body == [], f"Expected empty list on empty shelf, got {body}"


    def test_two_successive_calls_return_identical_arrays(client):
        """Two GET /books/duplicates calls with no intervening write return identical arrays.

        Fault caught: mutation side-effect — the handler accidentally mutates shelf
        state, so the second call sees a different shelf.
        """
        _post_book(client, "Dune")
        _post_book(client, "dune")
        _post_book(client, "SOLARIS")

        res1 = client.get("/books/duplicates")
        assert res1.status_code == 200, f"First call: expected 200, got {res1.status_code}"
        body1 = res1.json()

        res2 = client.get("/books/duplicates")
        assert res2.status_code == 200, f"Second call: expected 200, got {res2.status_code}"
        body2 = res2.json()

        assert body1 == body2, f"Idempotency violated: first={body1}, second={body2}"
        assert len(body1) == 2, f"Expected 2 duplicates, got {len(body1)}: {body1}"
        for entry in body1:
            assert isinstance(entry["id"], int), f"Entry id is not int: {entry}"
            assert isinstance(entry["title"], str), f"Entry title is not str: {entry}"
    ```
