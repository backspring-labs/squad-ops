          (1) Case-sensitive comparison: implementation uses == instead of .lower() ==,
          so mixed-case titles are not grouped together.
        """
        b1 = _add_book(client, title="Dune")
        b2 = _add_book(client, title="dune")
        b3 = _add_book(client, title="DUNE")
        b4 = _add_book(client, title="Neuromancer")

