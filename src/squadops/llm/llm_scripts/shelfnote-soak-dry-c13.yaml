      (1) Case-sensitive comparison — mixed-case titles not grouped together.
      (2) Self-counting — a uniquely-titled book appears in the result.
      (3) Wrong response shape — a wrapping object instead of a bare JSON array.
      (4) Route shadowing — /books/duplicates captured by /books/{id}.
      (5) Mutation side-effect — successive GET calls return different results.
    """


    def _add_book(client, title="Dune", author="A", added_by="U"):
        """POST a book and return its JSON dict."""
        res = client.post("/books", json={"title": title, "author": author, "added_by": added_by})
        assert res.status_code == 201
        return res.json()


    def test_case_insensitive_duplicates_all_returned(client):
        """Three books titled 'Dune', 'dune', 'DUNE' → all three in the result;
