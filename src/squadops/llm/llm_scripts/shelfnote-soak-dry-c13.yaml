    ```python:tests/test_criterion_D1.py
    """D1: GET /books/duplicates — case-insensitive duplicate title detection,
    bare JSON array, empty on unique/empty shelf, idempotent, correct shape.

    Faults distinguished:
      1. Case-sensitive comparison (== instead of .lower() ==)
      2. Self-counting (a book with a unique title appears in results)
      3. Wrong response shape ({"duplicates": [...]} instead of bare array)
      4. Route shadowing (/books/{id} captures /books/duplicates)
      5. Mutation side-effect (successive GETs return different arrays)
    """


    def _seed(client, title, author="A"):
        """POST a book and return its JSON dict."""
        res = client.post("/books", json={"title": title, "author": author, "added_by": "U"})
        assert res.status_code == 201, f"POST /books failed: {res.status_code}"
        return res.json()


    def test_response_is_bare_json_array(client):
        """Fault 3: body must be a bare JSON array, not {"duplicates": [...]}.

        A dict response means the handler wraps the list in an object.
        """
        _seed(client, "Dune", "Herbert")
        _seed(client, "Dune", "Herbert")

        res = client.get("/books/duplicates")
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        body = res.json()
        assert isinstance(body, list), (
            f"Expected bare JSON array, got {type(body).__name__}: {body}"
