        assert b2["id"] in result_ids, f"'dune' (id={b2['id']}) missing from result {result_ids}"
        assert b3["id"] in result_ids, f"'DUNE' (id={b3['id']}) missing from result {result_ids}"
        assert b4["id"] not in result_ids, f"'Neuromancer' (id={b4['id']}) should be absent"
        assert len(body) == 3, f"Expected 3 entries, got {len(body)}: {body}"


