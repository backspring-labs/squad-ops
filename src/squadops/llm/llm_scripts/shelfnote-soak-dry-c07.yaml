- task_type: strategy.propose_plan_guidance
  occurrence: 1
  call: 1
  content: |
    ```yaml:plan_guidance.yaml
    version: 1
    guidance_id: guid-a64bef25
    source_brief_id: brief-prop_dd00b2dda705-001
    proposing_role: strategy
    priority_guidance:
      - area: backend_store
        priority: high
        rationale: |
          The sort-by-added_at-descending branch in store.py is the single most
          complex piece of this change. A wrong comparator direction, a missing
          None-guard on added_at, or an in-place mutation of the internal list
          all live here. Proposers should weight this task's verification
          coverage (multiple books, distinct added_at values, combined with
          existing filters) above the other backend files.
      - area: backend_routes
        priority: high
        rationale: |
          The route handler must validate the new sort value using the existing
          pattern (Literal, Enum, or manual check) without altering behaviour for
          existing values or the default path. The thirty-line limit in
          CONTRIBUTING.md constrains how much validation logic can be inlined.
      - area: tests_R1
        priority: high
        rationale: |
          The criterion test must seed at least three books with distinct
          added_at values and assert strict descending order. A two-book test
          can pass an ascending comparator by coincidence. The test also must
          exercise the running app through the test client, not import the sort
          function directly.
      - area: backend_models
        priority: medium
        rationale: |
          The models.py change is likely minimal — at most adding
          'recently_added' to a Literal or Enum that constrains valid sort
          values. If the current implementation does not constrain sort values
          at the model layer, this file may require zero changes. Proposers
          should confirm the baseline before allocating generation effort.
    ordering_guidance:
      - before: "dev:store_sort_branch"
        after: "dev:models_sort_constant"
        rationale: |
          If models.py defines the set of valid sort values (Literal, Enum),
          the store and routes must reference that symbol. The constant must
          exist before the branch that uses it.
      - before: "dev:routes_sort_param"
        after: "dev:store_sort_branch"
        rationale: |
          The route handler forwards sort_by to the store's list-books method.
          The store must accept the new value before the route can pass it
          through without a TypeError or validation mismatch.
      - before: "dev:test_R1"
        after: "dev:routes_sort_param"
        rationale: |
          The criterion test calls GET /books?sort_by=recently_added through
          the test client. The full request path (route to store to sort) must
          be in place before the test can exercise it.
    risk_guidance:
      - target: "dev:test_R1"
        risk: |
          Plan-shape namespace conflict: the brief's footprint names the test
          at tests/test_criterion_R1.py (repository-root tests/), but the
          qa-tests-live-in-the-stacks-namespace rule requires qa.test artifacts
          to sit under backend/tests/. All sixteen existing test files in this
          product live in root-level tests/. The merger must assign this test
          file to a dev task, not a qa.test task, to satisfy both the binding
          footprint and the namespace validator. A qa.test task claiming
          tests/test_criterion_R1.py will be rejected before dispatch.
      - target: "dev:store_sort_branch"
        risk: |
          In-place mutation: if the store's list-books method returns the
          internal list object directly rather than a copy, calling .sort()
          mutates the stored collection and contaminates subsequent calls with
          different sort values or no sort at all. The implementer must use
          sorted() (returns a new list) and verify the existing method's return
          semantics at the baseline commit.
      - target: "dev:store_sort_branch"
        risk: |
          Sort direction: the comparator must produce descending order
          (most-recent added_at first, earliest last). A single-book test or a
          test where the first-seeded book happens to have the latest added_at
          will pass an ascending sort by accident. The test must seed at least
          three books and assert strict index-to-added_at monotonic decrease.
      - target: "dev:routes_sort_param"
        risk: |
          Filter-then-sort ordering: when sort_by=recently_added is combined
          with an existing filter (search, tag, reading_status), the filter
          must apply first and the sort second. If the new sort branch is
          inserted before the filter in the store method, the result set
          changes and existing filter tests (test_search_*, test_tags_*,
          test_reading_status_*) can regress.
      - target: "dev:models_sort_constant"
        risk: |
          Pydantic serialisation regression: any structural change to
          models.py — re-ordering fields, adding a default to an existing
          field, changing a field type — can shift the JSON serialisation of
          the Book model and break the must-not-break criteria (T1-T3, C1-C2,
          X1). If the only change is adding a string to a Literal or Enum,
          verify that existing model fields and their declaration order are
          byte-identical.
    time_budget_guidance:
      - area: backend_models
        budget_pct: 5
      - area: backend_store
        budget_pct: 35
      - area: backend_routes
        budget_pct: 30
      - area: tests_R1
        budget_pct: 20
      - area: regression_verification
