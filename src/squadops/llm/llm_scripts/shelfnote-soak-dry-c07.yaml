- task_type: development.design_plan
  occurrence: 1
  call: 1
  content: |-
    # Technical Design — `sort_by=recently_added` on GET /books

    ## 1. Architecture Overview

    This change adds a single query-parameter value (`recently_added`) to the existing `GET /books` endpoint. No new endpoints, no new models, no new frontend surface. The data flow is unchanged:

    ```
    Client → GET /books?sort_by=recently_added
             → routes.py  (parse & validate query param)
             → store.py   (order in-memory collection by added_at DESC)
             → routes.py  (serialise to JSON response)
    ```

    The three backend files in the footprint each receive a minimal, additive edit. A new test file is created. Nothing else changes.

    ### Component Responsibilities (unchanged roles)

    | File | Role | What changes |
    |---|---|---|
    | `backend/models.py` | Pydantic models & enums | Add `"recently_added"` to the existing sort-value set (or define a `SortField` enum) if the model layer constrains valid sort values |
    | `backend/store.py` | In-memory / lightweight data access | Accept an `order_by` / `sort_by` argument in the list-books method and apply `sorted(..., key=…, reverse=True)` on `added_at` |
    | `backend/routes.py` | FastAPI route handlers | Accept `sort_by: Optional[str] = Query(None)` on `GET /books`, validate the value, forward to store |
    | `tests/test_criterion_R1.py` | Criterion test | New file: seed books with distinct `added_at` values, call `GET /books?sort_by=recently_added`, assert descending order |

    ## 2. Interface Definitions

    ### 2.1 Query Parameter Contract

    ```
    GET /books?sort_by=recently_added
    ```

    - **Name:** `sort_by`
    - **Type:** `string`
    - **Values accepted (this cycle):** `recently_added`
    - **Values already accepted:** whatever the existing implementation supports (e.g. `title`, `rating`) — unchanged
    - **Omitted / `None`:** default ordering (unchanged behaviour)
    - **Invalid value:** `422` from FastAPI's built-in `Query(…) + Literal/Enum` validation, or a `400` from an explicit check — whichever the existing pattern uses

    > Because `manifest_delta` is empty, the public contract for `GET /books` is already frozen. This design implements *within* that contract, not against it.

    ### 2.2 Store-layer Signature (internal)

    ```python
    # backend/store.py
    def get_books(
        self,
        *,
        sort_by: str | None = None,   # NEW parameter
        # … existing params (search, tag, status filters, etc.)
    ) -> list[Book]:
    ```

    When `sort_by == "recently_added"`, the method returns books ordered by `added_at` descending. All other values / `None` fall through to the existing ordering logic.

    ### 2.3 Route Handler (internal)

    The existing `GET /books` handler gains one parameter:

    ```python
    @router.get("/books")
    async def list_books(
        sort_by: str | None = Query(None),  # NEW
        # … existing params
    ):
    ```

    Validation of `sort_by` follows the existing pattern (enum, literal, or manual check). The handler forwards it to `store.get_books(sort_by=sort_by, …)`.

    ### 2.4 Model layer

    If `models.py` currently defines a `SortField` enum or a `Literal` for valid sort values, `"recently_added"` is added there. If sorting is validated at the route layer only, `models.py` may see no change (or a trivial comment). Either way the footprint allows it.

    ### 2.5 Response Shape (unchanged)

    ```json
    {
      "data": [ { …book… }, { …book… }, … ],
      "count": 3
    }
    ```

    The `data` array is the only thing whose *order* changes. Book fields, envelope shape, and `count` are identical to the current response.

    ## 3. Implementation Sequencing

    | Phase | File(s) | Task | Depends on |
    |---|---|---|---|
    | **A** | `backend/models.py` | Add `"recently_added"` to the sort-value set / enum (if one exists at the model layer). Confirm `Book.added_at` field is present and typed (`datetime` or ISO string). | — |
    | **B** | `backend/store.py` | Add `sort_by` keyword arg to the list method. When `sort_by == "recently_added"`, sort the result list by `added_at` descending before returning. Keep all other sort paths and default ordering byte-identical. | A |
    | **C** | `backend/routes.py` | Add `sort_by: Optional[str] = Query(None)` to the `GET /books` handler. Validate (reuse existing validation mechanism). Pass through to `store.get_books(…)`. Keep handler < 30 lines (CONTRIBUTING.md). | B |
    | **D** | `tests/test_criterion_R1.py` | Write the criterion test (see §5). | C |

    Phases A → B → C are strictly ordered because each layer depends on the one below it. Phase D can be written in parallel with C but must run after C to pass.

    Total estimated implementation time: **~40 min** (well within the 3-hour budget).

    ## 4. Proto Validation Plan

    The risk surface is small, so one lightweight proto suffices.

    ### Proto: Store ordering correctness

    **Goal:** Confirm that the in-memory store's list method can be extended with an `added_at`-descending sort without disturbing existing sort paths or the default order.

    **Steps (throwaway script, not committed):**

    1. Import the store module.
    2. Create 3 book records with distinct `added_at` values (e.g. `2025-01-01`, `2025-06-15`, `2025-03-10`).
    3. Call the list method with the new `sort_by="recently_added"` kwarg.
    4. Assert the returned list order is `[Jun, Mar, Jan]`.
    5. Call the list method with `sort_by=None` (or the existing default) and assert order is unchanged from pre-change.
    6. Call with a pre-existing sort value (e.g. `title`) and assert that path is untouched.

    **Pass criterion:** All three assertions hold. The `added_at` field is populated on every book the store returns.

    **Disposability:** This script is deleted after it runs. No code from it lands in the product.

    ### What the proto does NOT validate

    - The FastAPI query-parameter plumbing (standard `Query(None)` — no risk).
    - The JSON serialisation of `added_at` (the field already exists and is already serialised in other responses; no new field is introduced).
    - Frontend behaviour (no frontend changes in this footprint).

    ## 5. Test Design — `tests/test_criterion_R1.py`

    Following CONTRIBUTING.md rules:
    - Exercises the running app through `TestClient` (or `httpx.AsyncClient` per the existing test files' pattern).
    - Fails on response content, not on imports.
    - Tests the new behaviour specifically; does not re-test existing must-not-break criteria.

    ```python
    # tests/test_criterion_R1.py
    """Criterion R1: GET /books?sort_by=recently_added returns books by added_at DESC."""

    import pytest
    from fastapi.testclient import TestClient   # or httpx, matching existing test files

    # Import the app the same way existing test files do (see conftest.py / test_books_api.py)
    from backend.main import app


    def test_recently_added_sort_orders_by_added_at_descending(client):
        """Seed books with known added_at values; verify descending order in response."""
        # 1. Create books with distinct added_at timestamps
        #    (use the app's own POST /books endpoint or direct store seeding,
        #     matching the pattern in existing criterion tests)
        book_a = _create_book(client, title="A", added_at="2025-01-01T00:00:00Z")
        book_b = _create_book(client, title="B", added_at="2025-06-15T00:00:00Z")
        book_c = _create_book(client, title="C", added_at="2025-03-10T00:00:00Z")

        # 2. Call the endpoint
        resp = client.get("/books", params={"sort_by": "recently_added"})

        # 3. Assert
        assert resp.status_code == 200
        data = resp.json()["data"]
        ids = [b["id"] for b in data]
        assert ids == [book_b, book_a, book_c]  # Jun, Mar, Jan → descending
    ```

    The helper `_create_book` and the `client` fixture follow the exact pattern used in `tests/test_books_api.py` and the other criterion test files (the `conftest.py` likely provides the fixture).

    **Additional assertions to include (within the same test function or a second test in the file):**
    - The most recent book appears **first** in the array.
    - The earliest book appears **last**.
    - The `count` field equals the total number of seeded books (not filtered).
    - Books *without* an explicit `added_at` (if the model allows) still appear; their position is deterministic per the implementation.

    **Must-not-break guard:** The test file does *not* re-assert T1–T3, C1–C2, X1. Those are covered by their own files and run in the same `pytest` invocation.

    ## 6. Unknown Classification

    | # | Unknown | Classification | Rationale |
    |---|---|---|---|
    | U1 | Does `Book` already carry an `added_at` field in `models.py`? | **resolved** | The criterion references `added_at` as an existing attribute. The manifest is already applied (`manifest_delta: []`), meaning the model contract is fixed and includes it. If the field were missing, the manifest delta would have added it. |
    | U2 | Does the store already have a `sort_by` parameter or an equivalent ordering mechanism? | **resolved** | `test_sorting_t1.py` (3 669 bytes) exists in the repo, proving a sort feature is already implemented and tested. The new work adds a *value* to that mechanism, not the mechanism itself. |
    | U3 | Which validation pattern does the existing `GET /books` use for query params (enum, literal, manual)? | **resolved** | Visible in `routes.py` (6 545 bytes) at the baseline commit. The implementer reads the file and follows the existing pattern. No design decision needed beyond "match what's there." |
    | U4 | Is `added_at` a `datetime` object or an ISO-8601 string in the in-memory store? | **resolved** | Determined by reading `models.py` and `store.py` at implementation start. Either way `sorted(…, key=lambda b: b.added_at, reverse=True)` works (strings sort lexicographically in ISO-8601; datetimes compare natively). No design impact. |
    | U5 | Does the existing `GET /books` response already include `added_at` in each book object? | **acceptable_risk** | If it does (likely, given it's a model field), no change needed. If it doesn't, the criterion only checks *order*, not the presence of `added_at` in the payload, so the test still passes. No action required. |
    | U6 | Can the handler stay under 30 lines after adding the `sort_by` parameter? | **acceptable_risk** | Adding one `Query(None)` parameter and one keyword argument to the store call is ~2 lines. The existing handler is well under the limit (6 545 bytes covers *multiple* endpoints). Mitigation: if it tips over, extract a small helper — but this is extremely unlikely. |

    **No `blocker` or `requires_human_decision` unknowns.**

    ## 7. Risks & Mitigations

    | Risk | Likelihood | Mitigation |
    |---|---|---|
    | Breaking an existing sort path (e.g. `sort_by=title`) | Low | The new sort is a new branch (`if sort_by == "recently_added"`); all other values fall through to existing logic unchanged. Must-not-break tests (T1–T3, C1–C2, X1) catch regression. |
    | `added_at` is `None` for some books, causing `TypeError` on sort | Low | Guard with `key=lambda b: b.added_at or datetime.min` (or equivalent). The proto in §4 exercises this case. |
    | Handler exceeds 30-line limit | Very low | Measure after edit; refactor only if necessary. |

    ## 8. Files Emitted (full replacement)

    | Path | Action |
    |---|---|
    | `backend/models.py` | **Replace** — add `"recently_added"` to sort-value set (if present) |
    | `backend/store.py` | **Replace** — add `sort_by` kwarg + descending `added_at` sort branch |
    | `backend/routes.py` | **Replace** — add `sort_by` query param to `GET /books`, forward to store |
    | `tests/test_criterion_R1.py` | **Create** — criterion R1 test |

    All other files remain at their baseline content. The footprint is exactly these four paths.

    ## 9. Budget Check

    | Activity | Estimate |
    |---|---|
    | Read existing code, confirm patterns | 15 min |
    | Proto (§4) | 10 min |
    | Implement phases A–C | 25 min |
    | Write test D | 10 min |
    | Run full test suite (`pytest -q`, `npm test`), fix any breakage | 15 min |
    | **Total** | **~75 min** |

    Well within the 3-hour (10 800 s) budget. No work is deferred.
- task_type: qa.define_test_strategy
  occurrence: 1
  call: 1
  content: |-
    # QA Test Strategy — `sort_by=recently_added` on GET /books

    **Change:** `prop_dd00b2dda705` v1 · Backlog SN-11 · Footprint: 3 backend files + 1 test file
    **Stage:** A (planning) — defines *what* and *how*, not the test code itself

    ---

    ## 1. Acceptance Checklist

    Derived from criterion **R1** and the `must_not_break` set. Each item is a concrete
    pass/fail gate evaluated at implementation review.

    ### R1 — New behaviour: `sort_by=recently_added`

    - [ ] **R1-1** `GET /books?sort_by=recently_added` returns HTTP 200 with a JSON body whose `data` array is ordered by `added_at` **descending** (most recent first, earliest last).
    - [ ] **R1-2** With ≥ 3 books having distinct `added_at` values, the response order matches the expected descending sequence exactly (no off-by-one, no ascending).
    - [ ] **R1-3** With exactly 1 book, the response contains that single book (trivially sorted).
    - [ ] **R1-4** With 0 books (empty shelf), the response is `{"data": [], …}` — no 500, no crash.
    - [ ] **R1-5** When two or more books share the same `added_at` timestamp, their relative order is stable and deterministic (no random re-ordering across repeated calls).
    - [ ] **R1-6** `sort_by=recently_added` composes correctly with other existing query parameters (e.g. `search=`, `tag=`, `reading_status=`, `page=` / `limit=`) — the filter is applied first, then the result is sorted by `added_at` desc.
    - [ ] **R1-7** The parameter value is matched case-sensitively as `recently_added`. A different casing (`Recently_Added`, `RECENTLY_ADDED`) is treated as an unknown sort value and falls through to the existing unknown-value handling (400 or default order — whichever the product currently does for unrecognised sort values).
    - [ ] **R1-8** The response schema (field names, nesting) is identical to the existing `GET /books` response; only the ordering of the `data` array changes. No new top-level keys are introduced.

    ### Must-not-break — existing criteria remain green

    - [ ] **T1** All tests in `tests/test_criterion_T1.py` pass unchanged.
    - [ ] **T2** All tests in `tests/test_criterion_T2.py` pass unchanged.
    - [ ] **T3** All tests in `tests/test_criterion_T3.py` pass unchanged.
    - [ ] **C1** All tests in `tests/test_criterion_C1.py` pass unchanged.
    - [ ] **C2** All tests in `tests/test_criterion_C2.py` pass unchanged.
    - [ ] **X1** All tests in `tests/test_criterion_X1.py` pass unchanged.
    - [ ] **NMB-1** `GET /books` with **no** `sort_by` parameter returns books in the product's existing default order (unchanged behaviour).
    - [ ] **NMB-2** `GET /books?sort_by=title` (or whichever existing sort values are supported) continues to sort by those fields as before.
    - [ ] **NMB-3** `pytest -q -p no:cacheprovider` exits 0 (all backend tests, including `test_sorting_t1.py`, `test_search_t*.py`, `test_tags_t*.py`, `test_ratings_t*.py`, `test_reading_status_t*.py`).
    - [ ] **NMB-4** `npm --prefix frontend test --silent` exits 0 (frontend harness test unaffected).
    - [ ] **NMB-5** `.venv/bin/python -c "from backend.main import app"` succeeds (app boots).

    ---

    ## 2. Test Strategy Note

    ### Scope decision

    | Layer | In scope? | Rationale |
    |---|---|---|
    | **Unit** (function-level) | Yes — targeted | `store.py` query/sort logic is the core of the change; a focused unit test on the sort call isolates ordering from HTTP plumbing. |
    | **Integration** (TestClient → route → store) | **Primary** | The product's convention is FastAPI `TestClient` integration tests. R1 is an endpoint-observable criterion; the test must exercise the full path `route → store → response`. |
    | **Contract / schema** | Light | No new endpoint, no new model field exposed. Verify the response JSON shape is unchanged via the existing test fixtures (no separate contract test needed). |
    | **E2E / frontend** | **Out of scope** | The change is backend-only (footprint contains no frontend files). The frontend's `BooksListView.jsx` already calls `GET /books`; no UI change is requested. The frontend harness test must still pass, but no new frontend test is warranted. |

    ### Test file placement and naming

    - New test: **`tests/test_criterion_R1.py`** (named per the change request's `criterion_files`).
    - Runner: `pytest` (matches `backend_tests` check; file is under `.` and named `test_*.py`).
    - Framework: `fastapi.testclient.TestClient` per product convention. **No** `httpx.AsyncClient`, **no** running server.
    - Imports must come only from packages declared in `backend/requirements.txt` and the product's own modules.

    ### Test structure for `test_criterion_R1.py`

    The implementation workload should produce tests that:

    1. **Seed the store** with a known set of books whose `added_at` values are controlled and distinct.
    2. **Call** `GET /books?sort_by=recently_added` via `TestClient`.
    3. **Assert** the `added_at` sequence in the response is strictly descending (or non-increasing for ties).
    4. Cover the checklist items R1-1 through R1-8 as individual test functions or grouped fixtures.
    5. **Not** import from `backend.models` internals for assertions — assert on the JSON response, per CONTRIBUTING.md ("fails on what the response says, not on importing something the change adds").

    ### Regression safety

    - The existing `tests/test_sorting_t1.py` already exercises sort behaviour on `GET /books`. It **must** continue to pass. If it tests an existing `sort_by` value, the new `recently_added` branch must not alter the dispatch logic for other values.
    - All other `tests/test_*.py` files are regression guards; the `backend_tests` check runs the entire suite.

    ### What is explicitly NOT tested here

    - Frontend rendering of the sorted list (no frontend change).
    - Database-level index performance (no database in this product; the store is in-process).
    - Concurrent-write consistency of `added_at` (single-threaded test client).

    ---

    ## 3. Defect Severity Rubric

    | Severity | Label | Definition (in this change's context) | Examples |
    |---|---|---|---|
    | **S1** | **Blocker** | R1's stated observable is violated, **or** a `must_not_break` criterion fails. The change cannot be accepted. | Books returned ascending instead of descending. `sort_by=title` no longer sorts by title. `GET /books` returns 500. App fails to boot. |
    | **S2** | **Major** | R1 is met in the happy path but a boundary or combination case (R1-4, R1-5, R1-6, R1-7) is wrong. No existing criterion is broken. | Empty shelf causes 500. Tied `added_at` values produce non-deterministic order. `sort_by=recently_added&tag=sci-fi` returns unfiltered-then-sorted (wrong filter semantics). |
    | **S3** | **Minor** | Observable behaviour is correct but a secondary concern is off. Does not affect R1 pass/fail or any `must_not_break`. | Error message for invalid `sort_by` value is inconsistent with existing messages. Log line is missing. Variable naming in `store.py` is unclear. |
    | **S4** | **Trivial** | Style, documentation, or cosmetic issue with zero functional impact. | PEP-8 spacing. Comment typo. |

    **Gate rule:** Any S1 → reject. Any S2 → reject with required fix, re-test. S3/S4 → note for next increment, do not block.

    ---

    ## 4. Risk-Based Test Priorities

    Ordered by likelihood × impact of a fault in each area.

    | Priority | Area | Risk | Why it matters | Test focus |
    |---|---|---|---|---|
    | **P1** | `store.py` — sort query construction | **High** | This is where the `ORDER BY added_at DESC` (or equivalent list-sort) is implemented. A wrong comparator (ascending vs descending), a wrong field, or a missing `None` guard all produce silent wrong ordering. | Verify ordering with ≥ 3 distinct `added_at` values. Verify with identical timestamps (tie-break). Verify `added_at` is never `None` in the test seed. |
    | **P1** | `routes.py` — parameter dispatch | **High** | The route must recognise `recently_added` as a valid sort key and route it to the correct store call **without** disturbing the dispatch for existing sort values or the default (no-sort) path. | Confirm existing `sort_by` values still work (NMB-2). Confirm no-`sort_by` still works (NMB-1). Confirm unknown value handling is unchanged. |
    | **P2** | `routes.py` — interaction with existing filters | **Medium** | `GET /books` already supports search, tags, reading_status, pagination. The new sort must apply **after** filtering, not before, and must not break the filter logic. | R1-6: combine `sort_by=recently_added` with `search=`, `tag=`, `reading_status=` and verify both filter and sort are correct. |
    | **P2** | `models.py` — any model change | **Medium** | The footprint includes `models.py`. If a field is added or modified (e.g., making `added_at` explicit when it was previously implicit), it could shift Pydantic serialisation or validation and break existing endpoints. | R1-8: response shape unchanged. NMB: existing POST/GET/PATCH book endpoints still validate and serialise correctly. |
    | **P3** | `tests/test_criterion_R1.py` — test quality | **Medium** | A test that passes vacuously (e.g., asserts on a single book, or asserts the list is non-empty without checking order) gives false confidence. | Review: does the test actually assert descending order? Does it fail if you flip the sort direction? (CONTRIBUTING.md: "must not be met already by the framework's default behaviour.") |
    | **P3** | Regression: full `pytest` suite | **Medium** | Any import-level or module-level side effect in the changed files (e.g., a new import in `store.py` that fails, a circular import) breaks the entire suite, not just R1. | Run the full `pytest` suite. Confirm exit code 0. |
    | **P4** | Frontend regression | **Low** | No frontend files are in the footprint. The only risk is if a backend response shape change (see P2) breaks `api.js` parsing. | NMB-4: `npm --prefix frontend test --silent` passes. |

    ---

    ## 5. Implementation Review Gate (QA sign-off)

    Before the change is accepted, QA verifies **all** of the following:

    1. `tests/test_criterion_R1.py` exists, is discoverable by `pytest`, and every test in it passes.
    2. Every item in the **Acceptance Checklist** (§1) is checked off.
    3. `pytest -q -p no:cacheprovider` exits 0 — all pre-existing test files pass.
    4. `npm --prefix frontend test --silent` exits 0.
    5. `python -c "from backend.main import app"` succeeds.
    6. No file outside the footprint (`backend/models.py`, `backend/store.py`, `backend/routes.py`, `tests/test_criterion_R1.py`) has been modified.
    7. The route handler for `GET /books` remains under 30 lines (CONTRIBUTING.md).
    8. No S1 or S2 defects are open.

    ---

    *End of test strategy.*
