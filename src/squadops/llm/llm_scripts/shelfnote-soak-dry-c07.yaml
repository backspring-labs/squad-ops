      - "Does the existing GET /books handler validate sort_by via a Pydantic Literal, an Enum, or a manual if/elif chain? The implementer must read backend/routes.py at the baseline commit and match the existing pattern. If the existing pattern is a Literal or Enum, adding 'recently_added' to that set is the correct approach. If it is a manual check, the new value is added as another branch. Either way, the validation behaviour for unknown values must remain identical to the current behaviour."
