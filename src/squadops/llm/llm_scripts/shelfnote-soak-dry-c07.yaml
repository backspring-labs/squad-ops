    ```yaml:proposed_plan_tasks.yaml
    version: 1
    proposal_id: prop-dedeff06
    source_brief_id: brief-prop_dd00b2dda705-001
    proposing_role: qa
    scope_statement: |
      One QA task that authors tests/test_criterion_R1.py, the criterion test for
      sort_by=recently_added on GET /books. The tests distinguish the following
      faults from correct behaviour: (a) ascending instead of descending sort
      direction, (b) sort key pointing at the wrong field, (c) unhandled None
      added_at causing TypeError, (d) in-place sort mutating the internal store
      collection, (e) filter-then-sort order reversal when combined with search or
      tag filters, and (f) response envelope shape drift. Must-not-break
      regression (T1–T3, C1–C2, X1, existing sort values, default ordering) is
      covered by the frozen test files that the backend_tests check re-runs
      automatically; this task does not re-author those.
    tasks:
      - task_type: qa.test
        role: qa
        focus: "Criterion R1: recently_added sort order"
        description: |
          Author tests/test_criterion_R1.py exercising GET /books?sort_by=recently_added
          through the FastAPI TestClient (or httpx.AsyncClient, matching the existing
          test-file convention in tests/). The client fixture comes from the root
          conftest.py.

          Faults distinguished (one or more test functions per fault):

          1. Ascending-vs-descending: seed at least three books with distinct
             added_at values; assert the data array is in strictly descending
             added_at order (most recent first, earliest last). A comparator that
             omits reverse=True fails this test.

          2. Wrong sort field: seed books whose title or rating ordering differs
             from their added_at ordering; assert the response follows added_at,
             not title or rating. A sort key on the wrong field fails.

          3. None added_at: seed a book with added_at set to None (or absent,
             depending on model optionality); assert the call returns successfully
             (no 500) and the book appears in a deterministic position. A sort key
             that calls .added_at directly without a None guard raises TypeError.

          4. Internal state mutation: call GET /books?sort_by=recently_added, then
             call GET /books (no sort) or GET /books?sort_by=<existing_value>;
             assert the second call's ordering is not corrupted by the first
             call's sort. An in-place list.sort() on the store's internal
             collection fails this.

          5. Filter-then-sort: seed books matching a search term and books that do
             not; call GET /books?sort_by=recently_added&search=<term>; assert only
             matching books appear and they are in descending added_at order. A
             sort-then-filter (or filter-then-no-sort) implementation fails.

          6. Response envelope: assert the JSON response has top-level keys "data"
             and "count" (matching the existing GET /books shape), that each book
             object in data carries the same per-book field names as the current
             response, and that count equals len(data). A models.py change that
             reorders fields or adds a new top-level key fails.

          The test file does NOT re-assert T1–T3, C1–C2, or X1; those are frozen
          files re-run by the backend_tests check. It does NOT assert on the
          internal Python type of added_at (datetime vs str) — only on the
          observable JSON response ordering.

          Per CONTRIBUTING.md: the test exercises the running app through the test
          client and fails on response content, not on importing a module the
          change adds. The test is not vacuous: with a correct descending sort it
          passes, and with an ascending sort (or no sort) it fails.
        expected_artifacts:
          - "tests/test_criterion_R1.py"
        acceptance_criteria:
          - check: function_defined
            file: "tests/test_criterion_R1.py"
            name_prefix: "test_"
            min_count: 3
            severity: error
          - check: command_exit_zero
            argv: ["python", "-m", "py_compile", "tests/test_criterion_R1.py"]
            severity: error
          - "The test seeds at least three books with distinct added_at values and asserts the data array is in descending added_at order (most recent first, earliest last); flipping the sort to ascending makes the test fail."
          - "The test covers the empty-shelf case (0 books) and asserts a successful response with an empty data array, not a 500."
          - "The test covers a book with added_at = None (or absent) and asserts the endpoint does not raise; the response is still well-formed."
          - "The test combines sort_by=recently_added with at least one existing filter (search, tag, or reading_status) and asserts the filter reduces the set and the sort applies to the filtered result."
          - "The test asserts the response envelope shape: top-level keys include 'data' and 'count'; each element of data carries the same per-book field names as the existing GET /books response."
          - "The test uses the client fixture from conftest.py and asserts on the HTTP response JSON, not on imported module internals."
          - "The test does not re-assert criteria T1, T2, T3, C1, C2, or X1; those are covered by their frozen test files."
        depends_on_focus:
          - "dev:Sort value in models layer"
          - "dev:Store sort branch for recently_added"
          - "dev:Route handler sort_by parameter"
    brief_conflicts:
      - field: "qa-tests-live-in-the-stacks-namespace"
        issue: |
          The plan-shape rule names backend/tests/ as the QA test namespace for the
          FastAPI+React stack. However, this product's established convention places
          all backend tests in tests/ at the repository root (tests/test_books_api.py,
          tests/test_criterion_T1.py, tests/test_sorting_t1.py, etc.), with conftest.py
          at the root serving that directory. The brief's footprint, the increment
          instructions, and the change request all mandate tests/test_criterion_R1.py
          at the root tests/ path. I follow the increment's binding path. If the
          plan-shape validator rejects tests/ as outside the stack's declared QA
          namespace, the merger must reconcile by treating the product's root tests/
          directory as this product's declared QA namespace (it is the directory the
          product's pytest runner collects, as shown by backend_tests running
          python -m pytest -q from the root).
        resolution: "Follow increment instruction: tests/test_criterion_R1.py"
    assumptions:
      - "The root conftest.py provides a client fixture (TestClient or httpx.AsyncClient) usable by tests in tests/."
      - "The Book model's added_at field is populated for books created via the API or direct store seeding; at least the model allows it to be set."
      - "The existing GET /books handler accepts query parameters and the response envelope has top-level keys 'data' and 'count'."
      - "pytest collects tests/test_criterion_R1.py when run as python -m pytest -q from the repository root."
    risks:
      - "If conftest.py's fixture does not seed the store fresh per test (no isolation), tests in this file may interfere with each other or with frozen criterion tests. Mitigation: follow the same fixture/seed pattern as existing tests in tests/ (e.g., test_books_api.py, test_sorting_t1.py)."
      - "If added_at is a datetime object internally but serialised as an ISO string in JSON, the test must compare the JSON string values in the response, not the internal objects. Mitigation: assert on the JSON array order, not on Python objects."
    gaps_not_covered:
