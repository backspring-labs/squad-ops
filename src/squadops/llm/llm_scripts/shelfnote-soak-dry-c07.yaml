    """Criterion R1: GET /books?sort_by=recently_added — descending added_at order,
    filter composition, None safety, no internal mutation, response envelope."""


    def _post_book(client, title="T", author="A", added_by="U"):
        """POST a book via the API and return its JSON dict."""
        res = client.post("/books", json={"title": title, "author": author, "added_by": added_by})
        assert res.status_code == 201
        return res.json()


    def _extract_data(res):
        """Extract the book list from the response JSON, handling both bare array and
        an envelope with a 'data' key."""
        body = res.json()
        if isinstance(body, dict) and "data" in body:
            return body["data"]
        return body


    def test_recently_added_descending_order(client):
        """Three books created in sequence → data array in strictly descending added_at
        order (most recent first). Titles are in a different order than creation order
        to also catch a sort on the wrong field.

        Faults caught:
          1. Ascending sort (oldest first) — reverse=True omitted.
          2. Sort key on title or rating instead of added_at.
        """
        # Creation order: Zebra (oldest), Apple (middle), Mango (newest)
        b_z = _post_book(client, title="Zebra", author="AuthZ")
        b_a = _post_book(client, title="Apple", author="AuthA")
        b_m = _post_book(client, title="Mango", author="AuthM")

        res = client.get("/books", params={"sort_by": "recently_added"})
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"

        data = _extract_data(res)
        assert len(data) == 3, f"Expected 3 books, got {len(data)}"

        # Descending added_at: Mango (newest), Apple, Zebra (oldest)
        titles = [b["title"] for b in data]
        assert titles == ["Mango", "Apple", "Zebra"], (
            f"Expected descending added_at [Mango, Apple, Zebra], got {titles}"
        )
        # A title-ascending sort would give [Apple, Mango, Zebra] — must NOT be that
        assert titles != ["Apple", "Mango", "Zebra"], "Sorted by title, not added_at"


    def test_recently_added_empty_shelf(client):
        """Zero books → 200 with empty data array, not a 500.

        Fault caught: unguarded iteration or division on an empty collection.
        """
        res = client.get("/books", params={"sort_by": "recently_added"})
        assert res.status_code == 200, f"Expected 200 on empty shelf, got {res.status_code}"

        data = _extract_data(res)
        assert data == [], f"Expected empty data array, got {data}"


    def test_recently_added_none_added_at_no_crash(client):
        """A book with added_at=None does not cause a 500; response is well-formed.

        Fault caught: sort key calls added_at directly without a None guard →
        TypeError → 500.
        """
        _post_book(client, title="Normal", author="A")
        _post_book(client, title="Other", author="B")

        # Mutate the store so one book has added_at=None
        import backend.store as _store
        col = None
        for name in ("books", "_books", "book_store", "shelf"):
            candidate = getattr(_store, name, None)
            if isinstance(candidate, list):
                col = candidate
                break
        if col is None:
            for name in dir(_store):
                candidate = getattr(_store, name)
                if (
                    isinstance(candidate, list)
                    and candidate
                    and isinstance(candidate[0], dict)
                    and "added_at" in candidate[0]
                ):
                    col = candidate
                    break
        assert col is not None, "Could not locate the books collection in backend.store"
        col[0]["added_at"] = None

        res = client.get("/books", params={"sort_by": "recently_added"})
        assert res.status_code == 200, (
            f"Expected 200, got {res.status_code} — possible unguarded None in sort key"
        )
        body = res.json()
        assert isinstance(body, (list, dict)), f"Response is not JSON: {type(body).__name__}"


    def test_recently_added_no_internal_mutation(client):
        """After a sorted call, the default unsorted call returns the original order.

        Fault caught: in-place list.sort() on the store's internal collection
        corrupts subsequent reads that rely on the original ordering.
        """
        _post_book(client, title="First", author="A")
        _post_book(client, title="Second", author="B")
        _post_book(client, title="Third", author="C")

        # Exercise the sort
        client.get("/books", params={"sort_by": "recently_added"})

        # Default order must still be newest-first (unchanged by the sort call)
        res = client.get("/books")
        assert res.status_code == 200
        body = res.json()
        titles = [b["title"] for b in body]
        assert titles == ["Third", "Second", "First"], (
            f"Default order corrupted after sort_by=recently_added call: {titles}"
        )


    def test_recently_added_with_search_filter(client):
        """sort_by=recently_added combined with search returns only matching books
        in descending added_at order.

        Faults caught:
          - Sort-then-filter: sorts the full list, then filters (order preserved
            but non-matching books were included before the sort changed positions).
          - Filter-then-no-sort: filters but forgets to sort the filtered subset.
        """
        b1 = _post_book(client, title="The Hobbit", author="Tolkien")
        b2 = _post_book(client, title="Dune", author="Herbert")
        b3 = _post_book(client, title="The Great Gatsby", author="Fitzgerald")

        res = client.get("/books", params={"sort_by": "recently_added", "search": "the"})
        assert res.status_code == 200

        data = _extract_data(res)
        # Only the two "The …" books match; Dune does not
        assert len(data) == 2, f"Expected 2 matching books, got {len(data)}"
        titles = [b["title"] for b in data]
        assert "Dune" not in titles, f"Non-matching book leaked into results: {titles}"

        # Descending added_at among matches: Gatsby (created last) before Hobbit
        assert titles == ["The Great Gatsby", "The Hobbit"], (
            f"Expected [The Great Gatsby, The Hobbit] in descending added_at, got {titles}"
        )


    def test_recently_added_response_envelope(client):
        """Response has top-level 'data' and 'count'; count equals len(data);
        each book carries the standard per-book field names.

        Faults caught:
          - models.py change adds or reorders top-level keys.
          - Per-book serializer drops or renames a field.
        """
        _post_book(client, title="Dune", author="Herbert", added_by="Alice")

        res = client.get("/books", params={"sort_by": "recently_added"})
        assert res.status_code == 200
        body = res.json()

        assert isinstance(body, dict), (
            f"Expected dict response with envelope, got {type(body).__name__}"
        )
        assert "data" in body, f"Missing top-level 'data' key: {list(body.keys())}"
        assert "count" in body, f"Missing top-level 'count' key: {list(body.keys())}"

        data = body["data"]
        count = body["count"]
        assert count == len(data), f"count={count} but len(data)={len(data)}"
        assert len(data) == 1, f"Expected 1 book, got {len(data)}"

        # Each book carries the same fields the existing GET /books response has
        expected_fields = {"id", "title", "author", "added_by", "notes", "slug", "rating", "status", "tags"}
        book = data[0]
        missing = expected_fields - set(book.keys())
        assert not missing, f"Book object missing fields {missing}; has {list(book.keys())}"
