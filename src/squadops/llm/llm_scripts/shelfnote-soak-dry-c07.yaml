      - "Full-suite regression (pytest exit 0) — handled by the backend_tests check running all collected tests including frozen criterion files; not a separate QA task."
      - "App boot (python -c 'from backend.main import app') — handled by the boots check; not a separate QA task."
      - "Handler line count (< 30 lines) — a dev acceptance criterion on the routes task, not a test observable."
    confidence: high
