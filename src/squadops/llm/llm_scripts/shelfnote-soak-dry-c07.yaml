    ---
    readiness: go
    sufficiency_score: 5
    blocker_unknowns: 0
    ---

    ## Consolidated Plan — Increment: `sort_by=recently_added` on GET /books

    ### 1. Objective Frame

    This cycle implements a single approved criterion against an accepted, shipped application (Shelfnote at commit `01b92774a23cbf2bc5d4db770e26e7d759b383d7`).

    **Criterion R1:** When `GET /books` is called with query parameter `sort_by=recently_added`, the `data` array in the JSON response lists books in **descending** order of their `added_at` value (most recently added first).

    No PRD delta, no manifest delta, no retired criteria. The accepted application's interface and behaviour are unchanged except for this one new sort option. The reviewer's notes impose no additional constraints beyond the pre-registration rule that triggered automatic approval.

    ### 2. Technical Design (by footprint file)

    The build starts from the accepted code at the baseline commit. Only the four footprint files change; every other file retains its accepted content verbatim.

    #### 2.1 `backend/models.py`

    - **Purpose:** Ensure the `Book` model carries an `added_at` field suitable for descending sort.
    - **Design:**
      - If the model already has an `added_at` field (e.g., a `datetime` or ISO-8641 `str` set at creation time), no structural change is needed; only confirm it is included in the serialization path.
      - If the field does not yet exist, add `added_at: str` (or `datetime`) to the `Book` pydantic model and ensure the store sets it to the current timestamp when a book is first created. The field must be part of the response so R1's observable is testable.
      - Do **not** add new endpoints, new models, or alter existing field types. Keep the change minimal.
    - **Constraint:** This file is in the footprint, so a model change is anticipated and permitted.

    #### 2.2 `backend/store.py`

    - **Purpose:** Provide the data-access operation that returns books sorted by `added_at` descending.
    - **Design:**
      - Extend the existing `list_books` (or equivalent) method to accept an optional `sort_by` parameter.
      - When `sort_by == "recently_added"`, sort the in-memory book collection by `added_at` in descending order before returning.
      - When `sort_by` is absent or a different value, preserve the existing default ordering so that all current behaviour (and the `must_not_break` criteria) is unaffected.
      - Keep the method signature backward-compatible: existing callers that do not pass `sort_by` must see identical results.
    - **Constraint:** No new file, no new module-level state. Sorting is a pure transformation on the existing collection.

    #### 2.3 `backend/routes.py`

    - **Purpose:** Accept and forward the `sort_by` query parameter on `GET /books`.
    - **Design:**
      - Add an optional query parameter `sort_by: str | None = None` to the existing `GET /books` handler.
      - Pass `sort_by` through to the store's list method.
      - The handler must remain under 30 lines per CONTRIBUTING.md. If adding the parameter pushes it over, extract the list-and-resolve logic into a small helper or rely on the store call as-is (a single call + response is well within 30 lines).
      - Do not add a new route. Do not change the response envelope (`{"data": [...], ...}`) shape.
    - **Constraint:** The existing `GET /books` handler already exists; this is a parameter addition, not a new endpoint.

    #### 2.4 `tests/test_criterion_R1.py`

    - **Purpose:** Prove criterion R1.
    - **Design:**
      - Pytest file under `tests/`, named per product convention (`test_*.py`).
      - Uses `fastapi.testclient.TestClient` (or `httpx.AsyncClient` per the product's existing test patterns) to exercise the running app.
      - **Test cases:**
        1. **Ordering (happy path):** Seed the store with ≥ 3 books having distinct `added_at` values (e.g., via `POST /books` or direct store seeding). Call `GET /books?sort_by=recently_added`. Assert the `data` array is in descending `added_at` order — first element is the newest, last is the oldest.
        2. **Single element / empty edge:** Call with a single book (or zero books) to confirm no crash and correct (trivial) ordering.
        3. **Default order preserved:** Call `GET /books` *without* `sort_by`. Assert the response order is unchanged from the accepted behaviour (guards against accidental re-sorting).
      - Each test asserts on the **response body** (the `data` array contents and order), not on internal imports. Per CONTRIBUTING.md: "fails on what the response says, not on importing something the change adds."
      - Must be runnable by `pytest -q -p no:cacheprovider` under the product's venv. Import only packages declared in `backend/requirements.txt`.
    - **Constraint:** This is a new file; it does not replace any existing test.

    ### 3. Test Strategy & Regression Guard

    | Check | What it proves | How it runs |
    |---|---|---|
    | `tests/test_criterion_R1.py` (new) | R1: descending `added_at` order on `sort_by=recently_added` | `pytest` (backend_tests) |
    | `tests/test_criterion_T1.py` … `X1.py` (existing) | Must-not-break: six accepted criteria still pass | `pytest` (backend_tests) |
    | All other `tests/test_*.py` (existing) | General regression: no accepted behaviour is disturbed | `pytest` (backend_tests) |
    | `frontend` tests (unchanged) | Frontend unaffected | `vitest` (frontend_tests) |
    | `boots` check | App still imports and constructs | `.venv/bin/python -c "from backend.main import app"` |

    No frontend file is in the footprint, so `frontend_tests` will run against unchanged code and pass by construction.

    ### 4. Design Sufficiency Assessment

    | Criterion | Rating | Notes |
    |---|---|---|
    | **Scope clarity** | 5/5 | One criterion, four files, no PRD/manifest delta, explicit observable. Boundaries are unambiguous. |
    | **Technical feasibility** | 5/5 | Add a timestamp field (if missing), a sort branch in the store, a query param in the route, and one test file. All are small, well-understood changes in a working FastAPI + pydantic codebase. |
    | **Risk coverage** | 4/5 | The only residual unknown is whether `added_at` already exists in the accepted model; the footprint's inclusion of `models.py` anticipates this. Mitigation: read the model at implementation start; if the field is present, `models.py` may require no edit. No architectural risk. |
    | **Test strategy alignment** | 5/5 | R1 is directly tested. Six must-not-break criteria are guarded by existing tests that run in the same pytest invocation. Edge cases (single/empty) are covered. |
    | **Resource fit** | 5/5 | Backend-only change, one new test file. Well within a 3-hour budget. No frontend work, no new dependencies, no infrastructure change. |

    **Sufficiency score: 5 / 5**

    ### 5. Risks & Mitigations

    | Risk | Class | Likelihood | Mitigation |
    |---|---|---|---|
    | `added_at` not yet in model | Minor | Medium (footprint anticipates it) | Read `models.py` first; add field + set-on-create in `store.py` if absent. |
    | Existing `sort_by` values (e.g., from `test_sorting_t1.py`) are clobbered | Minor | Low | The new sort branch is additive; default path is untouched. Existing sort tests run in the same pytest pass. |
    | Handler exceeds 30-line limit | Minor | Low | Adding one query param and forwarding it is ~2 lines; handler stays well under 30. |
    | Test seeds books in an order that accidentally matches default | Low | Low | Use ≥ 3 books with explicitly staggered `added_at` values; assert by ID order, not position. |

    No blocker-classified unknowns.

    ### 6. Execution Sequence (suggested task order)

    1. **Read** `backend/models.py`, `backend/store.py`, `backend/routes.py` at baseline to confirm current `Book` fields, existing sort logic, and handler shape.
    2. **Implement `backend/models.py`** (if `added_at` is absent): add the field, ensure it serialises in the response.
    3. **Implement `backend/store.py`**: add `sort_by` handling in the list method; set `added_at` on creation if the model gained the field.
    4. **Implement `backend/routes.py`**: add `sort_by` query param to `GET /books`; forward to store.
    5. **Write `tests/test_criterion_R1.py`**: three test cases per §2.4.
    6. **Run full checks:**
       - `boots`: `.venv/bin/python -c "from backend.main import app"`
       - `backend_tests`: `.venv/bin/python -m pytest -q -p no:cacheprovider`
       - `frontend_tests`: `npm --prefix frontend test --silent`
    7. **Verify** all must-not-break criteria (T1–T3, C1–C2, X1) and R1 pass.

    Estimated effort: 45–75 minutes of active coding and testing, well within the 3-hour budget.

    ### 7. Deferrals

    None. The change is a single, self-contained increment. No out-of-budget work is identified or deferred.

    ### 8. Readiness Recommendation

    **GO.** The plan is fully specified, technically feasible, low-risk, and comfortably within the time budget. No blocker unknowns exist. The squad can proceed directly to implementation.
