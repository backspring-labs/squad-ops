      - "The existing default ordering of GET /books (no sort_by parameter) is unchanged."
      - "All existing sort_by values (e.g. title, rating — whatever the current implementation supports) continue to sort correctly and are not affected by the new branch."
      - "The GET /books response envelope (top-level keys, per-book field names, count) is identical to the current response; only the ordering of the data array changes."
      - "The GET /books route handler remains under thirty lines (CONTRIBUTING.md)."
      - "The new test exercises the running app through the test client and fails on response content, not on importing a module the change adds (CONTRIBUTING.md)."
      - "The new test must not be satisfied already by the framework's default behaviour (CONTRIBUTING.md)."
      - "The change touches only the four footprint files: backend/models.py, backend/store.py, backend/routes.py, tests/test_criterion_R1.py. Every other file keeps its accepted implementation."
      - "The app must boot: python -c 'from backend.main import app' succeeds."

    scope_cuts:
      - "Frontend changes: deferred — no frontend file is in the footprint. BooksListView.jsx already calls GET /books; no UI work is requested."
      - "New endpoints: not in scope. Only the existing GET /books endpoint gains a new query-parameter value."
      - "New model fields: not in scope. added_at already exists on the Book model; no new field is added."
      - "Additional sort values beyond recently_added: not in scope this cycle. If more sort keys are wanted, that is a separate change request."
      - "Pagination, filtering, or search behaviour changes: not in scope. The new sort composes with existing filters but does not alter them."
      - "Performance, indexing, or database work: not applicable. The store is in-memory; there is no database."
      - "Admin dashboards, user management, or any other feature: deferred to a follow-up cycle if ever requested."

    risk_areas:
      - "Sort direction: the comparator must be descending (reverse=True), not ascending. A wrong direction silently passes a single-book test but fails with multiple books."
      - "Existing sort dispatch: the new sort value must not alter the branching logic for existing sort values or the default no-sort path. A shared mutable default (e.g. a list used as a keyword default) could cause cross-request contamination."
      - "added_at field integrity: if any book's added_at is None or missing, the sort key must handle it without raising TypeError. The existing store may or may not guarantee the field is always populated."
      - "Response shape regression: any change to models.py (even a re-ordered field or a new default) can shift Pydantic serialisation and break existing endpoint tests (T1–T3, C1–C2, X1)."
