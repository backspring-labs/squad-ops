    ```python:tests/test_criterion_R1.py
    """Criterion R1: GET /books?sort_by=recently_added — books in descending added_at order."""


    def _create_book(client, title, author, added_by="U"):
        """POST a book via the TestClient and return its JSON dict."""
        res = client.post("/books", json={"title": title, "author": author, "added_by": added_by})
        assert res.status_code == 201
        return res.json()


    def test_recently_added_descending_order(client):
        """Three books created in sequence → response lists them newest-first.

        Fault caught: ascending sort (oldest first) or no sort at all.
        """
        a = _create_book(client, "Alpha", "Author1")
        b = _create_book(client, "Beta", "Author2")
        c = _create_book(client, "Gamma", "Author3")

        res = client.get("/books", params={"sort_by": "recently_added"})
        assert res.status_code == 200
        data = res.json()
        assert isinstance(data, list), f"Expected JSON array, got {type(data).__name__}"
        assert len(data) == 3, f"Expected 3 books, got {len(data)}"

        ids = [book["id"] for book in data]
        assert ids == [c["id"], b["id"], a["id"]], (
            f"Expected newest-first order [{c['id']}, {b['id']}, {a['id']}], got {ids}"
        )


    def test_recently_added_follows_added_at_not_title(client):
        """Books whose title order differs from creation order: response follows added_at.

        Fault caught: sort key on title (or rating) instead of added_at.
        Created order: Zebra, Apple, Mango.
        Title ascending would be: Apple, Mango, Zebra.
        Correct (added_at desc): Mango, Apple, Zebra.
        """
        zebra = _create_book(client, "Zebra", "AuthZ")
        apple = _create_book(client, "Apple", "AuthA")
        mango = _create_book(client, "Mango", "AuthM")

        res = client.get("/books", params={"sort_by": "recently_added"})
        assert res.status_code == 200
        data = res.json()
        titles = [b["title"] for b in data]

        assert titles == ["Mango", "Apple", "Zebra"], (
            f"Expected ['Mango','Apple','Zebra'] (added_at desc), got {titles}. "
            f"Title-sorted would be ['Apple','Mango','Zebra']."
        )


    def test_recently_added_empty_shelf_returns_empty_list(client):
        """Zero books → 200 with empty array, not 500 or an error body.

        Fault caught: unguarded sort on empty collection raises, or wrong status code.
        """
        res = client.get("/books", params={"sort_by": "recently_added"})
        assert res.status_code == 200, f"Expected 200 on empty shelf, got {res.status_code}"
        data = res.json()
        assert isinstance(data, list), f"Expected JSON array, got {type(data).__name__}"
        assert data == [], f"Expected empty list, got {data}"


    def test_recently_added_does_not_mutate_default_order(client):
        """After sort_by=recently_added, a plain GET /books still returns default order.

        Fault caught: in-place list.sort() on the store's internal collection
        reorders the shelf so subsequent unsorted calls see the mutated order.
        """
        a = _create_book(client, "First", "A")
        b = _create_book(client, "Second", "B")
        c = _create_book(client, "Third", "C")

        # Trigger the sort
        sorted_res = client.get("/books", params={"sort_by": "recently_added"})
        assert sorted_res.status_code == 200

        # Default order must still be newest-first
        default_res = client.get("/books")
        assert default_res.status_code == 200
        default_ids = [book["id"] for book in default_res.json()]
        assert default_ids == [c["id"], b["id"], a["id"]], (
            f"Default shelf order corrupted after sort call: {default_ids}"
        )


    def test_recently_added_with_search_filter(client):
        """sort_by=recently_added + search → only matching books, in descending added_at.

        Fault caught: sort-then-filter (loses non-matches in sort), filter-then-no-sort,
        or sort applied to unfiltered set.
        """
        h = _create_book(client, "The Hobbit", "Tolkien")
        g = _create_book(client, "The Great Gatsby", "Fitzgerald")
        _create_book(client, "War and Peace", "Tolstoy")

        # "the" (case-insensitive) matches Hobbit and Gatsby; not "War and Peace"
        res = client.get("/books", params={"sort_by": "recently_added", "search": "the"})
        assert res.status_code == 200
        data = res.json()
        assert isinstance(data, list)
        assert len(data) == 2, f"Expected 2 matches for 'the', got {len(data)}"

        ids = [b["id"] for b in data]
        # Among matches, descending added_at: Gatsby (created 2nd) before Hobbit (1st)
        assert ids == [g["id"], h["id"]], (
            f"Expected [{g['id']}, {h['id']}] (desc added_at among matches), got {ids}"
        )


    def test_recently_added_response_fields_match_plain_listing(client):
        """Each book in the sorted response carries the same field names as GET /books.

        Fault caught: a models.py change renames, drops, or reorders serializer fields
        only on the sorted path.
        """
        _create_book(client, "Dune", "Herbert")

        plain = client.get("/books").json()
        assert isinstance(plain, list) and len(plain) == 1
        expected_fields = set(plain[0].keys())

        res = client.get("/books", params={"sort_by": "recently_added"})
        assert res.status_code == 200
        data = res.json()
        assert isinstance(data, list) and len(data) == 1

        actual_fields = set(data[0].keys())
        assert actual_fields == expected_fields, (
            f"Book field mismatch: expected {sorted(expected_fields)}, "
            f"got {sorted(actual_fields)}"
        )
    ```
