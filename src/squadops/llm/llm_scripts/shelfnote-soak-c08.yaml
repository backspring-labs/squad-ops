    """R1: GET /books?sort_by=recently_added — descending added_at order,
    filter composition, state non-mutation, and response shape."""


    def _seed(client, pairs):
        """POST books oldest→newest. pairs is a list of (title, author) tuples.
        Returns the list of response dicts in creation order."""
        books = []
        for title, author in pairs:
            res = client.post("/books", json={"title": title, "author": author, "added_by": "U"})
            assert res.status_code == 201
            books.append(res.json())
        return books


    def test_recently_added_descending_order(client):
        """Three books with distinct added_at values come back newest-first.

        Fault: ascending sort (missing reverse=True) or no sort applied.
        """
        books = _seed(client, [("First", "A"), ("Second", "B"), ("Third", "C")])
        # books[0] oldest … books[2] newest

        res = client.get("/books", params={"sort_by": "recently_added"})
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        data = res.json()
        assert isinstance(data, list), f"Expected list, got {type(data).__name__}"
        assert len(data) == 3

        expected = [books[2]["id"], books[1]["id"], books[0]["id"]]
        actual = [b["id"] for b in data]
        assert actual == expected, f"Expected newest-first {expected}, got {actual}"


    def test_recently_added_follows_added_at_not_title(client):
        """Title order differs from added_at order; response must follow added_at.

        Fault: sort key on title (or rating) instead of added_at.
        Creation order (oldest→newest): C, A, B.
        recently_added desc → B, A, C
        title asc           → A, B, C   (different)
        title desc          → C, B, A   (different)
        """
        books = _seed(client, [("C", "A"), ("A", "B"), ("B", "C")])
        # books[0]=C (oldest), books[1]=A, books[2]=B (newest)

        res = client.get("/books", params={"sort_by": "recently_added"})
        assert res.status_code == 200
        titles = [b["title"] for b in res.json()]
        assert titles == ["B", "A", "C"], (
            f"Expected added_at descending ['B','A','C'], got {titles}"
        )


    def test_recently_added_with_search_filter(client):
        """sort_by=recently_added + search: only matching books, in added_at desc order.

        Fault: sort-then-filter drops the sort, or filter-then-no-sort ignores added_at.
        """
        books = _seed(client, [
            ("Zulu", "A"),        # no match, oldest
            ("the-alpha", "B"),   # match
            ("Beta", "C"),        # no match
            ("the-gamma", "D"),   # match, newest
        ])
        # "the" matches the-alpha (books[1]) and the-gamma (books[3])

        res = client.get("/books", params={"sort_by": "recently_added", "search": "the"})
        assert res.status_code == 200
        data = res.json()
        assert isinstance(data, list)
        assert len(data) == 2, f"Expected 2 matches, got {len(data)}"

        # Descending added_at among matches: the-gamma (newest) then the-alpha
        expected = [books[3]["id"], books[1]["id"]]
        actual = [b["id"] for b in data]
        assert actual == expected, f"Expected {expected}, got {actual}"


    def test_recently_added_does_not_mutate_default_order(client):
        """After a sort_by call, a bare GET /books still returns default (newest-first) order.

        Fault: in-place list.sort() on the store's internal collection corrupts it.
        """
        books = _seed(client, [("One", "A"), ("Two", "B"), ("Three", "C")])

        # Trigger the sort
        client.get("/books", params={"sort_by": "recently_added"})

        # Bare GET must still be newest-first
        res = client.get("/books")
        assert res.status_code == 200
        data = res.json()
        assert isinstance(data, list)

        expected = [books[2]["id"], books[1]["id"], books[0]["id"]]
        actual = [b["id"] for b in data]
        assert actual == expected, (
            f"Default order corrupted after sort_by: {actual} != {expected}"
        )


    def test_recently_added_response_shape(client):
        """Each book carries the standard per-book fields in the sorted response.

        Fault: serializer change that drops or renames a field.
        """
        books = _seed(client, [("Book A", "Author A"), ("Book B", "Author B")])

        res = client.get("/books", params={"sort_by": "recently_added"})
        assert res.status_code == 200
        data = res.json()
        assert isinstance(data, list)
        assert len(data) == 2

        for book in data:
            for field in ("id", "title", "author", "added_by", "slug", "notes", "rating", "tags", "status"):
                assert field in book, f"Field '{field}' missing from book object: {list(book.keys())}"


    def test_recently_added_empty_shelf(client):
        """Zero books → 200 with an empty array, not a 500.

        Fault: unguarded sort over an empty collection raises TypeError/ValueError.
        """
        res = client.get("/books", params={"sort_by": "recently_added"})
        assert res.status_code == 200, f"Expected 200 on empty shelf, got {res.status_code}"
        data = res.json()
        assert isinstance(data, list)
        assert data == []
