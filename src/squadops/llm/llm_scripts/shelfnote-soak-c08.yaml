        "Product sort implementation for sort_by=recently_added returns ascending order (oldest first) instead of descending (most recent first) as specified by the PRD",
        "All three failing tests (test_recently_added_descending_order, test_recently_added_follows_added_at_not_title, test_recently_added_with_search_filter) assert descending order and all receive ascending order from the endpoint",
