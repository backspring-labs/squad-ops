    """Criterion R1: GET /books?sort_by=recently_added — descending added_at order.

    Faults distinguished:
      1. Ascending sort (reverse=True omitted) → order is oldest-first.
      2. Wrong sort field (title or rating) → order follows the wrong key.
      3. Filter-then-sort vs sort-then-filter → non-matching books leak.
      4. In-place sort mutates the store's list → subsequent unsorted call is corrupted.
      5. Empty shelf → unguarded sort raises 500.
      6. Response shape diverges from the standard GET /books array.
    """


    def test_recently_added_descending_order(client):
        """Three books posted in sequence: response lists them newest-first (descending added_at).

        Fault caught: ascending sort (reverse=True omitted) or no sort applied.
        """
        client.post("/books", json={"title": "Earliest", "author": "A", "added_by": "U"})
        client.post("/books", json={"title": "Middle", "author": "B", "added_by": "U"})
        client.post("/books", json={"title": "Latest", "author": "C", "added_by": "U"})

        res = client.get("/books", params={"sort_by": "recently_added"})
        assert res.status_code == 200, f"Expected 200, got {res.status_code}"
        data = res.json()
        assert isinstance(data, list), f"Expected JSON array, got {type(data).__name__}"
        assert len(data) == 3, f"Expected 3 books, got {len(data)}"
        titles = [b["title"] for b in data]
        assert titles == ["Latest", "Middle", "Earliest"], (
            f"Expected descending added_at [Latest, Middle, Earliest], got {titles}"
        )


    def test_recently_added_follows_added_at_not_title(client):
        """Books whose alphabetical order differs from added_at order: response follows added_at.

        Fault caught: sort key uses title or rating instead of added_at.
        """
        # POST order gives added_at: Zeta < Apple < Mango
        # Alphabetical order: Apple < Mango < Zeta (different!)
        client.post("/books", json={"title": "Zeta", "author": "A", "added_by": "U"})
        client.post("/books", json={"title": "Apple", "author": "B", "added_by": "U"})
        client.post("/books", json={"title": "Mango", "author": "C", "added_by": "U"})

        res = client.get("/books", params={"sort_by": "recently_added"})
        assert res.status_code == 200
        data = res.json()
        titles = [b["title"] for b in data]
        # Descending added_at: Mango (3rd posted), Apple (2nd), Zeta (1st)
        assert titles == ["Mango", "Apple", "Zeta"], (
            f"Expected added_at order [Mango, Apple, Zeta], got {titles} — "
            f"title-sort would give [Apple, Mango, Zeta]"
        )


    def test_recently_added_with_search_filter(client):
        """sort_by=recently_added + search: only matching books, in descending added_at order.

        Faults caught:
          - sort-then-filter: non-matching books appear in the result
          - filter-then-no-sort: filtered books are in insertion order, not added_at order
        """
        client.post("/books", json={"title": "Alpha One", "author": "A", "added_by": "U"})
        client.post("/books", json={"title": "Beta Mid", "author": "B", "added_by": "U"})
        client.post("/books", json={"title": "Alpha Two", "author": "C", "added_by": "U"})

        res = client.get("/books", params={"sort_by": "recently_added", "search": "alpha"})
        assert res.status_code == 200
        data = res.json()
        assert isinstance(data, list)
        assert len(data) == 2, f"Expected 2 'alpha' books, got {len(data)}: {data}"
        titles = [b["title"] for b in data]
        # Only alpha books, descending added_at: Alpha Two (3rd), Alpha One (1st); Beta excluded
        assert titles == ["Alpha Two", "Alpha One"], (
            f"Expected filtered+sorted [Alpha Two, Alpha One], got {titles}"
        )


    def test_recently_added_empty_shelf_returns_empty_array(client):
        """Zero books: sort_by=recently_added → 200, body is [].

        Fault caught: unguarded sort on empty list raises (500) or returns error.
        """
        res = client.get("/books", params={"sort_by": "recently_added"})
        assert res.status_code == 200, f"Expected 200 on empty shelf, got {res.status_code}"
        data = res.json()
        assert isinstance(data, list), f"Expected JSON array, got {type(data).__name__}"
        assert data == [], f"Expected empty array, got {data}"


    def test_recently_added_does_not_mutate_default_order(client):
        """After a sorted GET, the default (unsorted) GET still returns newest-first.

        Fault caught: in-place list.sort() on the store's internal list corrupts
        subsequent unsorted requests.
        """
        client.post("/books", json={"title": "First", "author": "A", "added_by": "U"})
        client.post("/books", json={"title": "Second", "author": "B", "added_by": "U"})
        client.post("/books", json={"title": "Third", "author": "C", "added_by": "U"})

        # Sorted call
        res_sorted = client.get("/books", params={"sort_by": "recently_added"})
        assert res_sorted.status_code == 200

        # Default call must still be newest-first (unchanged by the sorted call)
