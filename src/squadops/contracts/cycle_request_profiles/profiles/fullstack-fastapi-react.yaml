name: fullstack-fastapi-react
description: >
  Fullstack FastAPI + React (Vite) build with builder assembly.
  Neo produces backend/ and frontend/ source code, Bob assembles
  packaging artifacts, Eve generates tests for both stacks.
defaults:
  # SIP-0086 §12a change 1: declared, never defaulted. This profile runs no output
  # validation, so no self-evaluation pass can open; 0 says so.
  max_self_eval_passes: 0
  # SIP-0108 §10i item 3: the correction protocol this profile runs. The squad
  # analyzes the failure, decides the path, then repairs.
  correction_steps: [analyze, decide, repair]
  build_strategy: fresh
  development_profile: fullstack_fastapi_react
  build_profile: fullstack_fastapi_react
  task_flow_policy:
    mode: sequential
    gates:
      - name: plan-review
        description: >
          Review planning artifacts before building the fullstack app.
        after_task_types:
          - governance.review
  expected_artifact_types:
    - document
    - source
    - test
    - config
  build_tasks:
    - development.develop
    - builder.assemble
    - qa.test
  notes: "Fullstack FastAPI + React (Vite) — stack-aware development profiles"
