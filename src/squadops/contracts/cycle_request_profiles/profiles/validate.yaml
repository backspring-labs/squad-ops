# #316 (the request-profile taxonomy, R2.4): an operator profile, validation's depth. Its required checks,
# time budget and manifest attempts are the stack's (R2.3, squadops.stacks.request_defaults). `validation`,
# `validation-multirole`, `validated-fullstack` and `validated-fullstack-solo` stay, frozen, under their own.
name: validate
description: Framing then implementation, with output and typed validation and three corrections. The stack sets its required checks, time budget and manifest attempts.
defaults:
  # SIP-0108 §10i item 3: the correction protocol this profile runs. The squad
  # analyzes the failure, decides the path, then repairs.
  correction_steps: [analyze, decide, repair]
  build_strategy: fresh
  task_flow_policy:
    mode: sequential
    gates:
      - name: progress_plan_review
        description: Review planning artifacts and build manifest before implementation begins.
        after_task_types:
          - governance.review
  expected_artifact_types:
    - document
    - source
    - test
    - config
  workload_sequence:
    - type: framing
      gate: progress_plan_review
    - type: implementation
      gate: null
  build_tasks: true
  implementation_plan: true
  output_validation: true
  # Implementation-profile depth — exercises typed checks meaningfully and
  # gives correction enough budget to surface structural-change candidates.
  # SIP-0086 §12a change 1: the compile loop's depth for a one-hour build profile.
  max_self_eval_passes: 3
  max_correction_attempts: 3
  max_build_subtasks: 15
  # SIP-0092 M1 active.
  typed_acceptance: true
  command_acceptance_checks: true
  experiment_context: {}
  notes: "#316 validate: the stack declares what this depth requires of it (R2.3)"
