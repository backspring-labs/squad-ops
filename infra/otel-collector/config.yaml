receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  resource:
    attributes:
      - key: service.name
        action: insert
        value: squadops

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: squadops
  # #2424: basic is one summary line per batch. The traces and logs pipelines reach only this
  # exporter; at normal it printed each batch whole.
  debug:
    verbosity: basic
  # Optional: Add OTLP exporter for Jaeger if needed
  # otlp/jaeger:
  #   endpoint: jaeger:4317

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    include_metadata: true  # Include version and other metadata in health check response
  zpages:
    endpoint: 0.0.0.0:55679  # Diagnostic pages extension (includes version info)

service:
  extensions: [health_check, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [debug]
    # #2424: Prometheus is where the metrics are read. Sent to debug as well, every batch was
    # printed to the collector's log, about 250 lines a minute while a cycle runs (#2204).
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [debug]

