global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'squadops-dev'
    environment: 'development'

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # #2203: the agents serve no /metrics. They export over OTLP to the collector (#2239), whose
  # Prometheus exporter is scraped below; the three targets here (max, neo and a task-api that no
  # longer exists) were always down.

  # #2204: the host's resources (node-exporter, docker-compose.yml).
  - job_name: 'host'
    static_configs:
      - targets:
          - 'node-exporter:9100'
    scrape_interval: 15s

  # #2204: the GPU (dcgm-exporter, docker-compose.yml). It runs only on a GPU host, under the
  # compose profile `gpu`, so on any other host this target reads down: there is no GPU exporter
  # there. A static target fails quietly (up=0); discovery by DNS logged an ERROR every 30 s
  # wherever the exporter doesn't run (2026-10-11).
  - job_name: 'gpu'
    static_configs:
      - targets:
          - 'dcgm-exporter:9400'
    scrape_interval: 15s

  # The agents' metrics, through the OpenTelemetry Collector's Prometheus exporter
  - job_name: 'otel-collector'
    static_configs:
      - targets:
          - 'otel-collector:8889'
    metrics_path: '/metrics'
    scrape_interval: 15s

