[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Note: No package-dir override - allows packages from both src/ and root

[tool.setuptools.packages.find]
where = ["src", "."]  # Search both src/ and project root
include = ["squadops*", "adapters*"]  # Include both packages

[project]
name = "squadops"
version = "1.7.0"
description = "SquadOps: a production-grade multi-agent orchestration framework."
requires-python = ">=3.12"
authors = [
  { name = "Jason Ladd / Backspring Industries" }
]
readme = "README.md"
license = { text = "MIT" }
# What `import squadops` and the `squadops` console script need, unconditionally, at the
# floors requirements/base.txt carries (#582). The images pin exact versions through
# requirements/*.lock, compiled against ci-constraints.txt (#1041); this list is the
# library-side view of the same facts — what `pip install squadops`, dependabot and
# pip-audit read. It was empty until 1.7.1, so a bare install ImportError'd at first use.
# tests/unit/architecture/test_project_dependencies_mirror_imports.py holds it to the
# real imports in both directions and to base.txt's floors.
dependencies = [
  "pydantic>=2.7.3",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.1",
  "httpx>=0.27.0",
  "jsonschema>=4.20.0",
  # Exact, as in base.txt: its verdicts gate task acceptance (#689).
  "pyflakes==3.4.0",
  # The console script below is installed by every install, so what it imports is core.
  "typer>=0.9",
  "rich>=13.0",
]

[project.scripts]
squadops = "squadops.cli.main:app"

[project.optional-dependencies]
# Per-image sets, mirrored line for line from requirements/api.txt and agent.txt (the
# same guard test holds them equal). The images install the compiled locks; these are
# the metadata view so `pip install squadops[api]` resolves the runtime API's imports.
api = [
  "fastapi>=0.104.1",
  "uvicorn>=0.24.0",
  "python-multipart>=0.0.6",
  "aio-pika>=9.3.1",
  "asyncpg>=0.29.0",
  "redis>=5.0.0",
  "python-jose[cryptography]>=3.3.0",
  "langfuse>=2.0,<3.0",
  "ulid-py>=1.1.0,<2.0",
]
agent = [
  "aio-pika>=9.3.1",
  "lancedb>=0.8.2",
  "a2a-sdk[http-server]>=0.3.0",
  "uvicorn>=0.30.0",
  "langfuse>=2.0,<3.0",
]
langfuse = ["langfuse>=2.0,<3.0"]
# adapters/telemetry/otel.py imports the SDK lazily and swallows its absence; no image
# installs it and the test harness always had it, so it was declared nowhere (#582).
otel = ["opentelemetry-api>=1.22.0", "opentelemetry-sdk>=1.22.0"]
# Adapter-specific deps. Previously undeclared and pulled in only transitively
# (via Prefect in the Docker images), so minimal/CI envs failed to import the
# adapters and unit collection aborted. See issues #206 / #191.
auth = ["python-jose[cryptography]>=3.3"] # adapters/auth/keycloak (JWT validation)

[tool.setuptools.package-data]
# The package ships its prompt assets, request profiles and manifest schemas as data
# next to the code that reads them through importlib.resources. Without this a wheel
# (any non-editable install) carries the .py files alone and `load_profile()` finds no
# profiles — the images sidestep it with `pip install -e .`, a bare install does not.
squadops = ["**/*.yaml", "**/*.md", "**/*.json"]

#######################################
# Ruff - Linting & basic code hygiene #
#######################################

[tool.ruff]
target-version = "py311"
line-length = 100

extend-exclude = [
    "dist",
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "sips",
    "docs",
    "htmlcov",
    "scripts/dev/migrations",
    # Reference fills are checked-in sample *application* code (skeleton + fill), not
    # squad-ops source: their `backend` package is first-party to the generated app, so
    # squad-ops's isort/lint config does not apply. The contract gate materializes and
    # runs them; that is their gate, not ruff (SIP-0098 phase 98.2).
    "tests/fixtures/reference_fills",
]

[tool.ruff.lint]
# Rule sets: E,F = pycodestyle errors + pyflakes, I = import sorting, B = bugbear, UP = pyupgrade
select = ["E", "F", "I", "B", "UP", "C90"]

ignore = [
    "E501",  # line length (handled by Black)
    "B008",  # function call in argument defaults
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "B",
]
# SIP-0092 M1 follow-up: ruff is wired into regression as a fail-stop. The
# functions in the files listed below were already over the C901=12 budget
# when the gate landed; they are tracked as follow-up cleanup (the
# cycle_tasks.py handle() decomposition is deferred to its own PR) rather
# than blocking the gate. Newly added code in any file (including these)
# is still gated.
"adapters/cycles/dispatched_flow_executor.py" = ["C901"]
# (#152 split: the exempted handle() functions moved from cycle_tasks.py
# into the cycle/ package; exemption follows them, decomposition still deferred)
"src/squadops/capabilities/handlers/cycle/develop.py" = ["C901"]
"src/squadops/capabilities/handlers/cycle/qa_test.py" = ["C901"]
"scripts/dev/lint_realm_exports.py" = ["C901"]
"scripts/maintainer/audit_sip_registry.py" = ["C901"]
"scripts/maintainer/cleanup_sip_registry.py" = ["C901"]
"scripts/maintainer/update_sip_status.py" = ["C901"]
"src/squadops/cycles/acceptance_checks.py" = ["C901"]
"src/squadops/cycles/implementation_plan.py" = ["C901"]
"tests/integration/test_agent_model_validation.py" = ["C901"]
"tests/unit/config/test_secrets_enforcement.py" = ["C901"]

##########################
# Black - Code formatter #
##########################

[tool.black]
line-length = 100
target-version = ["py311"]
skip-string-normalization = false

##########################
# Pytest - Test running  #
##########################

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "src"]
addopts = "-v --tb=short --strict-markers --disable-warnings --color=yes --durations=10"

markers = [
    # Test type markers
    "unit: Unit tests for individual components",
    "integration: Integration tests for component interactions",
    "regression: Regression tests for critical workflows",
    "performance: Performance and load tests",
    "slow: Slow running tests",
    "smoke: Smoke tests for quick validation",
    "stack_validation: Full stack validation tests (requires running containers)",
    # Infrastructure markers
    "database: Tests that require database",
    "rabbitmq: Tests that require RabbitMQ",
    "redis: Tests that require Redis",
    "docker: Tests that require Docker",
    # Domain markers (SIP-0.8.9)
    "domain_agents: Agent domain tests",
    "domain_capabilities: Capability domain tests",
    "domain_skills: Skill domain tests",
    "domain_api: API domain tests",
    "domain_memory: Memory domain tests",
    "domain_config: Config domain tests",
    "domain_build: Build/packaging domain tests",
    "domain_governance: Governance domain tests",
    "domain_orchestration: Orchestration domain tests",
    "domain_adapters: Adapter domain tests",
    "domain_telemetry: Telemetry domain tests",
    # LangFuse (SIP-0061)
    "langfuse: Tests that require a running LangFuse instance",
    # Auth (SIP-0062/0063)
    "auth: Tests that exercise authentication/authorization logic",
    # CLI + Contracts (SIP-0065)
    "domain_cli: CLI domain tests",
    "domain_contracts: Contract domain tests",
    # Pulse Checks (SIP-0070)
    "domain_pulse_checks: Pulse check verification domain tests",
    # Cycle Event System (SIP-0077)
    "domain_events: Cycle lifecycle event system tests",
    # Runtime Modes (SIP-0089)
    "domain_runtime: Agent runtime state, modes, and coordinator tests",
    "domain_cycles: Cycle/run/gate execution domain tests",
]

###########################
# Coverage.py - Code cov  #
###########################

[tool.coverage.run]
branch = true
source = [
  "src/squadops",
  "adapters",
  "scripts",
]
omit = [
  "tests/*",
  "dist/*",
  "**/__init__.py",
  "scripts/dev/migrations/*",
  "htmlcov/*",
  "sips/*",
  "docs/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0

###########################
# Mypy - Optional typing  #
###########################

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

# Optional: Add per-module overrides for stricter type checking
# [[tool.mypy.overrides]]
# module = "agents.*"
# disallow_untyped_defs = true