        {"implementation_artifacts": ["backend/routes.py"]})],
    refuted_source_claims({"analysis_summary": "backend/routes.py is the cause."},
        {"implementation_artifacts": ["backend/routes.py"]}),
    default_reasoning_level("qa.test", output_shape="fill"), default_reasoning_level("qa.test"),
    assertion_literal_kinds_js("expect(typeof b.participant_count).toBe('number')\nexpect(b.n).toBe('x')\n"))
