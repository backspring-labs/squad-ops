    from squadops.cycles.fill_slot_integrity import restore_declared_status_codes;
    from squadops.cycles.acceptance_checks import assertion_literal_kinds_js;
    from pathlib import Path;
    from squadops.capabilities.scaffold import InterfaceManifest, expand, root_persisted_entities;
    from adapters.cycles.dispatched_flow_executor import _repaired_suite_files;
    from squadops.cycles.patch_verification import PatchCheckRecord, skip_reasons;
    from squadops.cycles.acceptance_check_spec import CHECK_SPECS, derived_check_names;
    from adapters.cycles.dispatched_flow_executor import _ASSEMBLY_NOTES_READERS;
    from squadops.cycles.check_registry import framework_rows_owed;
    from squadops.cycles.emission_integrity import no_fenced_blocks_failure;
    from squadops.cycles.correction_policy import resolve_correction_path;
    from squadops.cycles.failure_evidence import decision_disputes_own_artifact, own_artifact_signal, prior_emission_history;
    from adapters.cycles.correction_runner import refuted_source_claims;
    from squadops.capabilities.reasoning_policy import default_reasoning_level;
    from adapters.cycles.prefect_workflow_tracker import prefect_flow_state;
    from squadops.cycles.models import RunStatus;
    from squadops.cycles.scaffold_integrity_evidence import STAGE_FAILED_EMISSION;
    from squadops.tasks.task_types import TaskType, authors_qa_suite;
    import importlib;
    cfg = {"build_profile": "fullstack_fastapi_react", "development_profile": "fullstack_fastapi_react"};
    seed = "from fastapi import APIRouter\nrouter = APIRouter()\n@router.post(\"/runs\", status_code=201)\ndef c(p: dict):\n    return {}\n";
    emitted = seed.replace("APIRouter()", "APIRouter(prefix=\"/runs\")").replace("(\"/runs\", status_code=201)", "(\"\", status_code=201)");
    rehomed = restore_declared_status_codes(seed, emitted)[0];
    m = InterfaceManifest.from_yaml(Path("examples/03_group_run/interface_manifest.yaml").read_text());
    store = next(f["content"] for f in expand(m) if f["name"] == "backend/store.py");
    print(_repaired_suite_files([{"name": "backend/tests/test_runs.py", "type": "code"}], cfg),
    _repaired_suite_files([{"name": "backend/app/main.py", "type": "code"}], cfg),
