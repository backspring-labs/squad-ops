  # #1318: the spine row the accepted-patch path re-derives, and its paired control —
  # supplied passes, withheld fails. A row that can only pass is not evidence. The row now
  # carries `required` too (H1 reads every required file, not the handoff's). #1312: the
  # profile no longer requires the handoff, the notes are optional, and the exclusion list
  # is DERIVED — a stack that declares nothing renders nothing, which is the control.
  bob: >-
    from squadops.cycles.check_registry import required_files_row;
    from squadops.capabilities.handlers.build_profiles import get_profile;
    from squadops.capabilities.assembly_notes import ASSEMBLY_NOTES_DOCUMENT, already_supplied_lines;
    req = ["Dockerfile"];
    p = get_profile("fullstack_fastapi_react");
    print(required_files_row(req, ["a/Dockerfile", "b/README.md"])["passed"],
    required_files_row(req, ["b/README.md"])["missing"],
    required_files_row(req, ["a/Dockerfile"])["required"],
    "qa_handoff.md" in p.required_files, ASSEMBLY_NOTES_DOCUMENT in p.optional_files,
    len(already_supplied_lines("fullstack_fastapi_react")), already_supplied_lines("python_cli_builder"))
  # #1269: a repaired suite file is recognised through the stack's test-file patterns; an
  # app file in the same patch is not. Empty second list = the retest gate is keyed on the
  # patch's contents. #1273's skip reasons read by reason, not by count.
  # Plus the list's own live calls: #377 the Prefect state is the adapter's translation
  # (QUEUED → SCHEDULED, the pair .upper() got wrong); #1323 enforcement at the failed-
  # emission stage (control: the default stage); #559 the task type is the member and its
  # wire string; #922 the retired spelling is not importable. #1087: the reference's frozen
  # store exports the roots only (run_event_store) and names the embedded shape — the
  # control is that the phantom participant_store is absent. It runs HERE because the
  # runtime-api seeds the skeleton and ships examples/; the builder image does neither
  # (deploy B's first identity read an ERROR from bob for exactly that).
  # #1351: the router restore re-homes the paths it strips a prefix from (control: no empty
  # path is left). #1359: a typeof assertion is read by its literal's VALUE — number — and a
  # plain quoted literal is still a string.
  #
  # THE PACK'S OWN SURFACES, each with its paired control, so deploy C's identity proves
  # the 1.7.4 rows are LOADED rather than merely merged: #1374 what a builder owes vs what
  # a dev task owes; #1372 the emission shape on the marker; #994 a rewind with and without
