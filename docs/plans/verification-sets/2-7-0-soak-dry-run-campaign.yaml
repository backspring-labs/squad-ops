# The 2.7 soak's dry run (#2892), pre-registration §3 step 3: the soak's definition with the dry-run
# scripts, which replay no latency, so it runs in minutes. Its launch order, rows and acceptances
# must be the recording's before the soak launches.
project_id: prj-shelfnote
objective:
  statement: "the 2.7 soak: Shelfnote's goal set worked in its order, one backlog item per increment, every call answered from the recording's scripts"
  allowed_scope: ["backend/**", "tests/**"]
  measurement: "at least eight increments ended, any verdict, and at least nine hours, each increment judged on the product's own pytest runner; the launch order, kinds and acceptances are the recording's (pre-registration §7)"
  target_accepted_increments: 6
  work_class:
    prd_tier: tier-1
    attendance: unattended
  goals:
    goal_set: prj-shelfnote
    revision: 3
  stop_when: backlog_done
policy:
  max_cycles: 17
  max_elapsed_s: 54000
  budget_tokens: 14000000
  max_repair_cycles_per_increment: 1
  max_retry_cycles_per_increment: 1
  max_proposal_run_retries: 1
  max_proposal_revisions: 2
  max_rejected_proposals_in_row: 4
  max_unaccepted_increments: 10
  ruling_bound_s: 7200
  lease_expiry_s: 3600
  launch_blocked_interval_s: 300
  launch_blocked_attempts: 6
  calibration_profile: campaign-increment-source
  proposal_profile: campaign-increment-source
  squad_profile: machinery
  plan_gate: tier
  stack: null
  unattended_resume: []
