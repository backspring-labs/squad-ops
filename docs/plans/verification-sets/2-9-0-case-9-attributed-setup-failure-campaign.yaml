# The 2.9 certification window's CASE 9 (pre-registration §7; #3200, SIP-0117 R5.32): an attributable setup
# failure, repaired in the run. NON-COUNTING by construction: its proposal profile declares the fault
# luau_client_throws_at_start, as the 2.8.1 row-8 diagnostic's does, and leaves in-run correction ON (#3284,
# PR #3285). The first candidate's play reads setup_failed, the six conditions hold with the script error named in
# a file the candidate changed, ONE correction is dispatched, and the repaired candidate passes the same frozen
# scenario. It is `2-8-1-row8-diagnostic-campaign.yaml` with its proposal profile changed and nothing else: the
# same objective, the same limits. Run only on a deploy whose verify_loaded reads the 3284 and 3200 rows, with a
# worker that carries R5.32's Studio half.
project_id: prj-z-tower-ascension
objective:
  statement: 'While the player stands in the lobby, the HUD shows the line "The tower is waiting" at the top of the screen.'
  measurement: "one increment: the first candidate's plays read setup_failed where the baseline's setup was met, the Campaign routes §10 row 8, and its repair cycle's candidate passes the same frozen scenarios by digest and is accepted (pre-registration amendment 12h)"
  allowed_scope:
    - "src/**"
    - "tests/**/*.spec.luau"
  target_accepted_increments: 1
  requirements: "repo:file:docs/GAME_CONTEXT.md@current"
  work_class:
    prd_tier: core
    attendance: attended
policy:
  max_cycles: 4
  # 12h: well past the increment and its repair, so the elapsed-time guard cannot pause the Campaign before
  # the repair launches, as it paused both rehearsals that reached row 8.
  max_elapsed_s: 14400
  budget_tokens: 6000000
  max_repair_cycles_per_increment: 1
  max_retry_cycles_per_increment: 1
  max_proposal_run_retries: 1
  max_proposal_revisions: 2
  max_rejected_proposals_in_row: 2
  max_unaccepted_increments: 1
  ruling_bound_s: 1800
  lease_expiry_s: 3600
  launch_blocked_interval_s: 300
  launch_blocked_attempts: 3
  calibration_profile: campaign-increment-source
  proposal_profile: campaign-increment-source-client-stops-corrected
  squad_profile: game-dev-roblox
  plan_gate: tier
  development_profile: game_dev_roblox
