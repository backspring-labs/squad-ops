# 1.7.5 DIAGNOSTIC — an own-frame suite failure, then a repair that emits only prose
#
# Not a roll and not a shakeout: a non-counting cycle that runs the roll's own path with a
# deliberate fault injected at the producing agent's emission seam (#1251), so the whole
# downstream path — typed checks, ownership attribution, routing, repair, verification,
# retest, refund — runs as it would on a real defect. The driver REFUSES to count a cycle
# whose config declares a fault, and names the fault beside every readout it produces.
#
# WHY THIS SET'S DIAGNOSTICS MATTER MORE THAN 1.7.4's. The recovery extraction (#1152)
# moved every block these traverse. The goldens and the unit suites prove the moved code
# in isolation; only these prove it on the deploy, in the order a real failure takes. The
# plan is explicit that zero attributable findings is acceptable ONLY if every registered
# diagnostic reaches its seam — the reachability count is the evidence, not the verdict.
#
# Exercises: L7 (the locus routes to qa.test_repair), L4 (#1276 — a prose-only repair is refunded, not verified), L5 (the re-take is briefed with its cases)
# Asserts (map §3.4): protocol blocks 4-5, now `CorrectionRepair.dispatch` and `.judge_emission`, plus outcome block 4, now `_route_correction_path`
# Shape's provenance: 1.7.1 roll 4's own-frame import edit; #1053/#1273's zero-byte and prose-only emissions

name: 1-7-5-diagnostic-own-frame-then-prose-repair
records_dir: var/verification_sets/1-7-5-diagnostics/own-frame-then-prose-repair
pre_registration: docs/plans/1-7-5-verification-set-preregistration.md
project: group_run
squad_profile: full-38
request_profile: validated-fullstack
overrides:
  fault_injection: [qa_suite_own_frame_failure, repair_prose_only]
gate_name: progress_plan_review
n_rolls: 1
gate_notes: >-
  1.7.5 verification set. Approved under the pre-registered gate policy
  (pre-registration §7) — identical text applied to every roll of this set.
  System plan validation passed; no additional judgment applied.
launch_notes: >-
  UNUSED — a diagnostic is never counted; the driver refuses a counting roll that declares
  a fault.
shakeout_notes: >-
  1.7.5 DIAGNOSTIC — an own-frame suite failure, then a repair that emits only prose. NON-
  COUNTING by declaration before launch: two chained faults (#1251) drive the locus classifier
  to qa.test_repair (L7), then make that repair emit prose and no file, which must be REFUNDED
  rather than verified (L4, #1053/#1273) and the re-take briefed with its failing cases (L5,
  #1260). This is the widest of the five across the extraction: it crosses the repair
  collaborator, the emission judgment and the outcome router's refund in one run. Its red is
  manufactured.
loaded_checks:
  runtime-api: |-
    # #1152 step 5: the repair half is its own collaborator now, and the emission
    # judgment with it. Both are asserted by name — a diagnostic that reached the old
    # seam and not the new one would read identically in the record.
    from adapters.cycles.correction_repair import CorrectionRepair, RepairOutcome, _empty_emission_signature, _locus_and_repair_target
    from adapters.cycles.dispatched_flow_executor import DispatchedFlowExecutor, refund_empty_emission_attempt
    import dataclasses
    ex = DispatchedFlowExecutor()
    # The refund is bounded and SEPARATE from the correction pool — a producer that emits
    # nothing every time must still terminate. Control: the allowance, once spent, bills
    # the round like any other.
    c = {"n": 2, "empty_refunds": 0}
    first = refund_empty_emission_attempt(c, 2, 1)
    spent = {"n": 2, "empty_refunds": 2}
    after = refund_empty_emission_attempt(spent, 2, 1)
    print("L4", first, c, after)
    print("1152-repair", type(ex._correction_repair).__name__,
          ex._correction_runner._correction_repair is ex._correction_repair,
          hasattr(CorrectionRepair, "dispatch"), hasattr(CorrectionRepair, "judge_emission"),
          sorted(f.name for f in dataclasses.fields(RepairOutcome)))
    # steps_ran is a FIELD, not bool(artifacts): a rewind emits nothing legitimately and
    # must never be refunded. That distinction is what L4 turns on.
    print("L4-distinction", "steps_ran" in {f.name for f in dataclasses.fields(RepairOutcome)})
  eve: |-
    from squadops.capabilities.handlers.fault_injection import FAULTS, INJECTED_TASKS
    print("faults", sorted(FAULTS), sorted(INJECTED_TASKS))
    print("chain", [n for n in ("qa_suite_own_frame_failure", "repair_prose_only") if n in FAULTS])
  neo: |-
    from squadops.cycles.task_plan import repair_steps_for
    from squadops.cycles.failure_evidence import FailureLocus
    # L7 (#568): an OWN_ARTIFACT locus routes a qa failure to the qa role re-authoring its
    # own suite; a SUBJECT locus routes it to the dev repair, because then the suite ran
    # and the app failed it. The control is that the two DIFFER — without it the row
    # cannot tell a landed classifier from one that always said the same thing.
    own = repair_steps_for("qa.test", FailureLocus.OWN_ARTIFACT)
    subj = repair_steps_for("qa.test", FailureLocus.SUBJECT)
    print("L7", list(own), list(subj), list(own) != list(subj))
# A diagnostic asserts no pins: it is run on the deploy the shakeout loop settled on, and
# its record states the identity it observed (#1296).
expected_config_hash_prefix: ""
expected_squad_snapshot_prefix: ""
