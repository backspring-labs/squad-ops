# 1.7.5 DIAGNOSTIC — a suite addressed under a literal path/ prefix
#
# Not a roll and not a shakeout: a non-counting cycle that runs the roll's own path with a
# deliberate fault injected at the producing agent's emission seam (#1251), so the whole
# downstream path — typed checks, ownership attribution, routing, repair, verification,
# retest, refund — runs as it would on a real defect. The driver REFUSES to count a cycle
# whose config declares a fault, and names the fault beside every readout it produces.
#
# WHY THIS SET'S DIAGNOSTICS MATTER MORE THAN 1.7.4's. The recovery extraction (#1152)
# moved every block these traverse. The goldens and the unit suites prove the moved code
# in isolation; only these prove it on the deploy, in the order a real failure takes. The
# plan is explicit that zero attributable findings is acceptable ONLY if every registered
# diagnostic reaches its seam — the reachability count is the evidence, not the verdict.
#
# Exercises: L8b (#1311) — no emission lands under a literal `path/` prefix; L8a is the strip count read on every roll
# Asserts (map §3.4): outcome block 1's hand-off to `_admit_failed_emission`, now `_carry_facts_to_the_next_attempt`
# Shape's provenance: #1311, the extractor's placeholder-path strip

name: 1-7-5-diagnostic-path-prefix
records_dir: var/verification_sets/1-7-5-diagnostics/path-prefix
pre_registration: docs/plans/1-7-5-verification-set-preregistration.md
project: group_run
squad_profile: full-38
request_profile: validated-fullstack
overrides:
  fault_injection: [qa_suite_at_path_prefix]
gate_name: progress_plan_review
n_rolls: 1
gate_notes: >-
  1.7.5 verification set. Approved under the pre-registered gate policy
  (pre-registration §7) — identical text applied to every roll of this set.
  System plan validation passed; no additional judgment applied.
launch_notes: >-
  UNUSED — a diagnostic is never counted; the driver refuses a counting roll that declares
  a fault.
shakeout_notes: >-
  1.7.5 DIAGNOSTIC — a suite addressed under a literal path/ prefix. NON-COUNTING by declaration
  before launch: the fault (#1251) addresses the qa emission's fence under a literal `path/`
  segment, so the extractor's strip (L8a) and the rule that no emission lands under that prefix
  (L8b, #1311) both run on a real emission rather than on a fixture. Its red is manufactured.
loaded_checks:
  runtime-api: |-
    from adapters.cycles.dispatched_flow_executor import DispatchedFlowExecutor
    from squadops.capabilities.handlers.fenced_parser import extract_fenced_files
    import inspect
    # L8a: the strip, entered at the real extractor. It is PRESENCE-KEYED on
    # `expected_artifacts` (#1272) — it fires only when the prefix cannot be what the task
    # asked for — so the probe must hand it the expectation or it reads a no-op as a
    # failure. Three cases, because each is a different correct answer:
    #   stripped   the task expects the bare path and the emission carried `path/`
    #   kept       nothing was expected, so nothing says the prefix is wrong
    #   kept       the task genuinely expects a file under `path/`
    emission = "```jsx:path/frontend/src/a.test.jsx\nx\n```\n"
    stripped = extract_fenced_files(emission, expected_artifacts=["frontend/src/a.test.jsx"])
    unasked = extract_fenced_files(emission)
    genuine = extract_fenced_files(emission, expected_artifacts=["path/frontend/src/a.test.jsx"])
    print("L8a", [f["filename"] for f in stripped], [f["filename"] for f in unasked],
          [f["filename"] for f in genuine])
    # #1152 step 3: the admission hand-off lives in the outcome router's first block now.
    src = inspect.getsource(DispatchedFlowExecutor._carry_facts_to_the_next_attempt)
    print("1152-outcome", hasattr(DispatchedFlowExecutor, "_carry_facts_to_the_next_attempt"),
          "prior_attempts" in src, "emission_retry_feedback" in src)
  eve: |-
    from squadops.capabilities.handlers.fault_injection import FAULTS, INJECTED_TASKS
    print("faults", sorted(FAULTS), sorted(INJECTED_TASKS))
# A diagnostic asserts no pins: it is run on the deploy the shakeout loop settled on, and
# its record states the identity it observed (#1296).
expected_config_hash_prefix: ""
expected_squad_snapshot_prefix: ""
frozen_deploy_commit: ""
frozen_image_ids: {}
