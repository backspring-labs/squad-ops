# 1.7.2 verification set — Next.js+TS (nextjs_ts), 3 counting rolls (plan §4, up from 1.7.1's
# 2: both 1.7.1 Next.js rolls went through the contentless-emission path, so this arm reads L1
# directly and L2/L4 fire here first). Predictions L1–L8 with Q0/Q3/Q5/P0 and R6/R7 carried.
# Same project, squad and request profile as 1.6.6, 1.7.0 and 1.7.1 — the pack is the only
# variable. Pins are filled at pre-registration from the last shakeout on the frozen deploy
# and asserted on every counting roll; empty means no counting roll may launch.
#
# L1 is the line's one bar (plan §4): a falsified L1 blocks the cut, because #1268 is the
# condition every other prediction is measured through.
name: 1-7-2-nextjs
pre_registration: docs/plans/1-7-2-verification-set-preregistration.md
project: group_run
squad_profile: full-38
request_profile: validated-fullstack
overrides:
  build_profile: nextjs_ts
  dev_capability: nextjs_ts
gate_name: progress_plan_review
n_rolls: 3
# Copied verbatim onto every gate approval — the driver substitutes NOTHING in this text.
gate_notes: >-
  1.7.2 verification set. Approved under the pre-registered gate policy
  (pre-registration §6) — identical text applied to every roll of this set.
  System plan validation passed; no additional judgment applied.
# {roll} and {n} are the only substitutions the driver makes.
launch_notes: >-
  1.7.2 Next.js+TS (nextjs_ts) verification set — COUNTED roll {roll} of {n}. Frozen deploy
  per the pre-registration; predictions L1–L8 with Q0/Q3/Q5/P0 and R6/R7 carried; scoring per
  1.6.3 §5; validity per §5.1; a falsified prediction stops the set.
shakeout_notes: >-
  1.7.2 Next.js+TS (nextjs_ts) SHAKEOUT — NON-COUNTING by declaration before launch. Cycle on
  the deploy built from the merged 1.7.2 pack (#1268 #1270 #1271 #1269 #1273 #1260 #788 #1272
  on the #1276/#1251 instrument, plus #1292). Diagnostic only, not a measurement; the last
  shakeout's identity becomes the set's pins.
# "Loaded, not built": run inside the container and recorded with the deploy identity. Each
# is a live CALL with its paired control, not a symbol import — a symbol can be present and
# unreachable, which is the shape #1289 had for the whole of 1.7.1.
loaded_checks:
  # #1269 read on THIS stack's declared test-file patterns (*.test.ts[x], *.spec.ts[x]): a
  # repaired suite is recognised, an API route in the same patch is not. #1273's skip
  # reasons read by reason, not by count.
  runtime-api: >-
    from adapters.cycles.dispatched_flow_executor import _repaired_suite_files;
    from squadops.cycles.patch_verification import PatchCheckRecord, skip_reasons;
    cfg = {"build_profile": "nextjs_ts", "dev_capability": "nextjs_ts"};
    print(_repaired_suite_files([{"name": "__tests__/runs.test.tsx", "type": "code"}], cfg),
    _repaired_suite_files([{"name": "app/api/runs/route.ts", "type": "code"}], cfg),
    skip_reasons([PatchCheckRecord(check="acceptance:x", severity="blocking",
    status="skipped", reason="file_not_found")]))
  # #1292: the qa namespace is the co-located convention and nothing else — the root
  # harness and a co-located suite are qa's, an API route is not. Before the fix the third
  # value was True and the namespace was ("__tests__/", "app/", "lib/"). #1251: the faults.
  eve: >-
    from types import SimpleNamespace;
    from squadops.capabilities.scaffold import qa_test_namespace, is_qa_test_path_for_stack;
    from squadops.capabilities.handlers.fault_injection import FAULTS;
    print(qa_test_namespace(SimpleNamespace(stack="nextjs_ts")),
    is_qa_test_path_for_stack("__tests__/harness.test.ts", "nextjs_ts"),
    is_qa_test_path_for_stack("app/runs/__tests__/page.test.tsx", "nextjs_ts"),
    is_qa_test_path_for_stack("app/api/runs/route.ts", "nextjs_ts"), sorted(FAULTS))
  # #1289 and #788: the three blocks reach the renderer. Echoing the sentinels back is the
  # only evidence that distinguishes this build from every build before it, where the
  # variables were computed and dropped.
  neo: >-
    from squadops.capabilities.handlers.impl.repair_handlers import
    DevelopmentCorrectionRepairHandler;
    v = DevelopmentCorrectionRepairHandler()._build_render_variables("prd", None,
    {"failing_cases_section": "CASES", "client_surface_section": "SURFACE",
    "app_traceback_section": "TB"});
    print(v["failing_cases_section"], v["client_surface_section"], v["app_traceback_section"])
