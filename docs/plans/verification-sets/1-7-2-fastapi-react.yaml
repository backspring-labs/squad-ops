# 1.7.2 verification set — FastAPI+React (fullstack_fastapi_react), 6 counting rolls (plan §4).
# Predictions L1–L8 (the 1.7.2 pack: #1268 #1270 #1271 #1269 #1273 #1260 #788 #1272, on the
# #1276/#1251 instrument) with R1/R3/R5/R6/R7 and S0–S3/Q0/Q3/Q5/P0 carried from 1.7.1
# unchanged. Same project, squad and request profile as 1.6.6, 1.7.0 and 1.7.1 — the pack is
# the only variable. Pins are filled at pre-registration from the last shakeout on the frozen
# deploy and asserted on every counting roll; empty means no counting roll may launch.
#
# L1 is the line's one bar (plan §4): a falsified L1 blocks the cut, because #1268 is the
# condition every other prediction is measured through.
name: 1-7-2-fastapi-react
