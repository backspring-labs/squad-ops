shakeout_notes: >-
  1.8.2 DIAGNOSTIC — unattended-chain, cycle {roll} of {n}. NON-COUNTING by declaration before
  launch: four React cycles back to back with a cancel on cycle 2, a dev-agent crash on cycle 3
  and a develop-handler hang on cycle 4, each registered before launch. Its reds are manufactured
  and must never be read as the squad failing.
chain:
  cycles: 4
  # At least the declared per-task wait (1800 s): a ghost task after the cancel could run that long.
  quiet_timeout_seconds: 2400
  faults:
    - {cycle: 2, kind: cancel, task_type: development.develop}
    - {cycle: 3, kind: crash, task_type: development.develop, service: neo}
    - {cycle: 4, kind: hang, fault: handler_hang}
loaded_checks:
  runtime-api: |-
    from squadops.comms.run_cancellation import control_queue, run_cancelled_notice
    from adapters.cycles.task_dispatcher import TaskDispatcher
    import inspect
    # item 10: the cancel's notice goes on the agent's control queue; item 15: the wait is declared.
    print("chain-runtime", control_queue("neo"), run_cancelled_notice("c", ["r"])["action"],
          inspect.signature(TaskDispatcher.__init__).parameters["task_timeout"].default is inspect.Parameter.empty)
  neo: |-
    from squadops.agents.entrypoint import CancelledRuns, declared_task_bound
    from squadops.capabilities.handlers.fault_injection import FAULTS, HANG_SECONDS
    cr = CancelledRuns()
    cr.add(["r1"], 0.0)
    # The dev agent drops a told run's task (control: another run's), and the hang is a hold past any bound.
    print("chain-agent", cr.is_cancelled("r1"), cr.is_cancelled("r2"), FAULTS["handler_hang"].hold, HANG_SECONDS > 1800)
