# 1.8.2 DIAGNOSTIC — `unattended-chain` (1.8.2 plan §4.1; THE LINE'S CLAIM: a cycle is safe to leave
# running unattended)
#
# K = 4 React cycles back to back through the driver's `chain` command (§3.2 item 14), no human action
# between them except the registered gate policy. Three registered faults, one per cycle, as DATA:
#   cycle 2 — a CANCEL while its first implementation task (development.develop) is in flight;
#   cycle 3 — an agent CRASH: the dev agent's container killed mid-task (#1251's shape);
#   cycle 4 — an agent HANG: `handler_hang` holds the develop handler after its model returns, until
#             the declared per-task wait (item 15, 1800 s) ends it as a typed `task_timeout` fact.
# Between launches the driver asserts a quiet box by more than run state and leases: no dispatched
# task without a reply, no agent mid-task (item 10's signal), for up to `quiet_timeout_seconds`.
#
# PREDICTED, per cycle: a terminal state within its bound; ZERO ghost generations after the cancel (no
# LangFuse generation or agent emission carries cycle 2's id after its cancel is acknowledged — item
# 10, #1648); the crash recorded as a typed fact and the run leaving `running`; the hang ended at the
# declared timeout as a typed `task_timeout` fact and the run proceeding to correction or termination;
# a quiet box before each launch; the assessment read on every cycle; ZERO manual actions except the
# registered gate policy, which the record names.
# FALSIFIED BY: any ghost generation, any run left `running`, a hang past its bound, or a manual step.
# Readout: the chain record (`chain-state.json`, per-cycle `cycle-NN` records): terminal state and
# kind, `ghost_readings` (late replies read where they land, #1677), the quiet-box readings, the
# `handler_hang` seam readout (`loop_texture.task_timeouts`). N cell: none. One chain; a chain that
# fails its prediction stops the set and the plan is revised in the open.
