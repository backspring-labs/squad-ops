# The 2.8 demonstration's repair diagnostic (#3043), pre-registration §8. NON-COUNTING by construction: its
# proposal profile declares the fault luau_player_text_drops_a_word (#3170, PR #3171; SIP-0118 R5.6), which
# cuts the last word of the first player-facing text in the first development attempt's first client script.
# Run only on a deploy that carries the fault (verify_loaded row 3170-wrong-text-fault), after the counted
# run. The objective's text is static, has several words and is shown on the HUD in the lobby, so it is meant
# to live in a client script, and the play needs no saved value.
project_id: prj-z-tower-ascension
objective:
  statement: 'While the player stands in the lobby, the HUD shows the line "The tower is waiting" at the top of the screen.'
  measurement: "one increment: the first candidate's frozen scenario fails as an executed assertion, a development repair is routed, and the same scenario by digest passes (pre-registration §8)"
  allowed_scope:
    - "src/**"
    - "tests/**/*.spec.luau"
  target_accepted_increments: 1
  requirements: "repo:file:docs/GAME_CONTEXT.md@current"
  work_class:
    prd_tier: core
    attendance: attended
policy:
  max_cycles: 3
  max_elapsed_s: 3600
  budget_tokens: 6000000
  max_repair_cycles_per_increment: 1
  max_retry_cycles_per_increment: 1
  max_proposal_run_retries: 1
  max_proposal_revisions: 2
  max_rejected_proposals_in_row: 2
  max_unaccepted_increments: 1
  ruling_bound_s: 1800
  lease_expiry_s: 3600
  launch_blocked_interval_s: 300
  launch_blocked_attempts: 3
  calibration_profile: campaign-increment-source
  proposal_profile: campaign-increment-source-wrong-text
  squad_profile: game-dev-roblox
  plan_gate: tier
  development_profile: game_dev_roblox
