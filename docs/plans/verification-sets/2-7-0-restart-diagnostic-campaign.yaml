# The 2.7 restart diagnostic (#2892). The soak (cmp_056721e622e2) did not exercise §6.3: the driver read the launch
# row's target, not its binding, for the cycle id, and increment 4's proposal passed unrestarted. This replays the
# soak's launches 1-5 (the dry set's 1-3 and 5, which carry no latency, and the soak set's c04, whose proposal holds
# the hand-filled 108.6 s) and injects the restart at increment 4's proposal, as §6.3 registers it. A diagnostic,
# not the soak: its readings are §6.3's predictions, recorded beside the soak's record.
project_id: prj-shelfnote
objective:
  statement: "the 2.7 restart diagnostic: the soak's \xA76.3 controlled restart, injected\
    \ at increment 4's proposal as registered, on a replay of the soak's first five\
    \ launches"
  allowed_scope:
  - backend/**
  - tests/**
  measurement: 'increment 4''s proposal survives a restart of the runtime API and
    the agents: re-attached, answered once, its stale reply dropped, and increment
    4 ending as recorded'
  target_accepted_increments: 4
  work_class:
    prd_tier: tier-1
    attendance: unattended
  goals:
    goal_set: prj-shelfnote
    revision: 3
  stop_when: backlog_done
policy:
  max_cycles: 6
  max_elapsed_s: 54000
  budget_tokens: 14000000
  max_repair_cycles_per_increment: 1
  max_retry_cycles_per_increment: 1
  max_proposal_run_retries: 1
  max_proposal_revisions: 2
  max_rejected_proposals_in_row: 4
  max_unaccepted_increments: 10
  ruling_bound_s: 7200
  lease_expiry_s: 3600
  launch_blocked_interval_s: 300
  launch_blocked_attempts: 6
  calibration_profile: campaign-increment-source
  proposal_profile: campaign-increment-source
  squad_profile: machinery
  plan_gate: tier
  stack: null
  unattended_resume: []
  llm_scripts:
  - shelfnote-soak-dry-c01@a8e6062753af
  - shelfnote-soak-dry-c02@b12415e22cd4
  - shelfnote-soak-dry-c03@e09ae0c2095d
  - shelfnote-soak-c04@2d35a9154c75
  - shelfnote-soak-dry-c05@b1204429a807
