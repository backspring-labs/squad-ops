  (pre-registration §6) — identical text applied to every roll of this set.
  System plan validation passed; no additional judgment applied.
# {roll} and {n} are the only substitutions the driver makes.
launch_notes: >-
  1.7.3 FastAPI+React (fullstack_fastapi_react) verification set — COUNTED roll {roll} of {n}.
  Frozen deploy per the pre-registration; the 1.7.2 predictions L1–L8 re-registered verbatim
  with L8a/L8b and B1, R1/R3/R5/R6/R7 carried; scoring per 1.6.3 §5; validity per §5.1; a
  falsified prediction stops the set.
shakeout_notes: >-
  1.7.3 FastAPI+React (fullstack_fastapi_react) SHAKEOUT — NON-COUNTING by declaration before
  launch. Cycle on a deploy built from main carrying the Boundaries list (#922 #559 #377 #381
  #1241 #154 #218 #219 #305 #225 #999 #1087/#1112) on the repaired instrument (#1316 #1311
  #1330 #1310 #1323 #1347). Diagnostic only, not a measurement; the last shakeout's identity
  becomes the set's pins.
# "Loaded, not built": run inside the container and recorded with the deploy identity. Each
# is a live CALL with its paired control, not a symbol import — a symbol can be present and
# unreachable, which is the shape #1289 had for the whole of 1.7.1.
loaded_checks:
  # #1318: the spine row the accepted-patch path re-derives, and its paired control —
  # supplied passes, withheld fails. A row that can only pass is not evidence.
  bob: >-
    from squadops.cycles.check_registry import required_files_row;
    req = ["Dockerfile", "qa_handoff.md"];
    print(required_files_row(req, ["a/Dockerfile", "b/qa_handoff.md"])["passed"],
    required_files_row(req, ["a/Dockerfile"])["missing"])
  # #1269: a repaired suite file is recognised through the stack's test-file patterns; an
  # app file in the same patch is not. Empty second list = the retest gate is keyed on the
  # patch's contents. #1273's skip reasons read by reason, not by count.
  # Plus the list's own live calls: #377 the Prefect state is the adapter's translation
  # (QUEUED → SCHEDULED, the pair .upper() got wrong); #1323 enforcement at the failed-
  # emission stage (control: the default stage); #559 the task type is the member and its
  # wire string; #922 the retired spelling is not importable. #1087: the reference's frozen
  # store exports the roots only (run_event_store) and names the embedded shape — the
  # control is that the phantom participant_store is absent. It runs HERE because the
  # runtime-api seeds the skeleton and ships examples/; the builder image does neither
  # (deploy B's first identity read an ERROR from bob for exactly that).
  # #1351: the router restore re-homes the paths it strips a prefix from (control: no empty
  # path is left). #1359: a typeof assertion is read by its literal's VALUE — number — and a
  # plain quoted literal is still a string.
  runtime-api: >-
    from squadops.cycles.fill_slot_integrity import restore_declared_status_codes;
    from squadops.cycles.acceptance_checks import assertion_literal_kinds_js;
    from pathlib import Path;
    from squadops.capabilities.scaffold import InterfaceManifest, expand, root_persisted_entities;
    from adapters.cycles.dispatched_flow_executor import _repaired_suite_files;
    from squadops.cycles.patch_verification import PatchCheckRecord, skip_reasons;
    from adapters.cycles.prefect_workflow_tracker import prefect_flow_state;
    from squadops.cycles.models import RunStatus;
    from squadops.cycles.scaffold_integrity_evidence import STAGE_FAILED_EMISSION;
    from squadops.tasks.task_types import TaskType, authors_qa_suite;
    import importlib;
    cfg = {"build_profile": "fullstack_fastapi_react", "development_profile": "fullstack_fastapi_react"};
    seed = "from fastapi import APIRouter\nrouter = APIRouter()\n@router.post(\"/runs\", status_code=201)\ndef c(p: dict):\n    return {}\n";
    emitted = seed.replace("APIRouter()", "APIRouter(prefix=\"/runs\")").replace("(\"/runs\", status_code=201)", "(\"\", status_code=201)");
    rehomed = restore_declared_status_codes(seed, emitted)[0];
    m = InterfaceManifest.from_yaml(Path("examples/03_group_run/interface_manifest.yaml").read_text());
    store = next(f["content"] for f in expand(m) if f["name"] == "backend/store.py");
    print(_repaired_suite_files([{"name": "backend/tests/test_runs.py", "type": "code"}], cfg),
    _repaired_suite_files([{"name": "backend/app/main.py", "type": "code"}], cfg),
    skip_reasons([PatchCheckRecord(check="acceptance:x", severity="blocking",
    status="skipped", reason="file_not_found")]),
    PatchCheckRecord(check="sections_present", severity="error", status="passed",
    criterion_id="handoff-sections:qa_handoff.md").to_check_row()["criterion_id"],
    prefect_flow_state(RunStatus.QUEUED), prefect_flow_state(RunStatus.COMPLETED),
    STAGE_FAILED_EMISSION, TaskType.QA_TEST == "qa.test", authors_qa_suite("qa.test"),
    authors_qa_suite("development.develop"),
    importlib.util.find_spec("squadops.capabilities.dev_capabilities") is None,
    root_persisted_entities(m), "run_event_store" in store, "participant_store" in store,
    "@router.post(\"/runs\", status_code=201)" in rehomed, "(\"\"" not in rehomed,
    assertion_literal_kinds_js("expect(typeof b.participant_count).toBe('number')\nexpect(b.n).toBe('x')\n"))
  # #1270 on roll 4's own row (vitest `is not a function` at the suite's own frame) with
  # pytest as the paired control — 1 0 is the whole finding. #1280: the React qa namespace
  # names the directory the stack actually seeds. #1251: the four declared faults.
  eve: >-
    from types import SimpleNamespace;
    from squadops.capabilities.handlers.test_runner import suite_defects;
    from squadops.capabilities.scaffold import qa_test_namespace;
    from squadops.capabilities.handlers.fault_injection import FAULTS;
    rows = [{"file": "frontend/src/__tests__/runs.test.jsx", "title": "creates a run",
    "exception": "TypeError",
    "messages": ["TypeError: __vi_import_3__.default.click is not a function"],
    "frames": [{"file": "frontend/src/__tests__/runs.test.jsx", "line": 12}]}];
    print(len(suite_defects(rows, [], "vitest")), len(suite_defects(rows, [], "pytest")),
    qa_test_namespace(SimpleNamespace(stack="fullstack_fastapi_react")), sorted(FAULTS),
    {n: f.scope.value for n, f in sorted(FAULTS.items())})
  # #1289 and #788: the three blocks reach the renderer. Echoing the sentinels back is the
  # only evidence that distinguishes this build from every build before it, where the
  # variables were computed and dropped.
  neo: >-
    from squadops.capabilities.handlers.impl.repair_handlers import
    DevelopmentCorrectionRepairHandler;
    v = DevelopmentCorrectionRepairHandler()._build_render_variables("prd", None,
    {"failing_cases_section": "CASES", "client_surface_section": "SURFACE",
    "app_traceback_section": "TB"});
    print(v["failing_cases_section"], v["client_surface_section"], v["app_traceback_section"])
