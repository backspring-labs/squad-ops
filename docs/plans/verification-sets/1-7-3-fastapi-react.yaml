# The 1.7.2 set RE-REGISTERED VERBATIM — predictions L1–L8 with R1/R3/R5/R6/R7 and
# S0–S3/Q0/Q3/Q5/P0 carried — plus the two 1.7.3 changes: L8 read as two claims (L8a the
# extractor's placeholder strips, L8b stored names, #1311) and B1 (#1087/#1112: no stored qa
# suite declares a fixture table for an entity that is not root-persisted). No new pack: the
# thirteen Boundaries items are CI-verified refactors, so a red on this set is the refactor's
# (plan §4, one direction). Same project, squad and request profile as 1.6.6 → 1.7.2. Pins
# are filled at pre-registration from the last shakeout on the frozen deploy and asserted on
# every counting roll; empty means no counting roll may launch.
#
# L1 stays the line's one bar (plan §8).
