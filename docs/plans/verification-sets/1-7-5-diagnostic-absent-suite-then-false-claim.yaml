# 1.7.5 DIAGNOSTIC — an analyzer claim the workspace refutes, reaching the decision
#
# Not a roll and not a shakeout: a non-counting cycle that runs the roll's own path with a
# deliberate fault injected at the producing agent's emission seam (#1251), so the whole
# downstream path — typed checks, ownership attribution, routing, repair, verification,
# retest, refund — runs as it would on a real defect. The driver REFUSES to count a cycle
# whose config declares a fault, and names the fault beside every readout it produces.
#
# WHY THIS SET'S DIAGNOSTICS MATTER MORE THAN 1.7.4's. The recovery extraction (#1152)
# moved every block these traverse. The goldens and the unit suites prove the moved code
# in isolation; only these prove it on the deploy, in the order a real failure takes. The
# plan is explicit that zero attributable findings is acceptable ONLY if every registered
# diagnostic reaches its seam — the reachability count is the evidence, not the verdict.
#
# Exercises: A1 (#968, #1401) — the correction decision does not inherit an analyzer claim the workspace refutes
# Asserts (map §3.4): protocol blocks 1-2, now `CorrectionRunner._diagnose` and `._resolve_correction_path`
# Shape's provenance: #968's unchecked analyzer claims; #1401's `decision_inherited_claims` readout

name: 1-7-5-diagnostic-absent-suite-then-false-claim
records_dir: var/verification_sets/1-7-5-diagnostics/absent-suite-then-false-claim
pre_registration: docs/plans/1-7-5-verification-set-preregistration.md
project: group_run
squad_profile: full-38
request_profile: validated-fullstack
overrides:
  fault_injection: [qa_suite_absent, analyzer_false_source_claim]
gate_name: progress_plan_review
n_rolls: 1
gate_notes: >-
  1.7.5 verification set. Approved under the pre-registered gate policy
  (pre-registration §7) — identical text applied to every roll of this set.
  System plan validation passed; no additional judgment applied.
launch_notes: >-
  UNUSED — a diagnostic is never counted; the driver refuses a counting roll that declares
  a fault.
shakeout_notes: >-
  1.7.5 DIAGNOSTIC — an analyzer claim the workspace refutes, reaching the decision. NON-
  COUNTING by declaration before launch: the absent-suite fault forces a correction, and the
  chained analyzer fault (#1251) makes the analysis name a file the workspace does not contain.
  The decision must NOT inherit it (A1, #968), and the record must carry
  `decision_inherited_claims` beside `analyzer_claims_dropped` (#1401) — a count of zero is only
  evidence when the dropped count is non-zero beside it. #1152 step 4 split the diagnosis and
  the resolution into their own protocol steps; this run is what proves the claim still cannot
  cross between them. Its red is manufactured.
loaded_checks:
  runtime-api: |-
    # #1152 step 4: diagnosis and resolution are separate protocol steps, and the value
    # that crosses between them is explicit. A claim leaking into the decision would be a
    # step reaching backward into the one before it, which is exactly what the step
    # boundaries were built to make impossible.
    from adapters.cycles.correction_runner import CorrectionRunner, _Diagnosis, refuted_source_claims
    import dataclasses
    print("1152-protocol", hasattr(CorrectionRunner, "_diagnose"),
          hasattr(CorrectionRunner, "_resolve_correction_path"),
          sorted(f.name for f in dataclasses.fields(_Diagnosis)))
  data: |-
    from squadops.capabilities.handlers.impl import analyze_failure
    from squadops.capabilities.handlers.fault_injection import FAULTS, INJECTED_TASKS
    import inspect
    # The analyzer's emission seam must ask for the fault, or the chained claim never
    # happens and A1 reads green on a run that never tested it.
    src = inspect.getsource(analyze_failure.DataAnalyzeFailureHandler.handle)
    print("A1-hook", "apply_fault=True" in src)
    print("faults", sorted(FAULTS), sorted(INJECTED_TASKS))
  max: |-
    from squadops.capabilities.handlers.impl.correction_decision import GovernanceCorrectionDecisionHandler
    print("A1-decider", GovernanceCorrectionDecisionHandler()._task_type)
# A diagnostic asserts no pins: it is run on the deploy the shakeout loop settled on, and
# its record states the identity it observed (#1296).
expected_config_hash_prefix: ""
expected_squad_snapshot_prefix: ""
frozen_deploy_commit: ""
frozen_image_ids: {}
