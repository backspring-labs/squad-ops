# 1.7.5 DIAGNOSTIC — a builder emission that bills a budget and carries nothing
#
# Not a roll and not a shakeout: a non-counting cycle that runs the roll's own path with a
# deliberate fault injected at the producing agent's emission seam (#1251), so the whole
# downstream path — typed checks, ownership attribution, routing, repair, verification,
# retest, refund — runs as it would on a real defect. The driver REFUSES to count a cycle
# whose config declares a fault, and names the fault beside every readout it produces.
#
# WHY THIS SET'S DIAGNOSTICS MATTER MORE THAN 1.7.4's. The recovery extraction (#1152)
# moved every block these traverse. The goldens and the unit suites prove the moved code
# in isolation; only these prove it on the deploy, in the order a real failure takes. The
# plan is explicit that zero attributable findings is acceptable ONLY if every registered
# diagnostic reaches its seam — the reachability count is the evidence, not the verdict.
#
# Exercises: R1 (#1372) — the contentless attempt is retried WITH ITS FACT, not blind; F1 (#1374) — no false corrected result is composed from it
# Asserts (map §3.4): outcome block 1, now `_carry_facts_to_the_next_attempt`, and accept-patch block 6, now `PatchAcceptance._settle_patch_evidence` with `compose_owed_framework_rows`
# Shape's provenance: 1.7.3 roll 1 — a booting app that read `blocked_unverified` (#1364)

name: 1-7-5-diagnostic-contentless-builder
records_dir: var/verification_sets/1-7-5-diagnostics/contentless-builder
pre_registration: docs/plans/1-7-5-verification-set-preregistration.md
project: group_run
squad_profile: full-38
request_profile: validated-fullstack
overrides:
  fault_injection: [builder_emission_contentless]
gate_name: progress_plan_review
n_rolls: 1
gate_notes: >-
  1.7.5 verification set. Approved under the pre-registered gate policy
  (pre-registration §7) — identical text applied to every roll of this set.
  System plan validation passed; no additional judgment applied.
launch_notes: >-
  UNUSED — a diagnostic is never counted; the driver refuses a counting roll that declares
  a fault.
shakeout_notes: >-
  1.7.5 DIAGNOSTIC — a builder emission that bills a budget and carries nothing. NON-COUNTING by
  declaration before launch: the fault (#1251) empties the builder's emission so the retry-with-
  its-fact path (R1, #1372) and the re-derived framework rows (F1, #1374) both run. #1152 step 2
  moved the row composition to `check_registry.compose_owed_framework_rows`; this is the run
  that proves it on the deploy. Its red is manufactured.
loaded_checks:
  runtime-api: |-
    # #1152 step 2: the owed-row composition left the executor for check_registry, beside
    # the table that says who owes what. F1 is what this diagnostic asserts, so the row
    # is probed at its new home with both dispositions that matter.
    from squadops.cycles.check_registry import OWED_DERIVED, OWED_PRODUCED, compose_owed_framework_rows
    from adapters.cycles.patch_acceptance import PatchAcceptance
    from squadops.tasks.task_types import TaskType, emits_required_files
    # A CONTENTLESS attempt carries no rows at all — the #1364 shape. The row must still
    # be derived from the PATCHED set. Control: a stage that already produced it is not
    # re-derived, or the seam would overwrite real evidence with its own.
    derived = compose_owed_framework_rows(TaskType.BUILDER_ASSEMBLE, produced=set(),
        expected_artifacts=["docker/Dockerfile"], patched_names=["Dockerfile"])
    produced = compose_owed_framework_rows(TaskType.BUILDER_ASSEMBLE, produced={"required_files"},
        expected_artifacts=["docker/Dockerfile"], patched_names=[])
    print("F1", [(o.check_id, o.disposition, (o.row or {}).get("passed")) for o in derived],
          [(o.check_id, o.disposition) for o in produced],
          emits_required_files(TaskType.BUILDER_ASSEMBLE))
    print("1152-accept", hasattr(PatchAcceptance, "_settle_patch_evidence"))
  bob: |-
    from squadops.capabilities.handlers.cycle import builder
    from squadops.capabilities.handlers.cycle.base import _CycleTaskHandler
    import inspect
    # R1: the builder's emission seam asks for the fault, and the retry carries the
    # emission fact rather than re-rolling blind. After #929 the injector call is in
    # `_llm_call`; the builder's own wiring is the `apply_fault=True` argument.
    src = inspect.getsource(builder.BuilderAssembleHandler.handle)
    print("R1", "apply_fault=True" in src, "_apply_emission_retry_feedback" in src)
    print("929", "inject_fault(" in inspect.getsource(_CycleTaskHandler._llm_call))
# A diagnostic asserts no pins: it is run on the deploy the shakeout loop settled on, and
# its record states the identity it observed (#1296).
expected_config_hash_prefix: ""
expected_squad_snapshot_prefix: ""
frozen_deploy_commit: ""
frozen_image_ids: {}
