  only supply is a counted roll that happens to take a qa round. Its red is manufactured.
loaded_checks:
  runtime-api: |-
    # The cell counts a §9.3 region transaction (a fill) or an anchored edit on the task's own
    # free-authored suite. #1603 made the second reachable: before it, the #970 fill branch
    # aimed at the shells alone and a suite failing beside them was never a target — which is
    # how the one Next.js roll that produced a qa fill repair lost its retest. Both halves are
    # asserted by name, because a deploy without the second reads identically in the record
    # until the retest fails.
    from adapters.cycles.correction_repair import (
        CorrectionRepair,
        _fill_observations,
        _locus_and_repair_target,
        _own_files_named_by_failing_cases,
    )
    print("1603", callable(_own_files_named_by_failing_cases))
    # Control: a failing case in a file the task does not own is not a target.
    print("1603-own-only", _own_files_named_by_failing_cases(None, []))
    print("fill-branch", callable(_fill_observations), hasattr(CorrectionRepair, "dispatch"))
  eve: |-
    from squadops.capabilities.handlers.fault_injection import (
        FAULTS,
        INJECTED_TASKS,
        _qa_suite_own_frame_failure,
    )
    print("faults", sorted(FAULTS), sorted(INJECTED_TASKS))
    print("chain", [n for n in ("qa_suite_own_frame_failure", "repair_prose_only") if n in FAULTS])
    # The fault must BITE a TypeScript suite, not only a React one: on stack #2 there is no
    # RTL import to swap, and a fault that changes nothing is a diagnostic that proves nothing
    # while reading as launched.
    ts = 'import { describe, it, expect } from "vitest"\n\ndescribe("runs", () => {\n  it("lists", () => {\n    expect(1).toBe(1)\n  })\n})\n'
    print("bites-ts", _qa_suite_own_frame_failure(ts) != ts)
