# 1.8.1 DIAGNOSTIC — the own-frame chain on the App Router stack.
#
# WHY THIS EXISTS, and it is not a re-registration. The 1.8.0 pre-registration's §3c named two
# supplies for the qa × Next.js cell of SIP-0107 §39.8's N: the counted rolls, and "the same
# diagnostic in fill mode" — this one. **No such config was ever registered.** Only the dev-lane
# diagnostic had a Next.js variant, so the cell's whole supply was the counted rolls, the one
# Next.js roll that produced a qa fill repair lost its retest to #1602, and the cell read ZERO.
# N came to 5 of 6 with a required cell empty, and the line closed on the owner's ruling with
# the gap named (1.8.0 pre-registration §10c.4, §10c.5).
#
# So this is the missing supply, registered before deploy A's first diagnostic launch as
# §39.8 requires — a diagnostic registered after the first launch cannot count toward N.
#
# It is the 1.8.0 React config's fault chain on the other stack. The own-frame fault is
# runner-aware (#1304): on a TypeScript suite it injects `expect.__squadops_injected_fault__()`
# into the first test body rather than swapping an RTL import, so it bites whatever the planner
# scheduled. The repair that follows is the qa × Next.js transaction the cell counts — by FILL
# where the failing case is a scaffold shell (§3c rule 1, counted on the fill-merge evidence)
# or by anchored edit where it is the task's own free-authored suite, which #1603 made a repair
# target. Either path supplies the cell; the record says which it was.
#
# NON-COUNTING by declaration before launch: it declares faults, and the driver refuses to count
# a cycle that does.
