  1.8.2 DIAGNOSTIC — an own-frame suite failure on the App Router stack, then a repair that
  emits only prose. Exercises L7 (the locus routes to qa.test_repair), L4 (#1273 — a prose-only
  repair is refunded, not verified) and L5 (the re-take is briefed with its cases) on stack #2,
  where the 1.8.0 set exercised them only on stack #1. Its reason for existing is the supply
