    from squadops.capabilities.handlers.cycle import builder
    from squadops.capabilities.handlers.cycle.base import _CycleTaskHandler
    from squadops.capabilities.handlers.build_profiles import get_profile
    import inspect
    # R1: the builder's emission seam asks for the fault, and the retry carries the emission fact.
    src = inspect.getsource(builder.BuilderAssembleHandler.handle)
    print("R1", "apply_fault=True" in src, "_apply_emission_retry_feedback" in src)
    print("929", "inject_fault(" in inspect.getsource(_CycleTaskHandler._llm_call))
    # 598: what the builder is asked for on this deploy. Control: the legacy profile's Dockerfile.
    print("598", get_profile("fullstack_fastapi_react").required_files,
          "Dockerfile" in get_profile("python_cli_builder").required_files)
