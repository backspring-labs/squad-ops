    # Control: a stage that already produced the row is not re-derived.
    from squadops.cycles.check_registry import compose_owed_framework_rows
    from adapters.cycles.patch_acceptance import PatchAcceptance
    from squadops.capabilities.handlers.fault_injection import FAULTS
    from squadops.tasks.task_types import TaskType, emits_required_files
    derived = compose_owed_framework_rows(TaskType.BUILDER_ASSEMBLE, produced=set(),
        expected_artifacts=["assembly_notes.md"], patched_names=["assembly_notes.md"])
    produced = compose_owed_framework_rows(TaskType.BUILDER_ASSEMBLE, produced={"required_files"},
        expected_artifacts=["assembly_notes.md"], patched_names=[])
    print("F1", [(o.check_id, o.disposition, (o.row or {}).get("passed")) for o in derived],
          [(o.check_id, o.disposition) for o in produced], emits_required_files(TaskType.BUILDER_ASSEMBLE))
    print("1152-accept", hasattr(PatchAcceptance, "_settle_patch_evidence"))
    print("1506", FAULTS["builder_emission_contentless"].scope.value)
