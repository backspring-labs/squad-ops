# 1.7.3 verification set — Next.js+TS (nextjs_ts), 3 counting rolls (plan §4). The 1.7.2 set
# RE-REGISTERED VERBATIM — predictions L1–L8 with Q0/Q3/Q5/P0 and R6/R7 carried — plus L8 read
# as two claims (L8a/L8b, #1311) and B1 (#1087/#1112). No new pack; a red is the refactor's.
# Same project, squad and request profile as 1.6.6 → 1.7.2. The override key is
# `development_profile` since #922 (`dev_capability` is refused at cycle create). Pins are
# filled at pre-registration from the last shakeout on the frozen deploy; empty means no
# counting roll may launch.
#
# L1 stays the line's one bar (plan §8).
