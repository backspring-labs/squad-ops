# The 2.8 demonstration's rehearsal (#3043), pre-registration §6. UNCOUNTED. The counted Campaign's
# definition, policy for policy: z_tower's goal set revision 1, B-1 then B-2. It reads whether the machinery
# is clean (§6), not whether the squad's increments are accepted. Its outcome on each item is reported beside
# the counted run's as an earlier attempt at the same items; nothing it produces carries into the counted run
# (§6.2).
project_id: prj-z-tower-ascension
objective:
  statement: "Rehearsal: z_tower's goal set revision 1 in its order, B-1 the lobby hint then B-2 the session clock, each proved in a play session in Roblox Studio"
  measurement: "two accepted increments, B-1 then B-2, each with its frozen scenario executed and failing on the accepted baseline and passing on the candidate; B-2 with B-1's frozen scenario re-run and passing on its candidate"
  allowed_scope:
    - "src/**"
    - "tests/**/*.spec.luau"
  target_accepted_increments: 2
  work_class:
    prd_tier: core
    attendance: attended
  goals:
    goal_set: prj-z-tower-ascension
    revision: 1
  stop_when: backlog_done
policy:
  max_cycles: 6
  max_elapsed_s: 7200
  budget_tokens: 12000000
  max_repair_cycles_per_increment: 1
  max_retry_cycles_per_increment: 1
  max_proposal_run_retries: 1
  max_proposal_revisions: 2
  max_rejected_proposals_in_row: 2
  max_unaccepted_increments: 1
  ruling_bound_s: 1800
  lease_expiry_s: 3600
  launch_blocked_interval_s: 300
  launch_blocked_attempts: 3
  calibration_profile: campaign-increment-source
  proposal_profile: campaign-increment-source
  squad_profile: game-dev-roblox
  plan_gate: tier
  development_profile: game_dev_roblox
