# 1.8.2 DIAGNOSTIC — carried from 1.8.1's `absent-suite` unchanged in fault, invariant and loaded checks
# (1.8.2 plan §4.1: "the 1.8.1 nine, unchanged, plus four"). Re-run on deploy A because a
# re-run on the pinned deploy is what proves the seam is still reached here.
#
# ---- the 1.8.1 config's own header follows ----
# 1.8.1 DIAGNOSTIC — re-registered from 1.7.5's `absent-suite` for the 1.8.0 loop set on deploy E
# (pre-registration §3d, plan §7 step 9). The fault, the invariant and the loaded checks are the
# 1.7.5 config's: the recovery extraction's blocks they assert are unchanged on this deploy, and a
# re-run on the pinned deploy is what proves the seam is still reached here (README: a diagnostic
# is recorded with the entry point it used). What is NEW on this line is read from the same run
# as texture: the repair's `repair_revision_form` line (SIP-0107 §46k–§46p) — offered/form/modes/
# replaced — which is the row §3c's N is summed from where the cell applies.
#
# ---- the 1.7.5 config's own header follows ----
# 1.7.5 DIAGNOSTIC — the qa suite that was never emitted
#
# Not a roll and not a shakeout: a non-counting cycle that runs the roll's own path with a
# deliberate fault injected at the producing agent's emission seam (#1251), so the whole
# downstream path — typed checks, ownership attribution, routing, repair, verification,
# retest, refund — runs as it would on a real defect. The driver REFUSES to count a cycle
# whose config declares a fault, and names the fault beside every readout it produces.
#
# WHY THIS SET'S DIAGNOSTICS MATTER MORE THAN 1.7.4's. The recovery extraction (#1152)
# moved every block these traverse. The goldens and the unit suites prove the moved code
# in isolation; only these prove it on the deploy, in the order a real failure takes. The
# plan is explicit that zero attributable findings is acceptable ONLY if every registered
# diagnostic reaches its seam — the reachability count is the evidence, not the verdict.
#
# Exercises: L2 (#1269) — a repair that supplies the suite an emission failure lacked is retested
# Asserts (map §3.4): accept-patch block 5, now `PatchAcceptance._retest_patched_suite`, plus `reexecute_repaired_suite` (untouched by the map)
# Shape's provenance: #1268, 14 attempts across the 1.7.1 counted rolls

name: 1-8-2-diagnostic-absent-suite
records_dir: var/verification_sets/1-8-2-diagnostics/absent-suite
pre_registration: docs/plans/1-8-2-deploy-a-preregistration.md
project: group_run
squad_profile: full-38
request_profile: validated-fullstack
overrides:
  fault_injection: [qa_suite_absent]
gate_name: progress_plan_review
n_rolls: 1
gate_notes: >-
  1.8.2 verification set. Approved under the pre-registered gate policy
  (pre-registration §7) — identical text applied to every roll of this set.
  System plan validation passed; no additional judgment applied.
launch_notes: >-
  UNUSED — a diagnostic is never counted; the driver refuses a counting roll that declares
  a fault.
shakeout_notes: >-
  1.8.2 DIAGNOSTIC — the qa suite that was never emitted. NON-COUNTING by declaration before
  launch: this cycle injects a deliberate fault at the qa emission seam (#1251) to exercise L2
  (#1269) — a repair that supplies the suite an emission failure lacked is retested. Its red is
  manufactured and must never be read as the squad failing. It also carries the #1406 untouched-
  file proof: the forced qa repair's patch verification runs at the runtime-api, where npm is
  absent, so the readout must show the executed-and-passed view criteria surviving the
  environment skip.
loaded_checks:
  runtime-api: |-
    # #1152 step 2: `_repaired_suite_files` and `correction_is_deadlocked` moved to
    # `patch_acceptance` with the path they serve. The 1.7.4 config imported them from
    # the executor and would now fail here — which is the point of re-registering rather
    # than re-running last line's config.
    from adapters.cycles.patch_acceptance import PatchAcceptance, _repaired_suite_files, correction_is_deadlocked
    from squadops.cycles.patch_verification import PatchCheckRecord, skip_reasons
    from squadops.cycles.verification_integrity import CheckResult, _credit_contract_criteria
    import inspect
    cfg = {"build_profile": "fullstack_fastapi_react", "development_profile": "fullstack_fastapi_react"}
    # The retest trigger, with its control: a suite in the patch keys the retest, a source
    # file does not. A row that only ever answers one way proves nothing.
    suite = _repaired_suite_files([{"name": "backend/tests/test_runs.py", "type": "code"}], cfg)
    source = _repaired_suite_files([{"name": "backend/app/main.py", "type": "code"}], cfg)
    # The seam this diagnostic asserts, by name on the deployed class (map §4 step 2).
    block5 = hasattr(PatchAcceptance, "_retest_patched_suite")
    # #1406, the untouched-file rule this diagnostic proves deterministically: an
    # environment skip on ANOTHER subject does not withhold credit from the criterion an
    # executed-and-passed subject earned. Control: a real failure on the same shape does.
    env_skip = [CheckResult("c1", "passed", criterion_id="k", subject="backend/routes.py"),
                CheckResult("c2", "skipped", reason="missing_tooling", criterion_id="k", subject="frontend/src/views/X.jsx")]
    real_fail = [CheckResult("c1", "passed", criterion_id="k", subject="backend/routes.py"),
                 CheckResult("c2", "failed", criterion_id="k", subject="frontend/src/views/X.jsx")]
    _, a_skip, kept = _credit_contract_criteria(env_skip)
    _, a_fail, _ = _credit_contract_criteria(real_fail)
    print("L2", suite, source, block5)
    print("1406", sorted(kept), sorted(a_skip), sorted(a_fail))
    print("skips", skip_reasons([PatchCheckRecord(check="acceptance:x", severity="blocking", status="skipped", reason="file_not_found")]))
  eve: |-
    from squadops.capabilities.handlers.fault_injection import FAULTS, INJECTED_TASKS
    from squadops.capabilities.handlers.cycle.base import _CycleTaskHandler
    import inspect
    # The fault must be reachable from a seam that ASKS for it. After #929 the injector
    # call lives in `_llm_call`; the per-handler wiring is `apply_fault=True`, and a qa
    # emission with the flag lost would run clean while the diagnostic read green.
    src = inspect.getsource(_CycleTaskHandler._llm_call)
    print("faults", sorted(FAULTS), sorted(INJECTED_TASKS))
    print("929-fault-hook", "apply_fault" in src, "inject_fault(" in src)
  neo: |-
    from squadops.capabilities.handlers.impl.repair_handlers import DevelopmentCorrectionRepairHandler
    v = DevelopmentCorrectionRepairHandler()._build_render_variables("prd", None,
        {"failing_cases_section": "CASES", "client_surface_section": "SURFACE", "app_traceback_section": "TB"})
    print("repair-context", v["failing_cases_section"], v["client_surface_section"], v["app_traceback_section"])
# A diagnostic asserts no pins: it is run on the deploy the shakeout loop settled on, and
# its record states the identity it observed (#1296).
expected_config_hash_prefix: ""
expected_squad_snapshot_prefix: ""
frozen_deploy_commit: ""
frozen_image_ids: {}
