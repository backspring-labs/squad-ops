# The 2.9 certification window's CASE 1 (pre-registration §7): a normal Campaign, unattended. z_tower's goal set
# revision 1, B-1 then B-2, from the pinned baseline: the two increments the 2.8 demonstration built, since 2.9
# adds no capability. It is the 2.8 counted run's definition (`2-8-0-counted-campaign.yaml`) with ONE limit changed,
# said where it is. The same file is used for each rehearsal (§6) and for the window: a rehearsal's Campaign is
# uncounted by when it runs, not by its definition. Cases 2, 5, 6 and 8 are acted out on a Campaign of this
# definition (the front lost, the worker's service restarted, the worker stopped while it holds a lease, and
# an abort during a play).
project_id: prj-z-tower-ascension
objective:
  statement: "Certification: z_tower's goal set revision 1 in its order, B-1 the lobby hint then B-2 the session clock, each proved in a play session in Roblox Studio"
  measurement: "two accepted increments, B-1 then B-2, each with its frozen scenario executed and failing on the accepted baseline and passing on the candidate; B-2 with B-1's frozen scenario re-run and passing on its candidate"
  allowed_scope:
    - "src/**"
    - "tests/**/*.spec.luau"
  target_accepted_increments: 2
  work_class:
    prd_tier: core
    attendance: attended
  goals:
    goal_set: prj-z-tower-ascension
    revision: 1
  stop_when: backlog_done
policy:
  max_cycles: 6
  # The 2.8.1 diagnostic's value: the elapsed-time guard paused both 2.8 rehearsals that ran long, and a limit's
  # pause is the owner's to resume (D16). Every other limit is the 2.8 counted run's.
  max_elapsed_s: 14400
  budget_tokens: 12000000
  max_repair_cycles_per_increment: 1
  max_retry_cycles_per_increment: 1
  max_proposal_run_retries: 1
  max_proposal_revisions: 2
  max_rejected_proposals_in_row: 2
  max_unaccepted_increments: 1
  ruling_bound_s: 1800
  lease_expiry_s: 3600
  launch_blocked_interval_s: 300
  launch_blocked_attempts: 3
  calibration_profile: campaign-increment-source
  proposal_profile: campaign-increment-source
  squad_profile: game-dev-roblox
  plan_gate: tier
  development_profile: game_dev_roblox
