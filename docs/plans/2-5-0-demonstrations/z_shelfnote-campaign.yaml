# The 2.5 short demonstration (2.5 plan §2.1, §2.1a): a greenfield Project's first Campaign, on the
# blueprint path, one increment that adds a page. IR-4, IR-5 and IR-7 are read on it, and #2780's
# anchored page (docs/plans/verification-sets/2-5-0-demonstrations-preregistration.md).
# Uncounted for the regression rolls; its readings are the release's cross-lane scenarios.
project_id: prj-shelfnote
objective:
  statement: "add the book search the requirements describe, its API and its page, as one increment"
  allowed_scope: ["backend/**", "frontend/**", "tests/**"]
  measurement: "one accepted increment, judged on the product's own runners, its page rendered"
  target_accepted_increments: 1
  requirements: art_c8768ea0ea71
  work_class:
    prd_tier: tier-1
    attendance: unattended
policy:
  # 1 increment + one repair and one retry + 1 replacement.
  max_cycles: 4
  max_elapsed_s: 21600
  budget_tokens: 2500000
  max_repair_cycles_per_increment: 1
  max_retry_cycles_per_increment: 1
  max_proposal_run_retries: 1
  max_proposal_revisions: 2
  max_rejected_proposals_in_row: 2
  max_unaccepted_increments: 2
  ruling_bound_s: 1800
  lease_expiry_s: 3600
  launch_blocked_interval_s: 300
  launch_blocked_attempts: 6
  calibration_profile: campaign-increment-source
  proposal_profile: campaign-increment-source
  squad_profile: full-38-tf
  plan_gate: tier
scenario_suite: a1a6a0b721119d1ed19dffa22ee561c911e5bbdcb0db1f00eab086fb05ac04ca
