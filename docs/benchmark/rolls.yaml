# The benchmark registry's membership: the counted rolls of 1.6.3 through 1.7.5 (SIP-0108 §4.3,
# the 1.8.0 plan §3.4 (c)). Seventy-nine counted rolls, plus the two void launches whose
# registry launch notes still declare a counted roll 1.
#
# What each field is, and where it was read:
# - `counted`: the set's counted rolls, in roll order. They are transcribed from the set's
#   record; each cycle's own launch note in the registry must declare that roll, or the
#   re-grade refuses the row (`not_launched_as_declared`).
# - `void`: a counted-roll launch the record voided (the set stopped and restarted from roll 1).
#   A void carries no pins, because its set's pins describe the rebuilt deploy it restarted on.
# - `stack`: the stack the arm ran. The re-grade checks it against the cycle's own
#   `build_profile` (`stack_disagrees`).
# - `pins_config`: the set config whose `frozen_deploy_commit` and `frozen_image_ids` are the
#   lineage, read at re-grade time rather than copied here. Before 1.6.5 no set config exists;
#   `pins` is then transcribed from the pre-registration named as its `source`.
#
# The driver's per-roll JSON records are not an input (SIP-0108 §2): they are partial, and the
# registry and the vault hold every roll here.
#
# Re-grade: scripts/dev/regrade_benchmark.py (read-only). Capture: docs/benchmark/regrade.json.

