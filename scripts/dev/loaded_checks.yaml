  - id: "2340-runtime"
    what: "a declared contract probe compares without its reason when a failed retest is weighed as progress"
    container: squadops-runtime-api
    code: |
      # #2306 (SIP-0086 §12e) moved the comparison into retest_reduction_or_refusal; the probe still
      # compares without its reason, and an undeclared one is a check failing for a new reason.
      from squadops.cycles.correction_signature import retest_reduction_or_refusal as judge
      ev = lambda *rows: {"validation_result": {"checks": list(rows)}}
      probe = lambda reason: {"check": "p", "status": "failed", "reason": reason}
      suite = {"check": "tests_pass", "passed": False, "failing_tests": ["t.ts::a"]}
      seen = frozenset({"p", "tests_pass"})
      kept = judge(ev(probe("missing id"), suite), ev(probe("not ordered")), seen, frozenset({"p"}))[0]
      print(sorted(kept.cleared), judge(ev(probe("missing id"), suite), ev(probe("not ordered")), seen)[1])
    expect: "[('tests_pass', 't.ts', 'a')] added=p"
