  - id: "2160"
    what: SIP-0110 §0.4 - a return classified only in prose becomes citable only through a reviewed annotation, and the annotations table is live (reads the catalog; writes nothing)
    container: squadops-runtime-api
    code: |
      import asyncio
      from datetime import UTC, datetime
      import asyncpg
      from squadops.bootstrap.secrets import secret_provider_for
      from squadops.config import load_config
      from squadops.memory.annotation import annotate, citable, review
      from squadops.memory.observations import UNCLASSIFIED, Classification, Observation, ObservationSource
      at = datetime(2026, 10, 9, tzinfo=UTC)
      o = Observation(ObservationSource.PROPOSAL_RULING, "proposal_ruling:c:e", "p", at, Classification(UNCLASSIFIED))
      a = annotate(o, values=["criteria_not_checkable"], target_behavior=None, evidence={"r": "r"}, context={"deploy": "d", "prompt": "p"}, annotator="a", now=at)
      async def live():
          conn = await asyncpg.connect(load_config(secret_provider_factory=secret_provider_for).db.url)
          try:
              return await conn.fetchval("SELECT to_regclass('memory_observation_annotations') IS NOT NULL")
          finally:
              await conn.close()
      print(sorted(citable([o], [a])), sorted(citable([o], [review(a, reviewed_by="o", now=at)])), asyncio.run(live()))
    expect: "[] ['proposal_ruling:c:e'] True"
