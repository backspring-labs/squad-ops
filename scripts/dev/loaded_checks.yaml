  - id: "2165"
    what: SIP-0110 §0.2 - the exposures table holds one row per authoring invocation, not per task, so a re-dispatch's own exposure is stored (reads the live table's constraint kinds; writes nothing)
    container: squadops-runtime-api
    code: |
      import asyncio
      import asyncpg
      from squadops.bootstrap.secrets import secret_provider_for
      from squadops.config import load_config
      async def kinds():
          url = load_config(secret_provider_factory=secret_provider_for).db.url
          conn = await asyncpg.connect(url)
          try:
              rows = await conn.fetch(
                  "SELECT contype::text AS contype FROM pg_constraint "
                  "WHERE conrelid = 'memory_exposures'::regclass"
              )
          finally:
              await conn.close()
          return sorted(r["contype"] for r in rows)
      print(asyncio.run(kinds()))
    expect: "['p']"
