  - id: "1986"
    what: one recorder for every gate decision, keyed on the gate, and a refinement approval promotes
    container: squadops-runtime-api
    code: |
      import asyncio
      from datetime import UTC, datetime
      from squadops.cycles.gate_decisions import record_gate_decision
      from squadops.cycles.models import APPROVING_DECISIONS, GateDecision
      class Registry:
          async def record_gate_decision(self, run_id, decision): return run_id
      class Bus:
          def emit(self, event_type, **kw): self.seen = (kw["entity_type"], kw["payload"]["decision"])
      bus = Bus()
      d = GateDecision("g", "approved_with_refinements", "supervisor", datetime.now(UTC), "n")
      asyncio.run(record_gate_decision(Registry(), None, bus, project_id="p", cycle_id="c", run_id="r", decision=d))
      print(bus.seen, "approved_with_refinements" in APPROVING_DECISIONS)
    expect: "('gate', 'approved_with_refinements') True"
  - id: "1983"
    what: a bounded run ends its command's group, and the guard refuses a group that is no child's
    container: squadops-runtime-api
    code: |
      from squadops.core.bounded_run import run_bounded_sync, signal_group
      ran = run_bounded_sync(["sh", "-c", "exit 3"], cwd=None, timeout=10)
      slept = run_bounded_sync(["sleep", "5"], cwd=None, timeout=0.2)
      try:
          signal_group(1, 0)  # signal 0 sends nothing, so a broken guard still harms nothing
          refused = False
      except ValueError:
          refused = True
      print(ran.returncode, ran.timed_out, slept.timed_out, refused)
    expect: 3 False True True
