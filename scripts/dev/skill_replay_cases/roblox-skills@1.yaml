# Skill cases `roblox-skills@1`
#
# The replay cases for the three Roblox skillsets (SIP-0118 R4.3; SIP-0116 §17p; Q47), on
# z_tower-ascension. Run by `run_authoring_replay.py --skill-cases roblox-skills@1` against a capture
# run that loaded no skill. Each case starts from the capture's one envelope of its task type. A case
# with swaps puts another task in front of the same seam, and its record says no capture stands
# behind its prompt.
#
# A build task is shown the plan's words for its work and never the Campaign's objective, so a
# develop or qa case swaps the task's description, its focus, its criteria and its expected files
# together.
#
# The swapped objectives are changes to this game that the demonstration's goal set does not hold:
# the replay tests the skills, and the demonstration's increments stay unseen by it.
#
# What each case can and can't show is in its `why`. A proposal's scenario is read against the
# vocabulary here and never played. The proposal is shown the product's map and instructions, not
# its instance tree, so an instance path it names for something the change adds is the proposal's
# choice, and nothing here checks that today's game holds the paths its setup uses.
cases:
  - id: strategy-capture
    task_type: strategy.propose_increment
    skillset: roblox-increment-design
    vocabulary_skillset: roblox-studio-qa
    why: >-
      The captured proposal as it stands, a pure rule with no play-session effect of its own, handed
      the scenario skill. The skill must not cost an ordinary proposal its acceptance. This is the
      one strategy case checked byte for byte against its capture.
    expect: {accepted: true}

  - id: strategy-hud-text
    task_type: strategy.propose_increment
    skillset: roblox-increment-design
    vocabulary_skillset: roblox-studio-qa
    why: >-
      A text a player reads on the HUD after pressing Play: the representative scenario criterion.
      The accepted change request holds a scenario the rails read against roblox-studio/1.
    swaps:
      - path: [resolved_config, campaign_proposal, objective, statement]
        value: >-
          The HUD's lives label says how many lives are left, as in "5 lives left" for a player
          with five lives.
      - path: [resolved_config, campaign_proposal, objective, allowed_scope]
        value: ["src/**", "tests/**/*.spec.luau"]
    expect: {accepted: true, scenario_criterion: true}

  - id: strategy-title-screen
    task_type: strategy.propose_increment
    skillset: roblox-increment-design
    vocabulary_skillset: roblox-studio-qa
    why: >-
      An effect on the title screen itself, so the scenario's setup must not press Play as the
      skill's worked example does. It shows whether the example is followed or copied.
    swaps:
      - path: [resolved_config, campaign_proposal, objective, statement]
        value: The title screen shows a Credits button below its Settings button.
      - path: [resolved_config, campaign_proposal, objective, allowed_scope]
        value: ["src/**", "tests/**/*.spec.luau"]
    expect: {accepted: true, scenario_criterion: true}

  - id: strategy-unobservable
    task_type: strategy.propose_increment
    skillset: roblox-increment-design
    vocabulary_skillset: roblox-studio-qa
    why: >-
      The skill's prerequisite failure: a sound is an effect roblox-studio/1 can't observe, so the
      skill writes no change request and says why in one line.
    swaps:
      - path: [resolved_config, campaign_proposal, objective, statement]
        value: A chime plays each time the player's gold goes up.
      - path: [resolved_config, campaign_proposal, objective, allowed_scope]
        value: ["src/**", "tests/**/*.spec.luau"]
    expect: {stop: "no scenario:"}

  - id: strategy-saved-state
    task_type: strategy.propose_increment
    skillset: roblox-increment-design
    vocabulary_skillset: roblox-studio-qa
    why: >-
      A change that adds to what a player's save holds. Read by hand: the accepted change
      request's prd_delta must say what an existing save holds for the new count. The judgement
      here is only that the proposal was accepted.
    swaps:
      - path: [resolved_config, campaign_proposal, objective, statement]
        value: >-
          The game remembers, from one session to the next, how many potions a player has drunk,
          and the character menu shows that count.
      - path: [resolved_config, campaign_proposal, objective, allowed_scope]
        value: ["src/**", "tests/**/*.spec.luau"]
    expect: {accepted: true}

  - id: dev-capture
    task_type: development.develop
    skillset: roblox-luau-dev
    why: >-
      The captured build task as it stands. The skill must not cost an ordinary task its
      acceptance, and each file the plan expected of the task lands where the plan put it. The
      files are the captured task's own, so a capture taken again needs no change here. Checked
      byte for byte against its capture.
    expect: {accepted: true, emits_expected: true}

  - id: dev-saved-field
    task_type: development.develop
    skillset: roblox-luau-dev
    why: >-
      The skill's stop: a task that renames a field of the saved profile. The task isn't shown
      the file, so the stop is read from the task's own words. The baseline, handed no skill,
      is expected to write the file.
    swaps:
      - path: [subtask_description]
        value: |-
          Change src/Server/Util/ProfileSchema.luau so the saved profile's gold is held in a
          field named Coins. Rename the Gold field of DEFAULT_PROFILE to Coins, and change every
          read and write of profile.Gold in the file to profile.Coins. Every other field stays
          as it is.
      - path: [subtask_focus]
        value: ProfileSchema field rename
      - path: [expected_artifacts]
        value: ["src/Server/Util/ProfileSchema.luau"]
      - path: [acceptance_criteria]
        value:
          - check: count_at_least
            params: {glob: "src/Server/Util/ProfileSchema.luau", min_count: 1}
            severity: error
            description: ""
            id: ""
          - "DEFAULT_PROFILE holds a Coins field with the value 0, and no Gold field."
          - "No file other than src/Server/Util/ProfileSchema.luau is created or modified by this task."
    expect: {stop: "saved data:"}

  - id: qa-capture
    task_type: qa.test
    skillset: roblox-studio-qa
    why: >-
      The captured test task as it stands: the spec the plan expected, written for the product's
      own runner. The emitted spec is run on the product with the capture's own implementation
      laid over it, so a pass is the spec loading and passing under tests/run.luau. A wrong
      implementation in the capture would read here as a failing spec. The spec is also run
      alone without that implementation, and the two readings are judged by the Campaign's own
      rule: a spec that requires, at the top of its file, a module the change adds reads
      only_setup_failures there (SIP-0109 §24ec). Checked byte for byte against its capture.
    expect: {accepted: true, emits_expected: true, specs_pass: true, discriminates: true}

  - id: qa-no-runner
    task_type: qa.test
    skillset: roblox-studio-qa
    why: >-
      The skill's prerequisite failure: a product checked by another script, whose tree shows no
      tests/run.luau. The spec globals the skill teaches belong to that runner's loader, so the
      skill writes no spec and says why in one line. The repository's path list, which no prompt
      shows, still names the file.
    swaps:
      - path: [source_repository, checks, 0, argv]
        value: [".tools/lune", "run", "tests/harness.luau"]
      - path: [artifact_contents, tests/run.luau]
        delete: true
      - path: [artifact_contents, tests/loader.luau]
        delete: true
      - path: [acceptance_workspace_files, tests/run.luau]
        delete: true
      - path: [acceptance_workspace_files, tests/loader.luau]
        delete: true
    expect: {stop: "no tests/run.luau:"}
