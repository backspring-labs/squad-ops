checks:
  - id: "3182-qa-suite-collected"
    what: on a product, a plan whose qa.test names a file no runner of the product collects is refused by name, and a collected test file or a support file on record is accepted (SIP-0112 H.38)
    container: squadops-runtime-api
    code: |
      from types import SimpleNamespace
      import yaml
      from squadops.cycles.implementation_plan import ImplementationPlan
      from squadops.projects.derived_profile import Runner
      r = Runner("unittest", (), (), ("checks",), "check_*.py", (), None, None, ())
      profile = SimpleNamespace(runners=(r,), runner_for=lambda path: r if r.holds(path) else None, test_support_files=("checks/conftest.py",))
      task = lambda i, f: {"task_index": i, "task_type": "qa.test", "role": "qa", "focus": f, "description": "d", "expected_artifacts": [f], "acceptance_criteria": []}
      files = ["checks/check_totals.py", "tally/count.py", "checks/conftest.py", "checks/helpers.py"]
      plan = ImplementationPlan.from_yaml(yaml.safe_dump({"version": 1, "project_id": "p", "cycle_id": "c", "prd_hash": "h", "summary": {"total_dev_tasks": 0, "total_qa_tasks": 4}, "tasks": [task(i, f) for i, f in enumerate(files)]}))
      errors = plan.validate_qa_suite_collected(profile)
      print(len(errors), [e.split(":")[1].strip() for e in errors])
    expect: "2 ['Task 1 (tally/count.py)', 'Task 3 (checks/helpers.py)']"
