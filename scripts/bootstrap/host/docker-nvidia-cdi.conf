# Regenerate the NVIDIA CDI spec every time Docker starts (#3251), so a GPU whose
# /dev/dri card number changed across a boot is described correctly before Docker
# starts its containers. Seen 2026-11-23: the spec named card1, the GPU came up as
# card0, and every container that takes the GPU through CDI stayed down.
#
# Installed by the local-spark bootstrap as
# /etc/systemd/system/docker.service.d/10-nvidia-cdi.conf, and checked by
# `squadops doctor`.
#
# The spec is generated under /run and moved into /etc/cdi only when it generated
# and reads as an NVIDIA spec. A failure leaves the old spec in place and never
# blocks Docker (the leading "-"). It is held to 60 seconds, since docker.service
# sets no start timeout. The temporary file is kept out of /etc/cdi because
# nvidia-ctk appends ".yaml" to any other extension, and Docker reads every .yaml
# file in that directory as a spec.
[Service]
ExecStartPre=-/bin/sh -c '/usr/bin/timeout 60 /usr/bin/nvidia-ctk cdi generate --output=/run/nvidia-cdi-new.yaml && /usr/bin/grep -q "kind: nvidia.com/gpu" /run/nvidia-cdi-new.yaml && /usr/bin/mv -f /run/nvidia-cdi-new.yaml /etc/cdi/nvidia.yaml'
