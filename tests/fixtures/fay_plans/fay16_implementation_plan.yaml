    - app.main
    client_ctor: TestClient
  - All endpoint tests return correct HTTP status codes (201, 200, 404, 409, 422)
    per PRD behavior.
  - Response payloads match Pydantic model shapes and error contract specifications.
  depends_on:
  - 0
