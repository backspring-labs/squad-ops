    Directly addresses risk area: in-memory test state isolation preventing flaky
    assertions.'
  expected_artifacts:
  - backend/tests/test_state_isolation.py
  acceptance_criteria:
  - check: function_defined
    file: backend/tests/test_state_isolation.py
    name_prefix: test_
