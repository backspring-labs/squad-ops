tasks:
- task_index: 0
  task_type: development.develop
  role: dev
  focus: Implement all REST endpoints in backend/routes.py
  description: "Fill in the route handlers for the group_run API in backend/routes.py.\n\
    The scaffold already defines models (Run, Participant, RunSummary,\nRunCreate,\
    \ ParticipantBody), in-memory stores (run_store,\nparticipant_store, run_summary_store),\
    \ and error infrastructure (ApiError,\nregister_error_handlers). Wire the endpoints:\n\
    \n- Create a run event (title, datetime, meeting_location required;\n  distance,\
    \ pace_target, route_notes optional)\n- List upcoming runs (returns summaries\
    \ with participant_count)\n- Get a single run by id (full detail including participant\
    \ list)\n- Join a run by participant name (reject duplicates case-insensitively)\n\
    - Leave a run by participant name (clear error if name not found)\n\nUse the store\
    \ module for state. Raise ApiError for validation failures\nand not-found conditions.\
    \ The conftest.py client fixture provides the\nTestClient for integration tests\
    \ — do not construct one in routes.\n"
  expected_artifacts:
  - backend/routes.py
  acceptance_criteria:
  - Creating a run validates required fields and returns the created event with a
    generated id.
  - Listing runs returns a collection of summaries including participant_count.
  - Getting a run by id returns full detail with the participant list; unknown id
    yields a clear not-found error.
  - Joining adds the participant and rejects duplicate names (case-insensitive) with
    a descriptive error.
  - Leaving removes the participant; an absent name produces a clear error response.
  depends_on: []
  criteria_refs:
  - vc-routes-endpoints
  - vc-routes-apierror
  - vc-routes-compiles
  - vc-routes-imports
- task_index: 1
  task_type: development.develop
  role: dev
  focus: Build the RunsListView (upcoming runs list page)
  description: 'Implement frontend/src/views/RunsListView.jsx. The frozen App.jsx
    already

    wires this to the /runs route and the frozen api.js provides apiFetch.


    Display a list of runs (title, datetime, meeting_location, participant

    count). Link each row to the detail view (/runs/:id). Show an empty-state

    message when no runs exist. Fetch data on mount via apiFetch.

    '
  expected_artifacts:
  - frontend/src/views/RunsListView.jsx
  acceptance_criteria:
  - Renders each run's title, datetime, meeting location, and participant count.
  - Shows a clear empty-state message when the list is empty.
  - Each run entry links to its detail view.
  depends_on: []
  criteria_refs:
  - vc-view-compiles-runs-list-view
- task_index: 2
  task_type: development.develop
  role: dev
  focus: Build the CreateRunView (run creation form)
  description: 'Implement frontend/src/views/CreateRunView.jsx. The frozen App.jsx
    wires

    this to the /create route and api.js provides apiFetch.


    Provide a form with fields: title (required), datetime (required),

    meeting_location (required), distance (optional), pace_target (optional),

    route_notes (optional). Validate required fields are non-empty before

    submit. On success, navigate to the runs list. Display backend error

    messages inline.

    '
  expected_artifacts:
  - frontend/src/views/CreateRunView.jsx
  acceptance_criteria:
  - Renders input fields for all six run attributes with required-field markers on
    title, datetime, meeting_location.
  - Submits the form to the backend and navigates to the runs list on success.
  - Displays a user-visible error message when the backend rejects the payload.
  depends_on: []
  criteria_refs:
  - vc-view-compiles-create-run-view
- task_index: 3
  task_type: development.develop
  role: dev
  focus: Build the RunDetailView (run detail, join, leave)
  description: 'Implement frontend/src/views/RunDetailView.jsx. The frozen App.jsx
    wires

    this to the /runs/:id route and api.js provides apiFetch.


    Display all run details (title, datetime, location, distance, pace,

    notes) and the current participant list. Provide a join form (name

    input + submit) and a leave form (name input + submit). Update the

    participant list and count after join/leave actions. Show clear error

    messages for duplicate-name joins, not-found runs, and failed leaves.

    '
  expected_artifacts:
  - frontend/src/views/RunDetailView.jsx
  acceptance_criteria:
  - Displays all run event fields and the current participant list with count.
  - Join form accepts a name, submits to backend, and refreshes the participant list
    on success.
  - Leave form accepts a name, submits to backend, and refreshes the participant list
    on success.
  - Shows a descriptive error message for duplicate-name joins and failed leaves.
  depends_on: []
  criteria_refs:
  - vc-view-compiles-run-detail-view
