- task_index: 5
  task_type: qa.test
  role: qa
  focus: Write integration tests for core API behavior
  description: 'Author backend/tests/test_runs.py covering the core API contract using

    the scaffold-provided client fixture (from conftest.py). Do NOT import

    backend.main or construct TestClient directly — use the injected client.


    Minimum coverage:

    - Create a valid run and verify the response contains the expected fields

    - Create a run with missing required field and verify rejection

    - List runs and verify the created run appears

    - Get run detail by id and verify participant list is present

    - Join a run with a name and verify the participant appears

    - Join the same run with the same name again and verify rejection

    - Leave the run and verify the participant is removed

    - Leave a run with a name not present and verify error behavior

    - Get a non-existent run id and verify not-found error


    Each test should be independent (use reset() from backend.store between

    tests if needed via a fixture or setup).

    '
  expected_artifacts:
  - backend/tests/test_runs.py
  acceptance_criteria:
  - check: function_defined
    description: At least 6 test functions defined
    file: backend/tests/test_runs.py
    name_prefix: test_
    min_count: 6
  - check: harness_boundary
    description: Tests use the scaffold client fixture, not a direct import
    file: backend/tests/test_runs.py
    entry_modules:
