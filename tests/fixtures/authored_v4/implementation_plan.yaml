    mutations, CORS middleware (AllowAllOrigins as dev fallback), and router mounting.
    Includes a lightweight in-memory store module inline or as a submodule with lock-guarded
    mutation helpers.
  expected_artifacts:
  - backend/main.py
  acceptance_criteria:
