behavioral:
  build:
  - check: frontend_build
    id: vc-frontend-builds
    requires: node
  suite:
    checks:
    - check: tests_pass
      id: vc-suite-passes
      requires: python
    coverage_expectations:
    - 'happy path for each endpoint: GET /runs, POST /runs, GET /runs/{run_id}, POST
      /runs/{run_id}/join, POST /runs/{run_id}/leave'
    - validation_error -> HTTP 422
    - run_not_found -> HTTP 404
    - duplicate_participant -> HTTP 409
    - participant_not_found -> HTTP 404
    - tests are order-independent; module-level state reset per test
  probes:
  - id: vc-probe-runs
    subject: backend
    request:
      method: POST
      path: /runs
      json:
        title: sample
        datetime: '2026-08-01T08:00:00'
        location: sample
    expect:
      status: 201
    capture:
      run_id: id
  - id: vc-probe-runs-rejects-blank
    subject: backend
    request:
      method: POST
      path: /runs
      json:
        title: ''
        datetime: ''
        location: ''
    expect:
      status: 422
      error_code: validation_error
    guards: scaffold
  - id: vc-probe-runs-join
    subject: backend
    request:
      method: POST
      path: /runs/{run_id}/join
      json: &id001
        name: sample
    expect:
      status: 200
  - id: vc-probe-runs-join-duplicate
    subject: backend
    request:
      method: POST
      path: /runs/{run_id}/join
      json: *id001
    expect:
      status: 409
      error_code: duplicate_participant
  - id: vc-probe-runs-leave
    subject: backend
    request:
      method: POST
      path: /runs/{run_id}/leave
      json:
        name: sample
    expect:
      status: 200
