# The calibration_record form (SIP-0113 §10l, SIP-0112 H.14): a repository-backed Campaign's baseline reading, the reference to its calibration record's commit evaluated. It names the record in place of a cycle (cycle_id null, calibration_record_id set), and names no previous tree, since a calibration builds on nothing. Its tree is the second commit's, the Project's development baseline, where the record is written. A reader that knows only the four forms above refuses it, never misreads it.
