# The 2.4 window, campaign fastapi-react-2 (docs/plans/2-4-0-plan.md §1.3, D3; docs/plans/2-4-0-window-preregistration.md):
# one of four, two per stack, three increments each, on one frozen deploy. FastAPI + React: the stack comes from the policy
# (#2443), so the campaign profiles stay as they are. The held-out suite (#2464) is pinned, and each cycle is evaluated
# at its end, reporting only (SIP-0113 phase 1). Memory observes and supplies nothing: no build-side lesson is approved
# (SIP-0110's next build-side experiment). Plan gates are the tier's; proposal rulings are the supervisor's, by the
# pre-registration's rule. COUNTED, as the window's record.
project_id: group_run
objective:
  statement: "evolve group_run toward its PRD's expansion scope, one increment at a time"
  allowed_scope: ["backend/**", "frontend/**"]
  measurement: "three accepted increments"
  target_accepted_increments: 3
  work_class:
    prd_tier: tier-1
    attendance: unattended
policy:
  # 1 calibration + 3 increments + one repair or retry each (3) + 2 replacements for abandoned ones.
  max_cycles: 9
  max_elapsed_s: 64800
  budget_tokens: 6000000
  max_repair_cycles_per_increment: 1
  max_retry_cycles_per_increment: 1
  max_proposal_run_retries: 1
  max_proposal_revisions: 2
  max_rejected_proposals_in_row: 2
  max_unaccepted_increments: 2
  ruling_bound_s: 1800
  lease_expiry_s: 3600
  launch_blocked_interval_s: 300
  launch_blocked_attempts: 6
  calibration_profile: validated-fullstack
  proposal_profile: campaign-increment
  squad_profile: full-38-tf
  plan_gate: tier
  stack: fullstack_fastapi_react
scenario_suite: db69fd3707ea65b0c22e64aeefb90f2fc4621565b94244399be6de2ad697044d
