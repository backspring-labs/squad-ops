# The sixth live campaign shakeout (SIP-0109 §19 item 15; plan §6 step 13's loop). Runs on rebuild 17:
# the SIP-0107 flip (#1909, §46s), #1912, the box lease (#1802), the plan-gate bound (#1708), the
# revision-form capture (#1710), one supervisor bound (§24al) and restart re-attach (#1922). The loop's exit rule: a shakeout with
# no new seam finding, on the deploy the set would register. It runs the pre-registration draft's policy
# values (#1908 §5: three increments, max_cycles 9, 12 h), so the exit shakeout also rehearses them.
# Uncounted; within the 2.0 charter. Registering those values stays the owner's decision.
project_id: group_run
objective:
  statement: "evolve group_run toward its PRD's expansion scope, one increment at a time"
  allowed_scope: ["backend/**", "frontend/**"]
  measurement: "three accepted increments"
  target_accepted_increments: 3
policy:
  # 1 calibration + 3 increments + one repair or retry each (3) + 2 replacements for abandoned ones.
  max_cycles: 9
  max_elapsed_s: 43200
  budget_tokens: 4000000
  max_repair_cycles_per_increment: 1
  max_retry_cycles_per_increment: 1
  max_proposal_run_retries: 1
  max_proposal_revisions: 2
  max_rejected_proposals_in_row: 2
  max_unaccepted_increments: 2
  ruling_bound_s: 1800
  lease_expiry_s: 3600
  launch_blocked_interval_s: 300
  launch_blocked_attempts: 6
  calibration_profile: validated-fullstack
  proposal_profile: campaign-increment
  squad_profile: full-38
