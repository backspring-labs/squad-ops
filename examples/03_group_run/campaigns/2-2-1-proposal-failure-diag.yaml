# The 2.2.1 diagnostic (docs/plans/2-2-1-plan.md §3), uncounted: the roll's own path with the fault injected (#1251).
# The objective's allowed scope names the source files its objective changes and excludes the test directories.
# Every proposal's derived footprint carries the stack's qa test namespace (campaigns/change_request.py,
# derive_footprint_from), and the scope rail reads the whole footprint, so the rails refuse every proposal. That is
# the trigger of #2212, made certain.
# What it reads (the plan's R1-R4): no correction task in a proposal run; each proposal run ends failed with the
# rails' refusal as its reason, and its cycle proposal_failed; after one retry (max_proposal_run_retries) the campaign
# closes itself with a row naming why; no unretrieved task exception from launch to close.
# The fields below are the 2.2 cut's tier diagnostic's, unchanged: its header described an escalation that never fires.
project_id: group_run
objective:
  statement: "evolve group_run toward its PRD's expansion scope by adding a per-run capacity limit (PRD §4.1, Tier 1, item 1)"
  allowed_scope: ["backend/routes.py", "backend/models.py", "backend/store.py", "backend/errors.py", "frontend/src/api.js", "frontend/src/App.jsx", "frontend/src/views/**"]
  measurement: "one accepted increment"
  target_accepted_increments: 1
policy:
  # 1 calibration + 2 parked increments, with 2 to spare: the no-progress rule ends it, never this cap.
  max_cycles: 5
  max_elapsed_s: 43200
  budget_tokens: 4000000
  max_repair_cycles_per_increment: 1
  max_retry_cycles_per_increment: 1
  max_proposal_run_retries: 1
  max_proposal_revisions: 2
  max_rejected_proposals_in_row: 2
  max_unaccepted_increments: 2
  ruling_bound_s: 600
  lease_expiry_s: 3600
  launch_blocked_interval_s: 300
  launch_blocked_attempts: 6
  calibration_profile: validated-fullstack
  proposal_profile: campaign-increment
  squad_profile: full-38
  plan_gate: tier
