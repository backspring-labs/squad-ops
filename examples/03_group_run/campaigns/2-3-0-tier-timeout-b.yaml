# The plan-review tier's timeout half, read live: campaign B (#2279), uncounted, a diagnostic.
# Pre-registration: docs/plans/verification-sets/2-3-0-tier-timeout-preregistration.md.
# Created after campaign A closed and its expired escalation was answered late. Its first increment launches on a
# baseline that asks the same injected question, and the late answer on record is carried in (SIP-0109 §24bm), so
# the tier reads it and approves. Campaign A's definition, with the same objective and limits.
project_id: group_run
objective:
  statement: "evolve group_run toward its PRD's expansion scope, one increment at a time"
  allowed_scope: ["backend/**", "frontend/**"]
  measurement: "one accepted increment"
  target_accepted_increments: 1
policy:
  # 1 calibration + 1 increment + one repair or retry, with 2 to spare.
  max_cycles: 5
  max_elapsed_s: 43200
  budget_tokens: 4000000
  max_repair_cycles_per_increment: 1
  max_retry_cycles_per_increment: 1
  max_proposal_run_retries: 1
  max_proposal_revisions: 2
  max_rejected_proposals_in_row: 2
  max_unaccepted_increments: 2
  ruling_bound_s: 600
  lease_expiry_s: 3600
  launch_blocked_interval_s: 300
  launch_blocked_attempts: 6
  calibration_profile: validated-fullstack
  proposal_profile: campaign-increment-asks
  squad_profile: full-38-tf
  plan_gate: tier
