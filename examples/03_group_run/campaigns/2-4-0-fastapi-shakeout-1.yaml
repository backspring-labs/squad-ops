# 2.4's FastAPI + React shakeout (docs/plans/2-4-0-plan.md §1.3, D3; docs/plans/2-4-0-window-preregistration.md,
# condition 4): the cycle-end evaluation (#2472) has never run inside a campaign on either stack, so after the Next.js
# shakeout this stack's campaign path runs once more on the final deploy, ahead of the window's two FastAPI + React
# campaigns. The window's held-out suite is pinned so the evaluation path (the runner, Lighthouse, axe and lint, SIP-0113
# phase 1) runs at each cycle's end, reporting only. Plan gates stay `tier`; proposal rulings are the supervisor's, under
# the owner's grant of 2026-10-19. Uncounted. The exit rule: this campaign on one deploy with no new seam finding.
project_id: group_run
objective:
  statement: "evolve group_run toward its PRD's expansion scope, one increment at a time"
  # The window's FastAPI + React scope (2-4-0-window-fastapi-react-1.yaml): the backend and the frontend trees.
  allowed_scope: ["backend/**", "frontend/**"]
  measurement: "two accepted increments"
  target_accepted_increments: 2
  work_class:
    prd_tier: tier-1
    attendance: unattended
policy:
  # 1 calibration + 2 increments + one repair or retry each (2) + 2 replacements for abandoned ones.
  max_cycles: 7
  max_elapsed_s: 43200
  budget_tokens: 4000000
  max_repair_cycles_per_increment: 1
  max_retry_cycles_per_increment: 1
  max_proposal_run_retries: 1
  max_proposal_revisions: 2
  max_rejected_proposals_in_row: 2
  max_unaccepted_increments: 2
  ruling_bound_s: 1800
  lease_expiry_s: 3600
  launch_blocked_interval_s: 300
  launch_blocked_attempts: 6
  calibration_profile: validated-fullstack
  proposal_profile: campaign-increment
  squad_profile: full-38-tf
  plan_gate: tier
  stack: fullstack_fastapi_react
scenario_suite: db69fd3707ea65b0c22e64aeefb90f2fc4621565b94244399be6de2ad697044d
