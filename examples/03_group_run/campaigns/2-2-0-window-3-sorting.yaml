# The 2.2 measurement window, campaign 3 of 5 (the slice 4 pre-registration, docs/plans/2-2-0-slice4-preregistration.md
# §4, adopted 2026-10-09). One objective per campaign, so each campaign's first proposal is an independent case: this
# one is the PRD's expansion item "sorting the runs list by datetime" (examples/03_group_run/prd.md §4.1, Tier 1, item 2). A calibration and one increment.
# Lessons enabled: no memory declaration, so every cycle pins the campaign's snapshot. Proposal and plan rulings
# supervised (D3). The policy is the capture proof's (2-2-0-capture-proof.yaml), with the plan gate declared (#2146).
project_id: group_run
objective:
  statement: "evolve group_run toward its PRD's expansion scope by sorting the runs list by datetime (PRD §4.1, Tier 1, item 2)"
  allowed_scope: ["backend/**", "frontend/**"]
  measurement: "one accepted increment"
  target_accepted_increments: 1
policy:
  # 1 calibration + 1 increment + one repair or retry (1) + 1 replacement for an abandoned one.
  max_cycles: 4
  max_elapsed_s: 43200
  budget_tokens: 4000000
  max_repair_cycles_per_increment: 1
  max_retry_cycles_per_increment: 1
  max_proposal_run_retries: 1
  max_proposal_revisions: 2
  max_rejected_proposals_in_row: 2
  max_unaccepted_increments: 2
  ruling_bound_s: 1800
  lease_expiry_s: 3600
  launch_blocked_interval_s: 300
  launch_blocked_attempts: 6
  calibration_profile: validated-fullstack
  proposal_profile: campaign-increment
  squad_profile: full-38
  plan_gate: supervised
