# The 2.0 counted set, campaign 1 of 2 (#1908 §2). Its objective and policy are exactly shakeout 7's, the exit
# run on the registered deploy (rebuild 19, b0c25360), so the set runs what the exit shakeout ran (#1908 §5:
# immutable for the set, each value with its shakeout basis). Pinned in #1908 §6 by path, commit and sha256.
# Supervised by #1908 §3a. Counted.
project_id: group_run
objective:
  statement: "evolve group_run toward its PRD's expansion scope, one increment at a time"
  allowed_scope: ["backend/**", "frontend/**"]
  measurement: "three accepted increments"
  target_accepted_increments: 3
policy:
  # 1 calibration + 3 increments + one repair or retry each (3) + 2 replacements for abandoned ones.
  max_cycles: 9
  max_elapsed_s: 43200
  budget_tokens: 4000000
  max_repair_cycles_per_increment: 1
  max_retry_cycles_per_increment: 1
  max_proposal_run_retries: 1
  max_proposal_revisions: 2
  max_rejected_proposals_in_row: 2
  max_unaccepted_increments: 2
  ruling_bound_s: 1800
  lease_expiry_s: 3600
  launch_blocked_interval_s: 300
  launch_blocked_attempts: 6
  calibration_profile: validated-fullstack
  proposal_profile: campaign-increment
  squad_profile: full-38
