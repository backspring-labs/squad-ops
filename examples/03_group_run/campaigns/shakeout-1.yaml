# The first live campaign shakeout (SIP-0109 steps 1-7, #1705 a-d): start → calibration
# (validated-fullstack, ~50 min) → its tree promoted → propose → an increment cycle
# (campaign-increment): proposal run → progress_increment_ruling (ruled as the delegated diagnostic)
# → framing bound to the candidate manifest, framed by the change request → plan review →
# implementation from the accepted tree → assessed (step e unbuilt: the stack's acceptance, no
# increment promotion) → next decision, until max_cycles. Uncounted; within the 2.0 charter.
project_id: group_run
objective:
  statement: "evolve group_run toward its PRD's expansion scope, one increment at a time"
  allowed_scope: ["backend/**", "frontend/**"]
  measurement: "two accepted increments"
policy:
  max_cycles: 3
  max_elapsed_s: 21600
  budget_tokens: 3000000
  max_repair_cycles_per_increment: 1
  max_retry_cycles_per_increment: 1
  max_proposal_run_retries: 1
  max_proposal_revisions: 2
  max_rejected_proposals_in_row: 2
  max_unaccepted_increments: 2
  crew_ruling_bound_s: 1800
  owner_ruling_bound_s: 43200
  lease_expiry_s: 3600
  launch_blocked_interval_s: 300
  launch_blocked_attempts: 6
  calibration_profile: validated-fullstack
  proposal_profile: campaign-increment
  squad_profile: full-38
