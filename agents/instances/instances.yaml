# SquadOps Agent Instances Configuration
# This file defines all agent instances and their role mappings

instances:
  # Lead Role
  - id: max
    display_name: Max
    role: lead
    serves_roles: [lead]
    model: llama3.1:8b
    enabled: true
    description: "Task Lead - Orchestration"

  # Strategy Role
  - id: nat
    display_name: Nat
    role: strat
    serves_roles: [strat]
    model: qwen2.5:7b
    enabled: true
    description: "Product Strategy - Abductive reasoning"

  # Creative Role
  - id: creative-agent
    display_name: CreativeAgent
    role: creative
    serves_roles: [creative]
    model: stable-diffusion-xl
    enabled: true
    description: "Creative Design - Visual synthesis"

  # Development Role
  - id: neo
    display_name: Neo
    role: dev
    serves_roles: [dev]
    model: qwen2.5:7b
    enabled: true
    description: "Developer - Deductive reasoning"

  # QA Role
  - id: eve
    display_name: Eve
    role: qa
    serves_roles: [qa]
    model: qwen2.5:3b-instruct
    enabled: true
    description: "QA & Security - Counterfactual reasoning"

  # Builder Role
  - id: bob
    display_name: Bob
    role: builder
    serves_roles: [builder]
    model: qwen2.5:7b
    enabled: true
    description: "Builder - Artifact production from plans"

  # Data Role
  - id: data
    display_name: Data
    role: data
    serves_roles: [data]
    model: qwen2.5:3b-instruct
    enabled: true
    description: "Analytics - Inductive reasoning"

  # Generalist Role — the Solo arm (SIP-0108 §10i, 1.8.1 plan §3.5). One process serving
  # every step role the squad's `full-38` serves; `han` is the display identity, `generalist`
  # the role in source. Torn down after the 1.8.1 window by default (plan §8 decision 12).
  - id: han
    display_name: Han
    role: generalist
    serves_roles: [lead, dev, strat, builder, qa, data]
    model: qwen3.8:27b
    enabled: true
    description: "Generalist - one process, every role; the Solo arm"

  # Finance Role
  - id: finance-agent
    display_name: FinanceAgent
    role: finance
    serves_roles: [finance]
    model: llama3-8b
    enabled: true
    description: "Finance & Ops - Rule-based reasoning"

  # Communications Role (SIP-0085: A2A messaging enabled)
  - id: joi
    display_name: Joi
    role: comms
    serves_roles: [comms]
    model: llama3.1:8b
    host: joi
    enabled: true
    description: "Communications - Conversational interface"
    a2a_messaging_enabled: true
    a2a_port: 8080

  # Curation Role
  - id: curator-agent
    display_name: CuratorAgent
    role: curator
    serves_roles: [curator]
    model: llama3-70b
    enabled: true
    description: "R&D & Curation - Pattern detection"

  # Audit Role
  - id: audit-agent
    display_name: AuditAgent
    role: audit
    serves_roles: [audit]
    model: llama3-8b
    enabled: true
    description: "Monitoring & Audit - Continuous monitoring"

