[plugin]
id = "squadops.projects"
name = "Projects"
version = "0.1.0"
description = "Project browsing, goal sets and squad profile management."
required = false

[plugin.ui]
tag_prefix = "squadops-projects"
bundle = "plugin.js"

[[contributions.nav]]
slot = "ui.slot.left_nav"
label = "Projects"
icon = "folder"
priority = 600

[contributions.nav.target]
type = "panel"
panel_id = "discovery"

[[contributions.panel]]
slot = "ui.slot.main"
perspective = "discovery"
component = "squadops-projects-list"
priority = 800

# SIP-0115 §8.3 (slice 4, #2887): the selected Project's goal set, its backlog as a chosen
# Campaign stands on it, the candidates waiting and the revision history.
[[contributions.panel]]
slot = "ui.slot.main"
perspective = "discovery"
component = "squadops-projects-goals"
priority = 700

[[contributions.panel]]
slot = "ui.slot.main"
perspective = "discovery"
component = "squadops-projects-profiles"
priority = 600

[[contributions.command]]
id = "squadops.set_active_profile"
label = "Set Active Profile"
action = "squadops.set_active_profile"
danger_level = "confirm"

# The goals panel's edit: the Project's next goal-set revision, written through the runtime API.
[[contributions.command]]
id = "squadops.revise_goal_set"
label = "Write Goal-Set Revision"
action = "squadops.revise_goal_set"
danger_level = "confirm"
