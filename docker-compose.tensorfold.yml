# The squad's model clients on TensorFold (SIP-0111 §5.6 step 7, §5.7; #2200). Inert on merge: it is
# named in no deploy's COMPOSE_FILE. scripts/dev/ops/engine_switch.py appends it to the deploy's own
# list when it moves the clients to TensorFold, and recreates them without it when it moves them back:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.ollama.yml:docker-compose.tensorfold.yml
#
# It switches clients, never the engine. TensorFold itself is the switch's container, started from a
# frozen recipe and attached to squadnet as `tensorfold` (http://tensorfold:8080 here; the host keeps
# 127.0.0.1:8090).
#
# - Every model client moves together: provider, URL, key and model (§5.6 step 7). The model is the
#   served id: the adapter refuses an id with no frozen recipe, and Ollama's name is never aliased
#   to it (§5.3). Agents take the squad profile's model first, so a cycle on TensorFold names the
#   profile that serves it (`full-38-tf`).
# - The key is the deploy's own (#2006): SQUADOPS_TENSORFOLD_API_KEY in .env, generated by
#   deploy_credentials.py, which also writes the server's key file from it
#   (secrets/tensorfold_api_key.txt). One home, so a rotation reaches both.
# - depends_on is replaced, not merged: the Ollama overlay makes every client wait for Ollama, and
#   compose would start Ollama beside TensorFold for any client it recreated. The engines never run
#   together (§5.6). Each list is the base file's, restated, and a test holds them equal.
x-on-tensorfold: &on-tensorfold
  SQUADOPS__LLM__PROVIDER: tensorfold
  SQUADOPS__LLM__URL: http://tensorfold:8080
  SQUADOPS__LLM__API_KEY: ${SQUADOPS_TENSORFOLD_API_KEY:?required, written by scripts/dev/ops/deploy_credentials.py ensure (#2006)}
  SQUADOPS__LLM__MODEL: qwen3.8-27b-tf-nvfp4

x-after-infrastructure: &after-infrastructure
  rabbitmq:
    condition: service_healthy
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  runtime-api:
    environment: *on-tensorfold
    depends_on: !override
      postgres:
        condition: service_healthy
  max:
    environment: *on-tensorfold
    depends_on: !override
      <<: *after-infrastructure
  nat:
    environment: *on-tensorfold
    depends_on: !override
      <<: *after-infrastructure
  neo:
    environment: *on-tensorfold
    depends_on: !override
      <<: *after-infrastructure
  eve:
    environment: *on-tensorfold
    depends_on: !override
      <<: *after-infrastructure
  data:
    environment: *on-tensorfold
    depends_on: !override
      <<: *after-infrastructure
      runtime-api:
        condition: service_started
  han:
    environment: *on-tensorfold
    depends_on: !override
      <<: *after-infrastructure
  bob:
    environment: *on-tensorfold
    depends_on: !override
      <<: *after-infrastructure
  joi:
    environment: *on-tensorfold
    depends_on: !override
      <<: *after-infrastructure
