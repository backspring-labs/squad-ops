name: secret scan

# gitleaks over the commits a change adds, with the repository's own rules (.gitleaks.toml): the
# default provider formats plus this project's secret shapes, which GitHub's push protection does not
# know (LangFuse keys, SQUADOPS__*SECRET/PASSWORD/TOKEN/API_KEY values). Every pull request, prose
# included — a pasted secret in a doc is still a secret — and every push to main.
#
# The first step proves the rules fire: a key generated at run time must be found, or the job fails.
# A scanner that finds nothing is otherwise indistinguishable from a scanner that cannot see.
#
# Not a required check yet: it runs report-only while false positives are tuned, then becomes
# required. The image is pinned by digest (v8.30.1); gitleaks-action needs a licence for an
# organisation, so the binary runs directly. A finding is fixed by removing the value AND rotating
# it — this repository is public, and rewriting history un-leaks nothing.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The rules fire (a planted key must be found)
        run: |
          set -uo pipefail
          planted="$(mktemp -d)"
          printf 'SQUADOPS__LANGFUSE__SECRET_KEY=sk-lf-%s\n' "$(cat /proc/sys/kernel/random/uuid)" > "$planted/leak.env"
          # A finding exits 7, and Actions runs this under `bash -e`: `|| rc=$?` keeps the step
          # alive to read it.
          rc=0
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$planted:/scan:ro" -v "$PWD/.gitleaks.toml:/cfg/gitleaks.toml:ro" "$GITLEAKS_IMAGE" \
            dir /scan --config /cfg/gitleaks.toml --redact --no-banner --exit-code 7 || rc=$?
          if [ "$rc" -ne 7 ]; then
            echo "::error::gitleaks exited $rc on a planted LangFuse key (expected 7, a finding): the rules are not firing"
            exit 1
          fi

      - name: Scan the commits this change adds
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$'; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            range="-1 $PUSH_AFTER"
          fi
          echo "scanning $range"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --log-opts="$range" --redact --no-banner --verbose
