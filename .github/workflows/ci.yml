name: CI

# Runs the lint + regression gate on every PR and on pushes to main, so a red
# change (stale manifest, lint break, failing test) can't reach main once this
# check is marked Required in branch protection. Closes the enforcement gap that
# let a stale prompt-fragment manifest merge (issue #195).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            ci-constraints.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # ci-constraints.txt pins the exact resolved versions (#202) so an
          # upstream release can't silently change what CI tests.
          pip install -r tests/requirements.txt -c ci-constraints.txt

      - name: Prompt-fragment manifest is in sync
        run: python scripts/dev/regen_fragment_manifest.py --check

      # Runs `ruff check .` + `ruff format --check .` (lint + format, fail-stop) +
      # the test-quality lint + the full unit regression suite. The repo-wide
      # format sweep landed in #196, so the format check is now gated here.
      - name: Regression suite (ruff check + format + test-quality lint + pytest)
        run: bash scripts/dev/run_regression_tests.sh

  integration:
    # #242: nothing ran tests/integration/ on PRs, so four independent breakages sat in
    # test_pulse_check_e2e.py unnoticed (#211) and sixteen tests failed on every run of
    # main for weeks (#1099). The gate was unit-only; this is the missing lane.
    #
    # Services are real containers rather than mocks because that is what these tests
    # are for. Two things make the job trustworthy rather than decorative:
    #   * SQUADOPS_REQUIRE_SERVICES=1 turns "service missing" from a skip into a failure.
    #     Without it a broken service definition would skip all 67 tests and report green
    #     — the same silent rot this job exists to prevent.
    #   * The run asserts a floor on tests actually executed, so a collection error or a
    #     conftest change that quietly empties the suite fails instead of passing.
    #
    # POSTGRES_URL names squadops_test, never the deployment database (#1099).
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: squadops
          POSTGRES_PASSWORD: squadops-dev
          POSTGRES_DB: squadops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U squadops"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.12-management
        # The broker must CREATE the user the tests authenticate as. Setting only
        # RABBITMQ_USER/PASSWORD in the job env configures the client side; the stock image
        # ships `guest` alone, so every AMQP test failed with
        # "PLAIN login refused: user 'squadops' - invalid credentials". Must match the
        # RABBITMQ_USER / RABBITMQ_PASSWORD under `env:` below.
        env:
          RABBITMQ_DEFAULT_USER: squadops
          RABBITMQ_DEFAULT_PASS: squadops-dev
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 15
    env:
      SQUADOPS_REQUIRE_SERVICES: "1"
      # Agent containers are a dev-box thing; CI has no images for them. Without this the
      # session health check skips EVERY test (measured: 99 collected, 99 skipped, 0 run)
      # and the job would have gone green having executed nothing — which the floor check
      # below caught on the first run, doing exactly its job.
      SKIP_AGENT_CHECK: "1"
      POSTGRES_URL: postgresql://squadops:squadops-dev@localhost:5432/squadops_test
      RABBITMQ_USER: squadops
      RABBITMQ_PASSWORD: squadops-dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            ci-constraints.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r tests/requirements.txt -c ci-constraints.txt

      - name: Integration suite (real services, serviceless tests included)
        run: |
          python -m pytest tests/integration -v --no-header -p no:cacheprovider \
            --junitxml=integration-results.xml

      - name: The suite actually ran
        # A green job that executed nothing is the failure mode #242 is about. Floor is
        # set below the current pass count so ordinary additions do not trip it, but a
        # collapse to zero (or to the handful that need no services) fails.
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, sys
          r = ET.parse("integration-results.xml").getroot()
          suite = r if r.tag == "testsuite" else r[0]
          total = int(suite.get("tests", 0)); skipped = int(suite.get("skipped", 0))
          ran = total - skipped
          print(f"collected={total} skipped={skipped} executed={ran}")
          # Calibrated to catch COLLAPSE, not to police an exact count. Locally with the
          # full stack 67 execute; CI has postgres/redis/rabbitmq but no Keycloak, LangFuse
          # or agent containers, so its steady state is lower. 30 sits well below any
          # plausible real run and far above the 0 that a broken health check produces.
          # Raise it once CI's steady-state number has held for a few runs.
          FLOOR = 30
          if ran < FLOOR:
              sys.exit(f"FAIL: only {ran} tests executed (floor {FLOOR}). "
                       "Services likely unavailable or the suite was emptied — #242.")
          print(f"OK: {ran} tests executed")
          EOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: integration-results.xml

  skeleton-gate:
    # SIP-0099 acceptance surface: the deterministic expander must materialize a
    # walking skeleton that BUILDS and BOOTS with zero manual intervention, on plain
    # runners (x86_64 here vs aarch64 dev — acceptable; plain toolchains, no GPU/
    # agents). SIP-0098 phase 98.2 hangs its lint / bare-skeleton / reference-fill
    # contract jobs off this same gate, so a skeleton or template edit re-proves both.
    name: scaffold skeleton gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install squadops
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # Importing the expander triggers the squadops package __init__ chain
          # (pydantic et al.); SquadOps pins its runtime deps here, not in pyproject,
          # so mirror the test job's install rather than `pip install -e .` alone.
          pip install -r tests/requirements.txt -c ci-constraints.txt

      - name: Expand the group_run skeleton from its interface manifest
        run: |
          python scripts/dev/materialize_skeleton.py \
            examples/03_group_run/interface_manifest.yaml \
            "$RUNNER_TEMP/skeleton"

      - name: Backend imports and boots
        working-directory: ${{ runner.temp }}/skeleton
        run: |
          pip install -r backend/requirements.txt
          # imports clean and the wired /health route is present
          python -c "from backend.main import app; \
            assert any(getattr(r, 'path', None) == '/health' for r in app.routes), 'no /health route'"
          # actually boots: start uvicorn, probe /health, stop
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8099 &
          UVPID=$!
          trap 'kill $UVPID 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8099/health && break || sleep 0.5
          done
          curl -sf http://127.0.0.1:8099/health

      # --- SIP-0098 §6.2 contract gates: "author once, validate twice" ---
      # These prove no criterion false-greens on stubs or is unwinnable by correct code.
      # Each expands the skeleton fresh (and, for reference-fill, overlays the checked-in
      # fill), so a skeleton, contract-emitter, or fill edit re-proves all three.
      - name: Contract lints clean
        run: python scripts/dev/contract_gate.py lint

      - name: Bare-skeleton contract gate
        run: python scripts/dev/contract_gate.py bare-skeleton

      - name: Reference-fill contract gate
        run: python scripts/dev/contract_gate.py reference-fill
