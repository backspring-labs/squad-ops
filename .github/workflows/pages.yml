# Publishes site/ to GitHub Pages.
#
# Deliberately an Actions-source workflow rather than the branch/folder Pages
# source: the branch source can only publish the repo root or /docs, and docs/
# holds ~256 internal working files (plans, retrospectives, reviews) that must
# not become an indexed public site. Building from site/ publishes exactly the
# public surface and nothing else.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: site
      - uses: actions/configure-pages@v5
      - name: Build
        working-directory: site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
