# Squad Ops documentation site.
#
# docs_dir is site/content, NOT the repo's docs/ tree. That is deliberate and
# load-bearing: docs/ holds ~260 internal working files (plans, retrospectives,
# reviews) that are not published. Content reaches the site one of two ways —
# authored under site/content/, or GENERATED by site/hooks/ from structured
# sources in the repo (sips/, releases). Nothing is published by accident.
site_name: Squad Ops
site_description: A multi-agent framework that builds working software from a written requirement
site_url: https://backspring-labs.github.io/squad-ops/
repo_url: https://github.com/backspring-labs/squad-ops
repo_name: backspring-labs/squad-ops
edit_uri: ""

docs_dir: site/content
site_dir: site/_build

theme:
  name: material
  custom_dir: site/overrides
  # Versioned filename, deliberately. Browsers cache favicons per ORIGIN and
  # ignore normal cache headers for them — this origin served a black-tile
  # icon for ~90 minutes on 2026-08-23, and Chrome kept showing it long after
  # the transparent version deployed. A new path is the only reliable bust.
  # Bump the suffix on any future favicon change.
  favicon: assets/favicon-v2.svg
  font: false          # no Google Fonts fetch — system stack instead
  # NOTE ON THIRD-PARTY REQUESTS. Setting font:false removes the Google Fonts
  # fetch, but Material lazy-loads mermaid from unpkg.com at runtime on pages
  # that contain diagrams (verified in the theme bundle, not assumed). So the
  # site is NOT request-free — it makes exactly one, on those pages only.
  # Vendoring mermaid locally would fix it and costs 3.4 MB of minified JS in
  # the source tree plus a manual update treadmill; that trade was judged not
  # worth it for a docs site (#1039). Recorded so the next person does not
  # repeat the measurement, and so the claim is not overstated elsewhere.
  icon:
    # Inlined as SVG (not an <img>), so currentColor follows the active palette.
    logo: squadops/logo
    repo: fontawesome/brands/github
  features:
    # navigation.instant is DELIBERATELY off: its client-side page swaps wipe
    # rendered mermaid diagrams, leaving empty containers that still reserve
    # their height. Verified in-browser — the divs were empty with
    # data-processed unset while holding 1848px of layout.
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

plugins:
  - search
  - gen-files:
      scripts:
        - site/hooks/gen_sips.py
        - site/hooks/gen_releases.py

nav:
  # Structured on Diátaxis (diataxis.fr) — tutorials, how-to, reference and
  # explanation are kept strictly separate, because mixing the modes on one page
  # is what makes documentation feel simultaneously too long and unhelpful. The
  # project-level pages either side (overview, evidence, roadmap, releases,
  # design specs) sit deliberately outside the four modes; Diátaxis does not
  # claim them, and the OSS convention for each is well established.
  - Overview: index.md
  - Evidence: evidence.md
  - Tutorial:
      - Getting started: getting-started.md
  - How-to guides:
      - Operate a cycle: operate-a-cycle.md
  - Explanation:
      - Key concepts: key-concepts.md
      - Architecture: architecture.md
      - Observability: observability.md
  - Reference:
      - CLI: cli.md
      - Dependencies: dependencies.md
  - Roadmap: roadmap.md
  - Releases:
      - releases/index.md
  - Design specs:
      - Improvement proposals: design/sips/index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Mermaid via Material's native support: diagrams stay diffable markdown in
  # the page rather than becoming binary assets that rot (#1039).
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/backspring-labs
      name: Backspring Labs

# Generated SIP pages are reachable from the SIP index and search, but are not
# listed individually in the sidebar — 74+ entries would drown the nav.
not_in_nav: |
  design/sips/*.md
  releases/*/index.md
