# Squad Ops documentation site.
#
# docs_dir is site/content, NOT the repo's docs/ tree. That is deliberate and
# load-bearing: docs/ holds ~260 internal working files (plans, retrospectives,
# reviews) that are not published. Content reaches the site one of two ways —
# authored under site/content/, or GENERATED by site/hooks/ from structured
# sources in the repo (sips/, releases). Nothing is published by accident.
site_name: Squad Ops
site_description: A multi-agent framework that builds working software from a written requirement
site_url: https://backspring-labs.github.io/squad-ops/
repo_url: https://github.com/backspring-labs/squad-ops
repo_name: backspring-labs/squad-ops
edit_uri: ""

docs_dir: site/content
site_dir: site/_build

theme:
  name: material
  font: false          # no Google Fonts fetch; system stack, and no third-party requests
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

plugins:
  - search
  - gen-files:
      scripts:
        - site/hooks/gen_sips.py
        - site/hooks/gen_releases.py

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How it works: how-it-works.md
  - Architecture: architecture.md
  - Releases:
      - releases/index.md
  - Design records:
      - Improvement proposals: design/sips/index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/backspring-labs
      name: Backspring Labs

# Generated SIP pages are reachable from the SIP index and search, but are not
# listed individually in the sidebar — 74+ entries would drown the nav.
not_in_nav: |
  design/sips/*.md
  releases/*/index.md
