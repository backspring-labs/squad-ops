schema_version: 1
name: local-spark
description: "DGX Spark with GPU — local network deployment"

# Uses system Python intentionally — DGX Spark / Ubuntu 24.04 ships
# Python 3.12. Installing pyenv adds complexity with no benefit on
# a controlled hardware target (design rule R5). Still uses .venv for
# the project runtime (R4).

platform:
  os: linux
  distro: ubuntu
  distro_min_version: "24.04"

python:
  version: "3.12"
  manager: system
  extras: []
  test_deps: "tests/requirements.txt"

system_deps:
  - name: docker
    check: "docker --version"
    install: apt
    package: "docker.io"
    required: true

  - name: docker-compose
    check: "docker compose version"
    install: apt
    package: "docker-compose-plugin"
    required: true

  - name: ollama
    check: "ollama --version"
    install: script  # curl -fsSL https://ollama.com/install.sh | sh
    required: true

  - name: git
    check: "git --version"
    install: apt
    package: "git"
    required: true

  - name: curl
    check: "curl --version"
    install: apt
    package: "curl"
    required: true

  # GPU deps — validate only, do not install (R9/R10 in plan).
  # NVIDIA pre-installs drivers on DGX hardware.
  - name: nvidia-smi
    check: "nvidia-smi"
    install: none
    required: true

  - name: nvidia-container-toolkit
    check: "nvidia-container-toolkit --version"
    install: none
    required: true

docker_services:
  - name: rabbitmq
    healthcheck: tcp
    port: 5672
    timeout_seconds: 30

  - name: postgres
    healthcheck: tcp
    port: 5432
    timeout_seconds: 30

  - name: redis
    healthcheck: tcp
    port: 6379
    timeout_seconds: 15

  - name: prefect-server
    healthcheck: http
    endpoint: "http://localhost:4200/api/health"
    timeout_seconds: 60

  - name: runtime-api
    healthcheck: http
    endpoint: "http://localhost:8001/health"
    timeout_seconds: 60

  - name: squadops-keycloak
    healthcheck: http
    endpoint: "http://localhost:8180/health/ready"
    timeout_seconds: 90

ollama_models:
  # Must cover every squad profile this box runs (config/squad-profiles.yaml):
  # smoke → qwen2.5:3b-instruct, lite → qwen2.5:7b, full → qwen3.6:27b. Keep in
  # sync with squad-profiles.yaml so a fresh bootstrap provisions a runnable squad (#285).
  - name: "qwen2.5:3b-instruct"
    required: true
  - name: "qwen2.5:7b"
    required: true
  - name: "qwen3.6:27b"
    required: true

# #1178: memory-pressure containment. This box has none — systemd-oomd inactive and not
# installed, no earlyoom, no MemoryMax on the serving unit — and the kernel's OOM killer
# does not fire during thrash, because swap is technically still available. So a memory
# runaway does not produce one dead process and a live box; it produces a box that pages
# in and out indefinitely and answers nothing. On 2026-08-29 that was 95 minutes
# unreachable with ~800 MB free throughout, ended by a power cycle.
#
# `earlyoom` rather than systemd-oomd: it acts on AVAILABLE memory before thrash begins,
# which is this failure mode, where systemd-oomd keys on PSI and can act too late on a
# unified-memory box whose GPU allocation it cannot see.
#
# `free_swap_percent: 100` is the setting the incident forced, and the reason a default
# install would not have helped. earlyoom kills when available memory AND free swap are
# both under threshold; that livelock ran with 23% of swap still free from the cliff
# (17:50) to the power cycle (~19:25), so any swap-gated threshold would never have
# fired. At 100 swap cannot veto the kill.
#
# `free_memory_percent: 10` is upstream's default, kept rather than invented: 10% of
# 121 GiB is ~12 GiB of headroom, and the incident's cliff was at 0.65% free, so it fires
# far in advance of thrash. Tune it here — one declaration the bootstrap and the doctor
# both read.
memory_containment:
  daemon: earlyoom
  package: earlyoom
  free_memory_percent: 10
  free_swap_percent: 100
  # Prefer reclaiming pages to swapping them. Mitigation, not containment: it lengthens
  # the runway, it does not bound anything. The box shipped at the 60 default.
  swappiness: 10

deployment_profile: local
squad_profile: full
